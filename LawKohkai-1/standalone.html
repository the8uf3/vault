วมของผู้เรียน","ง":"จัดกิจกรรมตามวัฒนธรรมส่วนใหญ่ของสังคม เพื่อให้ผู้เรียนปรับตัวให้เหมือนกัน"},"a":"ข","e":"จัดกิจกรรมกลุ่มให้ผู้เรียนแลกเปลี่ยนเรียนรู้วัฒนธรรมของตนเอง ร่วมกันทำกิจกรรม และสะท้อนความคิดเห็นอย่างสร้างสรรค์"},{"id":69,"q":"ครูควรจัดการเรียนรู้เกี่ยวกับการเปลี่ยนแปลงสภาพภูมิอากาศอย่างไร เพื่อให้ผู้เรียนเกิดความเข้าใจและสามารถนำความรู้ไปใช้ในชีวิตประจำวัน","opts":{"ก":"บูรณาการการเปลี่ยนแปลงสภาพภูมิอากาศเข้ากับหลายกลุ่มสาระ ผ่านกิจกรรมกลุ่มและการเรียนรู้จากการลงมือปฏิบัติ","ข":"จัดการเรียนรู้โดยเน้นการถ่ายทอดข้อมูลเกี่ยวกับการเปลี่ยนแปลงสภาพภูมิอากาศจากครูสู่ผู้เรียนเป็นหลัก","ค":"จัดการเรียนรู้เกี่ยวกับการเปลี่ยนแปลงสภาพภูมิอากาศเฉพาะในรายวิชาวิทยาศาสตร์ตามแผนการสอน","ง":"จัดการเรียนรู้โดยมุ่งให้ผู้เรียนจดจำเนื้อหาเกี่ยวกับการเปลี่ยนแปลงสภาพภูมิอากาศเพื่อใช้ในการประเมินผล"},"a":"ก","e":"บูรณาการการเปลี่ยนแปลงสภาพภูมิอากาศเข้ากับหลายกลุ่มสาระ ผ่านกิจกรรมกลุ่มและการเรียนรู้จากการลงมือปฏิบัติ"},{"id":70,"q":"การปรับหลักสูตรการศึกษาควรดำเนินการอย่างไร จึงจะสอดคล้องกับพระราชบัญญัติส่งเสริมการเรียนรู้","opts":{"ก":"การปรับหลักสูตรให้ยึดโครงสร้างและเนื้อหาตามรูปแบบเดิมของสถานศึกษาเป็นสำคัญ โดยไม่ต้องเชื่อมโยงการเรียนรู้หลากหลายรูปแบบ","ข":"การปรับหลักสูตรให้สอดคล้องกับการจัดการเรียนการสอนในระบบการศึกษาเพียงรูปแบบเดียว","ค":"การปรับหลักสูตรให้มุ่งเน้นเนื้อหาทางวิชาการและการประเมินผลตามเกณฑ์มาตรฐาน","ง":"การปรับหลักสูตรให้เป็นหลักสูตรการเรียนรู้ตลอดชีวิต ที่มีความยืดหยุ่นและเชื่อมโยงการเรียนรู้หลากหลายรูปแบบ"},"a":"ง","e":"การปรับหลักสูตรให้เป็นหลักสูตรการเรียนรู้ตลอดชีวิต ที่มีความยืดหยุ่นและเชื่อมโยงการเรียนรู้หลากหลายรูปแบบ"}],"ศาสตร์การสอน & เทคโนโลยี":[{"id":1,"q":"(ข้อสอบแนว PISA) ครูทองมีและครูพี่หนึ่งปรึกษากันเพื่อจัดบรรยากาศที่ส่งเสริมการเรียนรู้ของผู้เรียน ได้แก่:\n1. บรรยากาศที่นักเรียนเกิดความอบอุ่น สบายใจ รักครู รักโรงเรียน และรักการมาเรียน คือ..................\n2. บรรยากาศที่นักเรียนมีโอกาสได้คิด ได้ตัดสินใจเลือกสิ่งที่มีความหมายและมีคุณค่า คือ..................\n3. บรรยากาศที่ครูกระตุ้นให้กำลังใจนักเรียนเพื่อให้ประสบผลสำเร็จในการทำงาน คือ..................\n4. บรรยากาศที่นักเรียนเกิดความเชื่อมั่นในตนเองและเกิดความยอมรับนับถือตนเอง คือ..................\n5. บรรยากาศที่นักเรียนมีระเบียบวินัย มิใช่การควบคุม ไม่ให้มีอิสระ คือ..................\n6. บรรยากาศที่ผู้เรียนเกิดความรู้สึกประสบความสำเร็จในงานที่ทำซึ่งส่งผลให้ผู้เรียนเกิดการเรียนรู้ได้ดีขึ้น คือ..................\n\nA. บรรยากาศที่ท้าทาย (Challenge)\nB. บรรยากาศที่มีอิสระ (Freedom)\nC. บรรยากาศที่มีการยอมรับนับถือ (Respect)\nD. บรรยากาศที่มีความอบอุ่น (Warmth)\nE. บรรยากาศแห่งการควบคุม (Control)\nF. บรรยากาศแห่งความสำเร็จ (Success)\n\nข้อใดเรียงลำดับถูกต้อง","opts":{"ก":"B D C A E F","ข":"C B D A E F","ค":"D B A C E F","ง":"D B A F E C"},"a":"ค","e":"การจัดบรรยากาศตามประมวลจิตวิทยาการเรียนรู้ มีคีย์เวิร์ดในการจับคู่เชิงพฤติกรรมอย่างมีระบบ ดังนี้: 1."},{"id":2,"q":"ข้อใดเป็นรูปแบบการจัดชั้นเรียนแบบนวัตกรรม","opts":{"ก":"ครูบัว ใช้วิธีการสอนแบบป้อนความรู้ให้แก่นักเรียนโดยการบรรยาย","ข":"ครูสอง ไม่เปิดโอกาสให้นักเรียนได้แสดงความคิดเห็น","ค":"ครูแพรว สอนนักเรียนโดยให้นักเรียนจัดโต๊ะเรียนเป็นโต๊ะเดี่ยวหรือโต๊ะคู่ตลอดภาคเรียน","ง":"ครูแก้ว ให้ผู้เรียนได้คิดค้นคว้า วิเคราะห์ และลงมือปฏิบัติจริงทุกขั้นตอน จนสามารถเรียนรู้ได้ตนเอง"},"a":"ง","e":"ห้องเรียนแบบธรรมดา (Traditional) ยึดมั่นพฤติกรรม \"Teacher-Centered\" ครูเป็นจุดศูนย์กลางของห้องเรียน เป็นผู้นำพาถ่ายทอดเนื้อหาข้อมูลเชิงปริมาณผ่านสื่อกระดาษและการบรรยายหน้าชั้นเรียนเป็นสำคัญ ข้อเลือก ข, ค, และ ง ล้วนเป็นลักษณะของการจัดกิจกรรมการเรียนร"},{"id":3,"q":"ข้อใดเป็นรูปแบบการจัดชั้นเรียนแบบธรรมดา","opts":{"ก":"ครูกิ๊ก สอนนักเรียนโดยครูเป็นศูนย์กลาง เป็นผู้นำการเรียนรู้","ข":"ครูแดง สอนนักเรียนเป็นศูนย์กลาง ครูเป็นผู้อำนวยสะดวก","ค":"ครูฝน จัดการเรียนรู้ในห้องเรียนแบบโครงงาน","ง":"ครูหมวย จัดการเรียนรู้แบบเน้นผู้เรียนเป็นสำคัญ"},"a":"ก","e":"บรรยากาศทางด้านจิตวิทยาในชั้นเรียน (Psychological Classroom Atmosphere) มุ่งเน้นไปที่การสร้างอารมณ์ ความรู้สึกอบอุ่น และความผูกพันเชิงเจตคติระหว่างครูผู้สอนกับผู้เรียน ผลลัพธ์โดยตรงที่สุดที่จะสะท้อนให้เห็นคือ ตัวผู้เรียนจะเกิดเจตคติเชิงบวก รู้สึกดีต่"},{"id":4,"q":"บรรยากาศทางด้านจิตวิทยา จะทำให้นักเรียนมีความรู้สึกอย่างไรมากที่สุด","opts":{"ก":"ผู้เรียนเกิดความรู้สึกที่ดีต่อการเรียนการสอนและเกิดความศรัทธาในครูผู้สอน","ข":"ผู้เรียนเกิดความรู้สึกที่ไม่ดีต่อการเรียนการสอน","ค":"ผู้เรียนเกิดความรู้สึกที่ดีต่อเพื่อนในชั้นเรียน","ง":"ผู้เรียนเกิดความรู้สึกรักโรงเรียน อยากมาโรงเรียน"},"a":"ก","e":"การจัดบอร์ดนิทรรศการแสดงผลงานของผู้เรียนในห้องเรียนเป็นจิตวิทยาที่ทำให้เด็กเกิดความรู้สึก \"ได้รับการยอมรับ\" (Respect) และความภูมิใจว่าผลงานของตนเองมีคุณค่าจนได้รับการคัดเลือกและจัดแสดงให้ทุกคนในห้องเห็นอย่างเป็นรูปธรรม ซึ่งสร้างแรงบันดาลใจและพฤติกรรม"},{"id":5,"q":"“บรรยากาศทางจิตวิทยา” สอดคล้องกับข้อใดมากที่สุด (สพฐ.รอบทั่วไป ปี 61)","opts":{"ก":"การสร้างแรงจูงใจ","ข":"โรงเรียนมีความสะอาด ร่มรื่น","ค":"ห้องเรียนมีความทันสมัย","ง":"ครูในโรงเรียนร่วมกันทำ PLC"},"a":"ก","e":"พฤติกรรมการจัดการชั้นเรียนของครูพี่หนึ่งเน้นไปที่ความเท่าเทียมกัน ความเสมอภาค มีอิสระและเปิดโอกาสให้เด็กทุกคนร่วมแสดงความคิดเห็น ซึ่งตรงกับนิยามและเสาหลักการทำงานของ"},{"id":6,"q":"การบริหารจัดการชั้นเรียนแบบคละชั้น หมายความว่าอย่างไร","opts":{"ก":"การนำนักเรียนต่างชั้น ต่างกลุ่มอายุต่างความสามารถมาเรียนรู้พร้อมกันในห้องเดียว โดยครูคนเดียว","ข":"การนำนักเรียนต่างชั้น ต่างกลุ่มอายุต่างความสามารถมาเรียนรู้พร้อมกันในห้องเดียว โดยครูสองคน","ค":"การนำนักเรียนต่างชั้น ต่างกลุ่มอายุต่างความสามารถมาเรียนรู้พร้อมกันในห้องเดียว โดยครูสามคน","ง":"การนำนักเรียนต่างชั้น ต่างกลุ่มอายุต่างความสามารถมาเรียนรู้พร้อมกันในห้องเดียว โดยครูหลายคน"},"a":"ก","e":"การที่ผู้เรียนจะบังเกิดความยอมรับนับถือ มีความรัก เคารพศรัทธา และยินดีรับฟังคำอบรมสั่งสอน กฎระเบียบของคุณครูอย่างจริงใจ (ไม่ใช่ควบคุมด้วยความกลัว) ครูผู้สอนจำเป็นต้องประพฤติและคลี่คลายการสอนด้วย **\"หลักพรหมวิหาร 4\"** เป็นฐานจิตใจ ได้แก่ เมตตา (มีความ"},{"id":7,"q":"การจัดการชั้นเรียน เพื่อให้ความสำคัญต่อนักเรียนเท่าเทียมกัน ให้ความเสมอภาคให้อิสระ ให้อิสระแก่นักเรียนให้มีโอกาสแสดงความคิดเห็น ครูควรใช้หลักการใดในการจัดการชั้นเรียน (สพฐ.รอบทั่วไป/63)","opts":{"ก":"หลักความยุติธรรมและประชาธิปไตย","ข":"หลักพรหมวิหาร 4 และความใกล้ชิด","ค":"หลักสังคหวัตถุ 4 และความใกล้ชิด","ง":"หลักประชาธิปไตยและหลักพรหมวิหาร 4"},"a":"ก","e":"การเรียนการสอนแบบคละชั้น (Multigrade Teaching) มีนิยามที่เป็นทางการคือ การจัดชั้นเรียนรวบเอานักเรียนที่มีอายุ ความสามารถ หรือระดับชั้นต่างกัน (เช่น ชั้นประถมปีที่ 1 และ 2) เข้ามาเรียนรู้ภายในห้องเรียนเดียวกัน โดยการจัดกิจกรรมการเรียนรู้ของ **\"ครูผู้ส"},{"id":8,"q":"ครูให้นักเรียนทำงานโดยไม่ตึงเครียด โดยปราศจากความกลัวและวิตกกังวล คือบรรยากาศแบบใด (สพฐ.รอบทั่วไป ปี 61, 63)","opts":{"ก":"บรรยากาศที่ท้าทาย (Challenge)","ข":"บรรยากาศที่มีอิสระ (Freedom)","ค":"บรรยากาศแห่งความสำเร็จ (Success)","ง":"บรรยากาศแห่งการควบคุม (Control)"},"a":"ข","e":"ในการบริหารจัดการชั้นเรียนสมัยใหม่ที่เน้นผู้เรียนเป็นสำคัญ การจัดแต่งหรือวางตำแหน่งครูและโต๊ะเรียนไม่ควรถูกล็อกไว้แบบตายตัว (หน้าห้องหรือหลังห้อง) เกณฑ์ที่ดีและเหมาะสมที่สุดคือต้องจัดโต๊ะครูและมุมกิจกรรมให้"},{"id":9,"q":"ข้อใดเป็นการจัดบรรยากาศที่เหมาะต่อการเรียนรู้ (สพฐ.รอบทั่วไป ปี 64/65)","opts":{"ก":"มีอิสระได้ตัดสินใจเลือกสิ่งที่มีความหมายและมีคุณค่า","ข":"มีการควบคุม ครูเป็นผู้ดำเนินกิจกรรมเป็นหลัก","ค":"มีคุณภาพเพื่อเตรียมการรองรับการประเมิน","ง":"ส่งเสริมและพัฒนาคุณภาพสถานศึกษา"},"a":"ก","e":"พฤติกรรมการเรียนการสอนที่ดำเนินไปอย่างผ่อนคลาย ปราศจากความกลัว วิตกกังวล หรือความตึงเครียดต่อความผิดพลาด มีเสรีภาพในการทดลองคิดริเริ่มสร้างสรรค์ ตรงตามนิยามจิตวิทยาของ"},{"id":10,"q":"ครูควรมีบทบาทอย่างไร ในการให้คำปรึกษากับการสอนแบบกระบวนการกลุ่ม (สพฐ.รอบทั่วไป ปี 2566)","opts":{"ก":"เป็นผู้นำ","ข":"เป็นผู้บรรยาย","ค":"เป็นศูนย์กลาง","ง":"เป็นผู้อำนวยความสะดวก"},"a":"ง","e":"บรรยากาศการเรียนรู้ที่มีประสิทธิภาพและเอื้อต่อ Active Learning คือห้องเรียนที่เอื้อประโยชน์ให้ผู้เรียนมีความเป็นเจ้าของการเรียนรู้ (Ownership) มีอิสระเสรีในการตัดสินใจเลือกทำกิจกรรมเชิงวิเคราะห์ที่มีความหมายและคุณค่าต่อเป้าหมายชีวิตตนเอง"},{"id":11,"q":"บรรยากาศที่นักเรียนรักครูและอยากมาโรงเรียน สอดคล้องกับบรรยากาศในข้อใด (สพฐ.กรณีพิเศษ ปี 2566)","opts":{"ก":"บรรยากาศที่ท้าทาย","ข":"บรรยากาศที่มีอิสระ","ค":"บรรยากาศที่มีความอบอุ่น","ง":"บรรยากาศที่มีการยอมรับนับถือ"},"a":"ค","e":"(หมายเหตุเชิงจิตวิทยาจากครูพี่หนึ่ง: ในตัวเลือกของข้อสอบจริงพฤติกรรมนี้ ครูควรหลีกเลี่ยงการด่าทอรุนแรงเพื่อประจาน แต่การ 'ต่อว่า' ในที่นี้หมายถึงการตักเตือนทันทีเพื่อระงับเหตุฉุกเฉิน และอธิบายเหตุผลชี้แนะสิ่งที่ทำว่าผิดและไม่เหมาะสมอย่างไร เพื่อกระตุ"},{"id":12,"q":"บรรยากาศที่นักเรียนเคารพศรัทธาครูและมีความเชื่อมั่นในตนเอง สอดคล้องกับบรรยากาศในข้อใด (สพฐ.กรณีพิเศษ ปี 2566)","opts":{"ก":"บรรยากาศที่มีอิสระ","ข":"บรรยากาศแห่งการควบคุม","ค":"บรรยากาศที่มีความอบอุ่น","ง":"บรรยากาศที่มีการยอมรับนับถือ"},"a":"ง","e":"ตัวแปรสำคัญที่ทำให้ผู้เรียนเกิดความรู้สึกเชิงลึกรักคุณครู ปลื้มครู และอยากก้าวเดินมาโรงเรียนทุกวัน สอดรับกับคำอธิบายของ **\"บรรยากาศที่มีความอบอุ่น\" (Warmth)**"},{"id":13,"q":"ข้อใดเป็นหลักในการบริหารจัดการชั้นเรียนที่ดีและเหมาะสมที่สุด (สพฐ.รอบทั่วไป ปี 2568)","opts":{"ก":"ครูเป็นผู้ควบคุมกฎระเบียบอย่างเคร่งครัดเพียงฝ่ายเดียว","ข":"การสร้างบรรยากาศการเรียนรู้ที่เอื้อต่อการมีส่วนร่วม มีระเบียบ ความปลอดภัย และการเคารพซึ่งกันและกัน","ค":"การใช้บทลงโทษเพื่อควบคุมพฤติกรรมผู้เรียนเป็นหลัก","ง":"การจัดกิจกรรมการเรียนการสอนโดยไม่คำนึงถึงความแตกต่างของผู้เรียน"},"a":"ข","e":"**PLC** ย่อมาจากคำว่า **\"Professional Learning Community\"** หมายถึง ชุมชนการเรียนรู้ทางวิชาชีพของครูและบุคลากรทางการศึกษาในการรวมกลุ่มร่วมงานแก้ปัญหาและพัฒนาการจัดกิจกรรมการสอนจริง"},{"id":14,"q":"ครูมีแนวทางในการพัฒนาการใช้เทคโนโลยี มาประยุกต์ในชั้นเรียนได้ ยกเว้นข้อใด (สพฐ.รอบทั่วไป ปี 2567)","opts":{"ก":"นําเทคโนโลยีมาพัฒนาตนเอง","ข":"ใช้เทคโนโลยีทำสื่อให้นักเรียนอยากรู้อยากเรียน","ค":"จัดตั้งศูนย์เทคโนโลยีสารสนเทศในโรงเรียน","ง":"ใช้เทคโนโลยีที่ทันสมัยที่สุด เพื่อประสิทธิภาพสูงสุด"},"a":"ง","e":"โมเดลกรวยสัญญลักษณ์และเทคโนโลยี \"Cone of Experience\" เป็นแนวคิดและผลงานการออกแบบทฤษฎีของนักวิชาการสื่อสารทางการศึกษาชื่อดังคือ **\"เอดการ์ เดล\" (Edgar Dale)**"},{"id":15,"q":"หลักสูตรเปรียบเสมือน........1........สำหรับครูที่กำหนดทิศทางในการจัดการเรียนรู้ให้แก่ผู้เรียน หากเปรียบการศึกษาเป็น.....2...... หลักสูตรเปรียบเสมือน พวงมาลัย หากเปรียบการศึกษาเป็นเรือยนต์ หลักสูตรเปรียบเสมือน.............3........... หากเปรียบการศึกษาเป็นอาหาร หลักสูตรเปรียบเสมือน.............4...........\nจากข้อความที่กำหนดให้ข้อใดเรียงลำดับได้อย่างถูกต้อง","opts":{"ก":"เข็มทิศ รถยนต์ คนขับเรือ คนทำอาหาร","ข":"แนวทาง คนขับรถ หางเสือ คู่มือการทำอาหาร","ค":"ตำรา รถยนต์ หางเสือ คนทำอาหาร","ง":"เข็มทิศ รถยนต์ หางเสือ คู่มือการทำอาหาร (ตำราปรุงอาหาร)"},"a":"ง","e":"การจัดชั้นเรียนแบบนวัตกรรม (Innovative Classroom) ตั้งอยู่บนรากฐานการจัดการเรียนรู้เชิงรุก (Active Learning) ที่เน้นผู้เรียนเป็นศูนย์กลางและส่งเสริมทักษะการเรียนรู้ด้วยตนเองและการแก้ปัญหาในศตวรรษที่ 21 การที่ครูแก้วให้ผู้เรียนได้คิด ค้นคว้า วิเคราะห์"},{"id":16,"q":"ข้อใดไม่ใช่จุดหมาย การพัฒนาผู้เรียนตามหลักสูตรแกนกลางการศึกษาขั้นพื้นฐาน พ.ศ. 2551","opts":{"ก":"มีคุณธรรม จริยธรรม และค่านิยมที่พึงประสงค์","ข":"มีความรักชาติ มีจิตสำนึกในความเป็นพลเมืองไทยและพลโลก","ค":"มีจิตสำนึกในการอนุรักษ์วัฒนธรรมและภูมิปัญญาไทย","ง":"มีสิ่งที่พึงรู้พึงปฏิบัติได้เมื่อจบการศึกษาภาคบังคับ"},"a":"ง","e":"เจตนารมณ์สำคัญสูงสุดของพระราชบัญญัติการศึกษาแห่งชาติ พ.ศ. 2542 และที่แก้ไขเพิ่มเติม ในมาตรา 22 ระบุไว้ชัดแจ้งว่า: การจัดกระบวนการเรียนรู้ต้องยึดมั่นหลักการที่ผู้เรียนมีความสามารถพัฒนาและเจริญงอกงามได้เต็มศักยภาพ และถือว่า **\"ผู้เรียนมีความสำคัญที่สุด"},{"id":17,"q":"คุณลักษณะตามวัย ตามหลักสูตรแกนกลางการศึกษาขั้นพื้นฐาน พ.ศ. 2551 ข้อใดกล่าวได้ถูกต้องที่สุด","opts":{"ก":"ป.1 - ป.3 ใฝ่ดี","ข":"ป.4 - ป.6 อ่านออก เขียนได้ คิดเลขเป็น","ค":"ม.1 - ม.3 มุ่งมั่นในการศึกษาและการทำงาน","ง":"ม.4 - ม.6 อยู่อย่างพอเพียง"},"a":"ก","e":"ตามโครงสร้างข้อกำหนดจุดเน้นคุณลักษณะที่พึงประสงค์รายวัย คุณลักษณะด้าน"},{"id":18,"q":"ข้อใดกล่าวถูกต้องที่สุด เกี่ยวกับลักษณะของหลักสูตรที่ดี","opts":{"ก":"ยึดผู้เรียนเป็นสำคัญ เนื้อหาและกิจกรรมต้องเหมาะสมกับธรรมชาติ","ข":"ตรงตามความมุ่งหมายของรัฐบาล","ค":"ตรงตามความมุ่งหมายของผู้บริหารสถานศึกษา","ง":"สามารถวัดผลการเรียนของนักเรียนได้มาตรฐานระดับสูง"},"a":"ก","e":"กระบวนการวิเคราะห์และตรวจสอบเพื่อสืบค้นข้อบกพร่อง ทราบจุดเด่นจุดอ่อน เพื่อช่วยเหลือและพัฒนาศักยภาพผู้เรียนรายวัน สอดคล้องโดยตรงที่สุดกับวัตถุประสงค์ของ"},{"id":19,"q":"ข้อใดเป็นหัวใจสำคัญของหลักสูตร","opts":{"ก":"หน่วยการเรียนรู้","ข":"สาระการเรียนรู้","ค":"จุดมุ่งหมาย","ง":"การสอน"},"a":"ก","e":"หลักสูตรที่ดีมีมาตรฐาน (Effective Curriculum) จำเป็นต้องยึดมั่นหลักการผู้เรียนเป็นสำคัญ โครงสร้างเนื้อหา กระบวนการจัดสรรเวลาเรียน และลักษณะชิ้นงานกิจกรรมต้องมีความเหมาะสม สอดประสานกับลีลา ความถนัด และพัฒนาการทางสติปัญญาตามธรรมชาติของผู้เรียนในแต่ละช่"},{"id":20,"q":"ข้อใดชี้ให้เห็นว่าการนำหลักสูตรแปลงไปสู่การปฏิบัตินั้น บรรลุจุดมุ่งหมายหรือไม่","opts":{"ก":"ความมุ่งหมาย (objectives)","ข":"เนื้อหาวิชา (Content)","ค":"การนำหลักสูตรไปใช้ (Curriculum implementation)","ง":"การประเมินผล (evaluation)"},"a":"ง","e":"ในการจัดทำแผนงานหลักสูตรสถานศึกษา ขั้นตอนการออกแบบ **\"หน่วยการเรียนรู้\" (Learning Unit)** ถือเป็นแกนหลักและหัวใจของการจัดทำหลักสูตร เพราะเป็นขั้นตอนสุดท้ายก่อนแปลงเป้าหมายคุณภาพมาตรฐานระดับชาติไปเป็นแผนกิจกรรมการสอนจริงในชั้นเรียน"},{"id":21,"q":"ข้อใดคือความหมายของหลักสูตร (สพฐ.รอบทั่วไป ปี 2559)","opts":{"ก":"ความรู้ ทักษะ กระบวนการที่จัดให้ผู้เรียน","ข":"ความรู้ทั้งมวลที่จัดให้ผู้เรียน","ค":"มวลประสบการณ์ทั้งมวลที่จัดให้ผู้เรียน","ง":"ประสบการณ์ในระบบ นอกระบบและตามอัธยาศัย"},"a":"ค","e":"ตามทฤษฎีองค์ประกอบหลักของหลักสูตร องค์ประกอบที่ทำหน้าที่เสมือนกระจกเงาส่องสะท้อน ตรวจสอบ ประเมินความสำเร็จของการดำเนินกิจกรรมการเรียนรู้ว่าบรรลุผลลัพธ์ความสำเร็จตามจุดมุ่งหมายหรือไม่ คือ"},{"id":22,"q":"ใครมีบทบาทสำคัญที่สุดในการนำหลักสูตรไปใช้ (สพฐ.รอบทั่วไป ปี 2559)","opts":{"ก":"ครูผู้สอน","ข":"นักเรียน","ค":"ผอ.โรงเรียน","ง":"ผอ.สนง.เขตพื้นที่การศึกษา"},"a":"ก","e":"ข้อเขียนหมายเลข 3 (ข้อความที่ 1) บ่งชี้ความจริงได้อย่างถูกต้องว่า การประเมินผลทำหน้าที่สะท้อนภาพรวมสัมฤทธิผล ส่วนข้อความที่ 2 ผิดพลาดเชิงพฤติกรรมเนื่องจากกระบวนการแปลงสาระหลักสูตรไปสู่ห้องเรียนเป็นหน้าที่หลักของ \"การนำหลักสูตรไปใช้\" ไม่ใช่ \"จุดมุ่งหม"},{"id":23,"q":"ขั้นตอนใดในการพัฒนาหลักสูตรที่บ่งชี้ถึงความสำเร็จล้มเหลวของหลักสูตร (สพฐ.รอบทั่วไป ปี 2559)","opts":{"ก":"กำหนดจุดมุ่งหมาย","ข":"การจัดเนื้อหาและประสบการณ์","ค":"การนำหลักสูตรไปใช้","ง":"การประเมินผลหลักสูตร"},"a":"ค","e":"การเทียบเคียงความหมายหลักสูตรเชิงสากลอย่างมีเหตุและผล: \\* หลักสูตรเป็นกรอบกำหนดทิศทางนำพาครูเดินทางถูกต้อง $$\\rightarrow$$ **เข็มทิศ (1)** \\* หากมีพวงมาลัยเป็นตัวควบคุมทิศ ย่อมต้องทำงานประสานกับ $$\\rightarrow$$ **รถยนต์ (2)** \\* ระบบขับเคลื่อนเรือที่"},{"id":24,"q":"\"ขั้นตอนวินิจฉัยความต้องการ\" สอดคล้องแนวคิดกระบวนการการพัฒนาหลักสูตรของใคร (สพฐ.รอบทั่วไป ปี 2559)","opts":{"ก":"ทาบา","ข":"วัตสัน","ค":"ไทเลอร์","ง":"สกินเนอร์"},"a":"ก","e":"นิยามศัพท์วิชาการที่สอดรับและสากลให้การยอมรับสูงสุดของหลักสูตร (Curriculum) คือ"},{"id":25,"q":"\"ขั้นตอนกำหนดวัตถุประสงค์\" สอดคล้องแนวคิดกระบวนการการพัฒนาหลักสูตรของใคร (สพฐ.รอบทั่วไป ปี 2559)","opts":{"ก":"ไทเลอร์","ข":"ทาบา","ค":"โอลิวา","ง":"วิชัย วงศ์ใหญ่"},"a":"ก","e":"แม้ว่าผู้บริหารจะมีหน้าที่ส่งเสริมความรู้และจัดซื้อวัสดุ แต่บุคคลหน้างานที่มีบทบาทสูงสุดในการแปลงหลักสูตรแกนกลางและโครงสร้างวิชาไปสู่ขั้นตอนการจัดเรียนรู้ ออกแบบสื่อ และวัดสัมฤทธิผลโดยตรงต่อผู้เรียนคือ **\"ครูผู้สอน\" (Teacher)**"},{"id":26,"q":"ในการพัฒนาหลักสูตรใครมีบทบาทสำคัญที่สุด (สพฐ.รอบทั่วไป ปี 2561)","opts":{"ก":"ครูผู้สอน","ข":"ผู้บริหาร","ค":"ผู้เชี่ยวชาญด้านหลักสูตร","ง":"คณะกรรมการการศึกษาระดับท้องถิ่น"},"a":"ก","e":"ทฤษฎีการศึกษาได้ข้อสรุปชัดแจ้งว่า ตัวชี้วัดขั้นสุดท้ายที่จะตัดสินว่า ตัวเอกสารหลักสูตรเขียนขึ้นมาได้อย่างสวยหรูและสำเร็จจริงหรือเป็นเพียงกระดาษไร้ค่า คือขั้นตอน"},{"id":27,"q":"การพัฒนาหลักสูตรสถานศึกษา ต้องสอดคล้องกับหลักสูตรแกนกลางการศึกษา และสิ่งใดมากที่สุด (สพฐ.ทั่วไป ปี 61)","opts":{"ก":"ความสนใจของผู้นำชุมชน","ข":"ความพร้อมของผู้อำนวยการโรงเรียน","ค":"ความสนใจและต้องการของผู้เรียน","ง":"ความต้องการของครู"},"a":"ค","e":"**ฮิลดา ทาบา (Hilda Taba)** เป็นผู้นำเสนอแนวทางการพัฒนาหลักสูตรที่ต้องเริ่มต้นด้วยการสำรวจสภาพปัญหา ค้นหาความจำเป็น และจัดกระบวนการ **\"วินิจฉัยความต้องการ\" (Diagnosis of Needs)** จากเสียงของผู้เกี่ยวข้อง ชุมชน และเด็กนักเรียนเป็นเสาเข็มขั้นแรกสุด"},{"id":28,"q":"ถ้าการจัดการศึกษาเปรียบเหมือนการปรุงอาหารหลักสูตรเปรียบเหมือนอะไร (สพฐ.กรณีพิเศษ ปี 2562)","opts":{"ก":"ตำราปรุงอาหาร","ข":"คนปรุง","ค":"อาหารที่ปรุงเสร็จแล้ว","ง":"วัตถุดิบในการปรุง"},"a":"ก","e":"**ราล์ฟ ไทเลอร์ (Ralph Tyler)** เจ้าของทฤษฎีกระบวนการพัฒนาหลักสูตรอันเลื่องชื่อ ยึดถือขั้นตอนแรกสุดด้วยการตั้งคำถามและปฏิบัติจัดทำ **\"ขั้นตอนกำหนดวัตถุประสงค์การศึกษาเชิงพฤติกรรม\" (Behavioral Objectives)**"},{"id":29,"q":"ขั้นตอนแรกในการพัฒนาหลักสูตรสถานศึกษา คือข้อใด (สพฐ. ปี 63)","opts":{"ก":"การประเมินผล","ข":"ศึกษาจุดมุ่งหมาย / วิเคราะห์ข้อมูลพื้นฐาน","ค":"การนำหลักสูตรไปใช้","ง":"จัดทำเนื้อหาวิชา"},"a":"ข","e":"ครูผู้สอนอยู่หน้างานในห้องเรียนจริง เป็นผู้แปลงเนื้อหาไปสู้กิจกรรมการเรียนรู้ จึงมีบทบาทโดดเด่นและสำคัญที่สุดในกระบวนการพัฒนาและปรับใช้หลักสูตรในชั้นเรียน"},{"id":30,"q":"ในการจัดทำหลักสูตรสถานศึกษา สอดคล้องกับข้อใดมากที่สุด (สพฐ. ปี 63)","opts":{"ก":"ผู้บริหารสถานศึกษา ฝ่ายวิชาการ ครูผู้สอนมีส่วนร่วม","ข":"ครูฝ่ายวิชาการ หัวหน้ากลุ่มสาระทุกกลุ่มสาระ มีส่วนร่วม","ค":"ผู้เรียน ผู้ปกครอง และสังคม มีส่วนร่วม","ง":"สำนักงานเขตพื้นที่การศึกษา สำนักงานศึกษาธิการจังหวัด มีส่วนร่วม"},"a":"ก","e":"การจัดทำและพัฒนาหลักสูตรระดับสากลต้องเดินตามหลักการผู้เรียนเป็นสำคัญ (Student-Centered) ดังนั้น นอกเหนือจากการเดินตามตัวชี้วัดแกนกลางของประเทศแล้ว ตัวหลักสูตรสถานศึกษาต้องคำนึงถึงและตอบสนองต่อ **\"ความสนใจและความต้องการที่แท้จริงของผู้เรียน\"** ร่วมกับ"},{"id":31,"q":"การประเมินผลการเรียนระหว่างเรียน เป็นการประเมินหลักสูตรในช่วงใด (สพฐ. ปี 64/65)","opts":{"ก":"ระหว่างการจัดทำหลักสูตร","ข":"ระหว่างการใช้หลักสูตร","ค":"การประเมินผลการใช้หลักสูตร","ง":"ความมุ่งหมายของการจัดทำหลักสูตร"},"a":"ข","e":"เป็นข้อสอบเก่าแนวเปรียบเทียบเทียบเคียงความรู้ (Analogical reasoning) เพื่อเช็กว่าหลักสูตรทำหน้าที่ระบุเป้าหมาย สัดส่วนความรู้ และวิธีการจัดกิจกรรม ซึ่งตรงเสมือน"},{"id":32,"q":"ข้อใดเป็นจุดมุ่งหมายของหลักสูตรบูรณาการ (สพฐ. รอบทั่วไป ปี 66)","opts":{"ก":"เพื่อให้เป็นหลักสูตรที่ทันสมัย","ข":"เพื่อให้ตรงตามความต้องการของผู้เรียน","ค":"เพื่อให้ตรงตามความต้องการของผู้พัฒนาหลักสูตร","ง":"เพื่อลดความซ้ำซ้อนของเนื้อหาวิชา"},"a":"ง","e":"การพัฒนาหลักสูตรไม่ว่าจะระดับใดก็ตาม ต้องเริ่มต้นจากการศึกษาจุดมุ่งหมาย รวบรวมและวิเคราะห์ข้อมูลพื้นฐาน (สังคม เศรษฐกิจ ชุมชน และธรรมชาติผู้เรียน) เพื่อนำมาเป็นฐานอิงในการกำหนดโครงสร้างหลักสูตรและเป้าหมายวิชาชีพต่อไป"},{"id":33,"q":"หลักสูตรที่สอดคล้องกับความต้องการของชุมชนและบริบทของสถานศึกษา คือหลักสูตรในข้อใด (สพฐ.รอบทั่วไป ปี 66)","opts":{"ก":"หลักสูตรแกนกลาง","ข":"หลักสูตรท้องถิ่น","ค":"หลักสูตรสถานศึกษา","ง":"หลักสูตรแห่งชาติ"},"a":"ค","e":"การพัฒนาหลักสูตรสถานศึกษา (School-Based Curriculum) เป็นงานที่มีขอบข่ายครอบคลุมและส่งผลเชิงสถาบัน คณะทำงานแกนหลักที่ต้องประคองบทบาทและมีส่วนร่วมอย่างเข้มแข็งคือ **\"ผู้บริหารสถานศึกษา, ครูฝ่ายงานวิชาการ, และครูผู้สอนทุกคนในโรงเรียน\"**"},{"id":34,"q":"หลักสูตรที่ดีมีดังต่อไปนี้ ยกเว้น (สพฐ.รอบทั่วไป ปี 66)","opts":{"ก":"จัดทำโดยผู้บริหารสถานศึกษา","ข":"ตรงตามความมุ่งหมายของการศึกษาแห่งชาติ","ค":"มีความคล่องตัว","ง":"ควรจัดทำมาจากการศึกษาข้อมูลพื้นฐานด้านต่าง ๆ"},"a":"ก","e":"การประเมินผลการเรียนระหว่างทางหรือระหว่างเรียน (Formative evaluation) เป็นกลไกตรวจสอบคุณภาพของผู้เรียนรายวันเพื่อสะท้อนพัฒนาการเรียน ซึ่งถือเป็นการประเมินและทบทวนหลักสูตรในช่วง **\"ระหว่างการนำหลักสูตรไปใช้จริง\" (During Implementation)**"},{"id":35,"q":"ข้อใดเป็นขั้นตอนแรกของการพัฒนาหลักสูตร (สพฐ.รอบทั่วไป ปี 66)","opts":{"ก":"การนำหลักสูตรไปใช้","ข":"การวิเคราะห์ความต้องการ","ค":"การกำหนดจุดมุ่งหมายของหลักสูตร","ง":"การประเมินผลหลักสูตร"},"a":"ข","e":"เป้าหมายหลักของการจัดทำโครงสร้างหลักสูตรแบบบูรณาการ (Integrated Curriculum) คือการรวมเอาเนื้อหารายวิชาหรือทักษะต่างๆ ที่มีสารัตถะใกล้เคียงกันมาร้อยรัดเข้าด้วยกัน เพื่อช่วยลดปริมาณเนื้อหาที่ทับซ้อนและลดความซ้ำซ้อนของเนื้อหา ช่วยร่นระยะเวลาเรียนให้กระช"},{"id":36,"q":"ข้อใดเป็นขั้นตอนการนำหลักสูตรไปใช้ (สพฐ.รอบทั่วไป ปี 66)","opts":{"ก":"ครูเอ วิเคราะห์ความต้องการของผู้เรียน","ข":"ครูบี ประเมินผลความสำเร็จล้มเหลวของหลักสูตร","ค":"ครูซี เลือกสาระความรู้ต่างเพื่อให้ตรงตามจุดมุ่งหมายของหลักสูตร","ง":"ครูดี ออกแบบการจัดการเรียนการสอน"},"a":"ง","e":"หลักสูตรที่มีหน้าที่ตอบสนองตามความต้องการ จุดเน้น และเป้าหมายตามบริบทเฉพาะของชุมชนและสถานศึกษานั้นๆ เรียกว่า **\"หลักสูตรสถานศึกษา\" (School-Based Curriculum)** ซึ่งเป็นหลักสูตรที่ดึงเอากรอบท้องถิ่นและมาตรฐานแกนกลางมาบูรณาการจัดทำขึ้น"},{"id":37,"q":"การจัดทำหลักสูตรการปรับปรุงการเปลี่ยนแปลงหลักสูตรให้ดีขึ้น สอดคล้องกับข้อใด (สพฐ. กรณีพิเศษ ปี 2566)","opts":{"ก":"การบริหารจัดการหลักสูตร","ข":"การพัฒนาหลักสูตร","ค":"การวิเคราะห์หลักสูตร","ง":"การประเมินหลักสูตร"},"a":"ข","e":"หลักสูตรที่ดีมีคุณภาพต้องเกิดจากมีส่วนร่วมของบุคลากรทุกฝ่าย (ผู้บริหาร ครู คณะกรรมการโรงเรียน ผู้ปกครอง ผู้ทรงคุณวุฒิ) การที่หลักสูตรจัดทำขึ้นโดยผู้บริหารสถานศึกษาเพียงคนเดียวตามอำเภอใจ (ข้อ ก.) จึงเป็นรูปแบบที่ผิดหลักการและไม่สะท้อนความเป็นหลักสูตรท"},{"id":38,"q":"ใครเห็นชอบมาตรฐานการศึกษา ของหลักสูตรสถานศึกษา (สพฐ.รอบทั่วไป ปี 2567)","opts":{"ก":"ผู้แทนผู้ปกครองนักเรียน","ข":"ผู้อํานวยการโรงเรียน","ค":"คณะกรรมการสถานศึกษาขั้นพื้นฐาน","ง":"ผู้อํานวยการสํานักงานเขตพื้นที่"},"a":"ค","e":"ขั้นตอนแรกของวัฏจักรการพัฒนาและรังสรรค์หลักสูตรที่ดี คือการดำเนินการวิเคราะห์ความต้องการ (วินิจฉัยปัญหา ความต้องการของผู้เรียน ชุมชน และสังคม) เพื่อค้นหาประเด็นที่จำเป็นมาใช้ในการตั้งเป้าหมายวัตถุประสงค์ต่อไป"},{"id":39,"q":"ครูดาได้รับมอบหมายจากผู้อำนวยการโรงเรียน ให้จัดทำหลักสูตรท้องถิ่นที่เกี่ยวข้องกับเขาพระวิหาร ครูดาต้องเริ่มจากสิ่งใด (สพฐ.รอบทั่วไป ปี 2567)","opts":{"ก":"ศึกษาข้อมูลของเขาพระวิหาร","ข":"ศึกษาหลักสูตรสถานศึกษาเพื่อออกแบบหน่วยการเรียน","ค":"จัดทำแผนการจัดการเรียนการสอน","ง":"สอบวัดความรู้นักเรียนเบื้องต้น"},"a":"ก","e":"การนำหลักสูตรไปใช้ (Implementation) คือการแปลเอกสารสารัตถะหลักสูตรไปเป็นกระบวนการเรียนรู้ กิจกรรม และสภาพจริงในห้องเรียน พฤติกรรมของครูดีที่ลงมือวางแผนและออกแบบแผนจัดการเรียนรู้ จัดกิจกรรมการสอนเชิงรุก จึงเป็นการกระทำในมิติขั้นการนำหลักสูตรไปใช้จริงอ"},{"id":40,"q":"หลักสูตรสถานศึกษา มีความหมายตรงกับข้อใด (สพฐ.รอบทั่วไป ปี 2568)","opts":{"ก":"จัดทำขึ้นโดยอิงจาก หลักสูตรแกนกลางการศึกษาขั้นพื้นฐาน พ.ศ. 2551 เพื่อให้สถานศึกษาในเขตพื้นที่นั้นๆ นำไปพัฒนาเป็นหลักสูตรสถานศึกษา (School-Based Curriculum)","ข":"การจัดหมวดหมู่วิชาการเพื่อยกฐานะชื่อเสียงของสถานศึกษา","ค":"แผนการจัดกิจกรรมที่ครูประจำการแต่ละรายวิชาบันทึกขึ้นชั่วคราว","ง":"คู่มือข้อสอบกลางระดับประเทศที่สพฐ.จัดส่งให้โรงเรียนทั่วประเทศ"},"a":"ก","e":"กระบวนการแก้ไข ปรับปรุง พัฒนา ยกระดับตัวโครงสร้างสารัตถะ รายวิชา และการดำเนินกิจกรรมหลักสูตรให้มีความทันสมัยและตอบสนองสัมฤทธิผลได้ดียิ่งขึ้น เรียกว่า"},{"id":41,"q":"สาเหตุที่ต้องมีการปรับปรุงหลักสูตรอยู่เสมอ สอดคล้องกับเหตุผลในข้อใดมากที่สุด (สพฐ.รอบทั่วไป ปี 2568)","opts":{"ก":"เพื่อให้การจัดการเรียนการสอนเป็นไปตามนโยบายของสถานศึกษา","ข":"เพื่อให้สอดคล้องกับการเปลี่ยนแปลงของสังคม เศรษฐกิจ และเทคโนโลยี","ค":"เพื่อให้เนื้อหาสาระในหลักสูตรมีความยากมากขึ้น","ง":"เพื่อให้การเรียนการสอนมีความเป็นมาตรฐานเดียวกันทุกยุคสมัย"},"a":"ข","e":"ตามกฎหมายพระราชบัญญัติและระเบียบกระทรวงศึกษาธิการ บุคคลที่มีบทบาทหน้าที่ตามกฎหมายในการให้ความเห็นชอบและอนุมัติมาตรฐานการศึกษา รวมถึงหลักสูตรสถานศึกษา คือ **\"คณะกรรมการสถานศึกษาขั้นพื้นฐาน\" (School Board)**"},{"id":42,"q":"การจัดทำหลักสูตรเพื่อการตอบสนองตลาดแรงงานในปัจจุบัน ควรดำเนินการตามข้อใด (สพฐ.รอบทั่วไป ปี 2568)","opts":{"ก":"จัดทำหลักสูตรตามความถนัดของครูผู้สอนเป็นหลัก","ข":"ยึดเนื้อหาวิชาการตามตำราเดิมโดยไม่คำนึงถึงบริบทพื้นที่","ค":"จัดทำหลักสูตรให้สอดคล้องกับบริบทท้องถิ่นและแรงงานในชุมชนโดยรอบ","ง":"กำหนดหลักสูตรแบบตายตัวโดยไม่ปรับเปลี่ยนตามสภาพเศรษฐกิจ"},"a":"ค","e":"ในการพัฒนาสาระของหลักสูตรท้องถิ่นเฉพาะประเด็น (เขาพระวิหาร) ครูผู้สอนจำเป็นต้องเริ่มต้นงานด้วยการ"},{"id":43,"q":"การประเมินผลการใช้หลักสูตร เป็นการประเมินจากสิ่งใด (สพฐ.รอบทั่วไป ปี 2568)","opts":{"ก":"ความครบถ้วนของเอกสารหลักสูตรและโครงสร้างรายวิชา","ข":"ผลสัมฤทธิ์ของผู้เรียน คุณลักษณะอันพึงประสงค์ และผลการนำหลักสูตรไปใช้จริงในบริบทของสถานศึกษาและชุมชน","ค":"ความพร้อมของอาคารสถานที่ สื่อ และงบประมาณของสถานศึกษา","ง":"ความคิดเห็นของผู้บริหารสถานศึกษาเป็นสำคัญ"},"a":"ข","e":"ตามวงจรการออกแบบพัฒนาหลักสูตรที่เป็นขั้นตอนเชิงเหตุผล: เมื่อศึกษาความต้องการ (1) และกำหนดวัตถุประสงค์จุดมุ่งหมายแล้ว (2) ลำดับต่อไปที่ครูผู้พัฒนาต้องจัดทำทันทีคือ"},{"id":44,"q":"บทบาทของครูผู้สอนในการนำหลักสูตรไปสู่การปฏิบัติ ข้อใดเหมาะสมที่สุด (สพฐ.รอบทั่วไป ปี 2568)","opts":{"ก":"ปฏิบัติตามเอกสารหลักสูตรอย่างเคร่งครัดโดยไม่ปรับเปลี่ยน","ข":"มุ่งเน้นการสอนตามเนื้อหาในหลักสูตรโดยไม่คำนึงถึงผลลัพธ์การเรียนรู้ของผู้เรียน","ค":"ใช้หลักสูตรเป็นเพียงกรอบแนวคิดโดยไม่จำเป็นต้องติดตามหรือประเมินผลการเรียนรู้","ง":"วางแผนการจัดการเรียนรู้ จัดกิจกรรมการเรียนการสอน เลือกใช้สื่อและวิธีการวัดผล พร้อมทั้งปรับใช้หลักสูตรให้สอดคล้องกับผู้เรียน บริบทของสถานศึกษา และชุมชน"},"a":"ง","e":"หลักสูตรสถานศึกษามีความหมายเป็นรูปธรรมที่สุดคือ แผนและแนวทางประสบการณ์ความเรียนรู้ที่จัดทำขึ้นภายใต้การอิงมาตรฐานของประเทศ (หลักสูตรแกนกลาง 51) และยกระดับปรับแต่งสาระความรู้เพื่อให้สอดรับและสอดประสานกับบริบท ความถนัด และความพร้อมของตัวเด็กภายในสถาบัน"},{"id":45,"q":"หลักสูตรการเรียนการสอนแบบออนไลน์ แบบเปิดเสรีสำหรับทุกๆ คนในโลก สามารถสมัครเข้าเรียนได้โดยไม่จำกัดจำนวน สอดคล้องกับข้อใด (สพฐ.รอบทั่วไป ปี 66)","opts":{"ก":"Smart Classroom","ข":"Moocs","ค":"CAI","ง":"Distance Learning"},"a":"ข","e":"ความแตกต่างของกลุ่มประชากรตามช่วงวัย (Generations) ทำให้วิธีการรับสารและธรรมชาติการเรียนรู้ของเด็กเปลี่ยนไปอย่างเด่นชัด การจัดกระบวนการสอนให้สอดรับความถนัดของเด็กยุคปัจจุบันจึงผลักดันให้เกิด"},{"id":46,"q":"ข้อใดคือชื่อเต็มของ PLC (สพฐ.รอบทั่วไป ปี 2567)","opts":{"ก":"Professional Learning Community","ข":"Professional Learning Center","ค":"Performance Learning Community","ง":"Performance Learning Center"},"a":"ก","e":"ในการวิเคราะห์และจัดกลุ่มผู้เรียนรายบุคคลเพื่อรองรับความแตกต่างระหว่างบุคคล คุณครูจำเป็นต้องคำนึงถึงมิติพื้นฐาน 3 ด้าน ได้แก่: (1) ประสบการณ์สะสมเดิม, (2) ฐานความรู้เดิม, และ (3) ธรรมชาติอุปนิสัยการเรียนรู้ของผู้เรียนเป็นแกนกลางหลัก"},{"id":47,"q":"สื่อวัสดุ คือข้อใด (ครู กทม./2562)","opts":{"ก":"หนังสือ","ข":"วิทยุ","ค":"วีดิทัศน์","ง":"คอมพิวเตอร์"},"a":"ก","e":"การประเมินผลการใช้หลักสูตร (Curriculum Evaluation) เป็นการวัดผลสัมฤทธิ์ในภาพกว้างเชิงระบบ ประเด็นหลักที่ต้องรวบรวมประเมินคือ คุณภาพที่เกิดขึ้นจริงในตัวผู้เรียน (ความรู้ สมรรถนะ คุณลักษณะ) และประสิทธิภาพและอุปสรรคของการเอาหลักสูตรไปจัดกิจกรรมการสอนจริ"},{"id":48,"q":"สื่อการสอนทางคอมพิวเตอร์ประเภทใดที่นำเสนอในลักษณะผสมผสานระหว่างข้อความ ภาพนิ่ง ภา ใดทำให้ผู้เรียนเกิดการแข่งขันมากที่สุด (สพฐ.กรณีพิเศษ ปี 2566)**","opts":{"ก":"การประเมินผลแบบอิงกลุ่ม","ข":"การประเมินผลแบบอิงเกณฑ์","ค":"การประเมินผลแบบสัดส่วนเปอร์เซ็นต์","ง":"การประเมินผลแบบค่าเฉลี่ยเลขคณิต"},"a":"ง","e":"การตัดสินผลการเรียนเป็นลักษณะสัมบูรณ์เพื่อสรุปเกรดปลายปี/ปลายภาควิชา จึงจัดอยู่ในการวัดและประเมินผลแบบรวม (Summative assessment) เช่น การสอบปลายภาค [24, 53]"},{"id":13,"q":"การประเมินผลก่อนเรียนมีจุดมุ่งหมายตามข้อใด (สพฐ.กรณีพิเศษ ปี 2566)**","opts":{"ก":"เพื่อปรับปรุงผลการเรียน","ข":"ค้นหาข้อบกพร่องของผู้เรียน","ค":"ประเมินความก้าวหน้าของผู้เรียน","ง":"ประเมินผลสรุปของผู้เรียน"},"a":"ก","e":"พุทธิพิสัย (Cognitive) ประเมินความจำ ความเข้าใจ และความรู้ในสมอง เครื่องมือที่สามารถวัดระดับกระบวนการคิดด้านนี้ได้เป็นสากลและรวดเร็วคือ \"แบบทดสอบ\" [16, 54]"},{"id":14,"q":"การประเมินผลการทำงานของกระบวนการกลุ่ม ควรใช้เครื่องมือในข้อใดจึงจะเหมาะสมที่สุด (สพฐ.กรณีพิเศษ ปี 2566)**","opts":{"ก":"การสังเกต","ข":"การสัมภาษณ์","ค":"แบบทดสอบ","ง":"แบบสอบถาม"},"a":"ง","e":"การวัดผลเป็นเพียงเครื่องมือรวบรวมหลักฐานเชิงปริมาณหรือคุณภาพ ส่วนการประเมินผลเป็นขั้นตอนการเอาหลักฐานเชิงตัวเลขจากการวัดนั้นมาตีราคาตัดสินคุณค่าตามเกณฑ์ [22, 54]"},{"id":15,"q":"จุดมุ่งหมายของการวัดและประเมินผล ข้อใดสำคัญที่สุด (สพฐ.กรณีพิเศษ ปี 2566)**","opts":{"ก":"เพื่อตัดสินผลการเรียน","ข":"เพื่อปรับปรุงการเรียนการสอน","ค":"เพื่อปรับปรุงหลักสูตร","ง":"เพื่อปรับปรุงการวัดและประเมินผล"},"a":"ค","e":"จุดประสงค์และประโยชน์หลักของการวัดผลทางการศึกษายึดปรัชญาเพื่อการพัฒนา (เพื่อวินิจฉัยข้อบกพร่อง, ค้นหาจุดอ่อนเด่น, และเปรียบเทียบพัฒนาการงอกงาม) [25-26]"},{"id":16,"q":"การประเมินผลตามสภาพจริง ควรดำเนินการอย่างไร (สพฐ.รอบทั่วไป ปี 2568)**","opts":{"ก":"ปฏิบัติตามเอกสารหลักสูตรอย่างเคร่งครัดโดยไม่ปรับเปลี่ยน","ข":"วางแผนการจัดการเรียนรู้ จัดกิจกรรมการเรียนการสอน เลือกใช้สื่อและวิธีการวัดผล พร้อมทั้งปรับใช้หลักสูตรให้สอดคล้องกับผู้เรียน บริบท of สถานศึก","ค":"มุ่งเน้นการสอนตามเนื้อหาในหลักสูตรโดยไม่คำนึงถึงผลลัพธ์การเรียนรู้ของผู้เรียน [63]","ง":"ใช้หลักสูตรเป็นเพียงกรอบแนวคิดโดยไม่จำเป็นต้องติดตามหรือประเมินผลการเรียนรู้ [63]"},"a":"ค","e":"แฟ้มสะสมงานไม่ได้ออกแบบมาเพื่อการสอบชี้ชะตาแต่เป็นประวัติความงอกงาม ทิศทางพัฒนาการ ความเจริญงอกงามในการสร้างสรรค์ชิ้นงานของเด็ก [30, 57]"},{"id":17,"q":"การวัดและการประเมินผลมีความแตกต่างกันอย่างไร (สพฐ.รอบทั่วไป ปี 2568)**","opts":{"ก":"การวัดคือการเก็บข้อมูลเชิงปริมาณ ส่วนการประเมินผลคือการนำข้อมูลที่ได้ไปวิเคราะห์ ตีความ และตัดสินคุณค่า [63]","ข":"การวัดคือการตัดสินคุณภาพ ส่วนการประเมินผลคือการให้คะแนน [63]","ค":"การวัดและการประเมินผลมีความหมายเหมือนกันทุกประการ [63]","ง":"การวัดเน้นความคิดเห็นของผู้สอน ส่วนการประเมินผลไม่ต้องใช้ข้อมูล [63]"},"a":"ก","e":"กระบวนการกลุ่มเป็นพฤติกรรมการมีปฏิสัมพันธ์และทักษะการทำงานร่วมกัน การประเมินที่ตรงตัวและเห็นลำดับเหตุการณ์การปฏิบัติชัดเจนที่สุดคือการใช้วิธีการสังเกตโดยใช้แบบบันทึกประเมินพฤติกรรมกลุ่ม [27, 58]"},{"id":18,"q":"ข้อใดกล่าวถึงลักษณะของการประเมินผลแบบ Rubric ได้ถูกต้อง (สพฐ.รอบทั่วไป ปี 2568)**","opts":{"ก":"การประเมินผลโดยให้คะแนนรวมตามความรู้สึกของผู้สอน [65]","ข":"การประเมินผลโดยเปรียบเทียบผลงานของผู้เรียนแต่ละคน [65]","ค":"การประเมินผลโดยกำหนดเกณฑ์และระดับคุณภาพของผลงานอย่างชัดเจน [65]","ง":"การประเมินผลโดยเน้นการทดสอบความจำของผู้เรียนเป็นหลัก [65]"},"a":"ข","e":"หัวใจหลักทางการศึกษามุ่งเน้นส่งเสริมการพัฒนาการเรียนรู้ ดังนั้น ผลการวัดและประเมินผลจึงต้องนำไปใช้เป็นเครื่องมือสารสนเทศสำหรับย้อนกลับเพื่อส่งเสริมและปรับปรุงประสิทธิภาพของกระบวนการเรียนการสอนมากที่สุด [22, 59]"},{"id":19,"q":"ข้อใดเป็นเครื่องมือที่ใช้ในการประเมินผลโครงงาน (สพฐ.รอบทั่วไป ปี 2568)**","opts":{"ก":"แบบทดสอบก่อนเรียน–หลังเรียน [66]","ข":"แบบประเมินโครงงาน [66]","ค":"แบบสังเกตพฤติกรรมรายบุคคล [66]","ง":"แบบทดสอบ [66]"},"a":"ข","e":"เจตคติและลักษณะทางจิตวิทยาเชิงพฤติกรรม (ความใฝ่เรียนรู้) เป็นองค์ประกอบในจิตพิสัย เครื่องมือวัดพฤติกรรมที่แสดงออกบ่งชี้ได้เหมาะสมและตรงเป้าหมายที่สุดคือการใช้แบบสังเกตพฤติกรรม [16-17, 60]"},{"id":20,"q":"การประเมินผลระหว่างเรียน (Formative Evaluation) มีจุดมุ่งหมายตามข้อใด","opts":{"ก":"เพื่อปรับปรุงหรือแก้ไขการเรียนการสอนระหว่างเรียน","ข":"เพื่อตัดสินผลการเรียนปลายภาค","ค":"เพื่อคัดเลือกเข้าเรียน","ง":"เพื่อเปรียบเทียบโรงเรียน"},"a":"ก","e":"สอดคล้องกับข้อ 41 การสังเกตข้อขัดข้องและนำข้อบกพร่องหลังแผนสอนไปปรับปรุงกิจกรรมการเรียนรู้แบบทันท่วงทีจัดอยู่ในกรอบระเบียบวิธีวิจัยปฏิบัติการ [111, 133]"},{"id":21,"q":"การประเมินผลรวม (Summative Evaluation) มีจุดมุ่งหมายตามข้อใด","opts":{"ก":"ค้นหาข้อบกพร่องก่อนเรียน","ข":"ปรับปรุงระหว่างเรียน","ค":"วัดความพร้อม","ง":"ประเมินผลสัมฤทธิ์เพื่อตัดสินผลการเรียน"},"a":"ง","e":"ขั้นตอนแรกสุดที่มีความสำคัญในการขับเคลื่อนกระบวนการวิจัยทั้งหมดคือ การศึกษา คัดเลือก และระบุขอบเขตกรอบของประเด็นข้อสงสัยหรือการกำหนดปัญหาการวิจัยให้ชัดเจน [75, 134]"},{"id":22,"q":"ควรใช้เครื่องมือใดในการวัดผลด้านทักษะพิสัย**","opts":{"ก":"การประเมินแฟ้มสะสมผลงาน","ข":"แบบสอบถาม","ค":"แบบทดสอบ","ง":"แบบสำรวจ"},"a":"ก","e":"พฤติกรรมทักษะพิสัย (Psychomotor Domain) สัมพันธ์กับทักษะการปฏิบัติ การใช้กล้ามเนื้อ ประสบการณ์ และขั้นตอนการลงมือปฏิบัติจริง ดังนั้นเครื่องมือประเมินในระดับห้องเรียนที่สอดคล้องที่สุดคือการประเมินการปฏิบัติงานจริงผ่านแฟ้มสะสมผลงาน (Portfolio) [17]"},{"id":23,"q":"ควรใช้เครื่องมือใดในการวัดผลด้านจิตพิสัย**","opts":{"ก":"การประเมินแฟ้มสะสมผลงาน","ข":"แบบสอบถาม","ค":"แบบทดสอบ","ง":"แบบสำรวจ"},"a":"ข","e":"จิตพิสัย (Affective Domain) เป็นการวัดความรู้สึกนึกคิด เจตคติ อารมณ์ และค่านิยม ซึ่งนิยมใช้แบบสอบถาม แบบสังเกตพฤติกรรม หรือการสัมภาษณ์ [16-17]"},{"id":24,"q":"ควรใช้เครื่องมือใดในการวัดผลด้านพุทธิพิสัย**","opts":{"ก":"การประเมินแฟ้มสะสมผลงาน","ข":"แบบสอบถาม","ค":"แบบทดสอบ","ง":"แบบสำรวจ"},"a":"ค","e":"พุทธิพิสัย (Cognitive Domain) เกี่ยวข้องกับการวัดความสามารถของสมอง ความรู้ ความคิด ความทรงจำ ความเข้าใจ การวิเคราะห์ และการประเมินค่า ซึ่งใช้แบบทดสอบ (Test) เป็นหลัก [16]"},{"id":25,"q":"“ครูหนึ่งจักรยาน มีเงินในกระเป๋าสตางค์ จำนวน 300 บาท” เป็นมาตรการวัดแบบใด**","opts":{"ก":"นามบัญญัติ (Nominal Scale)","ข":"วัดระดับเรียงอันดับ (Ordinal Scale)","ค":"อันตรภาค / ระดับช่วง (Interval Scale)","ง":"อัตราส่วน (Ratio Scale)"},"a":"ง","e":"จำนวนเงิน (300 บาท) จัดเป็นระดับมาตราอัตราส่วน เนื่องจากมีศูนย์แท้ (Absolute Zero) หากในประเป๋าสตางค์มีเงิน 0 บาท หมายถึงไม่มีเงินอยู่เลยโดยแท้จริง และสามารถบอกได้ว่าเงิน 600 บาท มีจำนวนเป็น 2 เท่าของ 300 บาท (เปรียบเทียบเชิงสัดส่วนคูณหารได้) [15-16]"},{"id":26,"q":"“นายมาริโอ้จักรยาน สอบได้คะแนนวิชาภาษาไทย 80 คะแนน” เป็นมาตรการวัดแบบใด**","opts":{"ก":"นามบัญญัติ (Nominal Scale)","ข":"วัดระดับเรียงอันดับ (Ordinal Scale)","ค":"อันตรภาค / ระดับช่วง (Interval Scale)","ง":"อัตราส่วน (Ratio Scale)"},"a":"ค","e":"คะแนนสอบวิชาภาษาไทย (80 คะแนน) อยู่ในระดับมาตรอันตรภาค เนื่องจากคะแนนนี้ไม่มีศูนย์แท้ (สอบได้คะแนน 0 ไม่ได้แปลว่านักเรียนไม่มีความรู้ภาษาไทยเลย แต่อาจเพราะทำข้อสอบที่นำมาทดสอบข้อนั้นไม่ได้) นอกจากนี้ระดับอันตรภาคยังมีค่าห่างเท่ากันในช่วงคะแนน [14-16]"},{"id":27,"q":"“นายอาร์มจักรยาน สอบได้ลำดับที่ 1 ของห้อง” เป็นมาตรการวัดแบบใด**","opts":{"ก":"นามบัญญัติ (Nominal Scale)","ข":"วัดระดับเรียงอันดับ (Ordinal Scale)","ค":"อันตรภาค / ระดับช่วง (Interval Scale)","ง":"อัตราส่วน (Ratio Scale)"},"a":"ข","e":"การสอบได้ลำดับที่ 1 เป็นการจัดอันดับหรือเรียงลำดับพฤติกรรมความสามารถ (สอบได้ที่ 1, 2, 3) แต่ไม่สามารถบอกปริมาณส่วนต่างที่ละเอียดเป็นคะแนนได้ว่าลำดับที่ 1 เก่งกว่าลำดับที่ 2 เท่าใด [14-16]"},{"id":28,"q":"“เด็กหญิงแก้วจักรยาน นับถือศาสนาพุทธ” เป็นมาตรการวัดแบบใด**","opts":{"ก":"นามบัญญัติ (Nominal Scale)","ข":"วัดระดับเรียงอันดับ (Ordinal Scale)","ค":"อันตรภาค / ระดับช่วง (Interval Scale)","ง":"อัตราส่วน (Ratio Scale)"},"a":"ก","e":"การระบุศาสนาเป็นเพียงการจัดกลุ่ม จำแนกกลุ่ม หรือจัดกลุ่มเพื่อจำแนกประเภท (พุทธ, คริสต์, อิสลาม ฯลฯ) ไม่สามารถนำตัวเลขหรือสถานะมาเปรียบเทียบเรียงลำดับ หรือเอามาคำนวณบวกลบคูณหารได้ [14-15]"},{"id":29,"q":"“เด็กหญิงแจงจักรยาน สูง 178 เซนติเมตร” เป็นมาตรการวัดแบบใด**","opts":{"ก":"นามบัญญัติ (Nominal Scale)","ข":"วัดระดับเรียงอันดับ (Ordinal Scale)","ค":"อันตรภาค / ระดับช่วง (Interval Scale)","ง":"อัตราส่วน (Ratio Scale)"},"a":"ง","e":"ส่วนสูง (178 เซนติเมตร) จัดเป็นระดับมาตราอัตราส่วน เนื่องจากมีศูนย์แท้ หากส่วนสูงเท่ากับ 0 แปลว่าไม่มีส่วนสูงอยู่เลย และค่าตัวเลขส่วนสูงสามารถนำมาเปรียบเทียบสัดส่วนคูณหารกันได้จริง [15-16]"},{"id":30,"q":"ข้อมูลที่ได้จากแบบวัดแบบ Ratio Scale จัดอยู่ในมาตรการวัดใด**","opts":{"ก":"นามบัญญัติ","ข":"เรียงอันดับ","ค":"อันตรภาค","ง":"อัตราส่วน"},"a":"ง","e":"การประเมินผลรวมหลังสิ้นสุดการเรียน (Summative evaluation) มุ่งตัดสินชี้ขาดระดับคะแนนหรือเกรดของผู้เรียนเมื่อจบบทเรียนหรือรายวิชา [24]"},{"id":31,"q":"เครื่องมือตามข้อใดใช้ในการวัดพฤติกรรม (สพฐ.รอบทั่วไป ปี 66)**","opts":{"ก":"แบบทดสอบ","ข":"แฟ้มสะสมผลงาน","ค":"แบบสังเกต","ง":"แบบสัมภาษณ์"},"a":"ก","e":"การประเมินผลการเรียนรู้ต้องยึดหลักความเที่ยงตรง (Validity) ซึ่งต้องเริ่มต้นจากการวิเคราะห์เป้าหมายและทิศทางตาม \"จุดประสงค์การเรียนรู้\" เป็นสำคัญที่สุด [12, 50]"},{"id":32,"q":"การวัดคุณลักษณะอันพึงประสงค์ควรใช้เครื่องมือในข้อใด (สพฐ.กรณีพิเศษ ปี 2566)**","opts":{"ก":"การสังเกต","ข":"การสัมภาษณ์","ค":"แบบทดสอบ","ง":"แฟ้มสะสมผลงาน"},"a":"ก","e":"หลักเกณฑ์สำคัญข้อแรกในการสร้างและเลือกเครื่องมือวัดผลคือ เครื่องมือวัดนั้นต้องวัดได้สอดคล้องและตรงตาม \"จุดประสงค์การเรียนรู้\" (วัตถุประสงค์เชิงพฤติกรรม) [12, 55]"},{"id":33,"q":"ข้อใดใช้เครื่องมือได้ถูกต้องที่สุด (สพฐ.รอบทั่วไป ปี 2567)**","opts":{"ก":"ชิ้นงาน - แบบสัมภาษณ์","ข":"ความใฝ่เรียนรู้ - แบบสังเกตพฤติกรรม","ค":"ความรู้ - แบบสอบถาม","ง":"เจตคติ - แบบสำรวจ"},"a":"ค","e":"แฟ้มสะสมผลงานสะสมหลักฐาน รวบรวมงานชิ้นเด่น และแสดงประวัติความพยายามในการทำงานของผู้เรียนในสถานการณ์จริง จึงสะท้อนความสามารถที่แท้จริงได้สูงและน่าเชื่อถือที่สุด [30, 56]"},{"id":34,"q":"ครูทองมี สอนวิชาคณิตศาสตร์ของนักเรียนระดับชั้นมัธยมศึกษาปีที่ 5/15 จำนวน 35 คน โรงเรียนแห่งหนึ่งในจังหวัดศรีสะเกษ ในการเรียนการสอนสัปดาห์ที่ 12 ครูทองมีต้องการหาเครื่องมือที่ดีที่สุดเพื่อใช้ในการวัดผลในชั้นเรียนของนักเรียนชั้นดังกล่าว ครูทองมีต้องใช้เครื่องมือตามข้อใด (ข้อสอบแนว PISA)** [60-61]","opts":{"ก":"การประเมินแฟ้มสะสมผลงาน","ข":"แบบสังเกตพฤติกรรม","ค":"แบบทดสอบ","ง":"แบบวัดเจตคติ"},"a":"ก","e":"การประเมินแบบอิงกลุ่ม (Norm-Referenced) เป็นการเปรียบเทียบคะแนนของผู้เรียนคนหนึ่งกับเพื่อนร่วมกลุ่มทั้งหมดเพื่อคัดเลือกคัดสรรหรือจัดลำดับพฤติกรรมความสามารถ จึงกระตุ้นให้เกิดการแข่งขันแย่งชิงตำแหน่งในกลุ่มสูง [25-26, 57]"},{"id":35,"q":"ครูพี่หนึ่งสอนวิชาภาษาไทยของนักเรียนระดับชั้นมัธยมศึกษาปีที่ 5 ส่วนครูทองมีสอนวิชาคณิตศาสตร์ของนักเรียนระดับชั้นมัธยมศึกษาปีที่ 5 โรงเรียนเดียวกัน ก่อนเริ่มทำการสอนในสัปดาห์ที่ 1 ครูพี่หนึ่งเลือกใช้แบบทดสอบแบบ Formative test ส่วนครูทองมีเลือกใช้แบบทดสอบแบบ Pre – Assessment เพื่อต้องการประเมินความรู้","opts":{"ก":"ในสัปดาห์ที่ 1 ไม่มีครูคนใดเลือกใช้ประเภทแบบทดสอบถูกต้อง","ข":"ในสัปดาห์ที่ 20 ไม่มีครูคนใดเลือกใช้ประเภทแบบทดสอบถูกต้อง","ค":"ในสัปดาห์ที่ 1 ครูพี่หนึ่งเลือกใช้ประเภทแบบทดสอบถูกต้อง","ง":"ในสัปดาห์ที่ 20 ครูพี่หนึ่งเลือกใช้ประเภทแบบทดสอบถูกต้อง * จ. ในสัปดาห์ที่ 1 และ 20 ครูทองมีเลือกใช้ประเภทแบบทดสอบถูกต้อง"},"a":"ข","e":"การประเมินก่อนเรียน (Pre-assessment) มีจุดเน้นเพื่อวินิจฉัยและระบุพื้นความรู้เดิมและค้นหาจุดที่ขาดตกบกพร่องของผู้เรียนเป็นรายคนก่อนเริ่มเนื้อหาใหม่ [23, 57]"},{"id":36,"q":"ข้อใดเป็นเครื่องมือที่ใช้ในการวัดทักษะการอ่านที่ชัดเจนที่สุด (สพฐ.รอบทั่วไป ปี 2568)**","opts":{"ก":"แบบวัดการอ่าน [66]","ข":"แบบสังเกตการอ่านของผู้เรียน [66]","ค":"แบบสัมภาษณ์เกี่ยวกับเนื้อเรื่องที่อ่าน [66]","ง":"แบบทดสอบ [66]"},"a":"ก","e":"การนำข้อมูลการตอบสนอง พฤติกรรมการเรียน และการตรวจงานมาปรับปรุงแผนการสอนรายวันและรายหน่วยสัปดาห์ในห้องเรียนเป็นขอบข่ายความรับผิดชอบของการประเมินระดับชั้นเรียน [3-4, 60]"},{"id":37,"q":"จงเรียงลำดับขั้นตอนของการวิจัยต่อไปนี้ (สพฐ.รอบทั่วไป ปี 2567)**  * **A:** ศึกษาเอกสารที่เกี่ยวข้อง * **B:** ศึกษาปัญหา * **C:** รวบรวมข้อมูล * **D:** ออกแบบการเก็บข้อมูล และสร้างเครื่องมือ * **E:** วิเคราะห์และสรุปผลการวิจัย *ตัวเลือก:*","opts":{"ก":"A B C D E","ข":"B A C D E","ค":"A B D C E","ง":"B A D C E"},"a":"ง","e":"การวัดเจตคติหรือคุณลักษณะทางลึกต้องการความยืดหยุ่นสูง เนื่องจากคำถามปรนัยทั่วไปอาจทำให้นักเรียนตอบเพื่อสร้างภาพหรือถูกบีบด้วยทิศทางตัวเลือก การสัมภาษณ์แบบไม่เป็นทางการจะช่วยสร้างบรรยากาศที่เปิดเผยและได้ข้อเท็จจริง ทัศนคติเชิงลึกได้เป็นธรรมชาติที่สุด "},{"id":38,"q":"ค่า P (ค่าความยากง่าย) และ ค่า R (ค่าอำนาจจำแนก) ของแบบทดสอบ ซึ่งนำไปใช้ได้คือ ข้อใด**","opts":{"ก":"$0.20 < p < 0.80$ , $0.20 < r < 1.00$","ข ียนและต้องมีความยืดหยุ่นในการบูรณาการหลักสูตรให้สอดประสานกับบริบทจริงของโรงเรียน สภาพครอบครัว และสังคมวัฒนธรรมรอบตัวเด็ก [28, 62-63]"},{"id":57,"q":"การวิจัยในชั้นเรียนเป็นการวิจัยรูปแบบใด (สพฐ.รอบทั่วไป ปี 2561)**","opts":{"ก":"การวิจัยเชิงปฏิบัติการ","ข":"การวิจัยเชิงปริมาณ","ค":"วิจัยประยุกต์","ง":"การวิจัยสถาบัน"},"a":"ก","e":"ขอบเขตหน้าที่ของการวัด (Measurement) เป็นเรื่องของการรวบรวมสังเกตและเก็บข้อมูลปริมาณตัวเลขตามเครื่องมือ ส่วนการประเมินผล (Evaluation) คือกระบวนการที่นำผลการวัดมารวมกับเกณฑ์อ้างอิงเพื่อตีค่าวิเคราะห์และตัดสินทิศทางการเรียนรู้ [11, 22, 63]"},{"id":58,"q":"สมมติฐานของการวิจัย หมายถึง (สพฐ.รอบทั่วไป ปี 2559)**","opts":{"ก":"การคาดคะเนคำตอบของการวิจัย","ข":"การกำหนดปัญหาของการวิจัย","ค":"การกำหนดกลุ่มตัวอย่างของการวิจัย","ง":"การอภิปรายวัตถุประสงค์ของการวิจัย"},"a":"ค","e":"ความตรงหรือความเที่ยงตรง (Validity) หมายถึง คุณลักษณะเฉพาะของเครื่องมือที่สามารถตรวจสอบวัดคะแนนในพฤติกรรมหรือคุณลักษณะทางพุทธิพิสัย ทักษะพิสัย จิตพิสัย ได้อย่างสอดคล้องถูกต้องตรงประเด็นตามกรอบวัตถุประสงค์หลัก [86, 64]"},{"id":59,"q":"การตั้งสมมติฐาน in งานวิจัยตรงกับอริยสัจ 4 ตามข้อใด (สพฐ.รอบทั่วไป ปี 2567)**","opts":{"ก":"ทุกข์","ข":"สมุทัย","ค":"นิโรธ","ง":"มรรค"},"a":"ค","e":"Rubrics Score (เกณฑ์การประเมินค่าคุณภาพ) คือชุดของหลักเกณฑ์การประเมินที่สร้างขึ้นอย่างจำเพาะเจาะจงเพื่อประเมินผลงานหรือทักษะภาคปฏิบัติ โดยกำหนดระดับชั้นคุณภาพ (เช่น ดีเยี่ยม, ดี, พอใช้, ปรับปรุง) และเกณฑ์บ่งบอกทักษะชัดเจนในทุกระดับชั้นคะแนน [65]"},{"id":60,"q":"ประเภทของการวิจัยแบ่งโดยใช้จุดมุ่งหมายของการวิจัย ได้แก่**  1. วิจัยบริสุทธิ์หรือวิจัยพื้นฐาน คือ.............................  2. วิจัยประยุกต์ คือ.............................  3. วิจัยเชิงปฏิบัติการหรือวิจัยเฉพาะกิจ คือ.............................  4. การวิจัยสถาบัน คือ..........................","opts":{"ก":"A B C D","ข":"A D C B","ค":"D A C B","ง":"B D C A"},"a":"ก","e":"ทักษะกระบวนการเฉพาะด้าน เช่น การอ่านจับใจความ การอ่านสะกดคำและการออกเสียงที่ต้องเป็นระบบระเบียบตามเกณฑ์มาตรฐานทางการศึกษา ควรใช้ชุดแบบประเมินหรือแบบวัดทักษะการอ่านที่เป็นรูปแบบเฉพาะและได้มาตรฐานเพื่อความเที่ยงตรงในการให้ข้อมูลพัฒนาผู้เรียน [66]"},{"id":61,"q":"ขั้นตอนของวิธีแก้ปัญหาอริยสัจ 4 เทียบกับกระบวนการวิธีทางวิทยาศาสตร์ มีดังนี้ (ข้อสอบแนว PISA)**  1. ทุกข์ = ขั้นกำหนดปัญหา (Problem)  2. สมุทัย = …………………………………………………………….  3. นิโรธ = ขั้นรวบรวมข้อมูล (Gathering Data)  4. มรรค = ………………………………………………….…………  *จงเติมขั้นตอนของวิธีแก้ปัญหาด้วยกระบวนการวิธี","opts":{"ก":"ขั้นวิเคราะห์ข้อมูล (Analysis) , ขั้นสรุปผล (Conclusion)","ข":"ขั้นศึกษางานทฤษฎีที่เกี่ยวข้อง , ขั้นวิเคราะห์ข้อมูล (Analysis)","ค":"ขั้นตั้งสมมติฐาน (Hypothesis) , ขั้นสรุปผล (Conclusion)","ง":"ขั้นตั้งสมมติฐาน (Hypothesis) , ขั้นวิเคราะห์ข้อมูล (Analysis) , ขั้นสรุปผล (Conclusion) --- ---"},"a":"ข","e":"โครงงาน (Project) เป็นกิจกรรมบูรณาการทักษะที่ประกอบด้วยกระบวนการทำงาน การเขียนรายงาน และการนำเสนอผลงาน ดังนั้นเครื่องมือสรุปผลงานวิชาการนี้ที่สอดคล้องครอบคลุมที่สุดคือ \"แบบประเมินโครงงาน\" ที่ใช้ระบบ Rubrics [66]"},{"id":62,"q":"ครูพี่หนึ่งต้องการทดสอบสมมติฐานการวิจัย โดยทดสอบกลุ่มตัวอย่างสองกลุ่มที่เป็นอิสระจากกัน สอบสองครั้ง เปรียบเทียบความแตกต่างระหว่างบุคคล ซึ่งกลุ่มตัวอย่างทั้งสองกลุ่มจะต้องไม่สัมพันธ์กันหรือเป็นอิสระต่อกัน ครูพี่หนึ่งทดสอบสมมติฐานการวิจัยด้วยวิธี.............................................. ส่วนครูทอ","opts":{"ก":"A C","ข":"B C","ค":"C B","ง":"A E"},"a":"ก","e":"สมมติฐานของการวิจัย (Research Hypothesis) คือ การคาดคะเนคำตอบของปัญหาการวิจัยไว้ล่วงหน้าอย่างมีเหตุผลอ้างอิงทางทฤษฎีก่อนทำการเก็บรวบรวมข้อมูลจริง [78, 81]"},{"id":63,"q":"“กระบวนการที่ทำให้ได้ตัวอย่างที่เป็นตัวแทนที่ดีของประชากร” สอดคล้องกับความหมายในข้อใดมากที่สุด**","opts":{"ก":"เครื่องมือที่ใช้ในการวิจัย","ข":"สมมติฐาน","ค":"การสุ่มกลุ่มตัวอย่าง","ง":"การกำหนดตัวแปร"},"a":"ง","e":"ขั้นตอนการทำวิจัยอย่างมีระบบเริ่มจาก: (1) ศึกษาและกำหนดตัวปัญหา (B) -> (2) ค้นคว้าทฤษฎีและศึกษาเอกสารที่เกี่ยวข้อง (A) -> (3) ออกแบบกรอบแนวคิดการรวบรวมข้อมูลและสร้างนวัตกรรมเครื่องมือ (D) -> (4) ดำเนินการเก็บและรวบรวมข้อมูลเชิงประจักษ์ (C) -> (5) ดำเ"},{"id":64,"q":"การเลือกกลุ่มตัวอย่าง หมายถึงข้อใด (สพฐ.รอบทั่วไป ปี 2561)**","opts":{"ก":"ครอบคลุม","ข":"ได้ตัวแทนที่ดี","ค":"ประหยัดงบประมาณ","ง":"ประหยัดทรัพยากร"},"a":"ข","e":"สัมพันธ์ตามลำดับวัตถุประสงค์เกณฑ์จุดมุ่งหมายของการวิจัย ได้แก่: * วิจัยพื้นฐาน/บริสุทธิ์ (1 - A) เพื่อตอบสนองความอยากรู้ทางปัญญาและสร้างความรู้เชิงทฤษฎีใหม่ [73] * วิจัยประยุกต์ (2 - D) นำองค์ความรู้พื้นฐานมาพัฒนากิจกรรม สภาพความเป็นอยู่และสังคม [73]"},{"id":65,"q":"ข้อใดคือความหมายของ “ตัวแปรอิสระหรือตัวแปรต้น (Independent)”**","opts":{"ก":"กำหนดขึ้นเพื่อทดสอบสมมติฐาน","ข":"เป็นผลเป็นตัวแปรมาจากตัวแปรต้น","ค":"ผู้วิจัยไม่ต้องการให้เกิดเหตุการณ์นั้นขึ้น","ง":"ตัวแปรที่ส่งผลต่อการทดลอง"},"a":"ค","e":"ความเชื่อมั่น (Reliability) ของเครื่องมือวัดหมายถึงความคงเส้นคงวาและเสถียรภาพในการวัดผล ไม่ว่าจะทำการทดสอบซ้ำห่างกันตามกำหนดภายใต้สภาวะเดิมกี่ครั้งก็ตาม เครื่องมือนั้นต้องให้ค่าคะแนนผลสัมฤทธิ์ใกล้เคียงตามคำตอบเดิมเสมอ [87, 93]"},{"id":66,"q":"ข้อใดคือความหมายของ “ตัวแปรควบคุม (Control Variable)”**","opts":{"ก":"กำหนดขึ้นเพื่อทดสอบสมมติฐาน","ข":"เป็นผลเป็นตัวแปรมาจากตัวแปรต้น","ค":"ผู้วิจัยไม่ต้องการให้เกิดเหตุการณ์นั้นขึ้น","ง":"ตัวแปรที่ส่งผลต่อการทดลอง"},"a":"ก","e":"ความคงเส้นคงวาของเครื่องมือทางการทดสอบมีนิยามศัพท์วิชาการว่า \"ความเชื่อมั่น (Reliability)\" [87, 93]"},{"id":67,"q":"ข้อใดสอดคล้องกับ ตัวแปรสอดแทรก (Intervening Variables)**","opts":{"ก":"กำหนดขึ้นเพื่อทดสอบสมมติฐาน","ข":"เป็นผลเป็นตัวแปรมาจากตัวแปรต้น","ค":"ความวิตกกังวล ความคับข้องใจ ความเกรงใจ","ง":"ตัวแปรที่ส่งผลต่อการทดลอง"},"a":"ก","e":"ค่าสถิติที่เหมาะสมและยอมรับให้นำมาใช้คัดกรองข้อสอบเข้าชุดแบบวัดมาตรฐานได้คือ: ค่าความยากง่าย $P$ อยู่ระหว่าง $0.20$ ถึง $0.80$ และค่าอำนาจการจำแนก $R$ ต้องไม่ต่ำกว่า $0.20$ และมีค่าสูงสุดได้ถึง $1.00$ [88-89, 94]"},{"id":68,"q":"ข้อใดคือตัวแปรอิสระ**","opts":{"ก":"วิธีการสอน","ข":"ผลสัมฤทธิ์","ค":"ระดับสติปัญญา","ง":"ความวิตกกังวล"},"a":"ค","e":"ค่าอำนาจจำแนก (Discrimination) คือขีดความสามารถของข้อสอบข้อนั้นๆ ในการจำแนกแยกแยะกลุ่มผู้เข้าสอบออกเป็นสองซีกตามความเก่ง ได้แก่กลุ่มสูง (เก่ง) และกลุ่มต่ำ (อ่อน) ได้อย่างถูกต้องตรงความเป็นจริง [89, 94]"},{"id":69,"q":"การศึกษาเปรียบเทียบผลการสอนวิชาภาษาอังกฤษโดยใช้บทเรียนสำเร็จรูปกับการสอนปกติ ข้อใดคือตัวแปรต้น**","opts":{"ก":"วิธีการสอน","ข":"ผลสัมฤทธิ์ทางการเรียน","ค":"เพศ, ระดับชั้น, ระดับสติปัญญา, อายุ","ง":"ภาวะจิตใจ, ความวิตกกังวล, สภาพแวดล้อม"},"a":"ค","e":"ครูพี่หนึ่งทำการวิเคราะห์กลุ่มตัวอย่างสอบเทียบความแตกต่างระหว่างกลุ่มประชากรศาสตร์ซึ่งข้อมูลสองกลุ่มนั้นไม่เกี่ยวโยงสัมพันธ์กัน (เป็นอิสระต่อกัน) จึงต้องเลือกใช้สถิติแบบ t-test Independent (C) ส่วนครูทองมีประเมินผลกลุ่มตัวอย่างกลุ่มเดียวแต่ทำข้อทดสอบ"},{"id":70,"q":"วิจัยเรื่องการเปรียบเทียบผลสัมฤทธิ์ทางการเรียนวิชาคณิตศาสตร์โดยวิธีการสอนแบบเรียนร่วมกับวิธีการสอนแบบปกติ ตัวแปรอิสระตรงกับข้อใด (สพฐ.รอบทั่วไป ปี 59)**","opts":{"ก":"วิธีการสอน","ข":"วิธีการสอนแบบปกติ","ค":"วิธีการสอนแบบร่วม","ง":"ผลสัมฤทธิ์ทางการเรียน"},"a":"ง","e":"ตามเกณฑ์มาตรฐานของคุณภาพเครื่องมือการวิจัยที่ใช้คัดกรองเครื่องมือ ได้แก่: * IOC (ความเที่ยงตรง) ยอมรับได้ตั้งแต่ 0.50 ขึ้นไป ถึง 1.00 (B) [87] * Reliability (ความเชื่อมั่น) ดีมากควรไม่ต่ำกว่า 0.80 ขึ้นไป ถึง 1.00 (E) [87] * Difficulty (ค่า P ความยากง"},{"id":71,"q":"ครูพี่หนึ่งทำการศึกษาเปรียบเทียบผลสัมฤทธิ์ทางการเรียนวิชาภาษาไทยโดยใช้บทเรียนสำเร็จรูปกับการสอนปกติ ซึ่งการศึกษาในครั้งนี้มีตัวแปรต้น คือ........................................ ตัวแปรตาม คือ ............................................. และมีตัวแปรที่มีผลกระทบตัวแปรตาม 2 ตัวแปร คือ ................","opts":{"ก":"D A E F","ข":"C D F E","ค":"A D E G","ง":"A D E F --- ---"},"a":"ค","e":"การสุ่มกลุ่มตัวอย่าง (Sampling) คือ ระเบียบวิธีการหรือขั้นตอนการเลือกตัวแทนจำนวนหนึ่งมาจากกลุ่มประชากรเป้าหมายทั้งหมด เพื่อใช้เป็นตัวแทนที่ดีในการวิเคราะห์แปลความข้อมูลเพื่ออ้างอิงคุณสมบัติไปสู่ประชากรทั้งหมด [97, 99]"},{"id":72,"q":"วิจัยประเภทใดที่ใช้ข้อมูลทุติยภูมิ (สพฐ.รอบทั่วไป ปี 2559)**","opts":{"ก":"วิจัยเชิงทดลอง","ข":"วิจัยเชิงประวัติศาสตร์","ค":"วิจัยเชิงบรรยาย","ง":"วิจัยเชิงปฏิบัติการ"},"a":"ข","e":"ขอบข่ายจุดมุ่งหมายสูงสุดของการเลือกตัวอย่างหรือสุ่มกลุ่มตัวอย่างคือ ความพยายามคัดสรรเลือกผู้ถูกทดสอบที่สะท้อนคุณลักษณะสำคัญใ ,"e":"การวิจัยเชิงทดลองต้องการให้ผู้วิจัยควบคุมตัวแปรและเฝ้าสังเกตการณ์ สัมภาษณ์ หรือตรวจบันทึกเพื่อรวบรวมคะแนนสอบที่เกิดจากการจัดทำสื่อนวัตกรรมใหม่ขึ้นมาด้วยตนเองแบบสดๆ ทันที จึงใช้ข้อมูลปฐมภูมิเป็นแกนสำคัญ [108-109]"},{"id":82,"q":"การทดสอบสมมุติฐานด้วย t-test Independent แสดงว่า ผู้วิจัยมีการออกแบบการวิจัยอย่างไร (สพฐ. รอบทั่วไป 63)**","opts":{"ก":"ทดลองกลุ่มตัวอย่างกลุ่มเดียว สอบหนึ่งครั้ง","ข":"ทดลองกลุ่มตัวอย่างกลุ่มเดียว สอบสองครั้ง","ค":"ทดลองกลุ่มตัวอย่างทั้งสองกลุ่มไม่สัมพันธ์กัน (เป็นอิสระต่อกัน) สอบหนึ่งครั้ง","ง":"ทดลองกลุ่มตัวอย่างทั้งสองกลุ่มไม่สัมพันธ์กัน (เป็นอิสระจากกัน) สอบสองครั้ง"},"a":"ค","e":"จุดเน้นและเป้าหมายสูงสุดของการทำวิจัยในชั้นเรียนไม่ใช่ครูหรือผู้บริหารโรงเรียน แต่ทำไปเพื่อแก้ไขข้อบกพร่อง ปัญหาพฤติกรรม และพัฒนาคุณภาพทักษะการเรียนรู้ของผู้เรียนเป็นรายบุคคลหรือรายกลุ่มให้ดีที่สุด [110, 112]"},{"id":83,"q":"ในการจัดการเรียนการสอน พบว่ามีนักเรียนอ่านไม่ออกจำนวน 3 คน จาก 35 คน ควรใช้การวิจัยรูปแบบใด (สพฐ. รอบทั่วไป 63)**","opts":{"ก":"การศึกษาแบบสำรวจ","ข":"การศึกษาแบบกรณีพิเศษ","ค":"การศึกษาแบบการทดลอง","ง":"การศึกษารายกรณี"},"a":"ค","e":"วัตถุประสงค์ของการวิจัยในชั้นเรียนคือความพยายามคิดค้นวิธีการ นวัตกรรม และนำลงไปทดสอบเพื่อพัฒนาและแก้ปัญหาการเรียนการสอนโดยตรงเพื่อให้ห้องเรียนเป็นสถานเรียนรู้อย่างมีคุณภาพ [110, 112]"},{"id":84,"q":"ข้อใดไม่ใช่ประโยชน์ของการวิจัย in ชั้นเรียน (สพฐ.รอบทั่วไป 64-65)**","opts":{"ก":"เพื่อพัฒนาสติปัญญา","ข":"ทำให้เกิดความเข้าใจในปรากฎการณ์และพฤติกรรมต่างๆ","ค":"ช่วยให้การจัดการศึกษามีประสิทธิภาพสูงสุดจากการได้ความรู้และ ความเข้าใจต่างๆ","ง":"ใช้แก้ปัญหาได้อย่างมีประสิทธิภาพ ถูกต้องและยุติธรรม"},"a":"ก","e":"วิจัยในชั้นเรียนมีกระบวนการวางแผน ปฏิบัติ สังเกตการณ์ สะท้อนผล (PAOR) ทำงานแก้ไขปัญหางานประจำในสถานการณ์จริง จึงเป็นรูปแบบของการวิจัยปฏิบัติการ (Action Research) [111, 113]"},{"id":85,"q":"การวิจัยในชั้นเรียนเกี่ยวข้องกับใครมากที่สุด (สพฐ. กรณีพิเศษ/2562)**","opts":{"ก":"นักเรียน","ข":"ครูประจำชั้น","ค":"ครูผู้สอน","ง":"ผู้บริหารโรงเรียน"},"a":"ก","e":"ลำดับที่ถูกต้อง: การวิจัยในชั้นเรียนจัดเป็นรูปแบบ \"วิจัยเชิงปฏิบัติการ\" (E) ซึ่งจัดแบ่งตามระเบียบวิธีวิจัยทั่วไป (A) โดยมีเป้าหมายและจุดมุ่งหมายเพื่อ \"พัฒนาและแก้ปัญหาในชั้นเรียน\" (I) [114]"},{"id":86,"q":"“ปัญหาผลสัมฤทธิ์ทางการเรียนของนักเรียนต่ำเนื่องจากนักเรียนไม่เข้าใจบทเรียน ” ควรออกแบบการวิจัย เพื่อแก้ปัญหาในลักษณะใด**","opts":{"ก":"เชิงทดลองพัฒนาสื่อนวัตกรรม","ข":"เชิงสำรวจหาสาเหตุปัญหา","ค":"เชิงปริมาณอ้างอิงทฤษฎีการเรียนรู้","ง":"เชิงปฏิบัติการอบรมพัฒนาการเรียนรู้"},"a":"ก","e":"วัตถุประสงค์สูงสุดและจุดโฟกัสของการทำวิจัยในชั้นเรียนคือเพื่อมุ่งมั่นเข้าไปจำกัดจุดอ่อน แก้ไขพฤติกรรม และพัฒนาพฤติกรรมการเรียนรู้ของผู้เรียน [110, 115]"},{"id":87,"q":"การวิจัยที่มุ่งแก้ปัญหาอย่างเร่งด่วนใช้เวลาไม่มากนัก คือการวิจัยแบบใด**","opts":{"ก":"การวิจัยเชิงประเมิน","ข":"การวิจัยเชิงบรรยาย","ค":"การวิจัยเชิงปฏิบัติการ","ง":"การวิจัยต่อยอด"},"a":"ข","e":"ปัญหาวิจัยและการหาคำตอบจะต้องดำเนินการสืบเสาะอย่างมีระบบตามระเบียบวิธีวิจัยและวิธีทางวิทยาศาสตร์ที่สังคมวิชาการยอมรับ ไม่สามารถสรุปได้ตามจินตนาการหรือวิธีกากบาทเดาใดๆ ได้ [70, 116]"},{"id":88,"q":"กระบวนการวิจัยมีลักษณะคล้ายคลึงกับการแสวงหาความรู้แบบใด**","opts":{"ก":"แบบอุปมาน","ข":"แบบอนุมาน","ค":"แบบอริสโตเติล","ง":"แบบวิทยาศาสตร์"},"a":"ข","e":"สถิติ t-test Dependent ใช้ทดสอบความแตกต่างของค่าเฉลี่ยคะแนนของกลุ่มทดลองหนึ่งกลุ่มเดิมที่ทำการวัดซ้ำสองครั้ง (เช่น คะแนนสอบก่อนเรียนและหลังเรียน) [91, 117]"},{"id":89,"q":"ในการกำหนดหัวข้อปัญหาการวิจัย จำเป็นต้องมีข้อใดที่จะทำให้ชื่อเรื่องชัดเจน**","opts":{"ก":"สถานที่","ข":"พฤติกรรมหรือตัวแปร","ค":"ลักษณะการวิจัย","ง":"ลักษณะของเครื่องมือวิจัย"},"a":"ง","e":"t-test Independent สถิติทดสอบเปรียบเทียบความแตกต่างระหว่างกลุ่มสองกลุ่มที่เป็นตัวแปรอิสระต่อกันในการทดสอบผลการวัดคะแนน [92, 117]"},{"id":90,"q":"สมมติฐานในข้อใดไม่ควรใช้เป็นสมมติฐานวิจัย**","opts":{"ก":"หญิงมีวินัยมากกว่าชาย","ข":"หญิงมีวินัยต่างจากชาย","ค":"ชายมีวินัยต่างจากหญิง","ง":"หญิงและชายมีวินัยไม่แตกต่างกัน"},"a":"ง","e":"การศึกษารายกรณี (Case Study / รวบรวมข้อมูลรายกรณี) เหมาะสำหรับการเข้าไปเยียวยา วิเคราะห์หาสาเหตุ และแก้ไขปัญหาพฤติกรรมเฉพาะของกลุ่มเป้าหมายขนาดเล็ การส่งเสริมการศึกษาเอกชน (สช.) องค์กรปกครองส่วนท้องถิ่น (อปท.) และสำนักงานคณะกรรมการการศึกษาขั้นพื้นฐาน (สพฐ.)” ข้อใดคือตัวแปรตาม (สพฐ.รอบทั่วไป ปี 66)**","opts":{"ก":"ผลคะแนน","ข":"สังกัดของโรงเรียน","ค":"ระดับชั้น","ง":"เครื่องมือในการทดสอบ"},"a":"ง","e":"การเก็บตัวอย่างการอ่านของประชากรขนาดใหญ่ในระดับจังหวัด (สกลนคร) ซึ่งมีโรงเรียนและพื้นที่จำนวนมาก การสุ่มให้ได้ข้อมูลที่เป็นตัวแทนที่ดีโดยประหยัดงบประมาณและเวลาคือการแบ่งกลุ่มระดับเขตพื้นที่, ระดับโรงเรียน, และระดับห้องเรียนเป็นชั้นๆ นั่นคือใช้วิธีการ"},{"id":96,"q":"ตัวแปรควบคุมสอดคล้องกับการวิจัยประเภทใด (สพฐ.รอบทั่วไป ปี 66)**","opts":{"ก":"วิจัยเชิงสำรวจ","ข":"วิจัยเชิงคุณภาพ","ค":"วิจัยเชิงทดลอง","ง":"วิจัยเชิงประวัติศาสตร์"},"a":"ง","e":"ลำดับโครงสร้างการทำวิจัยดำเนินตามขั้นตอนวิธีของวิทยาศาสตร์ (เริ่มจากปัญหา -> ทบทวนความรู้ตั้งสมมติฐาน -> ออกแบบรวบรวมหลักฐานเชิงประจักษ์ -> วิเคราะห์ประมวลผล -> สรุปความจริงตอบปัญหาวิจัย) [70, 121]"},{"id":97,"q":"ข้อใดเป็นความหมายของการวิจัย (สพฐ.กรณีพิเศษ ปี 2566)**","opts":{"ก":"การแก้ปัญหา","ข":"การคาดคะเนคำตอบ","ค":"การค้นหาความจริง","ง":"การสืบค้นข้อมูล"},"a":"ข","e":"การเขียนหัวข้อปัญหาและชื่องานวิจัยทางการศึกษาที่สมบูรณ์ ชัดเจน และน่าเชื่อถือ จะต้องระบุชื่อตัวแปรที่มุ่งศึกษา (ทั้งตัวแปรต้นนวัตกรรม และตัวแปรตามสัมฤทธิ์) พร้อมกับระบุพฤติกรรมและกลุ่มเป้าหมายที่จะกระทำทดสอบลงไปชัดเจนในชื่อเรื่อง [77, 121]"},{"id":98,"q":"ตามวงจรการวิจัย PAOR ตัวอักษร O สอดคล้องกับข้อใด (สพฐ.กรณีพิเศษ ปี 2566)**","opts":{"ก":"การปฏิบัติตามแผนที่กำหนด","ข":"การสังเกตผลที่เกิดขึ้นจากการปฏิบัติงาน","ค":"การสะท้อนผลหลังจากการปฏิบัติงานให้ผู้ที่มีส่วนร่วมได้วิพากษ์วิจารณ์","ง":"การวางแผนหลังจากที่วิเคราะห์และกำหนดประเด็นปัญหาที่ต้องการแก้ไข"},"a":"ง","e":"สมมติฐานวิจัย (Research Hypothesis) เป็นการแสดงความคิดคาดเดาความสัมพันธ์หรือส่วนต่างพฤติกรรมระหว่างตัวแปรที่แสดงทิศทาง (เช่น คาดว่า หญิงมากกว่าชาย หรือมีพฤติกรรมต่างกัน) ส่วนการเขียนในรูป \"ไม่แตกต่างกัน\" มีลักษณะเป็นสมมติฐานทางสถิติ (Null Hypothesis "},{"id":99,"q":"E1/E2 สอดคล้องกับทฤษฎีใดตามหลักของการวิจัย (สพฐ.กรณีพิเศษ ปี 2566)**","opts . รอบทั่วไป ปี 2564/2565)","opts":{"ก":"สำนักงานรับรองมาตรฐานและประเมินคุณภาพทางการศึกษา","ข":"อ.ก.ค.ศ. เขตพื้นที่การศึกษา","ค":"สำนักงานเขตพื้นที่การศึกษา","ง":"คณะกรรมการศึกษาธิการจังหวัด"},"a":"ค","e":"สำนักงานเขตพื้นที่การศึกษา"},{"id":27,"q":"ข้อใดเป็นการประเมินมาตรฐานการศึกษาเพื่อประกันคุณภาพภายใน มาตรฐานที่ 1 คุณภาพของผู้เรียน (ครูผู้ช่วย สพฐ.รอบทั่วไป ปี 2567)","opts":{"ก":"ผลสัมฤทธิ์ทางการเรียน และคุณภาพของผู้เรียน","ข":"ผลสัมฤทธิ์ทางวิชาการของผู้เรียน และคุณลักษณะที่พึงประสงค์ของผู้เรียน","ค":"คุณภาพทางวิชาการของผู้เรียน และคุณลักษณะที่พึงประสงค์ของผู้เรียน","ง":"ผลสัมฤทธิ์ทางการเรียนรู้ และคุณภาพของผู้เรียน"},"a":"ข","e":"ผลสัมฤทธิ์ทางวิชาการของผู้เรียน และคุณลักษณะที่พึงประสงค์ของผู้เรียน"},{"id":28,"q":"(Level 2 : การอธิบายและเชื่อมโยงหลักการ)  **สถานการณ์** โรงเรียนบ้านวังใหม่จัดทำรายงานการประเมินตนเอง (SAR) ทุกปี โดยครูแต่ละกลุ่มสาระรับผิดชอบจัดทำข้อมูลผลการดำเนินงานของตนเอง หลังส่งรายงานให้หน่วยงานต้นสังกัดแล้ว ครูบางคนเห็นว่าการดำเนินงานด้านการประกันคุณภาพของโรงเรียนเสร็จสิ้นในรอบปีการศึกษานั้น","opts":{"ก":"การจัดทำ SAR เป็นหลักฐานแสดงผลการดำเนินงานของสถานศึกษา จึงควรให้ความสำคัญกับความครบถ้วนของข้อมูลเป็นลำดับแรก ก่อนนำข้อมูลไปใช้พัฒนาในปีถัดไป [46, 47]","ข":"การจัดทำ SAR เป็นส่วนหนึ่งของกระบวนการประกันคุณภาพ โดยข้อมูลที่ได้ควรถูกนำมาวิเคราะห์ วางแผน ปรับปรุง และติดตามผลอย่างต่อเนื่อง เพื่อยกระดับคุณภาพของผ","ค":"การจัดทำ SAR เป็นกลไกสำคัญในการรองรับการประเมินภายนอก ดังนั้นการปรับปรุงคุณภาพควรอ้างอิงผลการประเมินจากหน่วยงานภายนอกเป็นหลัก [47]","ง":"การจัดทำ SAR ช่วยให้โรงเรียนสามารถรายงานผลการดำเนินงานต่อหน่วยงานต้นสังกัดได้อย่างเป็นระบบ จึงควรดำเนินการให้แล้วเสร็จก่อนเริ่มวางแผนพัฒนาในรอบปีถัดไป"},"a":"ข","e":"การจัดทำ SAR เป็นส่วนหนึ่งของกระบวนการประกันคุณภาพ..."},{"id":29,"q":"(Level 3 : ประยุกต์ใช้ วิเคราะห์สถานการณ์)  **สถานการณ์** โรงเรียนบ้านหนองโพธิ์กำหนดให้ทุกกลุ่มสาระการเรียนรู้จัดทำข้อมูลผลการดำเนินงานเพื่อประกอบการประเมินคุณภาพภายในประจำปี ระหว่างการติดตามผลในภาคเรียนที่ 2 คณะกรรมการประกันคุณภาพของโรงเรียนพบว่า ผลสัมฤทธิ์ทางการเรียนของนักเรียนชั้นประถมศึกษาปีที่","opts":{"ก":"นำผลสัมฤทธิ์ทางการเรียนมาเปรียบเทียบกับเป้าหมายของสถานศึกษา แล้วกำหนดกิจกรรมเสริมเพื่อยกระดับผลการเรียน พร้อมติดตามผลเมื่อสิ้นปีการศึกษา [49]","ข":"นำข้อมูลผลสัมฤทธิ์ของผู้เรียน ผลการนิเทศภายใน ข้อมูลการจัดการเรียนรู้ และสารสนเทศของสถานศึกษามาวิเคราะห์ความสัมพันธ์ของปัญหา ก่อนปรับแผนพัฒนาคุณภาพ กำ","ค":"ทบทวนตัวชี้วัดของโครงการให้สอดคล้องกับบริบทของผู้เรียน พร้อมกำหนดเป้าหมายใหม่ที่สามารถดำเนินการได้จริง และมอบหมายให้แต่ละกลุ่มสาระรับผิดชอบการติดตามผล","ง":"รวบรวมข้อมูลผลการดำเนินงานของทุกกลุ่มสาระ วิเคราะห์เฉพาะตัวชี้วัดที่ไม่บรรลุเป้าหมาย และจัดทำข้อเสนอเพื่อใช้ประกอบการจัดทำรายงานการประเมินตนเอง (SAR)"},"a":"ข","e":"นำข้อมูลผลสัมฤทธิ์ของผู้เรียน ผลการนิเทศภายใน...มาวิเคราะห์ความสัมพันธ์ของปัญหา..."},{"id":30,"q":"(Level 4 : ประเมินค่า สร้างทางเลือกใหม่)  **สถานการณ์** โรงเรียนบ้านคลองใหม่ดำเนินการประกันคุณภาพภายในตามแผนประจำปี โดยกำหนดให้มีการติดตามผลการดำเนินงานของทุกฝ่ายอย่างต่อเนื่อง เมื่อสิ้นปีการศึกษา คณะกรรมการประกันคุณภาพได้รวบรวมข้อมูลจากผลสัมฤทธิ์ของผู้เรียน รายงานการนิเทศภายใน ผลการประเมินความพึงพอ","opts":{"ก":"กำหนดโครงการพัฒนาทักษะการสื่อสารของผู้เรียนทันที โดยใช้ข้อเสนอแนะของผู้ปกครองเป็นประเด็นหลักในการวางแผน และประเมินผลเมื่อสิ้นปีการศึกษา [51, 52]","ข":"ใช้ผลสัมฤทธิ์ทางการเรียนเป็นตัวสะท้อนคุณภาพของการจัดการศึกษาเป็นสำคัญ เนื่องจากบรรลุเป้าหมายตามที่โรงเรียนกำหนด ส่วนข้อค้นพบอื่นให้นำไปพิจารณาในการดำเ","ค":"พิจารณาความสอดคล้องและความแตกต่างของข้อมูลจากทุกแหล่ง เพื่อวิเคราะห์ว่าข้อค้นพบใดสะท้อนคุณภาพของผู้เรียนและกระบวนการจัดการศึกษา ก่อนกำหนดประเด็นพัฒนาแ","ง":"จัดทำรายงานการประเมินตนเอง (SAR) โดยแสดงทั้งผลสำเร็จและข้อจำกัดของการดำเนินงาน พร้อมเสนอต่อคณะกรรมการสถานศึกษาเพื่อพิจารณาให้ข้อเสนอแนะก่อนเริ่มปีการศ"},"a":"ค","e":"พิจารณาความสอดคล้องและความแตกต่างของข้อมูลจากทุกแหล่ง..."},{"id":31,"q":"(Level 4 : ประเมินค่า สร้างทางเลือกใหม่)  **สถานการณ์** โรงเรียนบ้านดอยงามได้รับรายงานผลการประเมินคุณภาพภายนอกจากสำนักงานรับรองมาตรฐานและประเมินคุณภาพการศึกษา (สมศ.) โดยภาพรวมผ่านเกณฑ์การประเมิน แต่คณะผู้ประเมินมีข น (ครูผู้ช่วย กรณีพิเศษ ปี 2563)","opts":{"ก":"มหาวิทยาลัยขอนแก่น","ข":"โรงเรียนอัสสัมชัญคอนแวนต์","ค":"วิทยาลัยเทคนิคอุบลราชธานี","ง":"โรงเรียนสตรีวิทยา"},"a":"ก","e":"มหาวิทยาลัยขอนแก่น"},{"id":52,"q":"“การประเมินคุณภาพภายนอก” ข้อใดกล่าวถูกต้อง (สพฐ. รอบทั่วไป 2560)","opts":{"ก":"การประเมินผล การติดตามตรวจสอบคุณภาพจากสำนักงานพื้นที่การศึกษา","ข":"รายงานการประเมินตนเอง (SAR) Self-Assessment Report","ค":"หน่วยงานต้นสังกัดตรวจสอบทบทวน อย่างน้อย 3 ปี 1 ครั้ง","ง":"สำนักงานรับรองมาตรฐานและประเมินคุณภาพการศึกษา"},"a":"ง","e":"สำนักงานรับรองมาตรฐานและประเมินคุณภาพการศึกษา"},{"id":53,"q":"(Level 3 : ประยุกต์ใช้ วิเคราะห์สถานการณ์)  **สถานการณ์** โรงเรียนแห่งหนึ่งได้รับหนังสือแจ้งจากสำนักงานรับรองมาตรฐานและประเมินคุณภาพการศึกษา (สมศ.) ว่าจะเข้ารับการประเมินคุณภาพภายนอกในปีการศึกษาถัดไป ซึ่งเป็นไปตามกรอบการประเมินรอบปัจจุบัน ผู้บริหารจึงเรียกประชุมคณะครูเพื่อเตรียมความพร้อม  ในการประชุ","opts":{"ก":"ครู ก","ข":"ครู ข","ค":"ครู ค","ง":"ครู ง"},"a":"ค","e":"ครู ค (ทบทวนผลการดำเนินงานตามระบบประกันภายใน วิเคราะห์จุดแข็งจุดพัฒนา เตรียมหลักฐานจริง)"},{"id":54,"q":"(Level 4 : ประเมินค่า สร้างทางเลือกใหม่)  **สถานการณ์** โรงเรียนบ้านเขาแก้วได้รับผลการประเมินคุณภาพภายนอกจากสำนักงานรับรองมาตรฐานและประเมินคุณภาพการศึกษา (สมศ.) โดยคณะผู้ประเมินเห็นว่า การดำเนินงานด้านการพัฒนาคุณภาพผู้เรียนบางประเด็นยังไม่เป็นไปตามมาตรฐานที่กำหนด จึงจัดทำรายงานผลการประเมินพร้อมข้อเส","opts":{"ก":"ขอให้ สมศ. เข้าประเมินซ้ำโดยเร็ว เนื่องจากโรงเรียนเห็นว่าข้อมูลบางส่วนยังไม่สะท้อนผลการดำเนินงานทั้งหมด [57]","ข":"รอให้หน่วยงานต้นสังกัดกำหนดแผนพัฒนาให้โรงเรียน แล้วจึงดำเนินการตามแผนดังกล่าว เพื่อให้เป็นมาตรฐานเดียวกันทุกแห่ง [57]","ค":"นำข้อเสนอแนะจากผลการประเมินมาวิเคราะห์ร่วมกับข้อมูลของสถานศึกษา จัดทำแผนปรับปรุงคุณภาพ กำหนดผู้รับผิดชอบและระยะเวลาดำเนินงาน พร้อมรายงานความก้าวหน้าต่","ง":"จัดทำรายงานชี้แจงเหตุผลที่ทำให้ผลการประเมินไม่เป็นไปตามมาตรฐาน แล้วรอการประเมินรอบถัดไปเพื่อแสดงผลการดำเนินงานที่ดีขึ้น [58]"},"a":"ค","e":"นำข้อเสนอแนะจากผลการประเมินมาวิเคราะห์ร่วมกับข้อมูลของสถานศึกษา จัดทำแผนปรับปรุงคุณภาพ..."},{"id":55,"q":"(Level 4 : ประเมินค่า สร้างทางเลือกใหม่)  **สถานการณ์** ผลการประเมินคุณภาพภายนอกของโรงเรียนแห่งหนึ่งพบว่า ผลสัมฤทธิ์ทางการเรียนของผู้เรียนเป็นไปตามเป้าหมายที่สถานศึกษากำหนด แต่ข้อมูลจากการสัมภาษณ์ผู้เรียน ผู้ปกครอง และชุมชนสะท้อนว่า ผู้เรียนยังขาดทักษะการคิดวิเคราะห์และการแก้ปัญหา ขณะที่รายงานการประ","opts":{"ก":"ทบทวนข้อมูลจากรายงานการประเมินตนเองร่วมกับผลการประเมินภายนอก แล้วปรับแผนพัฒนาสถานศึกษาให้สอดคล้องกับข้อค้นพบ [59]","ข":"ทบทวนข้อมูลจากผลสัมฤทธิ์ของผู้เรียนร่วมกับหลักฐานการดำเนินงาน แล้วปรับระบบการติดตามผลให้สะท้อนผลการดำเนินงานมากขึ้น [59]","ค":"ทบทวนข้อมูลจากผลการประเมินภายนอกร่วมกับข้อมูลจากผู้มีส่วนเกี่ยวข้อง แล้วพิจารณาความสอดคล้องของข้อมูลก่อนกำหนดแนวทางพัฒนาคุณภาพ [59]","ง":"ทบทวนข้อมูลจากผลการดำเนินงานของโครงการร่วมกับตัวชี้วัดที่กำหนด แล้วปรับปรุงการจัดเก็บข้อมูลให้ครบถ้วนมากยิ่งขึ้น [59]"},"a":"ก","e":"ทบทวนข้อมูลจากรายงานการประเมินตนเองร่วมกับผลการประเมินภายนอก แล้วปรับแผนพัฒนาสถานศึกษาให้สอดคล้องกับข้อค้นพบ"},{"id":56,"q":"สำนักงานรับรองมาตรฐานและประเมินคุณภาพการศึกษา มีฐานะตามข้อใด","opts":{"ก":"องค์การมหาชน ในกำกับของรัฐมนตรีว่าการกระทรวงศึกษาธิการ","ข":"องค์กรอิสระในกำกับของรัฐมนตรีว่าการกระทรวงศึกษาธิการ","ค":"สภาครูและบุคลากรทางการศึกษา ในกำกับของกระทรวงศึกษาธิการ","ง":"องค์กรมหาชน ในกำกับของรัฐมนตรีว่าการกระทรวงศึกษาธิการ"},"a":"ก","e":"หรือ ง. องค์การมหาชน ในกำกับของรัฐมนตรีว่าการกระทรวงศึกษาธิการ"},{"id":57,"q":"การประกันคุณภาพการศึกษามีประโยชน์อย่างไร (สพฐ. รอบทั่วไป ปี 2564/2565 ม.สวนดุสิต)","opts":{"ก":"เป็นหลักประกันให้ผู้บริหารสถานศึกษามั่นใจในคุณภาพ","ข":"เป็นหลักประกันให้กับผู้ปกครองและนักเรียนให้มั่นใจในคุณภาพ","ค":"เป็นหลักประกันให้กับประชาชนเข้าใจในเจตนารมณ์ของคุณภาพการศึกษา","ง":"เป็นหลักประกันให้คณะกรรมการสถานศึกษาขั้นพื้นฐานมั่นใจในคุณภาพ"},"a":"ข","e":"เป็นหลักประกันให้กับผู้ปกครองและนักเรียนให้มั่นใจในคุณภาพ"},{"id":58,"q":"ระบบการประกันคุณภาพการศึกษา มีกี่ระบบ","opts":{"ก":"1 ระบบ","ข":"2 ระบบ","ค":"3 ระบบ","ง":"5 ระบบ"},"a":"ข","e":"2 ระบบ"},{"id":59,"q":"ข้อใดเป็นขั้นตอนแรกเกี่ยวกับการดำเนินการประกันคุณภาพทางการศึกษา (ครูผู้ช่วย สพฐ.รอบทั่วไป ปี 2567)","opts":{"ก":"กำหนดมาตรฐานสถานศึกษา","ข":"จัดระบบบริหารและสารสนเทศ","ค":"จัดทำแผนพัฒนาการจัดการศึกษา","ง":"แต่งตั้งคณะกรรมการติดตาม ตรวจสอบ"},"a":"ก","e":"กำหนดมาตรฐานสถานศึกษา"},{"id":60,"q":"“การพัฒนาการอ่าน การคิด การเขียน” เป็นการพัฒนาด้านใด (สพฐ. รอบทั่วไป ปี 2564/2565)","opts":{"ก":"พัฒนามาตรฐานการประเมิน","ข":"พัฒนาสถานศึกษา","ค":"พัฒนาหลักสูตร","ง":"พัฒนาคุณภาพผู้เรียน"},"a":"ง","e":"พัฒนาคุณภาพผู้เรียน"},{"id":61,"q":"สำนักงานเขตพื้นที่การศึกษามีบทบาทอย่างไรในการประกันคุณภาพ (สพฐ. รอบทั่วไป ปี 2564/2565)","opts":{"ก":"วิเคราะห์การจัดตั้งงบประมาณเงินอุดหนุนทั่วไปเกี่ยวกับระบบการประกันคุณภาพภายใน","ข":"พัฒนาสาระของหลักสูตรการศึกษาให้สอดคล้องกับหลักสูตรแกนกลางการศึกษาขั้นพื้นฐาน","ค":"ขับเคลื่อนการพัฒนาระบบการประกันคุณภาพภายในสถานศึกษาให้เป็นระบบ","ง":"ขับเคลื่อนระบบการประกันคุณภาพให้สอดคล้องกับความต้องการของเขตพื้นที่การศึกษา"},"a":"ค","e":"ขับเคลื่อนการพัฒนาระบบการประกันคุณภาพภายในสถานศึกษาให้เป็นระบบ"},{"id":62,"q":"ข้อใดสะท้อนบทบาทของครูในการประกันคุณภาพการศึกษาได้เหมาะสมที่สุด (ครูผู้ช่วย สพฐ.รอบทั่วไป 2568)","opts":{"ก":"ครูจัดทำข้อมูลและรายงานผล และมีส่วนร่วมในการติดตามคุณภาพของสถานศึกษาอย่างต่อเนื่อง","ข":"ครูจัดการเรียนการสอนตามแผน และมีส่วนร่วมในการจัดกิจกรรมของสถานศึกษาอย่างต่อเนื่อง","ค":"ครูเข้าร่วมการประชุมและการอบรม และมีส่วนร่วมในการพัฒนาระบบของสถานศึกษาอย่างต่อเนื่อง","ง":"ครูปฏิบัติตามระเบียบและแนวปฏิบัติ และมีส่วนร่วมในการดำเนินงานของสถานศึกษาอย่างต่อเนื่อง"},"a":"ก","e":"ครูจัดทำข้อมูลและรายงานผล และมีส่วนร่วมในการติดตามคุณภาพของสถานศึกษาอย่างต่อเนื่อง"},{"id":63,"q":"ข้อใดสะท้อนการพัฒนาผลสัมฤทธิ์ด้านการประเมินผลในการประกันคุณภาพการศึกษาได้เหมาะสมที่สุด (ครูผู้ช่วย สพฐ.รอบทั่วไป 2568)","opts":{"ก":"การประเมินผลและการติดตามตรวจสอบคุณภาพ และมาตรฐานการศึกษาของสถานศึกษา จากภายนอก โดยสำนักงานรับรองมาตรฐานและประเมินคุณภาพการศึกษา (สมศ.)","ข":"การประเมินผล และการติดตามตรวจสอบคุณภาพ และมาตรฐานการศึกษาของสถานศึกษา จากภายใน โดยบุคลากรของสถานศึกษานั้นเองหรือโดยหน่วยงานต้นสังกัด","ค":"ข้อกำหนดเกี     } catch (e) { console.error(e); }
  }
  fetch('questions.json')
    .then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(d => {
      QUESTIONS = d;
      renderLevels();
    })
    .catch(e => {
      console.error(e);
      toast('โหลดข้อสอบไม่สำเร็จ');
    });
}

function getProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch { return {}; }
}
function saveProgress(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
// แยก progress ตามโหมด ฝึกซ้อม / จำลองสอบ
function progKey(name) {
  return name + '::' + (mode || 'practice');
}
function getLevelProg(name) {
  const prog = getProgress();
  return prog[progKey(name)] || {};
}
function setLevelProg(name, p) {
  const prog = getProgress();
  prog[progKey(name)] = p;
  saveProgress(prog);
}

function renderLevels() {
  const grid = document.getElementById('levelGrid');
  const prog = getProgress();
  grid.innerHTML = '';
  const keys = Object.keys(QUESTIONS);
  keys.forEach((name, i) => {
    const qs = QUESTIONS[name];
    if (!qs || !qs.length) return;
    const p = getLevelProg(name);
    const played = p.played || p.plays || 0;
    const best = p.best || 0;
    const answered = p.answered || 0;
    const lastIdx = p.lastIdx || 0;
    const wrongs = (p.wrongIds || []);
    const pct = Math.round((best / qs.length) * 100) || 0;
    const card = document.createElement('div');
    card.className = 'level-card';
    card.innerHTML = `
      <div class="info" style="flex:1;cursor:pointer" data-start="1">
        <h3>${i+1}. ${name}</h3>
        <span>${qs.length} ข้อ · เล่นแล้ว ${played} ครั้ง · ทำไปแล้ว ${answered}/${qs.length} · สูงสุด ${best}</span>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="level-actions"></div>
      </div>
      <div class="badge">${pct}%</div>`;
    const actions = card.querySelector('.level-actions');
    // เริ่มใหม่
    const bStart = document.createElement('button');
    bStart.className = 'btn-restart';
    bStart.textContent = 'เริ่มใหม่';
    bStart.onclick = (e) => { e.stopPropagation(); startLevel(name, 0, false); };
    actions.appendChild(bStart);
    // ทำต่อ
    if (lastIdx > 0 && lastIdx < qs.length) {
      const bCont = document.createElement('button');
      bCont.className = 'btn-continue';
      bCont.textContent = 'ทำต่อข้อ ' + (lastIdx + 1);
      bCont.onclick = (e) => { e.stopPropagation(); startLevel(name, lastIdx, false); };
      actions.appendChild(bCont);
    }
    // ข้อผิด
    if (wrongs.length > 0) {
      const bWrong = document.createElement('button');
      bWrong.className = 'btn-wrong';
      bWrong.textContent = 'ทบทวนข้อผิด (' + wrongs.length + ')';
      bWrong.onclick = (e) => { e.stopPropagation(); startLevel(name, 0, true); };
      actions.appendChild(bWrong);
    }
    card.querySelector('[data-start]').onclick = () => startLevel(name, 0, false);
    grid.appendChild(card);
  });
}

function startLevel(name, resumeIdx, wrongOnly) {
  currentLevel = name;
  wrongOnlyMode = !!wrongOnly;
  const p = getLevelProg(name);
  let pool;
  if (wrongOnly && p.wrongIds && p.wrongIds.length) {
    const all = QUESTIONS[name];
    const idSet = new Set(p.wrongIds);
    pool = all.filter(q => idSet.has(q.id));
    if (!pool.length) pool = [...all];
  } else {
    pool = [...QUESTIONS[name]];
    // ฝึกซ้อม: เรียงตามกลุ่มประเภท
    // จำลองสอบ: สุ่มทั้งด่าน (ครบทุกข้อ)
    if (mode === 'exam') {
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
    }
  }
  currentQs = pool;
  idx = resumeIdx || 0;
  if (idx >= currentQs.length) idx = 0;
  score = p.lastScore || 0;
  if (!resumeIdx) score = 0;
  showScreen('quiz');
  showQ();
}

function showQ() {
  answered = false;
  const q = currentQs[idx];
  document.getElementById('qProgress').textContent = `${idx+1} / ${currentQs.length}`;
  document.getElementById('liveScore').textContent = `${score} คะแนน`;
  document.getElementById('qBar').style.width = `${((idx)/currentQs.length)*100}%`;
  document.getElementById('qText').textContent = q.q || '(ไม่มีข้อความคำถาม)';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').style.display = 'none';

  const optsEl = document.getElementById('opts');
  optsEl.innerHTML = '';
  // รองรับทุกตัวเลือก ทั้ง ก-ง, A-Q, จ-ซ
  const letters = Object.keys(q.opts || {}).sort((a,b) => {
    const order = 'ABCDEFGHIJKLMNOPQRSTUVWXYZกขคงจฉชซฌญฎฏฐฑฒณดตถทธนบปผฝพฟภมยรลวศษสหฬอฮ';
    return order.indexOf(a) - order.indexOf(b);
  });
  const optCount = letters.length;
  letters.forEach(L => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="letter">${L}</span><span>${q.opts[L]}</span>`;
    btn.onclick = () => selectOpt(L, btn);
    optsEl.appendChild(btn);
  });
  // ปุ่มดูเฉลย ถ้าตัวเลือกไม่ครบ
  if (optCount < 2) {
    const rev = document.createElement('button');
    rev.className = 'btn';
    rev.style.marginTop = '12px';
    rev.textContent = 'ดูเฉลย';
    rev.onclick = () => {
      if (answered) return;
      answered = true;
      const fb = document.getElementById('feedback');
      fb.className = 'feedback show ok';
      fb.textContent = '✅ เฉลย: ' + q.a + (q.opts[q.a] ? ' — ' + q.opts[q.a] : '');
      document.getElementById('nextBtn').style.display = 'flex';
      if (idx === currentQs.length - 1) document.getElementById('nextBtn').textContent = 'ดูผลคะแนน';
    };
    optsEl.appendChild(rev);
  }
}

function selectOpt(letter, btn) {
  if (answered) return;
  answered = true;
  const q = currentQs[idx];
  const correct = q.a;
  const all = document.querySelectorAll('.opt');
  all.forEach(el => el.classList.add('disabled'));

  const fb = document.getElementById('feedback');
  if (letter === correct) {
    score++;
    btn.classList.add('correct');
    fb.className = 'feedback show ok';
    fb.innerHTML = '✅ ถูกต้อง!' + (q.e ? '<div style="margin-top:6px;opacity:.95;font-size:.88rem;line-height:1.45">'+q.e+'</div>' : '');
    // ลบออกจากรายการข้อผิด
    try {
      const pp = getLevelProg(currentLevel);
      if (pp.wrongIds) {
        pp.wrongIds = pp.wrongIds.filter(id => id !== q.id);
        setLevelProg(currentLevel, pp);
      }
    } catch(e) {}
  } else {
    btn.classList.add('wrong');
    all.forEach(el => {
      if (el.querySelector('.letter') && el.querySelector('.letter').textContent === correct)
        el.classList.add('correct');
    });
    fb.className = 'feedback show bad';
    fb.innerHTML = '❌ ผิด — เฉลยข้อ <b>' + correct + '</b>' + (q.opts[correct] ? ': ' + q.opts[correct] : '') + (q.e ? '<div style="margin-top:6px;opacity:.95;font-size:.88rem;line-height:1.45">'+q.e+'</div>' : '');
    // เก็บข้อที่ผิด (แยกตามโหมด)
    try {
      const pp = getLevelProg(currentLevel);
      if (!pp.wrongIds) pp.wrongIds = [];
      if (!pp.wrongIds.includes(q.id)) pp.wrongIds.push(q.id);
      setLevelProg(currentLevel, pp);
    } catch(e) {}
  }
  // บันทึกความคืบหน้า + ข้อล่าสุด (แยกตามโหมด)
  try {
    const p2 = getLevelProg(currentLevel);
    p2.lastIdx = idx + 1;
    p2.answered = Math.max(p2.answered || 0, idx + 1);
    p2.lastScore = score;
    setLevelProg(currentLevel, p2);
  } catch(e) {}

  document.getElementById('nextBtn').style.display = 'flex';
  if (idx === currentQs.length - 1) {
    document.getElementById('nextBtn').textContent = 'ดูผลคะแนน';
  }
}

function nextQ() {
  if (idx >= currentQs.length - 1) {
    finish();
    return;
  }
  idx++;
  showQ();
}

function finish() {
  const total = currentQs.length;
  const pct = Math.round((score / total) * 100);
  // save (แยกตามโหมด)
  const prev = getLevelProg(currentLevel);
  if (!prev._partial) {
    prev.played = (prev.played || prev.plays || 0) + 1;
  }
  delete prev._partial;
  delete prev.plays;
  prev.last = score;
  prev.answered = total;
  prev.lastIdx = 0;
  prev.lastScore = score;
  if (score > (prev.best || 0)) prev.best = score;
  setLevelProg(currentLevel, prev);

  document.getElementById('finalScore').textContent = pct + '%';
  document.getElementById('rCorrect').textContent = score;
  document.getElementById('rWrong').textContent = total - score;
  document.getElementById('rTotal').textContent = total;
  let stars = '★☆☆';
  let msg = 'พยายามต่อไปนะ!';
  if (pct >= 90) { stars = '★★★'; msg = 'ยอดเยี่ยมมาก! พร้อมสอบจริงแล้ว'; }
  else if (pct >= 70) { stars = '★★☆'; msg = 'ดีมาก เกือบเต็มแล้ว'; }
  else if (pct >= 50) { stars = '★☆☆'; msg = 'พอใช้ ฝึกเพิ่มอีกนิด'; }
  document.getElementById('stars').textContent = stars;
  document.getElementById('resultMsg').textContent = msg;
  showScreen('result');
}

function retryLevel() {
  if (currentLevel) startLevel(currentLevel);
}

function goHome() {
  // บันทึกความคืบหน้าบางส่วน ถ้าออกกลางด่าน
  if (currentLevel && currentQs.length > 0 && idx > 0) {
    const p = getProgress();
    if (!p[currentLevel]) p[currentLevel] = { played: 0, best: 0, last: 0, answered: 0 };
    p[currentLevel].answered = Math.max(p[currentLevel].answered || 0, idx);
    p[currentLevel].lastIdx = idx;
    p[currentLevel].lastScore = score;
    p[currentLevel].last = Math.max(p[currentLevel].last || 0, score);
    // นับเป็น plays เฉพาะเมื่อตอบอย่างน้อย 1 ข้อ
    if (idx >= 1 && !(p[currentLevel]._partial)) {
      p[currentLevel].played = (p[currentLevel].played || p[currentLevel].plays || 0) + 1;
      p[currentLevel]._partial = true;
    }
    saveProgress(p);
  }
  showScreen('home');
  renderLevels();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function resetAllProgress() {
  if (confirm('ลบประวัติการเล่นทั้งหมดบนเครื่องนี้?')) {
    localStorage.removeItem(STORAGE_KEY);
    renderLevels();
    toast('ล้างประวัติแล้ว');
  }
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// mode toggle
document.querySelectorAll('.mode-toggle button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.mode-toggle button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    mode = b.dataset.mode;
  };
});

// SW
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

loadData();

// สลับโหมด ฝึกซ้อม / จำลองสอบ — แยก progress
document.querySelectorAll('[data-mode]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.getAttribute('data-mode') || 'practice';
    renderLevels(); // รีเฟรชการ์ดตาม progress ของโหมดนั้น
  });
});

</script>
