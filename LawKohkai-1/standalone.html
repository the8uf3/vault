<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>เกมตะลุยข้อสอบครูผู้ช่วย | วิชาชีพครู</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --accent: #14b8a6;
  --accent2: #f59e0b;
  --danger: #ef4444;
  --success: #22c55e;
  --text: #f1f5f9;
  --muted: #94a3b8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Sarabun', 'Segoe UI', system-ui, sans-serif;
  background: linear-gradient(160deg, #0f172a 0%, #134e4a 100%);
  color: var(--text);
  min-height: 100dvh;
  overflow-x: hidden;
}
.app { max-width: 520px; margin: 0 auto; padding: 12px; min-height: 100dvh; display: flex; flex-direction: column; }
header {
  text-align: center; padding: 16px 8px 8px;
}
header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
header p { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
.screen { display: none; flex: 1; flex-direction: column; }
.screen.active { display: flex; }
.level-grid { display: grid; gap: 10px; margin-top: 12px; }
.level-card {
  background: var(--card);
  border-radius: 14px;
  padding: 14px 16px;
  border: 1px solid #334155;
  cursor: pointer;
  transition: transform .15s, border-color .15s;
  display: flex; justify-content: space-between; align-items: center;
}
.level-card:active { transform: scale(0.98); }
.level-card:hover { border-color: var(--accent); }
.level-card .info h3 { font-size: 0.95rem; margin-bottom: 2px; }
.level-card .info span { font-size: 0.75rem; color: var(--muted); }
.badge {
  background: #0f766e33; color: var(--accent);
  font-size: 0.7rem; padding: 4px 8px; border-radius: 999px; font-weight: 600;
}
.progress-bar {
  height: 6px; background: #334155; border-radius: 3px; margin-top: 8px; overflow: hidden;
}
.progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--accent); color: #042f2e; border: none; border-radius: 12px;
  padding: 12px 20px; font-size: 1rem; font-weight: 700; cursor: pointer;
  transition: opacity .15s, transform .1s;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-outline {
  background: transparent; border: 1.5px solid #475569; color: var(--text);
}
.btn-danger { background: var(--danger); color: white; }
.btn-row { display: flex; gap: 10px; margin-top: 16px; }
.btn-row .btn { flex: 1; }

/* Quiz */
.quiz-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0 12px; border-bottom: 1px solid #334155; margin-bottom: 12px;
}
.quiz-header .score { font-weight: 700; color: var(--accent2); }
.q-num { font-size: 0.8rem; color: var(--muted); }
.question-box {
  background: var(--card); border-radius: 16px; padding: 18px;
  border: 1px solid #334155; margin-bottom: 14px; line-height: 1.55;
  font-size: 1.02rem;
}
.options { display: flex; flex-direction: column; gap: 8px; }
.opt {
  background: #0f172a; border: 1.5px solid #334155; border-radius: 12px;
  padding: 12px 14px; text-align: left; cursor: pointer; font-size: 0.95rem;
  transition: border-color .15s, background .15s; display: flex; gap: 10px; align-items: flex-start;
}
.opt:hover { border-color: var(--accent); }
.opt .letter {
  flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;
  background: #1e293b; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 0.85rem; color: var(--accent);
}
.opt.correct { border-color: var(--success); background: #14532d44; }
.opt.wrong { border-color: var(--danger); background: #7f1d1d44; }
.opt.disabled { pointer-events: none; opacity: 0.85; }
.feedback {
  margin-top: 12px; padding: 10px 14px; border-radius: 10px; font-size: 0.9rem;
  display: none;
}
.feedback.show { display: block; }
.feedback.ok { background: #14532d55; color: #86efac; }
.feedback.bad { background: #7f1d1d55; color: #fca5a5; }

/* Result */
.result-card {
  background: var(--card); border-radius: 18px; padding: 24px; text-align: center;
  border: 1px solid #334155; margin-top: 20px;
}
.result-card .big-score { font-size: 3rem; font-weight: 800; color: var(--accent); }
.result-card .stars { font-size: 1.8rem; margin: 8px 0; letter-spacing: 4px; }
.stat-row { display: flex; justify-content: space-around; margin: 16px 0; }
.stat-row div { text-align: center; }
.stat-row .n { font-size: 1.4rem; font-weight: 700; }
.stat-row .l { font-size: 0.75rem; color: var(--muted); }

.footer-note {
  text-align: center; font-size: 0.7rem; color: #64748b; margin-top: auto; padding: 16px 0 8px;
}
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
  background: #1e293b; color: white; padding: 10px 18px; border-radius: 10px;
  font-size: 0.85rem; border: 1px solid #334155; transition: transform .3s; z-index: 99;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.mode-toggle {
  display: flex; gap: 6px; margin: 10px 0; justify-content: center;
}
.mode-toggle button {
  background: #1e293b; border: 1px solid #334155; color: var(--muted);
  padding: 6px 14px; border-radius: 999px; font-size: 0.8rem; cursor: pointer;
}
.mode-toggle button.active { background: var(--accent); color: #042f2e; border-color: var(--accent); font-weight: 600; }

.level-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.level-actions button{font-size:.75rem;padding:6px 12px;border-radius:8px;border:none;cursor:pointer;font-family:inherit}
.btn-continue{background:#14b8a6;color:#fff}
.btn-wrong{background:#f59e0b;color:#fff}
.btn-restart{background:#334155;color:#e2e8f0}
.wrong-badge{background:#f59e0b;color:#fff;font-size:.7rem;padding:2px 8px;border-radius:10px;margin-left:6px}
</style>
</head>
<body>
<div class="app">
  <!-- HOME -->
  <div id="home" class="screen active">
    <header>
      <h1>📚 ตะลุยข้อสอบครูผู้ช่วย</h1>
      <p>จิตวิทยา • ศาสตร์การสอน • วัดผล • ประกันคุณภาพ • ข้อมูลเก็บบนเครื่องคุณเท่านั้น</p>
    </header>
    <div class="mode-toggle">
      <button class="active" data-mode="practice">ฝึกซ้อม</button>
      <button data-mode="exam">จำลองสอบ</button>
    </div>
    <div class="level-grid" id="levelGrid"></div>
    <div class="btn-row" style="margin-top:20px">
      <button class="btn btn-outline" onclick="resetAllProgress()">ล้างประวัติทั้งหมด</button>
    </div>
    <p class="footer-note">PWA • Offline • localStorage • ไม่ส่งข้อมูลออกนอกเครื่อง</p>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="screen">
    <div class="quiz-header">
      <button class="btn btn-outline" style="padding:6px 12px;font-size:0.85rem" onclick="goHome()">← กลับ</button>
      <div class="q-num" id="qProgress">1 / 40</div>
      <div class="score" id="liveScore">0 คะแนน</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="qBar" style="width:0%"></div></div>
    <div class="question-box" id="qText"></div>
    <div class="options" id="opts"></div>
    <div class="feedback" id="feedback"></div>
    <div class="btn-row">
      <button class="btn" id="nextBtn" style="display:none" onclick="nextQ()">ข้อถัดไป →</button>
    </div>
  </div>

  <!-- RESULT -->
  <div id="result" class="screen">
    <div class="result-card">
      <div class="stars" id="stars">★★★</div>
      <div class="big-score" id="finalScore">0%</div>
      <p id="resultMsg">ยอดเยี่ยม!</p>
      <div class="stat-row">
        <div><div class="n" id="rCorrect">0</div><div class="l">ถูก</div></div>
        <div><div class="n" id="rWrong">0</div><div class="l">ผิด</div></div>
        <div><div class="n" id="rTotal">0</div><div class="l">ทั้งหมด</div></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-outline" onclick="goHome()">หน้าหลัก</button>
        <button class="btn" onclick="retryLevel()">เล่นอีกครั้ง</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

และการทำงานประสานประสาทสัมผัสตา-มือ"},{"id":32,"q":"เด็กหญิง L มีความมุ่งมั่น ทุ่มเทในการเรียน","opts":{"ก":"พุทธิพิสัย","ข":"จิตพิสัย","ค":"ทักษะพิสัย","ง":"สมาธิพิสัย"},"a":"ข","e":"จิตพิสัย (Affective Domain): ความมุ่งมั่นตั้งใจและการทุ่มเทวิริยะเป็นคุณสมบัติในพฤติกรรมด้านจิตพิสัย (แรงจูงใจ ความสนใจใฝ่รู้)"},{"id":33,"q":"เด็กหญิง M มีจิตสำนึกสาธารณะ","opts":{"ก":"พุทธิพิสัย","ข":"จิตพิสัย","ค":"ทักษะพิสัย","ง":"สมาธิพิสัย"},"a":"ข","e":"จิตพิสัย (Affective Domain): จิตสำนึกสาธารณะ (Public Mind) เป็นการพัฒนาความรับผิดชอบเชิงค่านิยมและจริยธรรมภายในใจมนุษย์"},{"id":34,"q":"เด็กหญิง N มีความซื่อสัตย์ ความรับผิดชอบความมีวินัย","opts":{"ก":"พุทธิพิสัย","ข":"จิตพิสัย","ค":"ทักษะพิสัย","ง":"สมาธิพิสัย"},"a":"ข","e":"จิตพิสัย (Affective Domain): ความซื่อสัตย์ รับผิดชอบ มีวินัย จัดเป็นกลุ่มคุณธรรมและลักษณะนิสัยขั้นสูงที่จัดรวบรวมภายในจิตใจ (Characterization)"},{"id":35,"q":"เด็กหญิง O สามารถอ่านทำนองเสนาะได้","opts":{"ก":"พุทธิพิสัย","ข":"จิตพิสัย","ค":"ทักษะพิสัย","ง":"สมาธิพิสัย"},"a":"ค","e":"ทักษะพิสัย (Psychomotor Domain): การเอื้อนทำนองเสนาะอย่างวิจิตรต้องคุมอวัยวะการออกเสียง การจับจังหวะวรรคตอน และการสั่นคอ ซึ่งถือเป็นทักษะการปฏิบัติ"},{"id":36,"q":"ข้อใดคือพฤติกรรมด้านจิตพิสัย (สพฐ.กรณีพิเศษ ปี 2562)","opts":{"ก":"นักเรียนใช้เครื่องมือได้ถูกต้องและชำนาญ","ข":"นักเรียนแยกประเภทของของสัตว์","ค":"นักเรียนสร้างลักษณะนิสัยตามค่านิยมที่ยึดถือ","ง":"นักเรียนเป็นนักกีฬาของโรงเรียน"},"a":"ค","e":"นักเรียนสร้างลักษณะนิสัยตามค่านิยมที่ยึดถือ: จัดเป็นระดับสูงสุดของโดเมนจิตพิสัย (Affective) คือขั้นพัฒนาลักษณะนิสัยจากค่านิยมส่วนบุคคลจนเป็นลักษณะประตัว"},{"id":37,"q":"ข้อใดคือทักษะพิสัย (สพฐ.กรณีพิเศษ ปี 2562)","opts":{"ก":"นักเรียนใช้เครื่องมือได้ถูกต้องและชำนาญ","ข":"นักเรียนแยกแยะได้ว่าสิ่งไหนดีสิ่งไหนไม่ดี","ค":"นักเรียนสร้างลักษณะนิสัยตามค่านิยมที่ยึดถือ","ง":"นักเรียนมีความคิดเห็นต่อการเลือกตั้งประธานนักเรียน"},"a":"ก","e":"นักเรียนใช้เครื่องมือได้อย่างถูกต้องและชำนาญ: ตรงตามพฤติกรรมทักษะพิสัย (Psychomotor) ที่ให้ความสำคัญกับความถูกต้อง ว่องไว และความชำนิชำนาญการกระทำ"},{"id":38,"q":"เด็กหญิงคนหนึ่งเล่าวิชาประวัติศาสตร์ได้ จัดอยู่แนวคิดของบลูมข้อใด (สพฐ.กรณีพิเศษ ปี 2562)","opts":{"ก":"พุทธิพิสัย","ข":"จิตพิสัย","ค":"ทักษะพิสัย","ง":"สมาธิพิสัย"},"a":"ก","e":"พุทธิพิสัย: การจดจำเนื้อหารายวิชาประวัติศาสตร์แล้วนำมาบอกเล่าทบทวนต่อได้ จัดเป็นกระบวนการเรียนรู้เรื่อง 'ความรู้ที่เกิดจากความจำ' ของพุทธิพิสัยขั้นพื้นฐาน"},{"id":39,"q":"ความก้าวหน้าของทักษะพิสัยนักเรียนสอดคล้องกับข้อใด (สพฐ.รอบทั่วไป ปี 2567)","opts":{"ก":"บอกชื่อสัตว์ตามประเภทได้","ข":"แก้ปัญหาโจทย์คณิตระคนได้","ค":"มุ่งมั่นในการทำงาน","ง":"การปฏิบัติงานได้อย่างคล่องแคล่ว"},"a":"ง","e":"การปฏิบัติงานได้อย่างคล่องแคล่ว: ทักษะพิสัยมุ่งความสัมฤทธิ์ปลายทางของการทำงานจริงผ่านทางสายตาร่วมกับการตอบสนองทางกล้ามเนื้ออย่างว่องไวไร้จุดติดขัด"},{"id":40,"q":"ข้อใดเป็นระดับขั้นความสามารถของ Bloom ใหม่ ที่แตกต่างจาก Bloom เก่า (สพฐ. รอบทั่วไป ปี 2567)","opts":{"ก":"วิเคราะห์","ข":"สร้างสรรค์","ค":"ประเมินค่า","ง":"สังเคราะห์"},"a":"ข","e":"สร้างสรรค์ (Creating): บลูมฉบับปรับปรุงใหม่ยกระดับ 'การสร้างสรรค์' ขึ้นแท่นความยากขั้นสูงสุดแทนที่การประเมินและการสังเคราะห์แบบเดิมอย่างเด่นชัด"},{"id":41,"q":"สามารถพูดได้เป็นประโยค มีการสร้างคำได้มากขึ้น","opts":{"ก":"0-2 ปี","ข":"2-7 ปี","ค":"7-11 ปี","ง":"12 ปีขึ้นไป"},"a":"ข","e":"ระยะ 2-7 ปี: พัฒนาการตามทฤษฎีเพียเจต์ระบุว่าเด็กวัยนี้จะมีวิวัฒนาการทางภาษาขั้นก้าวกระโดด สามารถพูดคุยเป็นประโยคยาวและมีความคิดริเริ่มสร้างถ้อยคำสะสมได้เพิ่มขึ้น"},{"id":42,"q":"การใช้ประสาทสัมผัสและกล้ามเนื้อ","opts":{"ก":"0-2 ปี","ข":"2-7 ปี","ค":"7-11 ปี","ง":"12 ปีขึ้นไป"},"a":"ก","e":"ระยะ 0-2 ปี (Sensory-Motor): วัยทารกตอนต้นมีกิจกรรมการกระทำที่ขับเคลื่อนหลักโดยการพึ่งประสาทสัมผัสทั้งห้า ร่วมกับกลุ่มพัฒนากล้ามเนื้อผ่านการคว้า จับ หรือดูดคลำ"},{"id":43,"q":"การสอนแบบรูปธรรมของเพียเจต์ สอดคล้องกับข้อใด (สพฐ. รอบทั่วไป ปี 66)","opts":{"ก":"สอนให้รู้จักทดลอง สังเกต","ข":"สอนให้พูดเป็นประโยคได้","ค":"สอนให้คิดแบบผู้ใหญ่ได้","ง":"สอนให้รู้จักการใช้เหตุผลได้อย่างมีประสิทธิภาพ"},"a":"ก","e":"สอนให้รู้จักทดลอง สังเกต: เพียเจต์เน้นย้ำว่าพัฒนาการช่วงประถมรูปธรรม (7-11 ปี) จะเข้าใจดีที่สุดเมื่อได้หยิบต้อง สังเกต เปรียบเทียบสิ่งเร้าที่เป็นวัตถุที่มีมิติตัวตนจริง"},{"id":44,"q":"การคงสภาพ อยู่ในพัฒนาการขั้นใดตามพัฒนาการทางสติปัญญาของเพียเจต์ (สพฐ.รอบทั่วไป ปี 2568)","opts":{"ก":"Sensorimotor stage","ข":"Preoperational stage","ค":"Concrete Operational stage","ง":"Formal Operation stage"},"a":"ค","e":"Concrete Operational stage: ช่วง 7-11 ปี เด็กจะผ่านจุดเข้าใจกฎอนุรักษ์คงตัวของสาร (Conservation) แม้รูปทรงทางสายตาภายนอกสสารจะบิดเปลี่ยนไปจากเดิม"},{"id":45,"q":"ตามทฤษฎีจิตวิเคราะห์ ของ ซิกมันด์ ฟรอยด์ พบว่ามี 3 ส่วน ได้แก่\nจิตสำนึก (conscious mind) หมายถึง.................\nจิตกึ่งรู้สำนึก (preconscious mind) หมายถึง.................\nจิตไร้สำนึก (unconscious mind) หมายถึง.................\nซึ่งสอดคล้องกับความหมายดังต่อไปนี้\n1. เป็นส่วนใหญ่ของก้อนน้ำแข็งที่อยู่ใต้น้ำ จิตส่วนนี้มีอิทธิพลมากต่อพฤติกรรมของมนุษย์ หมายถึง ความคิด ความกลัว และความปรารถนาของมนุษย์\n2. โผล่ผิวน้ำขึ้นมา ซึ่งมีจำนวนน้อยมาก เป็นสภาพที่รู้ตัวว่าคือใคร อยู่ที่ไหน ต้องการอะไร หรือกำลังรู้สึกอย่างไรต่อสิ่งใด\n3. เป็นส่วนที่อยู่ใกล้ๆผิวน้ำ เป็นจิตที่เก็บสะสมข้อมูลประสบการณ์ไว้มากมาย มิได้รู้ตัวในขณะนั้นแต่พร้อมให้ดึงออกมาใช้ พร้อมเข้ามาอยู่ในระดับจิตสำนึก\nจากข้อความข้างต้น ข้อใดเรียงลำดับการสอดคล้องได้อย่างถูกต้อง","opts":{"ก":"1 , 2 , 3","ข":"3 , 2 , 1","ค":"2 , 1 , 3","ง":"2 , 3 , 1"},"a":"ง","e":"2 , 3 , 1: จิตสำนึกเปรียบดั่งยอดก้อนน้ำแข็งที่พ้นเหนือน้ำขึ้นมาสะท้อนภาวะรู้ตัว (2) -> จิตกึ่งรู้สำนึกคือชั้นผิวน้ำที่พร้อมขุดดึงขึ้นมาใช้ (3) -> จิตไร้สำนึกคือก้นก้อนน้ำแข็งขนาดมหึมาใต้น้ำที่ขับเคลื่อนพฤติกรรม (1)"},{"id":46,"q":"ข้อใดไม่ใช่ทฤษฎีการเรียนรู้ของธอร์นไดค์ (Thorndike) (สพฐ.รอบทั่วไป ปี 2559)","opts":{"ก":"กฎหมายแห่งการทำงาน","ข":"กฎแห่งผล","ค":"กฎแห่งความพร้อม","ง":"กฎแห่งการฝึกหัดหรือการกระทำซ้ำ"},"a":"ก","e":"กฎหมายแห่งการทำงาน: เป็นลวงตัวเลือกเพราะกฎของธอร์นไดค์มีเพียง 3 กฎเท่านั้น คือ กฎแห่งความพร้อม กฎแห่งการฝึกหัด และกฎแห่งผลลัพธ์"},{"id":47,"q":"หากจะเสริมแรงให้นักเรียน ต้องศึกษาทฤษฎีของใคร (สพฐ.รอบทั่วไป ปี 2561)","opts":{"ก":"สกินเนอร์","ข":"พาฟลอฟ","ค":"วัตสัน","ง":"ธอร์นไดค์"},"a":"ก","e":"สกินเนอร์ (Skinner): ทฤษฎีเด่นชัดในวงการคือการให้และถอนสิ่งเร้าพึงประสงค์ (เสริมแรงบวก/ลบ) เพื่อปรับเปลี่ยนและปรับพฤติกรรมมนุษย์ให้มั่นคงสม่ำเสมอ"},{"id":48,"q":"เด็กนักเรียนเกิดอาการการง่วงนอน ทำให้เรียนหนังสือไม่รู้เรื่อง สอดคล้องกับทฤษฎีการเรียนรู้ของนักจิตวิทยาคนใด (สพฐ.รอบทั่วไป ปี 63)","opts":{"ก":"พาฟลอฟ","ข":"สกินเนอร์","ค":"ธอร์นไดค์","ง":"โคเลอร์"},"a":"ค","e":"ธอร์นไดค์: ร่างกายเกิดความอ่อนล้าหรือขาดความเตรียมพร้อม ส่งผลตรงให้ผลสัมฤทธิ์ตกต่ำสะท้อนกฎแห่งความพร้อม \"เมื่อบุคคลไม่มีความพร้อมในการเรียนรู้แต่จำต้องกระทำจะก่อเกิดความคับข้องใจ\""},{"id":49,"q":"นักเรียนตั้งใจทำงานส่ง ครูบวกคะแนนเพิ่มให้ 10 คะแนน คือการเสริมแรงแบบใด ตามแนวคิดของ Skinner (สพฐ.รอบทั่วไป ปี 63)","opts":{"ก":"การเสริมแรงทางบวก","ข":"การเสริมแรงทางลบ","ค":"การลงโทษทางบวก","ง":"การลงโทษทางลบ"},"a":"ก","e":"การเสริมแรงทางบวก (Positive Reinforcement): การเพิ่มสิ่งเร้าดีพึงประสงค์ (คะแนนเพิ่ม 10 คะแนน) เพื่อเพิ่มพฤติกรรมการส่งงานที่ดีให้ถี่ยิ่งขึ้นสะท้อนตรงตามแนวคิดสกินเนอร์"},{"id":50,"q":"ครูให้เขียนคำศัพท์ 10 หน้า ถ้านักเรียนตั้งใจเรียน ไม่คุยกัน จะลดเหลือ 5 หน้า เป็นการเสริมแรงแบบใดตามแนวคิดของ Skinner (สพฐ.รอบทั่วไป ปี 63)","opts":{"ก":"การเสริมแรงทางบวก","ข":"การเสริมแรงทางลบ","ค":"การลงโทษทางบวก","ง":"การลงโทษทางลบ"},"a":"ข","e":"การเสริมแรงทางลบ (Negative Reinforcement): นำเอางานเขียนคัดคำศัพท์ที่สร้างความอึดอัดใจออกให้ครึ่งหนึ่ง (จาก 10 หน้าเหลือ 5 หน้า) เพื่อแลกกับการตกลงตั้งใจเรียน ถือเป็นการเสริมแรงลบ"},{"id":51,"q":"ครูยึดโทรศัพท์นักเรียนเพราะเล่นเกมในเวลาเรียน เป็นการเสริมแรงแบบใดตามแนวคิดของ Skinner (สพฐ.รอบทั่วไป ปี 63)","opts":{"ก":"การเสริมแรงทางบวก","ข":"การเสริมแรงทางลบ","ค":"การลงโทษทางบวก","ง":"การลงโทษทางลบ"},"a":"ง","e":"การลงโทษทางลบ (Negative Punishment): ยึดเอาของรักของหวงชื่นชอบอย่างโทรศัพท์ไปจากตัวผู้เรียนเพื่อลดโอกาสการพฤติกรรมแอบเล่นเกมในชั่วโมงศึกษา"},{"id":52,"q":"ครูให้เขียนคำศัพท์ภาษาจีน 20 คำ เพราะนักเรียนไม่ทำการบ้านมาส่ง เป็นการเสริมแรงแบบใดตามแนวคิดของ Skinner (สพฐ.รอบทั่วไป ปี 63)","opts":{"ก":"การเสริมแรงทางบวก","ข":"การเสริมแรงทางลบ","ค":"การลงโทษทางบวก","ง":"การลงโทษทางลบ"},"a":"ค","e":"การลงโทษทางบวก (Positive Punishment): เป็นการมอบหมายสิ่งที่ผู้เรียนไม่ชอบอย่างยิ่ง (ให้คัดคำศัพท์จีนหนัก ๆ เพิ่มขึ้นถึง 20 คำ) เพื่อปราบพฤติกรรมไม่รับผิดชอบงาน"},{"id":53,"q":"ทฤษฎีการหยั่งเห็น (Insight) เป็นทฤษฎีของใคร (สพฐ.รอบทั่วไป 2563)","opts":{"ก":"พาฟลอฟ","ข":"สกินเนอร์","ค":"ธอร์นไดค์","ง":"โคเลอร์"},"a":"ง","e":"โคเลอร์: นำทฤษฎีการหยั่งเห็นในส่วนรวมของกลุ่มเกสตัลท์มาเป็นหัวหอกสำคัญ ผ่านการจำลองและสังเกตสติปัญญาร่วมในการเอาชีวิตรอดของลิงในการคว้าอาหาร"},{"id":54,"q":"ตามทฤษฎีการเสริมแรงและการลงโทษของสกินเนอร์ พบว่า ได้แก่\nการเสริมแรงทางบวก สอดคล้องกับ...............\nการเสริมแรงทางลบ สอดคล้องกับ...............\nการลงโทษทางบวก สอดคล้องกับ...............\nการลงโทษทางลบ สอดคล้องกับ...............\nซึ่งสอดคล้องกับข้อความต่อไปนี้\n1. ตี | 2. ชม | 3. ยึด | 4. บ่น\nจากข้อความข้างต้น ข้อใดเรียงลำดับการสอดคล้องได้อย่างถูกต้อง","opts":{"ก":"1 , 2 , 3 , 4","ข":"4 , 3 , 2 , 1","ค":"2 , 4 , 1 , 3","ง":"3 , 2 , 1 , 4"},"a":"ค","e":"2 , 4 , 1 , 3: ลำดับถูกต้องตามแผนภูมิคือ: การเสริมแรงบวก = ชมเชย (2) -> การเสริมแรงลบ = บ่น (4) -> การลงโทษบวก = ตี (1) -> การลงโทษลบ = ยึดของรัก (3)"},{"id":55,"q":"ข้อใดเป็นหลักการเรียนรู้ตามทฤษฎีการเชื่อมโยงของธอร์นไดค์ (สพฐ. รอบทั่วไป ปี64/65)","opts":{"ก":"การเตรียมความพร้อม การฝึกหัด และการให้รางวัล","ข":"การคำนึกถึงความแตกต่างระหว่างบุคคล","ค":"การรับรู้ การเชื่อมโยงประสบการณ์เก่าและใหม่","ง":"การหยั่งเห็น การรู้แจ้ง การใช้ประสาทสัมผัส"},"a":"ก","e":"ความพร้อม การฝึกหัด และการให้รางวัล: สื่อความหมายกฎสามข้อหลักของธอร์นไดค์ (Readiness, Exercise, Effect) อย่างถูกต้องสมบูรณ์ในแง่แนวทางปฏิบัติสร้างแผนบทเรียน"},{"id":56,"q":"การที่เด็กคนเจ้าระเบียบ จู้จี้ ย้ำคิดย้ำทำ กังวลมากเกินไป เป็นผลมาจากการบุคลิกภาพ ของฟรอยด์ (Sigmund Freud) ขั้นใด (สพฐ. รอบทั่วไป ปี64/65)","opts":{"ก":"ขั้นปาก","ข":"ขั้นทวารหนัก","ค":"ขั้นอวัยวะเพศ","ง":"ขั้นแฝง"},"a":"ข","e":"ขั้นทวารหนัก (Anal Stage): ความตึงเครียดคับข้องใจในระยะหัดใช้กระโถนสุขาของสัญชาตญาณเด็กสร้างให้เด็กเป็นคนระเบียบจุกจิก และรักความสะอาดเจ้าระเบียบมากเกินเหตุ"},{"id":57,"q":"หากต้องการเสริมแรงสำหรับนักเรียนชั้นมัธยมศึกษาตอนปลาย ควรใช้รางวัลจูงใจด้วยวิธีใด (สพฐ. รอบทั่วไป ปี64/65)","opts":{"ก":"สติกเกอร์คูปองคะแนน","ข":"ดาวเด็กดีคะแนน","ค":"ลูกอม อมยิ้ม และขนม","ง":"ตุ๊กตา"},"a":"ก","e":"สติกเกอร์คูปองคะแนน: วัยรุ่นตอนปลายกระหายผลสัมฤทธิ์เกรดเพื่อนำไปเตรียมตัวศึกษาต่อ การสะสมคะแนนวิชาเรียนจึงถือเป็นสิ่งจูงใจที่มีอิทธิพลสูงสมวัย"},{"id":58,"q":"การที่เด็กอยากได้รางวัลเรียนดี สอดคล้องกับลำดับความต้องการในขั้นใดของมาสโลว์ (สพฐ. รอบทั่วไป ปี 66)","opts":{"ก":"ความต้องการทางกายภาพ","ข":"ความต้องการยกย่องนับถือ","ค":"ความต้องการบรรลุในสิ่งที่ตั้งใจ","ง":"ความต้องการมีส่วนร่วมในสังคม"},"a":"ข","e":"ความต้องการยกย่องนับถือ: การได้รับเกียรติยศชื่อเสียง เกียรติบัตรเรียนดี และการยกย่องจากคณะครู-ผู้ปกครอง สะท้อนถึงความปรารถนาด้านการยอมรับเกียรติยศส่วนตน"},{"id":59,"q":"การเสริมแรงทางลบและการลงโทษทางลบ สอดคล้องกับข้อใด (สพฐ. รอบทั่วไป ปี 66)","opts":{"ก":"บ่น ยึด","ข":"ชม บ่น","ค":"บ่น ตี","ง":"ตี ยึด"},"a":"ก","e":"บ่น ยึด: การเสริมแรงทางลบคือการพ้นทุกข์จากการ \"บ่น\" เมื่อทำงานสำเร็จ ส่วนการลงโทษทางลบคือการตัดทอนริบของโปรดหรือ \"ยึดโทรศัพท์\" เพื่อดับสยบพฤติกรรมเกเร"},{"id":60,"q":"ข้อใดไม่ใช่การเสริมแรงทางบวก (สพฐ.กรณีพิเศษ ปี 2566)","opts":{"ก":"ชมเชย","ข":"ให้รางวัล","ค":"ให้กำลังใจ","ง":"ให้ทำเวรแทนเพื่อน"},"a":"ง","e":"ให้ทำเวรแทนเพื่อน: การบังคับให้เหนื่อยล้าทำงานบ้านทำความสะอาดห้องแทนผู้อื่นมีเจตจำนงแฝงในการลงโทษ ไม่เข้าลักษณะสิ่งเสกสร้างเสริมแรงใจอันยินดีของเด็ก"},{"id":61,"q":"ข้อใดสอดคล้องกับทฤษฎีของมาสโลว์ (สพฐ.กรณีพิเศษ ปี 2566)","opts":{"ก":"การให้รางวัลแก่นักเรียน","ข":"การสร้างบรรยากาศแห่งความอบอุ่น","ค":"การให้นักเรียนทำแบบทดสอบเพื่อวัดความรู้","ง":"การจัดการเรียนการสอนตามความต้องการของผู้เรียน"},"a":"ข","e":"การสร้างบรรยากาศแห่งความอบอุ่น: การสร้างความปลอดภัยในชีวิตห้องเรียน มิตรภาพครูศิษย์ และความอบอุ่นสอดคล้องความต้องการพื้นฐานขั้นที่สองและสามของมาสโลว์อย่างลงตัว"},{"id":62,"q":"ทฤษฎีลองผิดลองถูก เป็นทฤษฎีของใคร (สพฐ.กรณีพิเศษ ปี 2566)","opts":{"ก":"สกินเนอร์","ข":"จอห์น บี วัตสัน","ค":"ธอร์นไดร์","ง":"จอห์น ดิวอี้"},"a":"ค","e":"ธอร์นไดร์: โด่งดังและริเริ่มด้วยการทดลองแมวในกรงปริศนา เพื่อยืนยันว่าการเปลี่ยนพฤติกรรมมนุษย์ผ่านขั้นลองผิดและลองถูกสร้างความจำยั่งยืน"},{"id":63,"q":"ครูคนใด ใช้หลักการสอนตามทฤษฎีของสกินเนอร์ (สพฐ.รอบทั่วไป ปี 2567)","opts":{"ก":"ครูหนึ่งจัดการสอบ 10 ครั้ง ๆ ละ10คะแนน","ข":"ครูสองเน้นความสำคัญของการเรียนปนเล่น การเล่มเกมส์ร้องเพลงในการเรียนการสอน","ค":"ครูสามให้รางวัลกับนักเรียนที่สอบได้คะแนนสูงสุด","ง":"ครูแปดเน้นพัฒนาการทางบุคลิกภาพ"},"a":"ก","e":"ครูหนึ่งจัดการสอบ 10 ครั้งๆ ละ 10 คะแนน: สกินเนอร์สนับสนุนบทเรียนแบบแบ่งเป็นกรอบย่อย ๆ (Programmed Instruction) สอบบ่อยและเฉลยความก้าวหน้าทันควัน เพื่อมอบแรงเสริมต่อเนื่อง"},{"id":64,"q":"ตามลำดับขั้นความต้องการของมาสโลว์ ขั้นสูงสุดสอดคล้องกับข้อใด (สพฐ.รอบทั่วไป ปี 2567)","opts":{"ก":"ด้านความรัก","ข":"ด้านการยอมรับนับถือ","ค":"ด้านร่างกาย","ง":"ด้านความปลอดภัย"},"a":"ข","e":"ด้านการยอมรับนับถือ: แม้ขั้นที่ 5 (Self-Actualization) จะเป็นยอดปิรามิดของมาสโลว์ แต่ในตัวเลือกทั้งหมดที่ปรากฏ ขั้นความเคารพยกย่อง (Esteem Needs) คือขั้นสูงสุดที่ระบุไว้"},{"id":65,"q":"ทฤษฎีพหุปัญญาของการ์ดเนอร์ สมองซีกขวาทำหน้าที่เกี่ยวกับอะไร (สพฐ.รอบทั่วไป ปี 2567)","opts":{"ก":"ดนตรี","ข":"ภาษา","ค":"การเข้าใจธรรมชาติ","ง":"ตรรกะ"},"a":"ก","e":"ดนตรี: ซีกขวาทำงานหลักคอยคุมสุนทรียภาพ จิตนึกคิด จินตนาการ ศิลปะ โทนสัดส่วนรูปภาพ และกลุ่มสุนทรียวิจิตรของเสียงทำนองเพลง"},{"id":66,"q":"ใช้สัญลักษณ์แทนวัตถุสิ่งรอบตัวได้","opts":{"ก":"0-2 ปี","ข":"2-7 ปี","ค":"7-11 ปี","ง":"12 ปีขึ้นไป"},"a":"ข","e":"ระยะ 2-7 ปี (Preoperational): วัยนี้ยังติดขัดข้อจำกัดความคิดแบบนามธรรมอย่างเป็นระบบ แต่สามารถใช้สัญลักษณ์แทนวัตถุสิ่งของรอบกายในการเล่นจินตนาการได้เป็นอย่างดี"},{"id":67,"q":"สามารถคิดย้อนกลับไปมาได้","opts":{"ก":"0-2 ปี","ข":"2-7 ปี","ค":"7-11 ปี","ง":"12 ปีขึ้นไป"},"a":"ค","e":"ระยะ 7-11 ปี (Concrete Operation): สติปัญญาด้านการคิดแบบย้อนกลับ (Reversibility) จะเริ่มก่อเกิดสมบูรณ์ในเด็กวัยประถม ทำให้เข้าใจความสัมพันธ์ของทิศทางสลับได้ดี"},{"id":68,"q":"การคิดอย่างมีเหตุผลและอย่างเป็นนามธรรม","opts":{"ก":"0-2 ปี","ข":"2-7 ปี","ค":"7-11 ปี","ง":"12 ปีขึ้นไป"},"a":"ง","e":"ระยะ 12 ปีขึ้นไป (Formal Operation): เป็นขีดความสามารถสติปัญญาขั้นสูงสุดตามแนวคิดเพียเจต์ เข้าใจแนวคิดทางฟิสิกส์ สังคมศาสตร์ และการคิดสมมติฐานที่เป็นนามธรรม"},{"id":69,"q":"เด็กจะรับรู้สิ่งที่เป็นรูปธรรมได้เท่านั้น","opts":{"ก":"0-2 ปี","ข":"2-7 ปี","ค":"7-11 ปี","ง":"12 ปีขึ้นไป"},"a":"ก","e":"ระยะ 0-2 ปี: ในตอนแรกเริ่มชีวิต เด็กจะตอบสนองต่อวัตถุที่มีตัวตนและจับต้องสัมผัสรูปธรรมได้ก่อนเป็นสำคัญ ยังไม่สามารถวิเคราะห์โครงสร้างเหตุผลที่ลึกซึ้ง"},{"id":70,"q":"ขั้นเตรียมความคิดที่มีเหตุผล หรือการคิดก่อนปฏิบัติการ","opts":{"ก":"0-2 ปี","ข":"2-7 ปี","ค":"7-11 ปี","ง":"12 ปีขึ้นไป"},"a":"ข","e":"ระยะ 2-7 ปี: เรียกว่าระยะก่อนการปฏิบัติการหรือขั้นเตรียมความคิดเหตุผล (Preoperational Stage) เด็กยังคงยึดหลักตนเองเป็นศูนย์กลางของโลก"},{"id":71,"q":"ครูทองมีศึกษาองค์ประกอบของพัฒนาการ พบว่ามีองค์ประกอบ ดังนี้ ได้แก่ .............. หมายถึง การเปลี่ยนแปลงพฤติกรรมอันเป็นผลมาจากประสบการณ์ หรือการฝึกหัด การเรียนรู้เป็นสาเหตุอย่างหนึ่งที่ทำให้เกิดการพัฒนา และ...................หมายถึง ความเจริญเติบโตทั้งทางร่างกายและจิตใจ พร้อมที่จะทำงานตามหน้าที่ได้ ข้อใดสอดคล้องกับองค์ประกอบของพัฒนาการตามลำดับข้อความข้างต้น","opts":{"ก":"วุฒิภาวะ , การเรียนรู้","ข":"Learning , Maturity","ค":"วุฒิภาวะ , กระบวนการ","ง":"กระบวนการ , การเรียนรู้"},"a":"ข","e":"Learning , Maturity: ตามหลักพัฒนาการ 'การเรียนรู้' (Learning) คือการเปลี่ยนพฤติกรรมจากซ้ำประสบการณ์ ขณะที่ 'วุฒิภาวะ' (Maturity) คือความงอกงามทางกายจิตใจตามระยะธรรมชาติที่เหมาะสม"},{"id":72,"q":"ข้อใดกล่าวถูกต้องที่สุดเกี่ยวกับหลักจิตวิทยาการศึกษา (สพฐ.รอบทั่วไป ปี 59)","opts":{"ก":"เป็นการศึกษาเกี่ยวกับเรียนรู้และพัฒนาการของผู้เรียนในสภาพการเรียนการสอนในชั้นเรียน","ข":"เป็นการศึกษาการเปลี่ยนแปลงพฤติกรรมอันเนื่องมาจากประสบการณ์และการฝึกหัด","ค":"ศึกษาเกี่ยวกับพฤติกรรมหรือกิริยาอาการของมนุษย์และสัตว์โดยอาศัยกระบวนการทางวิทยาศาสตร์","ง":"ความรู้สึกของบุคคลที่มีต่อสิ่งใด ๆ ซึ่งแสดงออกมา"},"a":"ก","e":"เรียนรู้และพัฒนาการในชั้นเรียน: ข้อความ ก. เป็นนิยามมาตรฐานสูงสุดของวิชาจิตวิทยาการศึกษาที่ศึกษาการโต้ตอบของผู้เรียนและผู้สอนท่ามกลางสภาพแวดล้อมเชิงวิชาการจริง"},{"id":73,"q":"ข้อใดคือคุณลักษณะทางด้านสติปัญญา (สพฐ.รอบทั่วไป ปี 2559)","opts":{"ก":"พุทธิพิสัย","ข":"จิตพิสัย","ค":"ทักษะพิสัย","ง":"สมาธิพิสัย"},"a":"ก","e":"พุทธิพิสัย (Cognitive Domain): โดเมนที่เกี่ยวดองโดยตรงกับกลไกทางสติปัญญา ความคิดวิเคราะห์ ความจำ การประเมินและทักษะประมวลผลของสมอง"},{"id":74,"q":"ข้อใดไม่ใช่ขอบข่ายการแนะแนว (กทม.รอบทั่วไป ปี 60-61)","opts":{"ก":"ครูแนะนำอาชีพให้กับนักเรียน","ข":"ครูนัดเด็กที่มีปัญหามาสอนซ่อมเสริม","ค":"ครูพานักเรียนไปแข่งขันภาษาอังกฤษ","ง":"ครูพาเด็กนักเรียนเดินสำรวจอาคารบริเวณหลังโรงเรียนพร้อมบอกวิธีการใช้ห้องน้ำ"},"a":"ค","e":"ครูพานักเรียนไปแข่งขันภาษาอังกฤษ: การนำเด็กแข่งขันคือมิติพัฒนากิจกรรมวิชาการระดับโรงเรียน คัดง้างกับขอบข่ายการแนะแนวสามข่าย (การศึกษา, อาชีพ, ส่วนตัวสังคม) ซึ่งต้องเน้นที่เครื่องมือและการแก้ปัญหาโดยตรง"},{"id":75,"q":"การรู้จักผู้เรียนเป็นรายบุคคล เครื่องมือใดสอดคล้องน้อยที่สุด (สพฐ.รอบทั่วไป ปี 61)","opts":{"ก":"การสังเกต","ข":"สัมภาษณ์","ค":"การเยี่ยมบ้าน","ง":"การทดสอบ"},"a":"ง","e":"การทดสอบ (Testing): ในระบบดูแลช่วยเหลือนักเรียน การตรวจเยี่ยมบ้าน บันทึกสะสม และสัมภาษณ์เป็นวิธีตามธรรมชาติเพื่อหาภูมิหลัง ส่วนแบบทดสอบความรู้ไม่สอดคล้องต่อการเห็นพฤติกรรมจริงเพื่อการดูแลนักเรียน"},{"id":76,"q":"ข้อใดกล่าวถึงปรัชญาของการแนะแนวได้ถูกต้องมากที่สุด (สพฐ.รอบทั่วไป ปี 61)","opts":{"ก":"บุคคลแต่ละคนย่อมมีความเหมือนกันทั้งทางร่างกาย จิตใจ","ข":"บุคคลมีการเปลี่ยนแปลงในบางด้าน","ค":"ธรรมชาติของคนไม่ต้องการอยู่ร่วมกันในสังคม","ง":"มนุษย์ต้องการความเคารพในศักดิ์ศรี"},"a":"ง","e":"มนุษย์ต้องการความเคารพในศักดิ์ศรี: ปรัชญาแนะแนวข้อที่ 5 บันทึกแจ่มแจ้งว่า \"บุคคลย่อมมีศักดิ์ศรี และต้องการการยอมรับซึ่งกันและกัน\" มนุษย์ทุกคนจึงสมควรมีสิทธิได้รับการนำทางชีวิตเชิงสร้างสรรค์"},{"id":77,"q":"ข้อใดเป็นงานบริการของกิจกรรมแนะแนว (สพฐ.รอบทั่วไป ปี 61)","opts":{"ก":"การคัดกรอง","ข":"การสำรวจนักเรียนรายบุคคล","ค":"การสอนเสริม","ง":"การแก้ปัญหา"},"a":"ข","e":"การสำรวจนักเรียนรายบุคคล: บริการแรกสุดที่เปรียบดั่งบันไดห้าขั้นของแนะแนวคือบริการศึกษาและรวบรวมข้อมูลส่วนตัวรายบุคคลเพื่อใช้สืบค้นวิเคราะห์ปัญหาอย่างรอบด้าน"},{"id":78,"q":"การเติบโตขึ้น เรียนรู้และทำอะไรได้มากขึ้นเพราะอะไร (สพฐ.รอบทั่วไป 2563)","opts":{"ก":"สิ่งแวดล้อมและพันธุกรรม","ข":"พันธุกรรมและสิ่งแวดล้อม","ค":"วุฒิภาวะและการเรียนรู้","ง":"วุฒิภาวะและพันธุกรรม"},"a":"ค","e":"วุฒิภาวะและการเรียนรู้: พัฒนาการมนุษย์เกิดขึ้นอย่างสมบูรณ์จากแรงประสานระหว่างระดับวุฒิภาวะร่างกายและการเรียนรู้จากสิ่งแวดล้อมภายนอก"},{"id":79,"q":"สิ่งที่ทำให้วัยรุ่น มีความแตกต่างจากวัยอื่น คือข้อใด (สพฐ.รอบทั่วไป ปี 63)","opts":{"ก":"ท่องคำศัพท์ภาษาอังกฤษได้","ข":"เขียน ก-ฮ ได้","ค":"เลียนแบบท่าผู้ใหญ่ได้","ง":"มีความเข้าใจในนามธรรม"},"a":"ง","e":"มีความเข้าใจในนามธรรม: วัยรุ่นก้าวขึ้นสู่ระดับ Formal Operation ของเพียเจต์ ส่งผลให้สมองพัฒนาการคิดเปรียบเทียบในมุมมองเชิงสมมติฐานและอุดมคตินามธรรมได้ดีกว่าวัยอื่น"},{"id":80,"q":"ข้อใดคือพฤติกรรมภายในตัวบุคคล (สพฐ.รอบทั่วไป ปี 63)","opts":{"ก":"ความรู้สึก","ข":"หัวเราะ","ค":"ออกกำลังกาย","ง":"นอนหลับ"},"a":"ก","e":"ความรู้สึก (Covert Behavior): พฤติกรรมภายในของมนุษย์คือกิริยาจิตใจที่ผู้อื่นไม่สามารถล่วงรู้และสังเกตตรวจจับได้ง่ายด้วยตาเปล่า ได้แก่ ความเครียด คิด ความคิด และความรู้สึก"},{"id":81,"q":"ข้อใดไม่ใช่บทบาทหน้าที่ครูที่ปรึกษาในการแนะแนวนักเรียน (สพฐ.รอบทั่วไป 2563)","opts":{"ก":"ป้องกันและแก้ไขปัญหานักเรียน","ข":"ให้นักเรียนรู้จักตนเอง","ค":"ให้นักเรียนแก้ปัญหาด้วยตนเองได้","ง":"ให้นักเรียนที่เก่งเอาชนะผู้อื่นได้"},"a":"ง","e":"ให้นักเรียนที่เก่งเอาชนะผู้อื่นได้: ผิดแนวแนะแนวเนื่องจากการชี้แนะวิชาการมีปลายทางเพื่อส่งเสริมให้นักเรียนรู้จักปรับตัวอยู่ร่วมกับผู้อื่นได้ดี มีสันติสุข ไม่ใช่มุ่งสอนความเห็นแก่ตัว"},{"id":82,"q":"ข้อใดไม่เกี่ยวข้องกับพัฒนาการทางสติปัญญาและความคิด (สพฐ. รอบทั่วไป ปี64/65)","opts":{"ก":"การถ่ายทอดความรู้ทางสังคม","ข":"วุฒิภาวะ","ค":"การพัฒนาบุคลิกภาพ","ง":"ประสบการณ์การกระทำ"},"a":"ค","e":"การพัฒนาบุคลิกภาพ: บุคลิกภาพจัดอยู่ในกลุ่มพัฒนาการเจริญอารมณ์สังคม ไม่ได้เกี่ยวข้องกับพุทธิปัญญาความคิดด้านเชาวน์สติปัญญาเชิงวิทยาศาสตร์การเข้าใจโครงสร้างความคิด"},{"id":83,"q":"ข้อใดเป็นการพัฒนาเกี่ยวกับอารมณ์ของวัยรุ่นตอนต้น (สพฐ. รอบทั่วไป ปี64/65)","opts":{"ก":"มีความอยากรู้อยากเห็น ใช้กล้ามเนื้อจับต้องสิ่งของต่าง ๆ","ข":"ชอบเล่นก่อสร้างอะไรขึ้นมาตามความคิดของตน","ค":"การใช้เวลาว่างให้เกิดประโยชน์ เพื่อความมั่นคงทางอารมณ์ สนใจเรื่องเพศ","ง":"สุขุม รอบคอบ ฉลาด บุคคลจะยอมรับความเป็นจริงของชีวิต"},"a":"ค","e":"สนใจเรื่องเพศ และมุ่งมั่นมั่นคงอารมณ์: วัยรุ่นตอนต้นจะเริ่มมีการเปลี่ยนแปลงฮอร์โมนเพศและก้าวเข้าสู่ขั้นสนใจเพศตรงข้ามของฟรอยด์ ความพึงใจจึงสะท้อนความต้องการสัมพันธ์เพื่อนร่วมรุ่น"},{"id":84,"q":"ข้อใดเป็นพัฒนาการของวัยเด็กตอนต้น (สพฐ. รอบทั่วไป ปี64/65)","opts":{"ก":"เด็กชอบพูดมากกว่าชอบเขียน สนใจสิ่งรอบข้าง","ข":"เด็กอยากรู้อยากเห็น ใช้กล้ามเนื้อจับต้องสิ่งของต่าง ๆ","ค":"รู้จักตนเองว่ามีเป้าหมายในการชีวิตอย่างไร","ง":"คิดแบบมีเหตุผลนามธรรม"},"a":"ก","e":"เด็กชอบพูดมากกว่าเขียน สนใจสิ่งรอบข้าง: เด็กปฐมวัย (2-7 ปี) มีกล้ามเนื้อมัดเล็กไม่แกร่งพอสำหรับการประดิษฐ์อักษรเขียนได้คล่อง แต่จะมีทักษะใช้คำพูดสื่อสารที่เจริญรุดหน้าอย่างดีเยี่ยม"},{"id":85,"q":"ข้อใดเป็นขอบข่ายการแนะแนวด้านการศึกษา (สพฐ. รอบทั่วไป ปี64/65)","opts":{"ก":"ให้นักเรียนที่เก่งเอาชนะผู้อื่นได้","ข":"ประชาสัมพันธ์ข้อมูลของโรงเรียน","ค":"ให้นักเรียนเลือกเรียนต่อคณะครุศาสตร์หรือพยาบาล","ง":"ให้นักเรียนเรียนพิเศษซ่อมเสริมในช่วงเลิกเรียน"},"a":"ค","e":"เลือกเรียนต่อคณะครุศาสตร์หรือพยาบาล: แนะแนวการศึกษาคือการชี้ช่องทาง วางโร้ดแมปในการศึกษาต่อในขั้นสูงขึ้นที่ตรงใจและเหมาะสมกับระดับเชาวน์ของนักเรียน"},{"id":86,"q":"ข้อใดเป็นขอบข่ายการแนะแนวด้านอาชีพ (สพฐ. รอบทั่วไป ปี64/65)","opts":{"ก":"ครูแนะนำให้นักเรียนทำงานพาร์ทไทม์ที่ร้านพิซซาในช่วงปิดภาคเรียน","ข":"ครูพานักเรียนไปประกวดและแข่งขันความสามารถทางวิชาการงานศิลปหัตถกรรมนักเรียน","ค":"ครูแนะแนวในเรื่องสถานที่เรียนให้กับผู้ที่จะศึกษาต่อในระดับอุดมศึกษา","ง":"ครูช่วยให้นักเรียนรู้จักวิธีการเรียนและค้นคว้าข้อมูลจากอินเทอร์เน็ต"},"a":"ก","e":"แนะทำงานพาร์ทไทม์ที่ร้านพิซซ่า: เป็นการแนะแนวอาชีพที่เชื่อมโยงความรู้สู่การสัมผัสประสบการณ์ทำงานจริงในสถานประกอบการ และเข้าใจคุณลักษณะอาชีพตามสถานการณ์จริง"},{"id":87,"q":"“เด็กชายเอ ไม่สบายใจเกี่ยวกับน้ำหนักตัวที่มากขึ้น จึงได้มาปรึกษาคุณครูประจำชั้น” เป็นขอบข่ายการแนะแนวด้านใด (สพฐ. รอบทั่วไป ปี64/65)","opts":{"ก":"แนะแนวอาชีพ","ข":"แนะแนวการศึกษา","ค":"แนะแนวอารมณ์และสังคม","ง":"แนะแนวส่วนตัวและสังคม"},"a":"ง","e":"แนะแนวส่วนตัวและสังคม: ปัญหาภาพลักษณ์ รูปร่าง และน้ำหนักตัวเป็นประเด็นอ่อนไหวระดับส่วนตัวซึ่งมีผลสะท้อนต่อสภาวะจิตวิทยาส่วนบุคคล สังคม และเจตคติต่อตนเอง"},{"id":88,"q":"ครูแนะแนวต้องมีความเชี่ยวชาญ ด้านการให้คำปรึกษาแก่นักเรียน จากข้อความดังกล่าว ถูกต้องหรือไม่ เพราะเหตุใด (สพฐ. รอบทั่วไป ปี64/65)","opts":{"ก":"ไม่ถูกต้อง เพราะงานแนะแนว เป็นหน้าที่ของบุคลากรทุกคนในโรงเรียน","ข":"ไม่ถูกต้อง เพราะงานแนะแนว เป็นหน้าที่ของครูฝ่ายปกครอง","ค":"ถูกต้อง เพราะงานแนะแนวช่วยให้นักเรียนได้รู้จักตัวเองคิดแก้ปัญหาด้วยตัวเอง","ง":"ถูกต้อง เพราะงานแนะแนวช่วยให้นักเรียนทราบถึงบทบาทของครูแนะแนว"},"a":"ค","e":"ถูกต้อง เพราะทำให้รู้จักตนเองและแก้ปัญหาได้: หน้าที่และสารัตถะหลักของการบริการให้คำปรึกษาคือการกระตุ้นให้เด็กมองเห็นปัญหาของตน คลายปมลึกในอดีต และตัดสินใจเลือกทางรอดเองได้อย่างฉลาด"},{"id":89,"q":"ข้อใดสอดคล้องกับการสอนโดยใช้เงื่อนไขตามแบบของจอห์น บี วัตสัน (สพฐ. รอบทั่วไป ปี 66)","opts":{"ก":"การสอนโดยการลองผิดลองถูก","ข":"การสอนโดยการรับรู้ การเชื่อมโยงประสบการณ์เก่าและใหม่","ค":"สอนโดยการให้จำจนเป็นอัตโนมัติ","ง":"สอนโดยการให้ความอบอุ่น จนปราศจากความกลัว"},"a":"ง","e":"สอนโดยให้ความอบอุ่นจนปราศจากความกลัว: วัตสันเชื่อว่าความกลัวเกิดขึ้นจากการสร้างเงื่อนไขรอบข้าง หากครูต้องการลบล้างความกลัวก็ต้องสร้างความอบอุ่น สบายใจขึ้นเป็นสิ่งเร้าแทนที่เงื่อนไขลบ"},{"id":90,"q":"เด็กชายเอเข้ากับผู้ปกครองไม่ได้ จึงได้มาปรึกษาครูแนะแนว เป็นการให้คำปรึกษาที่ สอดคล้องกับข้อใด (สพฐ. รอบทั่วไป ปี 66)","opts":{"ก":"การศึกษา","ข":"อาชีพ","ค":"ส่วนตัวและสังคม","ง":"ด้านอื่นๆ"},"a":"ค","e":"ส่วนตัวและสังคม: ปัญหาความระหองระแหงของคนในบ้านและประเด็นครอบครัวที่ไม่เข้าใจกันจัดอยู่ในกรอบสาระของแนะแนวส่วนตัวและสังคมเพื่อเยียวยาจิตใจและปรับตัว"},{"id":91,"q":"เด็กชายเอเกิดภาวะเครียดจนถึงขั้นกรีดแขนตนเอง หากท่านเป็นครูที่ปรึกษาท่านจะ ดำเนินการตามระบบดูแลช่วยเหลือนักเรียนตามข้อใด (สพฐ. รอบทั่วไป ปี 66)","opts":{"ก":"การคัดกรองนักเรียน","ข":"ให้คำปรึกษาและส่งต่อผู้เชี่ยวชาญ","ค":"การป้องกันและแก้ไขปัญหา","ง":"การส่งเสริมและพัฒนานักเรียน"},"a":"ข","e":"ให้คำปรึกษาและส่งต่อผู้เชี่ยวชาญ: กรณีนักเรียนกรีดแขนมีสภาวะความเสี่ยงจิตเวชและทำร้ายตัวเอง เกินความสามารถของครูแนะแนวเบื้องต้น จำเป็นต้องใช้บริการ 'ส่งต่อภายนอก' ให้แพทย์จิตวิญญาณด่วนที่สุด"},{"id":92,"q":"ข้อใดไม่สอดคล้องกับการพัฒนาเด็กมัธยม (สพฐ. รอบทั่วไป ปี 66)","opts":{"ก":"พัฒนาให้คิดแบบผู้ใหญ่ได้","ข":"พัฒนาการคิดที่เป็นนามธรรม","ค":"พัฒนาการใช้ประสาทสัมผัส","ง":"พัฒนาให้รู้จักการใช้เหตุผลได้อย่างมีประสิทธิภาพ"},"a":"ค","e":"พัฒนาการใช้ประสาทสัมผัส: การเน้นฝึกฝนสัมผัสห้าและการกระพริบตามอเตอร์ประสาท (Sensory-Motor) เป็นแนวสติปัญญาเฉพาะของเด็กทารกขวบปีแรก ไม่ใช่ระดับชั้นมัธยม"},{"id":93,"q":"หากครูต้องการกระตุ้นการเรียนรู้ของผู้เรียน ไม่ควรปฏิบัติต่อผู้เรียนอย่างไร (สพฐ.กรณีพิเศษ ปี 2566)","opts":{"ก":"ชมเชย","ข":"ลงโทษ","ค":"ให้รางวัล","ง":"สร้างบรรยากาศที่ท้าทาย"},"a":"ข","e":"ลงโทษ: การใช้วิธีลงโทษเป็นกระบวนการระงับและขัดขวางพฤติกรรมเชิงหักหาญ ไม่ก่อให้เกิดใจรักในการศึกษาและการสร้างเจตคติสร้างสรรค์ต่อวิชาเรียนและครูสอน"},{"id":94,"q":"การแนะแนวนักเรียนระดับชั้นมัธยมศึกษาปีที่ 6 ข้อใดเหมาะสมที่สุด (สพฐ.กรณีพิเศษ ปี 2566)","opts":{"ก":"แนะแนวด้านอาชีพ","ข":"แนะแนวด้านการศึกษา","ค":"แนะแนวด้านสังคม","ง":"แนะแนวเรื่องส่วนตัว"},"a":"ข","e":"แนะแนวด้านการศึกษา: นักเรียน ม.6 กำลังเปลี่ยนผ่านวัยสู่ก้าวสำคัญในรั้วอุดมศึกษา บริการแนะแนวข้อมูลวิชาการ โควตา และทิศทางวิชาเรียนจึงเป็นจุดเปลี่ยนสำคัญชีวิต"},{"id":95,"q":"บิดาแห่งจิตวิทยาทางการศึกษาคือใคร (สพฐ.กรณีพิเศษ ปี 2566)","opts":{"ก":"ธอร์นไดร์","ข":"จอห์น บี วัตสัน","ค":"เบนจามิน เอส บลูม","ง":"วอล์ฟแกง โคห์เลอร์"},"a":"ก","e":"ธอร์นไดร์: เป็นบิดาจิตวิทยาทางการศึกษา ผู้เชื่อมแนวคิดทดลองชีววิทยาและพฤติกรรมมนุษย์จัดวางโครงสร้างการเรียนการสอนและการวัดผลทางการเรียนอย่างเป็นแบบแผน"},{"id":96,"q":"บิดาแห่งสติปัญญาคือใคร (สพฐ.กรณีพิเศษ ปี 2566)","opts":{"ก":"ซิกมัน ฟรอยด์","ข":"อัลเฟรด บิเนต์","ค":"วิลเฮล์ม แมกซ์ วุ้นท์","ง":"จอห์น บี วัตสัน"},"a":"ข","e":"อัลเฟรด บิเนต์: ค้นคว้าและเขียนแบบทดสอบแรกของฝรั่งเศส นำแนวคิดอายุสมองและวิเคราะห์ศักยภาพมนุษย์ที่เรียกว่าสติปัญญามาเผยแผ่เป็นรูปธรรมสู่ระดับโลก"},{"id":97,"q":"บิดาแห่งการแนะแนวคือใคร (สพฐ.กรณีพิเศษ ปี 2566)","opts":{"ก":"ซิกมัน ฟรอยด์","ข":"ฌอง ฌาค รุสโซ","ค":"เบนจามิน เอส บลูม","ง":"แฟรงค์ พาร์สัน"},"a":"ง","e":"แฟรงค์ พาร์สัน: ผู้วิเคราะห์จับคู่นิสัยมนุษย์และคุณสมบัติงานเข้าคู่กันอย่างเป็นทฤษฎี จนได้รับการตั้งชื่อให้เป็นบิดาแห่งการแนะแนวทางอาชีพของโลก"},{"id":98,"q":"ข้อใดไม่ใช่เป้าหมายของการแนะแนว (สพฐ.กรณีพิเศษ ปี 2566)","opts":{"ก":"การแก้ปัญหา","ข":"การส่งเสริมพัฒนา","ค":"การส่งต่อภายนอก","ง":"การป้องกันปัญหา"},"a":"ค","e":"การส่งต่อภายนอก: เป้าหมายวิถีแนะแนวหลักมีสามประการคือ \"ป้องกันปัญหา แก้ไขเยียวยา ส่งเสริมส่งเสริมพัฒนา\" ส่วนการส่งต่อภายนอกเป็นขั้นตอนหนึ่งของการทำงานบริหาร"},{"id":99,"q":"ข้อใดเป็นองค์ประกอบสำคัญของพัฒนาการมนุษย์ (สพฐ.รอบทั่วไป ปี 2567)","opts":{"ก":"วุฒิภาวะ, การเรียนรู้","ข":"อายุ, ประสบการณ์","ค":"ความรู้, ทักษะการคิด","ง":"การเรียนรู้, ประสบการณ์"},"a":"ก","e":"วุฒิภาวะ, การเรียนรู้: สองเสาหลักนี้เป็นเงื่อนไขที่กำหนดกงล้อพัฒนาการและการทำหน้าที่ตามปกติของอวัยวะมนุษย์ตามที่ธรรมชาติจัดลำดับขั้นวิวัฒนาการไว้"},{"id":100,"q":"ถ้าครูพบว่าเด็กชายเอชอบลักขโมยของในโรงเรียน ครูจะใช้วิธีการเก็บข้อมูลแบบใด ตามหลักจิตวิทยา (สพฐ.รอบทั่วไป ปี 2567)","opts":{"ก":"ศึกษารายกรณี","ข":"สังเกต","ค":"สำรวจ","ง":"สัมภาษณ์"},"a":"ก","e":"ศึกษารายกรณี (Case Study): พฤติกรรมเบี่ยงเบนรุนแรงและเรื้อรัง เช่น ลักทรัพย์ ยาเสพติด จำเป็นต้องใช้วิธีศึกษาอย่างลึกซึ้งเป็นรายบุคคล ค้นปมลึกครอบครัวเพื่อวางแผนรักษาระยะยาว"},{"id":101,"q":"การจัดการเรียนรู้แบบมีปฏิสัมพันธ์ ( Interactive Learning) เป็นการจัดการเรียนรู้ที่ สอดคล้องกับข้อใด (สพฐ.รอบทั่วไป ปี 2568)","opts":{"ก":"ให้ผู้เรียนแสดงออกถึงความรู้สึก ความคิด ทัศนคติต่าง ๆ","ข":"จะมีการผูกเรื่องแต่ละตอนให้เกิดขึ้นอย่างต่อเนื่อง และเรียงลำดับเหตุการณ์","ค":"เชื่อมโยงเนื้อหาความรู้จากศาสตร์ต่าง ๆ","ง":"ลงมือปฏิบัติ อภิปราย แก้ปัญหา และทำงานร่วมกับผู้อื่น"},"a":"ง","e":"ลงมือปฏิบัติ อภิปราย ร่วมงานกับผู้อื่น: การศึกษาแนวสร้างสรรค์ปฏิสัมพันธ์ยึดผู้เรียนเป็นศูนย์กลางด้วยกิจกรรมกลุ่ม อภิปรายแลกเปลี่ยนความรู้ และสืบค้นทางรอดร่วมแก้ไขปัญหา"},{"id":102,"q":"การที่เด็กมีพฤติกรรมดูดนิ้ว กลับไปพูดเหมือนเด็ก หลังจากที่มีน้องเกิดใหม่ เป็นวิธี ป้องกันตนเองแบบใด (สพฐ.รอบทั่วไป ปี 2568)","opts":{"ก":"การเก็บกด (Repression)","ข":"การถดถอย (Regression)","ค":"การปะทุ (Displacement)","ง":"การหาเหตุผลเข้าข้างตนเอง (Rationalization)"},"a":"ข","e":"การถดถอย (Regression): กลไกป้องกันจิตตนเองที่พ่ายแพ้ต่อภาวะคับข้องจิตใจ อิจฉาความรักต่อน้อง จึงแสดงกิริยาวัยเยาว์ย้อนยุคเพื่อให้แม่หันกลับมาดูแลปรนนิบัติ"},{"id":103,"q":"การที่ครูผู้สอนเข้าใจภูมิหลังของนักเรียนแต่คนในชั้นเรียน เป็นประโยชน์ต่อครูผู้สอนในการจัดการเรียนรู้ตามข้อใด (สพฐ.รอบทั่วไป ปี 2568)","opts":{"ก":"เข้าใจความแตกต่างระหว่างบุคคล","ข":"จัดการเรียนการสอนให้ยากกว่าเดิม","ค":"รู้ถึงฐานะทางครอบครัว","ง":"สามารถคัดเลือกนักเรียนที่เรียนเก่งส่งแข่งขันทางวิชาการได้"},"a":"ก","e":"เข้าใจความแตกต่างระหว่างบุคคล: ช่วยให้ครูหลีกเลี่ยงการตัดสินใจที่ผิดพลาดในการเอาเปรียบหรือบังคับเด็ก และจัดการแผนบทเรียนที่ซัพพอร์ตจุดเด่นจุดด้อยแต่ละคน"},{"id":104,"q":"การที่มีเด็กนักเรียนย้ายเข้ามาใหม่ในชั้นเรียน ไม่รวมกลุ่มกับนักเรียนในชั้นเรียนที่มีอยู่เดิมได้ ครูผู้สอนควรดำเนินการอย่างไร (สพฐ.รอบทั่วไป ปี 2568)","opts":{"ก":"จัดการเรียนการสอนตามปกติ","ข":"จัดกิจกรรมกลุ่มที่ทำกิจกรรมร่วมกัน","ค":"จัดให้นั่งคู่กับเพื่อนที่เรียนเก่งที่สุดในห้อง","ง":"จัดให้นั่งตรงกลางของห้องเพื่อจะได้คุยกับทุกคน"},"a":"ข","e":"จัดกิจกรรมกลุ่มที่ทำกิจกรรมร่วมกัน: การสร้างกิจกรรมที่สร้างสรรค์ความร่วมมือจะช่วยละลายพฤติกรรม สานสัมพันธ์และช่วยให้สมาชิกใหม่หลอมรวมตนเข้ากลุ่มได้อย่างสันติ"},{"id":105,"q":"การสอนตามบทบาทสมมติ (Role-playing) และตามแบบจำลอง (Modeling) เป็น แนวคิดของนักทฤษฏีคนใด (สพฐ.รอบทั่วไป ปี 2568)","opts":{"ก":"แฟรงค์ พาร์สัน","ข":"ซิกมันด์ ฟรอยด์","ค":"อับราฮัม ฮาโรลด์ มาสโลว์","ง":"อัลเบิร์ต แบนดูรา"},"a":"ง","e":"อัลเบิร์ต แบนดูรา (Albert Bandura): เป็นบิดาการเรียนรู้ทางปัญญาสังคม ผู้วางระเบียบกลยุทธ์การฝึกเด็กผ่านการดูตัวอย่างพฤติกรรมจากแบบจำลอง และการจำลองสวมบทบาทสมมติ"}],"บริบทโลก & สังคม (PISA)":[{"id":1,"q":"ข้อใดเป็นเป้าหมายการพัฒนาที่ยั่งยืนของสหประชาชาติ","opts":{"ก":"HDGs","ข":"SDGs","ค":"SEA-TCF","ง":"NEETs"},"a":"ข","e":"SDGs"},{"id":2,"q":"เป้าหมายการพัฒนาที่ยั่งยืน SDGs เพื่อให้บรรลุความมุ่งหมายอันสูงสุดภายในปีใด","opts":{"ก":"ค.ศ. 2010","ค":"ศ. 2010","ข":"ค.ศ. 2020","ง":"ค.ศ. 2050"},"a":"ค","e":"ค.ศ. 2030"},{"id":3,"q":"ข้อใดไม่ใช่เป้าหมายพัฒนาผู้เรียน 3Rs ตามทักษะการเรียนรู้ แห่งศตวรรษที่ 21","opts":{"ก":"การคิดเลขเป็น","ข":"การฟังได้","ค":"การเขียนได้","ง":"การอ่านออก"},"a":"ข","e":"การฟังได้"},{"id":4,"q":"ข้อใดไม่ใช่วิธีการจัดการเรียนการสอนตามทักษะ 3Rs","opts":{"ก":"ครูงาม สอนให้นักเรียนอ่านเนื้อหาวิชาภาษาไทยได้","ข":"ครูพิม สอนให้นักเรียนเขียนพยัญชนะ ก-ฮ ได้","ค":"ครูนนท์ สอนให้นักเรียนมีทักษะการเป็นผู้ฟังที่ดี","ง":"ครูโม สอนให้นักเรียนมีทักษะการคิดคำนวณได้"},"a":"ค","e":"ครูนนท์ สอนให้นักเรียนมีทักษะการเป็นผู้ฟังที่ดี"},{"id":5,"q":"ข้อใดเป็นเป้าหมายของการจัดการศึกษาเพื่อความยั่งยืน SDGs ภายในปี ค.ศ. 2030","opts":{"ก":"คนมีชีวิตที่มีสุขภาพดีและส่งเสริมความเป็นอยู่ที่ดีสำหรับทุกคนในทุกวัย","ข":"เสริมความเข้มแข็งให้แก่กลไกการดำเนินงานและฟื้นฟูหุ้นส่วนความร่วมมือระดับโลก","ค":"การศึกษาที่มีคุณภาพสร้างการศึกษาที่เท่าเทียมและทั่วถึง ส่งเสริมการเรียนรู้ตลอดชีวิตแก่ทุกคน","ง":"การศึกษาที่มีประสิทธิภาพและประสิทธิผลส่งเสริมการเรียนรู้จนถึงจบการศึกษาขั้นพื้นฐานทุกคน"},"a":"ค","e":"การศึกษาที่มีคุณภาพสร้างการศึกษาที่เท่าเทียมและทั่วถึง ส่งเสริมการเรียนรู้ตลอดชีวิตแก่ทุกคน"},{"id":6,"q":"แนวคิดเรื่อง ประชาคมโลก (Global Community) มีความเชื่อมโยงกับแนวคิดใดมากที่สุดในการพัฒนาผู้เรียนตามเป้าหมายการศึกษาสำหรับศตวรรษที่ 21","opts":{"ก":"การส่งเสริมให้ผู้เรียนตระหนักถึงความเชื่อมโยงของประเทศและผู้คนทั่วโลก ภายใต้กระแสโลกาภิวัตน์และการพัฒนาที่ยั่งยืน","ข":"การส่งเสริมการเรียนรู้ด้านอัตลักษณ์ของชาติและวัฒนธรรมท้องถิ่นเป็นสำคัญ","ค":"การจัดการเรียนรู้ที่มุ่งเน้นการแข่งขันทางเศรษฐกิจระหว่างประเทศเป็นหลัก","ง":"การปลูกฝังให้ผู้เรียนให้ความสำคัญกับความร่วมมือระหว่างประเทศและสังคมโลก ตามแนวคิดพลเมืองโลก"},"a":"ง","e":"การปลูกฝังให้ผู้เรียนให้ความสำคัญกับความร่วมมือระหว่างประเทศและสังคมโลก ตามแนวคิดพลเมืองโลก"},{"id":7,"q":"โรงเรียนขนาดกลางแห่งหนึ่งต้องการพัฒนาผู้เรียนให้เข้าใจแนวคิด Global Community โดยในปีที่ผ่านมาโรงเรียนจัดกิจกรรมให้นักเรียนศึกษาเรื่องประเทศต่าง ๆ และนำเสนอหน้าชั้นเรียน ผลการประเมินพบว่านักเรียนสามารถบอกข้อมูลเกี่ยวกับประเทศต่าง ๆ ได้มากขึ้น แต่ยังไม่สามารถอธิบายว่าปัญหาของชุมชนตนเองเกี่ยวข้องกับปัญหาระดับโลกอย่างไร คณะทำงานจึงเสนอแนวทางพัฒนาการจั","opts":{"ก":"ปรับกิจกรรมให้ผู้เรียนศึกษาปัญหาสำคัญของประเทศต่าง ๆ เปรียบเทียบกับบริบทของประเทศไทย และนำเสนอความสัมพันธ์ของปัญหาในระดับประเทศกับระดับโลก","ข":"เพิ่มกิจกรรมแลกเปลี่ยนเรียนรู้กับผู้เรียนต่างประเทศ โดยให้นักเรียนร่วมอภิปรายประเด็นทางสังคมและสิ่งแวดล้อม เพื่อสร้างความเข้าใจในมุมมองที่หลากหลาย","ค":"ออกแบบโครงงานที่ให้ผู้เรียนเลือกปัญหาจากชุมชน เชื่อมโยงกับปัญหาระดับโลก แลกเปลี่ยนมุมมองกับผู้เรียนต่างประเทศ วิเคราะห์ทางเลือก และร่วมกันออกแบบแนวทางแก้ปัญหาที","ง":"บูรณาการการศึกษาปัญหาระดับท้องถิ่นกับการแลกเปลี่ยนเรียนรู้ระหว่างประเทศ โดยให้ผู้เรียนวิเคราะห์ความเหมือนและความแตกต่างของปัญหา แล้วนำเสนอแนวทางที่เหมาะสมกับบริ"},"a":"ค","e":"ออกแบบโครงงานที่ให้ผู้เรียนเลือกปัญหาจากชุมชน เชื่อมโยงกับปัญหาระดับโลก แลกเปลี่ยนมุมมองกับผู้เรียนต่างประเทศ วิเคราะห์ทางเลือก และร่วมกันออกแบบแนวทางแก้ปัญหาที่สามารถนำกลับมาปรับใช้และพัฒนาต่อในบริบทของชุมชน"},{"id":8,"q":"[เศรษฐกิจพอเพียง] ครูศศิธร ได้รับมอบหมายให้พัฒนาโครงการ “โรงเรียนพอเพียง” โดยโรงเรียนมีงบประมาณจำกัด นักเรียนมีฐานะทางเศรษฐกิจแตกต่างกัน และผู้ปกครองบางส่วนกังวลว่าโครงการอาจเพิ่มภาระค่าใช้จ่ายให้แก่ครอบครัว หากครูศศิธรต้องออกแบบโครงการที่สอดคล้องกับปรัชญาของเศรษฐกิจพอเพียงและสามารถพัฒนาได้อย่างยั่งยืน ข้อใดเหมาะสมที่สุด","opts":{"ก":"จัดกิจกรรมออมเงินและบัญชีรายรับ–รายจ่ายให้นักเรียนทุกคน โดยกำหนดรูปแบบ และเป้าหมายเดียวกันทั้งโรงเรียน","ข":"จัดแปลงเกษตรเพื่อสร้างรายได้ให้โรงเรียน พร้อมให้นักเรียนมีส่วนร่วมในการผลิต และจำหน่ายผลผลิตเพื่อเป็นทุนหมุนเวียน","ค":"จัดการเรียนรู้จากปัญหาจริงของนักเรียน ให้แต่ละห้องวิเคราะห์ทรัพยากรและข้อจำกัดของตนเอง แล้วออกแบบกิจกรรมพอเพียงที่เหมาะกับบริบท โดยประเมินผลทั้งด้านเศรษฐกิจ สัง","ง":"จัดโครงการขนาดใหญ่โดยเชิญหน่วยงานภายนอกและชุมชนเข้ามาสนับสนุนงบประมาณ เพื่อให้โรงเรียนมีทรัพยากรเพียงพอและสามารถดำเนินกิจกรรมได้อย่างต่อเนื่อง"},"a":"ค","e":"พัฒนาระบบการผลิตให้สอดคล้องกับทรัพยากรและปริมาณน้ำ ลดความเสี่ยงจากการพึ่งพาผลผลิตชนิดเดียว ควบคู่กับการแปรรูปและสร้างตลาดหลายช่องทาง โดยกำหนดการลงทุนตามศักยภาพของสมาชิกและเตรียมแผนรองรับความผันผวน"},{"id":9,"q":"จากสภาวการณ์และบริบทแวดล้อมที่มีผลต่อการพัฒนาการศึกษาของประเทศ ทรัพยากรธรรมชาติเสื่อมสภาพ เกิดจากสาเหตุใด","opts":{"ก":"การขยายตัวของชุมชน","ข":"นโยบายของรัฐบาลด้านการศึกษา","ค":"การบริหารที่ล้มเหลว","ง":"การลงทุนด้านการศึกษา"},"a":"ก","e":"การขยายตัวของชุมชน"},{"id":10,"q":"ข้อใดไม่ใช่เทคโนโลยีในการจัดการเรียนการสอนในอนาคต","opts":{"ก":"Web Based Instruction (WBI)","ข":"Artificial Intelligence (AI) ปัญญาประดิษฐ์","ค":"Metaverse (จักรวาลนฤมิต)","ง":"Video-Assisted Learning (VAL) *(หมายเหตุ: ในต้นฉบับไม่มีข้อ 13 และ 14 เนื่องจากเว้นข้ามหัวข้อในการจัดพิมพ์ข้อสอบของส่วนบริบทโลกและสังคม)"},"a":"ก","e":"Web Based Instruction (WBI)"},{"id":11,"q":"ถุงพลาสติกที่ใช้ไปแล้วนำกลับมาใช้ซ้ำ เรียกว่าอย่างไร","opts":{"ก":"Reuse","ข":"retired","ค":"Reduce","ง":"Recycle"},"a":"ก","e":"Reuse"},{"id":12,"q":"Fake News หมายถึงข้อใด","opts":{"ก":"ข่าวสารที่นำเสนอข้อมูลจริงเพียงบางส่วน และใช้ถ้อยคำหรือภาพประกอบเพื่อชักจูงความเชื่อของประชาชน","ข":"ข่าวสารที่เป็นความคิดเห็นส่วนบุคคลและไม่มีแหล่งที่มาชัดเจน","ค":"ข่าวปลอมหรือข่าวสารที่ไม่มีความจริง ซึ่งถูกสร้างหรือเผยแพร่ขึ้นเพื่อให้เกิดความเข้าใจผิดในสังคม","ง":"ข่าวสารที่มีการตีความหรือวิเคราะห์เหตุการณ์จากข้อมูลที่ถูกต้อง"},"a":"ค","e":"ข่าวปลอมหรือข่าวสารที่ไม่มีความจริง ซึ่งถูกสร้างหรือเผยแพร่ขึ้นเพื่อให้เกิดความเข้าใจผิดในสังคม"},{"id":13,"q":"การใช้เทคโนโลยีในการจัดการเรียนรู้ของครู ควรมุ่งเน้นแนวทางใด","opts":{"ก":"ใช้เทคโนโลยีเป็นเครื่องมือสนับสนุนการจัดกิจกรรมการเรียนรู้ภายใต้การกำกับของครูเป็นหลัก","ข":"ใช้เทคโนโลยีเป็นสื่อในการนำเสนอเนื้อหา เพื่อช่วยให้ผู้เรียนเข้าใจบทเรียนได้ชัดเจนยิ่งขึ้น","ค":"ใช้เทคโนโลยีเพื่อเปิดโอกาสให้ผู้เรียนเข้าถึงแหล่งเรียนรู้ที่หลากหลายและเรียนรู้ได้อย่างต่อเนื่อง","ง":"ใช้เทคโนโลยีตามรูปแบบการจัดการเรียนรู้ของสถานศึกษา เพื่อให้การดำเนินงานเป็นไปในทิศทางเดียวกัน"},"a":"ค","e":"ใช้เทคโนโลยีเพื่อเปิดโอกาสให้ผู้เรียนเข้าถึงแหล่งเรียนรู้ที่หลากหลายและเรียนรู้ได้อย่างต่อเนื่อง"},{"id":14,"q":"ในช่วง 2–3 ปีที่ผ่านมา โรงเรียนบ้านหนองไผ่พบว่านักเรียนใช้โทรศัพท์มือถือและสื่อดิจิทัลในการค้นคว้าความรู้มากขึ้น นักเรียนสามารถเข้าถึงข้อมูลจากเว็บไซต์ วิดีโอ และแพลตฟอร์มออนไลน์ได้อย่างรวดเร็ว แต่ครูหลายคนพบปัญหาว่านักเรียนนำข้อมูลจากอินเทอร์เน็ตมาใช้โดยไม่ตรวจสอบความถูกต้อง และบางครั้งเชื่อข้อมูลเพียงเพราะมีผู้ติดตามหรือยอดเข้าชมจำนวนมาก ครูมณี ซ","opts":{"ก":"กำหนดรายชื่อเว็บไซต์ที่นักเรียนสามารถใช้ค้นข้อมูลได้ และให้นำเรียนใช้เฉพาะแหล่งข้อมูลที่โรงเรียนรับรอง","ข":"จัดการเรียนรู้เกี่ยวกับการค้นข้อมูลบนอินเทอร์เน็ต โดยให้ครูเป็นผู้แนะนำแหล่งข้อมูลที่มีความน่าเชื่อถือ","ค":"ให้นักเรียนค้นข้อมูลจากหลายแหล่ง เปรียบเทียบความน่าเชื่อถือ วิเคราะห์ความแตกต่าง และนำข้อมูลที่ผ่านการพิจารณาไปใช้สร้างผลงาน","ง":"จำกัดการใช้โทรศัพท์ในเวลาเรียน และให้นักเรียนศึกษาข้อมูลจากเอกสารที่ครูจัดเตรียมไว้เพื่อป้องกันการรับข้อมูลที่คลาดเคลื่อน"},"a":"ค","e":"ให้นักเรียนค้นข้อมูลจากหลายแหล่ง เปรียบเทียบความน่าเชื่อถือ วิเคราะห์ความแตกต่าง และนำข้อมูลที่ผ่านการพิจารณาไปใช้สร้างผลงาน"},{"id":15,"q":"โรงเรียนมัธยมแห่งหนึ่งพบว่านักเรียนเผชิญกับการเปลี่ยนแปลงที่รวดเร็ว ทั้งด้านเทคโนโลยี เศรษฐกิจ สังคม และรูปแบบการทำงาน ผู้บริหารจึงต้องการปรับการจัดการเรียนรู้ให้ผู้เรียนสามารถรับมือกับโลกที่มีลักษณะ เปราะบาง กังวล คาดเดายาก และเข้าใจยาก (BANI World) In ภาคเรียนที่ผ่านมา โรงเรียนทดลองใช้ 2 แนวทาง ได้แก่ การบรรยายเกี่ยวกับ BANI World และการจัดสถานกา","opts":{"ก":"ออกแบบกระบวนการเรียนรู้ใหม่โดยให้นักเรียนเผชิญปัญหาที่เปลี่ยนแปลงได้จริง วิเคราะห์ทางเลือก ทดลองแก้ปัญหา ประเมินผล และปรับวิธีการของตนเองเมื่อเงื่อนไขเปลี่ยนไป","ข":"เพิ่มจำนวนสถานการณ์จำลองให้หลากหลายขึ้น เพื่อให้นักเรียนได้ฝึกตัดสินใจในสถานการณ์ที่แตกต่างกัน","ค":"ผสมผสานการบรรยายกับสถานการณ์จำลอง และเพิ่มการสะท้อนผลหลังการเรียนรู้ เพื่อให้นักเรียนเข้าใจและปรับปรุงการตัดสินใจ","ง":"เพิ่มเนื้อหาเกี่ยวกับ BANI World ให้มากขึ้น เพื่อให้นักเรียนมีความรู้และเข้าใจบริบทของโลกมากกว่าเดิม"},"a":"ก","e":"ออกแบบกระบวนการเรียนรู้ใหม่โดยให้นักเรียนเผชิญปัญหาที่เปลี่ยนแปลงได้จริง วิเคราะห์ทางเลือก ทดลองแก้ปัญหา ประเมินผล และปรับวิธีการของตนเองเมื่อเงื่อนไขเปลี่ยนไป"},{"id":16,"q":"โรงเรียนแห่งหนึ่งเริ่มนำ AI และเทคโนโลยีดิจิทัล มาใช้ในการจัดการเรียนรู้ ครูพบว่า AI ช่วยลดเวลาในการเตรียมสื่อและแบบฝึกหัด ขณะที่นักเรียนมีความสนใจในการใช้เทคโนโลยีมากขึ้น อย่างไรก็ตาม จากการติดตามผลพบว่า นักเรียนบางส่วนใช้ AI เพื่อหาคำตอบทันทีโดยไม่ได้คิดวิเคราะห์ และนักเรียนบางส่วนมีข้อจำกัดด้านอุปกรณ์และอินเทอร์เน็ต ฝ่ายวิชาการจึงต้องการพัฒนาแนว","opts":{"ก":"กำหนดแนวทางให้ครูใช้ AI เป็นเครื่องมือช่วยออกแบบสื่อและกิจกรรม โดยเพิ่มเกณฑ์การประเมินที่เน้นกระบวนการคิดของผู้เรียน เพื่อป้องกันการพึ่งพา AI มากเกินไป","ข":"ประเมินผลการใช้เทคโนโลยีจากทั้งผลสัมฤทธิ์ พฤติกรรมการเรียนรู้ ความพร้อมของผู้เรียน และข้อจำกัดด้านการเข้าถึง แล้วออกแบบระบบการใช้เทคโนโลยีแบบยืดหยุ่น ที่เปิดให้","ค":"นำผลการทดลองใช้ AI และเทคโนโลยีต่าง ๆ มาเปรียบเทียบประสิทธิผล แล้วเลือกเทคโนโลยีที่เหมาะสมที่สุดสำหรับแต่ละระดับชั้น พร้อมกำหนดมาต"},"a":"ข","e":"ประเมินผลการใช้เทคโนโลยีจากทั้งผลสัมฤทธิ์ พฤติกรรมการเรียนรู้ ความพร้อมของผู้เรียน และข้อจำกัดด้านการเข้าถึง แล้วออกแบบระบบการใช้เทคโนโลยีแบบยืดหยุ่น ที่เปิดให้เลือกเครื่องมือและวิธีการตามวัตถุประสงค์ พร้อมกำหนดทางเลือกอื่นเมื่อผู้เรียนไม่สามารถเข้าถ"},{"id":17,"q":"โรงเรียนแห่งหนึ่งตั้งอยู่ในชุมชนที่กำลังเปลี่ยนแปลงอย่างรวดเร็ว ผู้ปกครองประกอบอาชีพหลากหลาย นักเรียนมีความพร้อมด้านเทคโนโลยีแตกต่างกัน และชุมชนกำลังเผชิญปัญหาสิ่งแวดล้อมและการเปลี่ยนแปลงสภาพภูมิอากาศ จากการประเมินหลักสูตรพบว่า ผู้เรียนมีความรู้ตามเนื้อหา แต่ยังไม่สามารถนำความรู้ไปใช้กับปัญหาจริงได้ ขณะเดียวกันการจัดการเรียนรู้ส่วนใหญ่ยังเน้นการถ่า","opts":{"ก":"ปรับหลักสูตรให้เชื่อมโยงโรงเรียน เทคโนโลยี และชุมชน โดยใช้ปัญหาสิ่งแวดล้อมเป็นฐาน ให้ผู้เรียนเลือกวิธีเรียนตามความพร้อม และปรับแนวทางจากผลการประเมิน","ข":"ปรับหลักสูตรให้เชื่อมโยงโรงเรียน เทคโนโลยี และชุมชน โดยใช้ปัญหาสิ่งแวดล้อมเป็นฐาน ให้ผู้เรียนเลือกกิจกรรมตามความสนใจ และนำเสนอผลการเรียนรู้","ค":"ปรับหลักสูตรให้เชื่อมโยงโรงเรียน เทคโนโลยี และชุมชน โดยใช้ปัญหาสิ่งแวดล้อมเป็นฐาน ให้ผู้เรียนเลือกวิธีเรียนตามความพร้อม และทดลองใช้แนวทางในชุมชน","ง":"ปรับหลักสูตรให้เชื่อมโยงโรงเรียน เทคโนโลยี และชุมชน โดยใช้ปัญหาสิ่งแวดล้อมเป็นฐาน ให้ผู้เรียนค้นคว้า วิเคราะห์ข้อมูล และนำเสนอผลการเรียนรู้"},"a":"ก","e":"ปรับหลักสูตรให้เชื่อมโยงโรงเรียน เทคโนโลยี และชุมชน โดยใช้ปัญหาสิ่งแวดล้อมเป็นฐาน ให้ผู้เรียนเลือกวิธีเรียนตามความพร้อม และปรับแนวทางจากผลการประเมิน"},{"id":18,"q":"\"มีความเอื้ออาทรต่อครอบครัวและชุมชนของตน มีความรู้ความเข้าใจที่มีต่อชาติบ้านเมือง\" เป็นพระบรมราโชบายด้านการศึกษาของ ร.10 ด้านใด (Level: L1-2)","opts":{"ก":"มีพื้นฐานชีวิตที่มั่นคง มีคุณธรรม","ข":"มีงานทำ มีอาชีพ","ค":"เป็นพลเมืองดี","ง":"มีทัศนคติที่ถูกต้องต่อบ้านเมือง"},"a":"ง","e":"มีทัศนคติที่ถูกต้องต่อบ้านเมือง"},{"id":19,"q":"โรงเรียนแห่งหนึ่งตั้งอยู่ในชุมชนที่ผู้ปกครองจำนวนมากประกอบอาชีพค้าขายและรับจ้าง นักเรียนบางส่วนต้องช่วยครอบครัวทำงานหลังเลิกเรียน ทำให้ไม่สามารถเข้าร่วมกิจกรรมเสริมหลังเลิกเรียนได้อย่างสม่ำเสมอ ในที่ประชุมคณะกรรมการสถานศึกษา ครูปรีชา เสนอว่าโรงเรียนควรเพิ่มกิจกรรมหลังเลิกเรียน เพื่อให้นักเรียนมีโอกาสเรียนรู้มากขึ้น ขณะที่ ครูรัตนา เห็นว่าปัญหาสำคัญ","opts":{"ก":"เพิ่มจำนวนกิจกรรมหลังเลิกเรียน และกำหนดให้นักเรียนเข้าร่วมอย่างน้อยสัปดาห์ละ 2 ครั้ง","ข":"ลดจำนวนเนื้อหาในหลักสูตร เพื่อให้นักเรียนสามารถเรียนจบได้ภายในเวลาเรียนปกติและไม่ต้องใช้เวลาเพิ่มเติม","ค":"จัดการเรียนรู้ที่เปิดโอกาสให้นักเรียนเลือกเรียนผ่านรูปแบบที่เหมาะสม ทั้งในระบบ นอกระบบ และตามอัธยาศัย พร้อมติดตามความก้าวหน้าเป็นรายบุคคล","ง":"บันทึกการสอนของครูไว้ให้นักเรียนดูย้อนหลัง โดยใช้เนื้อหาและกิจกรรมเดียวกันกับการเรียนในห้อง"},"a":"ค","e":"จัดการเรียนรู้ที่เปิดโอกาสให้นักเรียนเลือกเรียนผ่านรูปแบบที่เหมาะสม ทั้งในระบบ นอกระบบ และตามอัธยาศัย พร้อมติดตามความก้าวหน้าเป็นรายบุคคล"},{"id":20,"q":"จังหวัดแห่งหนึ่งประสบปัญหาฝนตกหนักและน้ำท่วมฉับพลันบ่อยครั้ง โรงเรียนต้องการให้ผู้เรียนเข้าใจว่าการเปลี่ยนแปลงสภาพภูมิอากาศส่งผลต่อชีวิ ,{"id":40,"q":"[เศรษฐกิจพอเพียง] ครูมีการเตรียมตัวให้พร้อมรับผลกระทบและการเปลี่ยนแปลงด้านต่าง ๆ ตรงกับหลักปรัชญาของเศรษฐกิจพอเพียง ตามข้อใด (Level: L1-2)","opts":{"ก":"มีความพอประมาณ","ข":"มีคุณธรรม","ค":"มีภูมิคุ้มกัน","ง":"มีเหตุผล"},"a":"ค","e":"ความยากจนและปัญหาเศรษฐกิจ"},{"id":41,"q":"[เศรษฐกิจพอเพียง] บทบาทของครูในการสอนเศรษฐกิจพอเพียง สอดคล้องกับข้อใดมากที่สุด (Level: L1-2)","opts":{"ก":"ครูสอนให้นักเรียนประหยัดอดออม อยู่ร่วมกับผู้อื่นในสังคมได้สงบสุข","ข":"ครูพานักเรียนไปทัศนศึกษาโรงเรียนต้นแบบเศรษฐกิจพอเพียงระดับจังหวัด","ค":"ครูสอนให้นักเรียนทำงานหลังเลิกเรียนเพื่อเก็บเงินไว้ซื้อสิ่งของที่อยากได้","ง":"ครูสอนให้นักเรียนเปลี่ยนหลอดไฟเป็นแบบหลอดประหยัดไฟฟ้า"},"a":"ก","e":"การพึ่งพาตัวเอง การเอาตัวรอด"},{"id":42,"q":"[เศรษฐกิจพอเพียง] ข้อใดเป็นเหตุผลที่ทำให้เด็กหลุดจากการศึกษามากที่สุด (Level: L1-2)","opts":{"ก":"ความหลากหลายของชาติพันธุ์นักเรียน","ข":"ความยากจนและปัญหาเศรษฐกิจ","ค":"ข้อมูลนักเรียนไม่เชื่อมโยงกันอย่างเป็นระบบ","ง":"นักเรียนมีอายุเกินเกณฑ์การศึกษาภาคบังคับ"},"a":"ข","e":"สอนให้นักเรียนตระหนักถึงการเปลี่ยนแปลง ใช้เหตุผลในการตัดสินใจ"},{"id":43,"q":"[เศรษฐกิจพอเพียง] ข้อใดเป็นการแสดงออกตามหลักปรัชญาเศรษฐกิจพอเพียง","opts":{"ก":"กล้าแสดงออก กล้าคิด กล้าลงมือทำ","ข":"การพึ่งพาตัวเอง การเอาตัวรอด","ค":"สามารถช่วยเหลือผู้อื่นได้อย่างเหมาะสม","ง":"ใช้เทคโนโลยีตามความเหมาะสม"},"a":"ข","e":"เศรษฐกิจ, วัฒนธรรม, สังคม, สิ่งแวดล้อม"},{"id":44,"q":"[เศรษฐกิจพอเพียง] บทบาทของครูในการสอนเรื่อง เศรษฐกิจพอเพียง ข้อใดเด่นชัดที่สุด","opts":{"ก":"พานักเรียนไปทัศนศึกษาโรงเรียนต้นแบบเศรษฐกิจพอเพียงระดับจังหวัด","ข":"สอนให้นักเรียนทำงานหลังเลิกเรียนเพื่อเก็บเงินไว้ซื้อสิ่งของที่อยากได้","ค":"สอนให้นักเรียนเปลี่ยนหลอดไฟธรรมดาเป็นแบบหลอดประหยัดไฟฟ้า","ง":"สอนให้นักเรียนตระหนักถึงการเปลี่ยนแปลง ใช้เหตุผลในการตัดสินใจ"},"a":"ง","e":"ครูสอนให้นักเรียนออมเงิน เพื่อวางแผนและเตรียมความพร้อมสำหรับอนาคต"},{"id":45,"q":"[เศรษฐกิจพอเพียง] สมดุล 4 มิติ ตามการจัดกิจกรรมตามหลักปรัชญาของเศรษฐกิจพอเพียง หมายถึงข้อใด","opts":{"ก":"เศรษฐกิจ, วัฒนธรรม, สังคม, สิ่งแวดล้อม","ข":"สังคม, คุณธรรม, เศรษฐกิจ, สิ่งแวดล้อม","ค":"เศรษฐกิจ, สังคม, สิ่งแวดล้อม, จริยธรรม","ง":"เศรษฐกิจ, ประเพณี, สิ่งแวดล้อม, สังคม"},"a":"ก","e":"การบันทึกรายรับรายจ่ายอย่างสม่ำเสมอ เพื่อใช้เป็นข้อมูลในการวางแผนการใช้จ่ายในชีวิตประจำวัน"},{"id":46,"q":"[เศรษฐกิจพอเพียง] ข้อใดเป็นการจัดกิจกรรมหรือการจัดการเรียนรู้ที่สอดคล้องกับหลักภูมิคุ้มกันตามปรัชญาของเศรษฐกิจพอเพียง","opts":{"ก":"ครูสอนให้นักเรียนออมเงิน เพื่อวางแผนและเตรียมความพร้อมสำหรับอนาคต","ข":"ครูพานักเรียนไปทัศนศึกษาโรงเรียนต้นแบบเศรษฐกิจพอเพียงระดับจังหวัด","ค":"ครูส่งเสริมให้นักเรียนใช้ทรัพยากรอย่างประหยัด และคำนึงถึงความพอประมาณในการดำรงชีวิต","ง":"ครูปลูกฝังให้นักเรียนมุ่งสร้างรายได้ให้สูงที่สุด เพื่อความมั่นคงทางเศรษฐกิจ"},"a":"ก","e":"การปลูกป่าและสร้างฝายชะลอนน้ำในชุมชน เพื่อฟื้นฟูทรัพยากรธรรมชาติ"},{"id":47,"q":"[เศรษฐกิจพอเพียง] ข้อใดเป็นการสอนนักเรียนโดยนำหลักปรัชญาของเศรษฐกิจพอเพียงมาประยุกต์ใช้ในการดำเนินชีวิตประจำวันได้อย่างเหมาะสม","opts":{"ก":"การมุ่งเพิ่มรายได้จากหลายช่องทาง เพื่อให้มีรายได้สูงขึ้นอย่างรวดเร็ว","ข":"การใช้จ่ายเงินตามความต้องการของตนเอง โดยคำนึงถึงความสะดวกสบายเป็นสำคัญ","ค":"การบันทึกรายรับรายจ่ายอย่างสม่ำเสมอ เพื่อใช้เป็นข้อมูลในการวางแผนการใช้จ่ายในชีวิตประจำวัน","ง":"การใช้ทรัพยากรและเงินทุนอย่างเต็มที่ เพื่อให้เกิดผลประโยชน์สูงสุดในระยะสั้น"},"a":"ค","e":"ครัวเรือนใช้ทรัพยากรที่มีอยู่ ปลูกพืชผักไว้บริโภค จัดการรายจ่าย และลดการพึ่งพาปัจจัยจากภายนอก"},{"id":48,"q":"[เศรษฐกิจพอเพียง] ข้อใดเป็นการนำปรัชญาของเศรษฐกิจพอเพียงมาประยุกต์ใช้ในการอนุรักษ์สิ่งแวดล้อมได้อย่างเหมาะสม","opts":{"ก":"การนำทรัพยากรธรรมชาติมาใช้เพื่อรองรับการขยายตัวของกิจกรรมทางเศรษฐกิจ","ข":"การใช้ทรัพยากรธรรมชาติอย่างเต็มศักยภาพ เพื่อให้เกิดประโยชน์ทางเศรษฐกิจสูงสุด","ค":"การพัฒนาโครงการด้านสิ่งแวดล้อมขนาดใหญ่ โดยมุ่งเนน้ผลสัมฤทธิ์ในระยะสั้น","ง":"การปลูกป่าและสร้างฝายชะลอนน้ำในชุมชน เพื่อฟื้นฟูทรัพยากรธรรมชาติ"},"a":"ง","e":"ให้นักเรียนวิเคราะห์รายรับ ต้นทุน และรายจ่ายของตนเอง แล้ววางแผนการใช้เงินโดยพิจารณาความจำเป็น ความสามารถในการรับภาระ และผลที่อาจเกิดขึ้นในอนาคต"},{"id":49,"q":"[เศรษฐกิจพอเพียง] ข้อใดสะท้อน ขั้นตอนของการพึ่งพาตนเอง ตามปรัชญาของเศรษฐกิจพอเพียงได้เหมาะสมที่สุด","opts":{"ก":"ครัวเรือนใช้ทรัพยากรที่มีอยู่ ปลูกพืชผักไว้บริโภค จัดการรายจ่าย และลดการพึ่งพาปัจจัยจากภายนอก","ข":"ชุมชนรวมกลุ่มกันวางแผนการผลิต แลกเปลี่ยนทรัพยากร และจำหน่ายผลผลิตในระดับท้องถิ่น","ค":"เครือข่ายชุมชนพัฒนาสินค้าแปรรูป เชื่อมโยงตลาดภายนอก และสร้างรายได้อย่างต่อเนื่อง","ง":"หน่วยงานและชุมชนร่วมกันดำเนินโครงการพัฒนา เพื่อยกระดับเศรษฐกิจและคุณภาพชีวิต"},"a":"ก","e":"วิเคราะห์ปริมาณน้ำ ต้นทุน ความต้องการของตลาด และชนิดพืช แล้วปรับสัดส่วนพื้นที่ให้เหมาะกับทรัพยากรและความเสี่ยงของโรงเรียน"},{"id":50,"q":"[เศรษฐกิจพอเพียง] ครูณัฐ สังเกตว่านักเรียนชั้นมัธยมศึกษาปีที่ 5 หลายคนมีรายได้จากการขายสินค้าออนไลน์ แต่ไม่สามารถแยกได้ว่าเงินส่วนใดเป็นต้นทุน กำไร หรือเงินที่สามารถนำไปใช้จ่ายได้ บางคนจึงนำเงินทั้งหมดไปซื้อสินค้าตามความต้องการ ขณะที่บางคนเก็บเงินทั้งหมดโดยไม่ยอมใช้จ่ายแม้เป็นสิ่งจำเป็น ครูณัฐจึงต้องการจัดกิจกรรมให้นักเรียนสามารถนำหลักปรัชญาของเศรษฐกิจพอเพียงมาใช้ใน","opts":{"ก":"ให้นักเรียนกำหนดจำนวนเงินสำหรับการใช้จ่ายในแต่ละเดือน โดยเน้นการลดรายจ่ายที่ไม่จำเป็นและเพิ่มเงินออมให้มากที่สุด","ข":"ให้นักเรียนวิเคราะห์รายรับ ต้นทุน และรายจ่ายของตนเอง แล้ววางแผนการใช้เงินโดยพิจารณาความจำเป็น ความสามารถในการรับภาระ และผลที่อาจเกิดขึ้นในอนาคต","ค":"ให้นักเรียนศึกษาหลักความพอประมาณ แล้วจัดทำบัญชีรายรับ–รายจ่ายเพื่อเปรียบเทียบพฤติกรรมการใช้เงินของตนเองกับเพื่อนในชั้นเรียน","ง":"ให้นักเรียนแบ่งรายได้ออกเป็นส่วน ๆ สำหรับใช้จ่าย ออมเงิน และลงทุน โดยกำหนดสัดส่วนเดียวกันทั้งชั้นเรียนเพื่อให้เกิดมาตรฐานในการบริหารรายได้"},"a":"ข","e":"ให้นักเรียนวิเคราะห์ความจำเป็น คุณภาพ ปริมาณ และผลกระทบของการใช้ทรัพยากร แล้วเลือกแนวทางที่เหมาะกับบริบทของตนเอง"},{"id":51,"q":"[เศรษฐกิจพอเพียง] ครูปาริชาติ รับผิดชอบโครงการแปลงเกษตรของโรงเรียน ซึ่งเดิมแบ่งพื้นที่เป็นแปลงผักจำนวนมากเพื่อสร้างรายได้ให้โรงเรียน แต่ในปีที่ผ่านมาเกิดปัญหาน้ำไม่เพียงพอในฤดูแล้ง ต้นทุนการผลิตสูงขึ้น และผลผลิตบางส่วนขายไม่ได้ตามเป้าหมาย นักเรียนจึงเสนอแนวทางต่างกัน ได้แก่ ลดพื้นที่ปลูกผัก เพิ่มพื้นที่กักเก็บน้ำ หรือเปลี่ยนไปปลูกพืชที่ใช้น้ำน้อย หากครูปาริชาติต้องก","opts":{"ก":"ลดพื้นที่ปลูกผักลงบางส่วน และเลือกปลูกพืชที่มีต้นทุนต่ำเพื่อควบคุมค่าใช้จ่ายของโรงเรียนให้ลดลง","ข":"เพิ่มพื้นที่กักเก็บน้ำและลดพื้นที่ปลูกพืชบางชนิด เพื่อให้โรงเรียนสามารถดำเนินโครงการต่อได้แม้เกิดภาวะขาดแคลนน้ำ","ค":"เปลี่ยนพื้นที่ส่วนใหญ่ไปปลูกพืชใช้น้ำน้อยที่มีตลาดรองรับ เพื่อให้โรงเรียนสามารถลดต้นทุนและสร้างรายได้อย่างต่อเนื่อง","ง":"วิเคราะห์ปริมาณน้ำ ต้นทุน ความต้องการของตลาด และชนิดพืช แล้วปรับสัดส่วนพื้นที่ให้เหมาะกับทรัพยากรและความเสี่ยงของโรงเรียน"},"a":"ง","e":"จัดการเรียนรู้จากปัญหาจริงของนักเรียน ให้แต่ละห้องวิเคราะห์ทรัพยากรและข้อจำกัดของตนเอง แล้วออกแบบกิจกรรมพอเพียงที่เหมาะกับบริบท โดยประเมินผลทั้งด้านเศรษฐกิจ สังคม และสิ่งแวดล้อม"},{"id":52,"q":"[เศรษฐกิจพอเพียง] ครูธนกร พบว่านักเรียนในห้องมีพฤติกรรมใช้ทรัพยากรแตกต่างกัน นักเรียนกลุ่มหนึ่งใช้กระดาษอย่างประหยัดและนำกระดาษใช้แล้วกลับมาใช้ซ้ำ กลุ่มหนึ่งพยายามลดค่าใช้จ่ายโดยไม่ซื้ออุปกรณ์การเรียนที่จำเป็น และอีกกลุ่มหนึ่งซื้ออุปกรณ์ราคาถูกจำนวนมากเพราะเห็นว่าคุ้มค่า แต่สุดท้ายมีของเหลือใช้จำนวนมาก ครูธนกรต้องการให้นักเรียนวิเคราะห์พฤติกรรมของตนเองและปรับเปลี่ยน","opts":{"ก":"ให้นักเรียนวิเคราะห์ความจำเป็น คุณภาพ ปริมาณ และผลกระทบของการใช้ทรัพยากร แล้วเลือกแนวทางที่เหมาะกับบริบทของตนเอง","ข":"ส่งเสริมให้นักเรียนทุกคนลดการใช้ทรัพยากรและลดค่าใช้จ่ายให้ได้มากที่สุด เพื่อสร้างนิสัยประหยัดและพึ่งพาตนเอง","ค":"ให้นักเรียนเปรียบเทียบค่าใช้จ่ายของตนเอง แล้วกำหนดเป้าหมายการประหยัดทรัพยากร โดยพิจารณาจากความจำเป็นเป็นสำคัญ","ง":"ให้นักเรียนเลือกใช้ทรัพยากรที่มีราคาต่ำและสามารถนำกลับมาใช้ซ้ำได้ เพื่อให้เกิดความคุ้มค่าและลดภาระค่าใช้จ่าย"},"a":"ก","e":"ให้นักเรียนวิเคราะห์ปัญหาธุรกิจของตนเอง ประเมินความเสี่ยงและทรัพยากรที่มี แล้วร่วมกันออกแบบรูปแบบธุรกิจที่มีเงินลงทุนเหมาะสม มีแผนรองรับความเสี่ยง และสามารถปรับเปลี่ยนตามสถานการณ์ได้"},{"id":53,"q":"[เศรษฐกิจพอเพียง] ครูวรากร พบว่านักเรียนในโรงเรียนมีความสนใจทำธุรกิจออนไลน์เพิ่มขึ้น แต่มีปัญหาหลายด้าน ได้แก่ การซื้อสินค้ามาสต็อกมากเกินไป การกู้เงินมาลงทุน การตั้งราคาที่ไม่คำนึงถึงต้นทุน และการใช้รายได้ทั้งหมดเพื่อซื้อสินค้าตามกระแส ครูวรากรจึงให้คณะนักเรียนเสนอรูปแบบการจัดการเรียนรู้เพื่อแก้ปัญหา หากครูวรากรต้องการให้การจัดการเรียนรู้สะท้อนทั้งการประยุกต์ใช้และ","opts":{"ก":"ให้นักเรียนเรียนรู้เรื่องการออม การประหยัด และการใช้จ่ายอย่างพอประมาณ พร้อมกำหนดกิจกรรมให้ทุกคนปฏิบัติตามรูปแบบเดียวกัน","ข":"ให้นักเรียนวิเคราะห์ปัญหาธุรกิจของตนเอง ประเมินความเสี่ยงและทรัพยากรที่มี แล้วร่วมกันออกแบบรูปแบบธุรกิจที่มีเงินลงทุนเหมาะสม มีแผนรองรับความเสี่ยง และสามารถปรับ","ค":"ให้นักเรียนทำบัญชีรายรับ–รายจ่ายและบัญชีต้นทุนของธุรกิจ จากนั้นประเมินผลกำไรและปรับพฤติกรรมการใช้จ่ายให้เหมาะสม","ง":"ให้นักเรียนศึกษาการบริหารธุรกิจขนาดเล็ก แล้วทดลองทำธุรกิจจริงโดยจำกัดเงินลงทุน เพื่อให้เกิดประสบการณ์และเรียนรู้จากผลการดำเนินงาน"},"a":"ข","e":""},{"id":54,"q":"[เศรษฐกิจพอเพียง] ครูมณีรัตน์ ได้รับมอบหมายให้ร่วมวางแผนพัฒนาเศรษฐกิจของชุมชนแห่งหนึ่ง ซึ่งสมาชิกส่วนใหญ่ประกอบอาชีพเกษตรกรรม โดยในช่วง 3 ปีที่ผ่านมา ชุมชนประสบปัญหาฝนทิ้งช่วง ราคาผลผลิตผันผวน และต้นทุนปัจจัยการผลิตสูงขึ้น ส่งผลให้หลายครัวเรือนมีหนี้สินเพิ่มขึ้น ขณะเดียวกันคนรุ่นใหม่ในชุมชนมีทักษะด้านการแปรรูปสินค้าและการตลาดออนไลน์ แต่ยังขาดประสบการณ์ในการวางแผนธุร","opts":{"ก":"ส่งเสริมให้สมาชิกเพิ่มการผลิตสินค้าที่มีแนวโน้มเป็นที่ต้องการของตลาด ควบคู่กับการพัฒนาช่องทางออนไลน์ โดยใช้ทรัพยากรที่มีอยู่เป็นหลัก และติดตามผลเพื่อปรับแผนการผ","ข":"ส่งเสริมการแปรรูปผลผลิตและการตลาดออนไลน์โดยให้คนรุ่นใหม่เป็นแกนนำ พร้อมสนับสนุนการรวมกลุ่มของสมาชิก เพื่อเพิ่มมูลค่าผลผลิต กระจายรายได้ และลดการพึ่งพาตลาดสินค้า","ค":"พัฒนาระบบการผลิตให้สอดคล้องกับทรัพยากรและปริมาณน้ำ ลดความเสี่ยงจากการพึ่งพาผลผลิตชนิดเดียว ควบคู่กับการแปรรูปและสร้างตลาดหลายช่องทาง โดยกำหนดการลงทุนตามศักยภาพข","ง":"ให้ชุมชนลดการผลิตที่มีความเสี่"},"a":"ค","e":""},{"id":55,"q":"“เด็กชายหนึ่ง ใช้จ่ายตามศักยภาพของตัวเอง โดยคำนึงถึงความคุ้มค่าอย่างละเอียดถี่ถ้วน” สอดคล้องหลักปรัชญาเศรษฐกิจพอเพียงข้อใดมากที่สุด","opts":{"ก":"ความพอประมาณ","ข":"มีคุณธรรม","ค":"มีภูมิคุ้มกัน","ง":"มีเหตุผล"},"a":"ง","e":"มีเหตุผล"},{"id":56,"q":"“ครูสวย เป็นครูบรรจุใหม่ เงินเดือน 15,800 บาท อยากได้รองเท้ายี่ห้อว้าวว้าว ราคา 200,000
