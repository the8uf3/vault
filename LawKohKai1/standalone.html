:"ค","exp":"วัตถุประสงค์และเหตุผลการประกาศใช้ พ.ร.บ. สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546 คือต้องการให้มีสภาวิชาชีพเพื่อกำหนดมาตรฐานวิชาชีพ ออก/เพิกถอนใบอนุญาต ตลอดจนพัฒนาและส่งเสริมวิชาชีพทางการศึกษา ส่วน \"องค์กรกลางบริหารงานบุคคลของข้าราชการครูฯ\" นั้น คือ คณะกรรมการข้าราชการครูและบุคลากรทางการศึกษา (ก.ค.ศ.) ซึ่งทำงานภายใต้ พ.ร.บ. ระเบียบข้าราชการครูฯ พ.ศ. 2547 ไม่ใช่บทบาทหน้าที่ของคุรุสภาตามกฎหมายนี้"},{"id":64,"q":"มหาวิทยาลัยแห่งหนึ่งเปิดรับ “อาจารย์ประจำมหาวิทยาลัยของรัฐ” และกำหนดว่าผู้สมัครต้องมีใบอนุญาตประกอบวิชาชีพทางการศึกษา โดยอ้างว่าอาจารย์มหาวิทยาลัยถือเป็นผู้ประกอบวิชาชีพทางการศึกษาตามกฎหมาย จากสถานการณ์ดังกล่าว ข้อใดกล่าวสอดคล้องตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546","opts":{"ก":"ถูกต้อง เพราะผู้สอนทุกระดับเป็นผู้ประกอบวิชาชีพทางการศึกษา","ข":"ถูกต้อง เพราะมหาวิทยาลัยเป็นสถานศึกษาของรัฐ","ค":"ไม่ถูกต้อง เพราะอาจารย์มหาวิทยาลัยของรัฐไม่อยู่ในนิยามตามกฎหมายนี้","ง":"ไม่ถูกต้อง เพราะเฉพาะครูเอกชนเท่านั้นที่ต้องมีใบอนุญาต"},"a":"ค","exp":"มาตรา 43 วรรคสอง (5) (หรือ (6) ในบางโครงสร้างสรุปย่อ) บัญญัติยกเว้นชัดเจนให้ \"คณาจารย์ ผู้บริหารสถานศึกษา และผู้บริหารการศึกษาในระดับอุดมศึกษาระดับปริญญาทั้งของรัฐและเอกชน\" ไม่ต้องอยู่ภายใต้กฎการบังคับมีใบอนุญาตประกอบวิชาชีพควบคุมของคุรุสภา ดังนั้น อาจารย์มหาวิทยาลัยของรัฐจึงได้รับการยกเว้นตามข้อยกเว้นทางกฎหมายโดยตรง"},{"id":65,"q":"โรงเรียนแห่งหนึ่งเชิญ “วิทยากรพิเศษ” มาสอนการทำสื่อดิจิทัลแก่ผู้เรียนสัปดาห์ละ 1 ครั้ง โดยโรงเรียนกำหนดให้วิทยากรต้องมีใบอนุญาตประกอบวิชาชีพทางการศึกษาเช่นเดียวกับครูประจำ จากสถานการณ์ดังกล่าว ข้อใดกล่าวสอดคล้องตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546","opts":{"ก":"ถูกต้อง เพราะผู้ที่ทำหน้าที่สอนทุกคนเป็นผู้ประกอบวิชาชีพทางการศึกษา","ข":"ถูกต้อง เพราะปฏิบัติงานในสถานศึกษา","ค":"ไม่ถูกต้อง เพราะวิทยากรพิเศษไม่ถือเป็นผู้ประกอบวิชาชีพทางการศึกษา","ง":"ไม่ถูกต้อง เพราะใบอนุญาตใช้เฉพาะโรงเรียนรัฐบาล"},"a":"ค","exp":"ตามมาตรา 43 วรรคสอง (1) บุคคลที่เข้ามาให้ความรู้แก่ผู้เรียนในสถานศึกษาเป็นครั้งคราวในฐานะ \"วิทยากรพิเศษทางการศึกษา\" ได้รับการยกเว้นไม่ต้องมีใบอนุญาตประกอบวิชาชีพควบคุมอย่างชัดเจน การที่โรงเรียนกำหนดให้วิทยากรพิเศษต้องมีใบอนุญาตฯ จึงเป็นการเข้าใจผิดและไม่สอดคล้องกับข้อยกเว้นตามตัวบทกฎหมาย"},{"id":66,"q":"โรงเรียนเอกชนแห่งหนึ่ง กำหนดให้ครูทุกคนต้องมีใบอนุญาตประกอบวิชาชีพครู โดยให้เหตุผลว่า “ครูโรงเรียนเอกชนถือเป็นผู้ประกอบวิชาชีพทางการศึกษาเช่นเดียวกับครูของรัฐ” จากสถานการณ์ดังกล่าว ข้อใดกล่าวสอดคล้องตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546","opts":{"ก":"ไม่ถูกต้อง เพราะครูเอกชนไม่ใช่ข้าราชการ จึงไม่ถือว่าเป็นผู้ประกอบวิชาชีพทางการศึกษา","ข":"ถูกต้อง เพราะครูโรงเรียนเอกชน เป็นผู้ประกอบวิชาชีพทางการศึกษาเช่นเดียวกับโรงเรียนของรัฐ","ค":"ไม่ถูกต้อง เพราะโรงเรียนเอกชนขึ้นกับกระทรวงแรงงาน เป็นผู้ประกอบวิชาชีพทางการศึกษา","ง":"ถูกต้อง เพราะครูโรงเรียนเอกชน ไม่ถือว่าเป็นผู้ประกอบวิชาชีพทางการศึกษา"},"a":"ข","exp":"ตามมาตรา 4 บทนิยามคำว่า \"ครู\" หมายความถึง บุคคลซึ่งประกอบวิชาชีพหลักทางด้านการเรียนการสอนและการส่งเสริมการเรียนรู้... ทั้งของรัฐและเอกชน ครูโรงเรียนเอกชนจึงจัดเป็นผู้ประกอบวิชาชีพควบคุมและจำต้องได้รับการออกใบอนุญาตประกอบวิชาชีพจากคุรุสภา เช่นเดียวกับข้าราชการครูหรือครูของรัฐทุกประการ"},{"id":67,"q":"สถาบันเสริมสวยแห่งหนึ่งเปิดสอนวิชาชีพทำผม โดยผู้สอนเรียกตนเองว่า “ครู” และต้องการขอใบอนุญาตประกอบวิชาชีพครูตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ.2546 หากพิจารณาตามตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546 ข้อใดกล่าวได้สอดคล้องที่สุด","opts":{"ก":"สามารถขอได้ เพราะมีหน้าที่สอนเช่นเดียวกับครูทั่วไป","ข":"สามารถขอได้ หากเปิดสอนเกนิ 1 ปี","ค":"ไม่ถือเป็นผู้ประกอบวิชาชีพทางการศึกษาตามกฎหมายนี้","ง":"ถือเป็นผู้ประกอบวิชาชีพทางการศึกษาทันทีเมื่อมีผู้เรียน"},"a":"ค","exp":"บทนิยาม \"วิชาชีพ\" และ \"ครู\" ภายใต้กฎหมายนี้จะครอบคลุมเฉพาะการเรียนการสอนและการทำงานในระดับปฐมวัย ขั้นพื้นฐาน และอุดมศึกษาที่ต่ำกว่าปริญญาเท่านั้น สถาบันเสริมสวยเปิดสอนหลักสูตรฝึกอาชีพเฉพาะทาง ไม่ได้เข้าลักษณะการจัดระบบการศึกษาปฐมวัยหรือขั้นพื้นฐาน ผู้สอนจึงไม่เข้าเงื่อนไขผู้ประกอบวิชาชีพทางการศึกษาที่คุรุสภารับรองหรือควบคุมตามกฎหมายนี้"},{"id":68,"q":"“Neung Future Academy” เปิดสอนติวสอบเข้ามหาวิทยาลัย โดยจดทะเบียนเป็นสถาบันกวดวิชาตามกฎหมายโรงเรียนเอกชน มีการจ้างผู้สอนจำนวนมาก และใช้คำว่า “ครู” ในการประชาสัมพันธ์ ผู้อำนวยการสถาบันมีความเห็นว่า ผู้สอนทุกคนในสถาบันต้องมีใบอนุญาตประกอบวิชาชีพครู เพราะถือว่าเป็น “สถานศึกษา” ตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546 จากสถานการณ์ดังกล่าว ข้อใดกล่าวสอดคล้องตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546","opts":{"ก":"ถูกต้อง เพราะสถาบันกวดวิชาเป็นสถานศึกษาตามกฎหมายดังกล่าว","ข":"ถูกต้อง เพราะผู้ทำหน้าที่สอนทุกแห่งต้องมีใบอนุญาตประกอบวิชาชีพครู","ค":"ไม่ถูกต้อง เพราะสถาบันกวดวิชาไม่เป็นสถานศึกษาตาม พ.ร.บ.สภาครูฯ","ง":"ไม่ถูกต้อง เพราะสถาบันกวดวิชาอยู่ภายใต้กระทรวงแรงงาน ไม่ใช่กระทรวงศึกษาธิการ"},"a":"ค","exp":"แม้สถาบันกวดวิชาจะจดทะเบียนเป็นโรงเรียนเอกชนนอกระบบตาม พ.ร.บ.โรงเรียนเอกชน แต่ตาม พ.ร.บ.สภาครูฯ นั้น \"วิชาชีพครูควบคุม\" จะควบคุมเฉพาะบุคคลผู้ปฏิบัติหน้าที่สอนเป็นหลักในสถานศึกษาปฐมวัย ขั้นพื้นฐาน และอุดมศึกษาต่ำกว่าปริญญา โรงเรียนกวดวิชาไม่ได้จัดการศึกษาในระดับดังกล่าว จึงไม่มีกฎหมายบังคับให้ผู้สอนต้องขึ้นทะเบียนใบอนุญาตประกอบวิชาชีพครูควบคุม"},{"id":69,"q":"โรงเรียนเอกชนแห่งหนึ่ง แต่งตั้งบุคคลที่ไม่มีใบอนุญาตประกอบวิชาชีพครูเข้าทำหน้าที่สอนประจำ โดยอ้างว่าโรงเรียนเอกชนไม่ใช่หน่วยงานของรัฐ จึงไม่อยู่ภายใต้ พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546 จากสถานการณ์ดังกล่าว ข้อใดกล่าวสอดคล้องตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546","opts":{"ก":"ถูกต้อง เพราะโรงเรียนเอกชนมีอิสระในการบริหารงาน","ข":"ถูกต้อง เพราะโรงเรียนเอกชนไม่เป็นสถานศึกษาตาม พ.ร.บ.สภาครูฯ","ค":"ไม่ถูกต้อง เพราะโรงเรียนเอกชนเป็นสถานศึกษาตาม พ.ร.บ.สภาครฯู","ง":"ไม่ถูกต้อง เพราะต้องรับความยินยอมจากผู้ปกครองนักเรียนก่อน"},"a":"ค","exp":"คำนิยาม \"สถานศึกษา\" ในมาตรา 4 ระบุชัดเจนว่ารวมถึงโรงเรียนของรัฐและของเอกชน ดังนั้นโรงเรียนเอกชนจึงจัดเป็นสถานศึกษาภายใต้ข้อบังคับของ พ.ร.บ.สภาครูฯ การแต่งตั้งบุคคลที่ไม่มีใบอนุญาตประกอบวิชาชีพครูเข้าปฏิบัติหน้าที่สอนประจำ จึงเป็นการกระทำที่ขัดต่อกฎหมายมาตรา 46 และได้รับโทษจำคุกตามมาตรา 79"},{"id":70,"q":"สำนักงานเขตพื้นที่การศึกษาแห่งหนึ่งจัดประชุมเรื่อง “วิชาชีพควบคุมทางการศึกษา” โดยมีผู้เข้าร่วม 4 กลุ่ม ได้แก่ ครู ผู้บริหารสถานศึกษา ผู้บริหารการศึกษา เจ้าหน้าที่ธุรการโรงเรียน วิทยากรกล่าวว่าทุกกลุ่มเป็น “วิชาชีพควบคุม” ตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546 ทั้งหมด จากสถานการณ์ดังกล่าว ข้อใดกล่าวสอดคล้องตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546","opts":{"ก":"ถูกต้องทั้งหมด เพราะทุกตำแหน่งในการศึกษาเป็นวิชาชีพควบคุม","ข":"ไม่ถูกต้อง เพราะมีเพียงครูเท่านั้นที่เป็นวิชาชีพควบคุม","ค":"ไม่ถูกต้อง เพราะเจ้าหน้าที่ธุรการไม่ใช่วิชาชีพควบคุม","ง":"ไม่ถูกต้อง เพราะผู้บริหารการศึกษาไม่ใช่วิชาชีพควบคุม"},"a":"ค","exp":"ตามมาตรา 43 ของ พ.ร.บ. บัญญัติให้วิชาชีพ ครู ผู้บริหารสถานศึกษา และผู้บริหารการศึกษา เป็นวิชาชีพควบคุม และศึกษานิเทศก์เป็นวิชาชีพควบคุมเพิ่มเติมตามกฎกระทรวง ส่วนตำแหน่ง \"เจ้าหน้าที่ธุรการ\" ไม่เคยมีข้อกำหนดให้เป็นวิชาชีพควบคุมแต่อย่างใด คำกล่าวของวิทยากรจึงคลาดเคลื่อนไปจากข้อเท็จจริงทางกฎหมาย"},{"id":71,"q":"นายสมชาย ต้องการดำรงตำแหน่งเป็นศึกษานิเทศก์ประจำสำนักงานเขตพื้นที่การศึกษา แต่ยังไม่ได้ดำเนินการขอใบอนุญาตประกอบวิชาชีพทางการศึกษา โดยให้เหตุผลว่า “ศึกษานิเทศก์ไม่ใช่วิชาชีพควบคุมโดยตรงในตัวบทกฎหมายหลัก” ข้อใดกล่าวสอดคล้องตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546","opts":{"ก":"นายสมชาย สามารถเป็นศึกษานิเทศก์ได้ เพราะศึกษานิเทศก์ไม่เกี่ยวกับการสอน","ข":"นายสมชาย สามารถเป็นศึกษานิเทศก์ได้ชั่วคราวจนกว่าจะครบ 5 ปี","ค":"นายสมชาย ไม่สามารถเป็นศึกษานิเทศก์ได้ เพราะไม่มีใบอนุญาตประกอบวิชาชีพทางการศึกษา","ง":"นายสมชาย ไม่สามารถเป็นศึกษานิเทศก์ได้ เพราะมีใบอนุญาตประกอบวิชาชีพทางการศึกษา"},"a":"ค","exp":"พ.ร.บ. สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546 มาตรา 43 วรรคสอง บัญญัติให้อำนาจในการกำหนดวิชาชีพควบคุมเพิ่มเติมในกฎกระทรวง ซึ่งปัจจุบันมีการประกาศกฎกระทรวงกำหนดให้วิชาชีพ \"ศึกษานิเทศก์\" (บุคลากรทางการศึกษาอื่น) เป็นวิชาชีพควบคุมที่ต้องได้รับใบอนุญาตประกอบวิชาชีพ ดังนั้นนายสมชายจึงไม่สามารถเข้าดำรงตำแหน่งได้หากปราศจากใบอนุญาตฯ"},{"id":72,"q":"ศูนย์การเรียนรู้ชุมชนแห่งหนึ่ง เปิดกิจกรรมส่งเสริมการอ่านและการเรียนรู้ตลอดชีวิตแก่ประชาชนทุกวัย โดยผู้ดำเนินกิจกรรมเป็น “ผู้จัดการศึกษาตามอัธยาศัย” เมื่อมีการตรวจสอบคุณสมบัติ มีผู้ร้องเรียนว่า บุคคลดังกล่าวไม่มีใบอนุญาตประกอบวิชาชีพทางการศึกษา จากสถานการณ์ดังกล่าว ข้อใดกล่าวสอดคล้องตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546","opts":{"ก":"ศูนย์การเรียนรู้ชุมชน ต้องมีใบอนุญาต เพราะทำหน้าที่จัดการศึกษา","ข":"ศูนย์การเรียนรู้ชุมชน ต้องมีใบอนุญาต เฉพาะกรณีได้รับงบประมาณจากรัฐ","ค":"ศูนย์การเรียนรู้ชุมชน ไม่ต้องมีใบอนุญาต เพราะได้รับการยกเว้นตามกฎหมาย","ง":"ศูนย์การเรียนรู้ชุมชน ไม่ต้องมีใบอนุญาต เฉพาะกรณีเป็นอาสาสมัครเท่านั้น"},"a":"ค","exp":"ตามมาตรา 43 วรรคสอง (3) (หรืออนุมาตรา (4) ตามกฎหมายเต็ม) กำหนดข้อยกเว้นการบังคับใช้มีใบอนุญาตประกอบวิชาชีพควบคุมแก่ \"ผู้ที่จัดการศึกษาตามอัธยาศัย\" ไว้อย่างชัดเจน การดำเนินกิจกรรมส่งเสริมการอ่านในศูนย์การเรียนรู้ชุมชนซึ่งเข้าลักษณะการศึกษาตามอัธยาศัย จึงได้รับการยกเว้นตามบทบัญญัติแห่งกฎหมาย"},{"id":73,"q":"วิทยาลัยอาชีวศึกษาเอกชนแห่งหนึ่งเปิดสอนระดับประกาศนียบัตรวิชาชีพ (ปวช.) และได้ว่าจ้าง นายธนา ซึ่งเป็นวิศวกรที่มีประสบการณ์ในโรงงานอุตสาหกรรม มาทำหน้าที่สอนรายวิชาช่างกลโรงงานเต็มเวลา โดยนายธนาไม่มีใบอนุญาตประกอบวิชาชีพครู ระหว่างการตรวจประเมินคุณภาพภายใน มีกรรมการบางคนเสนอว่าโรงเรียนกระทำผิดกฎหมาย จากสถานการณ์ดังกล่าว ข้อใดกล่าวสอดคล้องตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546","opts":{"ก":"โรงเรียนกระทำผิด เพราะผู้สอนระดับประกาศนียบัตรวิชาชีพ (ปวช.) ต้องมีใบอนุญาตประกอบวิชาชีพครู","ข":"โรงเรียนกระทำผิด เพราะผู้สอนระดับประกาศนียบัตรวิชาชีพ (ปวช.) วิทยาลัยอาชีวศึกษาเอกชน ไม่ต้องมีใบอนุญาตประกอบวิชาชีพครู ยกเว้นวิทยาลัยอาชีวศึกษาของรัฐต้องมีใบอนุญาตประกอบวิชาชีพครู","ค":"โรงเรียนไม่กระทำผิด เพราะครูผู้สอนระดับประกาศนียบัตรวิชาชีพ (ปวช.) ได้รับการยกเว้นใบอนุญาตประกอบวิชาชีพทางการศึกษา","ง":"โรงเรียนไม่กระทำผิด เพราะวิทยาลัยอาชีวศึกษาไม่ถือเป็นสถานศึกษาตามกฎหมาย"},"a":"ก","exp":"การเรียนการสอนระดับประกาศนียบัตรวิชาชีพ (ปวช.) ในวิทยาลัยอาชีวศึกษา (ทั้งรัฐและเอกชน) จัดเป็นการสอนระดับขั้นพื้นฐานและต่ำกว่าปริญญา ซึ่งวิชาชีพครูในสถานศึกษาระดับนี้เป็นวิชาชีพควบคุมตามมาตรา 43 วรรคหนึ่ง การที่วิทยาลัยจ้างนายธนามาสอนประจำเต็มเวลาโดยไม่ได้รับใบอนุญาตประกอบวิชาชีพครู (หรือหนังสืออนุญาตชั่วคราวจากคุรุสภา) จึงถือเป็นการละเมิดกฎหมาย"},{"id":74,"q":"โรงเรียนมัธยมแห่งหนึ่งเชิญผู้เชี่ยวชาญด้านปัญญาประดิษฐ์จากบริษัทเอกชนมาบรรยายพิเศษให้แก่นักเรียนชั้นมัธยมศึกษาปีที่ 6 เป็นเวลา 1 วัน โดยวิทยากรดังกล่าวไม่มีใบอนุญาตประกอบวิชาชีพทางการศึกษา หลังการจัดกิจกรรม มีครูบางคนตั้งข้อสังเกตว่าการให้บุคคลภายนอกเข้าสอนนักเรียนโดยไม่มีใบอนุญาต อาจขัดต่อ พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546 ข้อใดอธิบายสถานการณ์นี้สอดคล้องตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546","opts":{"ก":"ผิด ตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546 เพราะวิทยากรพิเศษต้องมีใบอนุญาตประกอบวิชาชีพทางการศึกษาเสมอ","ข":"ไม่ผิด ตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546 เพราะผู้ที่มาให้ความรู้ในการเรียนการสอนครั้งคราวได้รับการยกเว้นใบอนุญาต","ค":"ไม่ผิด ตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546 เฉพาะกรณีที่วิทยากรไม่ได้รับค่าตอบแทน","ง":"ผิด ตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546 เพราะผู้สอนนักเรียนทุกคนถือเป็นผู้ประกอบวิชาชีพครู"},"a":"ข","exp":"มาตรา 43 วรรคสอง (1) ของกฎหมาย ระบุข้อยกเว้นอย่างเป็นรูปธรรมชัดเจนว่า \"ผู้ที่เข้ามาให้ความรู้แก่ผู้เรียนในสถานศึกษาเป็นครั้งคราวในฐานะวิทยากรพิเศษทางการศึกษา\" ได้รับการยกเว้นไม่ต้องมีใบอนุญาตประกอบวิชาชีพครูควบคุม การเชิญผู้เชี่ยวชาญมาจัดกิจกรรมเพียง 1 วันจึงดำเนินตามข้อกฎหมายอย่างถูกต้องแล้ว"},{"id":75,"q":"โรงเรียนเอกชนแห่งหนึ่งแต่งตั้งนางสาวศิริพรให้ดำรงตำแหน่งผู้อำนวยการโรงเรียน โดยนางสาวศิริพรมีประสบการณ์ในการสอนและบริหารการศึกษาระดับมหาวิทยาลัยมากกว่า 15 ปี แต่ยังไม่มีใบอนุญาตประกอบวิชาชีพผู้บริหารสถานศึกษา จากสถานการณ์ดังกล่าว ข้อใดกล่าวสอดคล้องตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546","opts":{"ก":"สามารถปฏิบัติหน้าที่ได้ เพราะสามารถใช้ประสบการณ์ด้านการบริหารระดับมหาวิทยาลัยได้","ข":"สามารถปฏิบัติหน้าที่ได้ เพราะกฎหมายยกเว้นให้สำหรับสถานศึกษาเอกชน","ค":"ไม่สามารถปฏิบัติหน้าที่ได้ เพราะผู้บริหารสถานศึกษาต้องมีใบอนุญาตประกอบวิชาชีพทางการศึกษา","ง":"ไม่สามารถปฏิบัติหน้าที่ได้ เพราะโรงเรียนเอกชนไม่ใช่สถานศึกษาของรัฐตามกฎหมายนี้"},"a":"ค","exp":"แม้ว่าการเป็นผู้บริหารสถานศึกษาระดับอุดมศึกษา (ระดับปริญญา) จะได้รับการยกเว้นไม่ต้องมีใบอนุญาตฯ ตามมาตรา 43 วรรคสอง (5) แต่สำหรับผู้อำนวยการโรงเรียนซึ่งทำหน้าที่ผู้บริหารสถานศึกษาระดับขั้นพื้นฐาน จำต้องมีใบอนุญาตประกอบวิชาชีพผู้บริหารสถานศึกษาตามกฎหมายควบคุมวิชาชีพมาตรา 43 วรรคหนึ่ง ดังนั้นโรงเรียนเอกชนจึงไม่สามารถแต่งตั้งนางสาวศิริพรมารับตำแหน่งได้หากไม่มีใบอนุญาตฯ"},{"id":76,"q":"มหาวิทยาลัยแห่งหนึ่งส่งนักศึกษาคณะครุศาสตร์ออกฝึกประสบการณ์วิชาชีพครูในโรงเรียนเครือข่าย โดยให้นักศึกษารับผิดชอบการจัดการเรียนการสอนจริงภายใต้การดูแลของครูพี่เลี้ยง ผู้ปกครองบางส่วนร้องเรียนว่า นักศึกษายังไม่มีใบอนุญาตประกอบวิชาชีพทางการศึกษา จึงไม่ควรทำหน้าที่สอนนักเรียน จากสถานการณ์ดังกล่าว ข้อใดกล่าวสอดคล้องตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546","opts":{"ก":"นักศึกษาฝึกสอนกระทำผิด เพราะการสอนทุกกรณีต้องมีใบอนุญาตประกอบวิชาชีพครู","ข":"นักศึกษาฝึกสอนกระทำผิด เพราะสอนโดยมีใบอนุญาตประกอบวิชาชีพครู","ค":"นักศึกษาฝึกอบรมหรือฝึกสอนได้รับการยกเว้นใบอนุญาตประกอบวิชาชีพทางการศึกษา","ง":"นักศึกษาฝึกอบรมหรือฝึกสอนได้รับการยกเว้นเฉพาะการสอนบรรยายเท่านั้น"},"a":"ค","exp":"ตามมาตรา 43 วรรคสอง (2) (หรืออนุมาตรา (3) ตามตัวบทเต็ม) มีบทบัญญัติรองรับสิทธิ์และยกเว้นการบังคับมีใบอนุญาตประกอบวิชาชีพควบคุมให้แก่ \"นักเรียน นักศึกษา หรือผู้รับการฝึกอบรม... ซึ่งทำการฝึกหัดหรืออบรมในความควบคุมของผู้ประกอบวิชาชีพทางการศึกษา\" การออกฝึกสอนจริงภายใต้การควบคุมของครูพี่เลี้ยงจึงปฏิบัติได้ตามกฎหมาย"},{"id":77,"q":"ในการประชุมวางแผนพัฒนาการศึกษาระดับจังหวัด มีการแต่งตั้งข้าราชการรายหนึ่งให้ดำรงตำแหน่งผู้บริหารการศึกษาในหน่วยงานระดับเหนือเขตพื้นที่การศึกษา โดยบุคคลดังกล่าวยังไม่ได้รับใบอนุญาตประกอบวิชาชีพทางการศึกษา ผู้เข้าร่วมประชุมบางคนให้เหตุผลว่า ผู้บริหารระดับเหนือเขตพื้นที่การศึกษาขึ้นไปไม่จำเป็นต้องมีใบอนุญาต ขณะที่อีกฝ่ายเห็นว่าตำแหน่งดังกล่าวยังอยู่ในขอบเขตวิชาชีพควบคุม จากสถานการณ์ดังกล่าว ข้อใดกล่าวสอดคล้องตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546","opts":{"ก":"ไม่จำเป็นต้องมีใบอนุญาต เพราะผู้บริหารการศึกษาเหนือเขตพื้นที่การศึกษาไม่ต้องมีใบอนุญาตประกอบวิชาชีพทางการศึกษา","ข":"ไม่จำเป็นต้องมีใบอนุญาต เพราะไม่ได้ทำหน้าที่สอนในสถานศึกษา","ค":"ต้องมีใบอนุญาต เพราะผู้บริหารการศึกษาเหนือเขตพื้นที่การศึกษาต้องมีใบอนุญาตประกอบวิชาชีพทางการศึกษา","ง":"ต้องมีใบอนุญาต เพราะเป็นวิชาชีพควบคุมเฉพาะทางการศึกษา"},"a":"ก","exp":"มาตรา 43 วรรคสอง (6) (หรืออนุมาตรา (7) ในตัวบทดั้งเดิม) กำหนดข้อยกเว้นการมีใบอนุญาตประกอบวิชาชีพผู้บริหารการศึกษาไว้สำหรับ \"ผู้บริหารการศึกษาระดับเหนือเขตพื้นที่การศึกษา\" ไว้อย่างเด่นชัด ดังนั้น การแต่งตั้งบุคคลดังกล่าวในตำแหน่งระดับเหนือเขตพื้นที่การศึกษาจึงสามารถทำได้แม้ไม่มีใบอนุญาตประกอบวิชาชีพควบคุม"},{"id":78,"q":"ในเวทีเสวนาทางวิชาการเกี่ยวกับมาตรฐานวิชาชีพทางการศึกษา มีผู้กล่าวว่า “ผู้บริหารการศึกษาทุกตำแหน่งได้รับการยกเว้นใบอนุญาตประกอบวิชาชีพทางการศึกษา เพราะทำหน้าที่ด้านบริหารการศึกษา ไม่ได้ทำหน้าที่สอนหนังสือ” คำกล่าวดังกล่าวทำให้เกิดการถกเถียงอย่างกว้างขวางในที่ประชุม เนื่องจากบางตำแหน่งอาจอยู่ในข่ายวิชาชีพควบคุมตามกฎหมาย จากสถานการณ์ดังกล่าว ข้อใดกล่าวสอดคล้องตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546","opts":{"ก":"ถูกต้อง เพราะผู้บริหารการศึกษาไม่มีหน้าที่จัดการเรียนการสอนโดยตรง","ข":"ถูกต้อง เพราะใบอนุญาตใช้เฉพาะวิชาชีพครู","ค":"ไม่ถูกต้อง เพราะผู้บริหารการศึกษาบางตำแหน่งต้องมีใบอนุญาตประกอบวิชาชีพทางการศึกษา","ง":"ไม่ถูกต้อง เพราะผู้บริหารการศึกษาทุกตำแหน่งเป็นข้าราชการพลเรือนทั่วไป"},"a":"ค","exp":"ข้อยกเว้นที่ไม่ต้องมีใบอนุญาตประกอบวิชาชีพควบคุมกำหนดเฉพาะสำหรับ \"ผู้บริหารการศึกษาระดับเหนือเขตพื้นที่การศึกษา\" เท่านั้น แต่ในส่วนของ \"ผู้บริหารการศึกษาในระดับเขตพื้นที่การศึกษา\" (เช่น ผอ.และรอง ผอ.สำนักงานเขตพื้นที่การศึกษา) จัดเป็นวิชาชีพควบคุมตามกฎหมายมาตรา 43 วรรคหนึ่ง ที่จำต้องยื่นเรื่องสอบหรือขอขึ้นทะเบียนใบอนุญาตฯ ดังนั้นคำว่า \"ทุกตำแหน่ง\" จึงคลาดเคลื่อนและไม่ถูกต้องตามกฎหมาย"},{"id":79,"q":"ในการประชุมปฐมนิเทศครูบรรจุใหม่ วิทยากรกล่าวว่า “สภาครูและบุคลากรทางการศึกษา คือ หน่วยงานที่ใช้ชื่อว่า ‘คุรุสภา’ ซึ่งทำหน้าที่กำกับดูแลมาตรฐานวิชาชีพทางการศึกษา” ครูผู้เข้ารับการอบรมบางคนตั้งข้อสงสัยว่า คำว่า “สภาครูและบุคลากรทางการศึกษา” กับ “คุรุสภา” เป็นคนละหน่วยงานกันหรือไม่ เพราะชื่อเรียกแตกต่างกัน จากสถานการณ์ดังกล่าว ข้อใดกล่าวสอดคล้องตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546","opts":{"ก":"เป็นคนละหน่วยงาน โดยคุรุสภาเป็นหน่วยงานภายใต้กระทรวงศึกษาธิการ","ข":"เป็นคนละหน่วยงาน โดยสภาครูฯ มีหน้าที่เฉพาะด้านวิชาการ","ค":"เป็นหน่วยงานเดียวกัน เพราะสภาครูและบุคลากรทางการศึกษา หมายถึง คุรุสภา","ง":"เป็นหน่วยงานเดียวกัน เฉพาะกรณีที่เกี่ยวข้องกับใบอนุญาตประกอบวิชาชีพเท่านั้น"},"a":"ค","exp":"ตัวบทหลักของกฎหมายในมาตรา 7 บัญญัติข้อความไว้ว่า \"ให้มีสภาครูและบุคลากรทางการศึกษา เรียกว่า คุรุสภา...\" ดังนั้น ทั้งสองคำเรียกจึงหมายถึงองค์กรนิติบุคคลเดียวกัน โดย \"คุรุสภา\" เป็นชื่อที่บัญญัติให้เรียกอย่างเป็นทางการเพื่อสืบทอดประวัติศาสตร์ของสภาวิชาชีพครู"},{"id":80,"q":"ครูรายหนึ่งยื่นคำขอรับใบอนุญาตประกอบวิชาชีพครู และได้รับแจ้งว่าคณะกรรมการมาตรฐานวิชาชีพซึ่งเป็นผู้พิจารณาอนุมัติการออกใบอนุญาตดังกล่าว ต่อมามีผู้แสดงความคิดเห็นว่า อำนาจออกใบอนุญาตควรเป็นของรัฐมนตรีว่าการกระทรวงศึกษาธิการโดยตรง เนื่องจากเป็นเรื่องสำคัญเกี่ยวกับวิชาชีพครู จากสถานการณ์ดังกล่าว ข้อใดกล่าวสอดคล้องตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546","opts":{"ก":"ถูกต้อง เพราะรัฐมนตรีเป็นผู้กำกับดูแลการศึกษาโดยตรง","ข":"ถูกต้อง เพราะใบอนุญาตเป็นคำสั่งทางปกครองระดับกระทรวง","ค":"ไม่ถูกต้อง เพราะคณะกรรมการมาตรฐานวิชาชีพเป็นผู้ออกใบอนุญาตประกอบวิชาชีพ","ง":"ไม่ถูกต้อง เพราะสำนักงานเลขาธิการสภาการศึกษาเป็นผู้ออกใบอนุญาตโดยตรง"},"a":"ค","exp":"ตามบทบัญญัติมาตรา 25 (1) กำหนดอำนาจหน้าที่ไว้เป็นสัดส่วนชัดเจนว่า เป็นอำนาจเด็ดขาดของ คณะกรรมการมาตรฐานวิชาชีพ (กมว.) ในการ \"พิจารณาการออกใบอนุญาตให้แก่ผู้ประกอบวิชาชีพทางการศึกษา...\" แม้รัฐมนตรีจะมีฐานะเป็นผู้กำกับดูแลระดับสูงสุดและรักษาการตามกฎหมาย แต่ก็ไม่มีอำนาจตามกฎหมายในการอนุมัติใบอนุญาตด้วยตนเองเป็นกรณีรายคน"},{"id":81,"q":"ระหว่างการประชุมเชิงนโยบายด้านการพัฒนาวิชาชีพครู มีผู้บริหารรายหนึ่งกล่าวว่า “คุรุสภาทำหน้าที่เพียงออกใบอนุญาตประกอบวิชาชีพเท่านั้น ส่วนเรื่องมาตรฐานวิชาชีพและแผนพัฒนาวิชาชีพเป็นหน้าที่ของกระทรวงศึกษาธิการ” จากสถานการณ์ดังกล่าว ข้อใดกล่าวสอดคล้องตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546","opts":{"ก":"ค.ศ.","ข":"ถูกต้อง เพราะการกำหนดมาตรฐานวิชาชีพเป็นอำนาจของ","ค":"ไม่ถูกต้อง เพราะคุรุสภามีอำนาจทั้งออกและเพิกถอนใบอนุญาต กำหนดมาตรฐานวิชาชีพ และกำหนดนโยบายพัฒนาวิชาชีพ","ง":"ไม่ถูกต้อง เพราะคุรุสภามีหน้าที่เฉพาะจัดอบรมครูและบุคลากรทางการศึกษา"},"a":"ค","exp":"ตามมาตรา 8 และมาตรา 9 แห่งพระราชบัญญัติ กำหนดวัตถุประสงค์และขอบเขตอำนาจหน้าที่ของคุรุสภาให้ครอบคลุมการพัฒนาวิชาชีพและการควบคุมคุณภาพมาตรฐานอย่างรอบด้าน ได้แก่ กำหนดมาตรฐานวิชาชีพ, ควบคุมความประพฤติ, กำหนดนโยบายและแผนพัฒนาวิชาชีพ ตลอดจนออกและเพิกถอนใบอนุญาต คุรุสภาจึงไม่ได้ทำหน้าที่ในลักษณะเป็นเพียงเคาน์เตอร์ออกบัตรใบอนุญาตอย่างเดียวตามข้ออ้าง"},{"id":82,"q":"ครูคนหนึ่งถูกกล่าวหาว่าประพฤติผิดจรรยาบรรณวิชาชีพอย่างร้ายแรง จนมีการเสนอให้พักใช้ใบอนุญาตประกอบวิชาชีพ ขณะเดียวกัน มีผู้ตั้งข้อสังเกตว่า คุรุสภาไม่มีอำนาจเกี่ยวกับการพักใช้หรือเพิกถอนใบอนุญาต เพราะทำหน้าที่เพียงรับขึ้นทะเบียนผู้ประกอบวิชาชีพเท่านั้น จากสถานการณ์ดังกล่าว ข้อใดกล่าวสอดคล้องตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546","opts":{"ก":"ถูกต้อง เพราะการพักใช้ใบอนุญาตเป็นอำนาจของศาลปกครอง","ข":"ถูกต้อง เพราะคุรุสภามีหน้าที่เพียงเสนอความเห็นต่อกระทรวงศึกษาธิการ","ค":"ไม่ถูกต้อง เพราะคุรุสภามีอำนาจพิจารณาออก เพิกถอน และพักใช้ใบอนุญาตประกอบวิชาชีพ","ง":"ไม่ถูกต้อง เพราะอำนาจดังกล่าวเป็นของสำนักงานเลขาธิการคุรุสภาเท่านั้น"},"a":"ค","exp":"บทบัญญัติในมาตรา 8 (1) และมาตรา 9 (4) กำหนดให้คุรุสภามีวัตถุประสงค์และอำนาจชัดเจนในการ \"พักการใช้ใบอนุญาตหรือเพิกถอนใบอนุญาต\" เพื่อรักษาจริยธรรมของกลุ่มวิชาชีพชั้นสูง คุรุสภาจึงเป็นผู้ทรงสิทธิ์ในเรื่องดังกล่าวทางปกครองโดยตรงตามที่กฎหมายมอบหมายไว้"},{"id":83,"q":"มีผู้กล่าวว่า รัฐมนตรีว่าการกระทรวงศึกษาธิการทำหน้าที่เพียงกำกับดูแลทั่วไป และไม่ได้มีตำแหน่งเกี่ยวข้องกับคณะกรรมการคุรุสภาโดยตรงแต่อย่างใด จากข้อความดังกล่าว ข้อใดกล่าวสอดคล้องตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546","opts":{"ก":"รัฐมนตรีว่าการกระทรวงศึกษาธิการเป็นเลขานุการคณะกรรมการคุรุสภา","ข":"รัฐมนตรีว่าการกระทรวงศึกษาธิการเป็นประธานคณะกรรมการคุรุสภา","ค":"รัฐมนตรีว่าการกระทรวงศึกษาธิการเป็นประธานคณะกรรมการมาตรฐานวิชาชีพ","ง":"รัฐมนตรีว่าการกระทรวงศึกษาธิการไม่มีตำแหน่งในคุรุสภาโดยตรง"},"a":"ข","exp":"โครงสร้างคณะกรรมการคุรุสภาตามกฎหมายมาตรา 12 และสูตรสรุปโครงสร้างปัจจุบัน (ตามเกณฑ์ของข้อสอบและเนื้อหาติวเตอร์) บัญญัติให้ \"รัฐมนตรีว่าการกระทรวงศึกษาธิการ\" ดำรงตำแหน่งเป็น ประธานกรรมการคุรุสภา รัฐมนตรีจึงควบคุมทิศทางและการบริหารงานของบอร์ดคุรุสภาโดยตรง ไม่ใช่มีเพียงบทบาทเชิงพิธีการหรือการกำกับห่างๆ เท่านั้น"},{"id":84,"q":"ระหว่างการเสวนาเรื่อง “บทบาทของครู” มีผู้เข้าร่วมอภิปรายว่า คุรุสภาเป็นหน่วยงานที่กำหนดมาตรฐานตำแหน่งข้าราชการครูทั้งหมด เพื่อให้เชื่อมโยงกับมาตรฐานวิชาชีพ อย่างไรก็ตาม นักกฎหมายการศึกษาบางคนแย้งว่า อำนาจดังกล่าวไม่ใช่อำนาจหน้าที่ของคุรุสภาตามกฎหมาย จากสถานการณ์ดังกล่าว ข้อใดกล่าวสอดคล้องตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546","opts":{"ก":"ถูกต้อง เพราะคุรุสภามีอำนาจกำหนดตำแหน่งข้าราชการครูทุกประเภท","ข":"ถูกต้อง เพราะมาตรฐานตำแหน่งต้องสอดคล้องกับมาตรฐานวิชาชีพ","ค":"ไม่ถูกต้อง เพราะคุรุสภาไม่มีอำนาจหน้าที่กำหนดมาตรฐานตำแหน่งข้าราชการครู","ง":"ไม่ถูกต้อง เพราะอำนาจดังกล่าวเป็นของกระทรวงศึกษาธิการ"},"a":"ค","exp":"คุรุสภามีบทบาทด้านการออกข้อบังคับและควบคุม \"มาตรฐานวิชาชีพ\" (เช่น จรรยาบรรณวิชาชีพ, ความรู้และเกณฑ์การปฏิบัติงาน) แต่ไม่มีสิทธิ์เข้าไปยุ่งเกี่ยวกับการกำหนด \"มาตรฐานตำแหน่ง\" ของข้าราชการ ซึ่งเรื่องดังกล่าวเป็นกรอบอำนาจในการบริหารงานบุคคลของคณะกรรมการข้าราชการครูและบุคลากรทางการศึกษา (ก.ค.ศ.) เท่านั้น คำกล่าวอ้างในที่ประชุมจึงขัดแย้งกับตัวบทกฎหมาย"},{"id":85,"q":"ครูรายหนึ่งถูกคณะกรรมการมาตรฐานวิชาชีพสั่งพักใช้ใบอนุญาตประกอบวิชาชีพ และได้ยื่นอุทธรณ์คำสั่งดังกล่าวต่อคณะกรรมการคุรุสภา แต่มีผู้เห็นแย้งว่า คณะกรรมการคุรุสภาไม่มีอำนาจเกี่ยวข้องกับการอุทธรณ์ เพราะเป็นหน้าที่ของศาลปกครองเท่านั้น จากสถานการณ์ดังกล่าว ข้อใดกล่าวสอดคล้องตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546","opts":{"ก":"ถูกต้อง เพราะการอุทธรณ์คำสั่งทางปกครองต้องยื่นต่อศาลเท่านั้น","ข":"ถูกต้อง เพราะคณะกรรมการคุรุสภามีหน้าที่เพียงกำหนดนโยบายวิชาชีพ","ค":"ไม่ถูกต้อง เพราะคณะกรรมการคุรุสภามีอำนาจให้คำปรึกษาแก่คณะกรรมการมาตรฐานวิชาชีพ","ง":"ไม่ถูกต้อง เพราะอำนาจอุทธรณ์เป็นของคณะกรรมการคุรุสภา"},"a":"ง","exp":"ตามที่บัญญัติในมาตรา 20 (3) และมาตรา 55 แห่ง พ.ร.บ. สั่งให้ผู้ได้รับความเสียหายหรือผู้ถูกลงโทษทางปกครองโดยคำวินิจฉัยของ กมว. สามารถยื่นเรื่องอุทธรณ์เพื่อขอความยุติธรรมทางปกครองต่อ คณะกรรมการคุรุสภา ได้ภายใน 30 วันนับแต่วันได้รับหนังสือ คณะกรรมการคุรุสภาจึงเป็นผู้รับผิดชอบพิจารณาวินิจฉัยอุทธรณ์ตามกฎหมายนี้อย่างชัดเจน ก่อนที่ผู้ได้รับคำตัดสินจะนำคดีไปฟ้องร้องต่อศาลปกครองต่อไป"},{"id":86,"q":"โรงเรียนเอกชนแห่งหนึ่งซึ่งจัดการศึกษาขั้นพื้นฐาน ได้รับการตรวจติดตามจากหน่วยงานต้นสังกัด พบว่ามีครูผู้สอนบางรายยังไม่มีใบอนุญาตประกอบวิชาชีพทางการศึกษา โดยฝ่ายบริหารโรงเรียนชี้แจงว่า โรงเรียนเอกชนมีสิทธิบริหารบุคลากรได้อย่างอิสระ และไม่จำเป็นต้องใช้หลักเกณฑ์เดียวกับโรงเรียนของรัฐ คณะกรรมการตรวจติดตามจึงพิจารณาประเด็นดังกล่าว ตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546 จากสถานการณ์ดังกล่าว ข้อใดกล่าวสอดคล้องตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546","opts":{"ก":"โรงเรียนเอกชนไม่จำเป็นต้องใช้ครูที่มีใบอนุญาตประกอบวิชาชีพก็ได้","ข":"โรงเรียนเอกชน ได้รับการยกเว้นไม่ต้องมีใบอนุญาตเฉพาะผู้บริหารสถานศึกษา","ค":"ครูโรงเรียนเอกชนที่จัดการศึกษาขั้นพื้นฐาน ต้องมีใบอนุญาตประกอบวิชาชีพทางการศึกษา","ง":"ครูโรงเรียนเอกชนสามารถใช้ใบรับรองจากโรงเรียนแทนใบอนุญาตประกอบวิชาชีพได้"},"a":"ค","exp":"ตามความในมาตรา 43 วรรคหนึ่ง กำหนดให้วิชาชีพครูเป็นวิชาชีพควบคุมที่ผู้ปฏิบัติงานหลักต้องมีใบอนุญาต และตามนิยามคำว่า \"ครู\" ในมาตรา 4 ครอบคลุมผู้สอนในสถาบันปฐมวัย ขั้นพื้นฐาน และอุดมศึกษาต่ำกว่าปริญญา \"ทั้งของรัฐและของเอกชน\" สิทธิการบริหารงานบุคคลอย่างอิสระของโรงเรียนเอกชนไม่เคยตัดสิทธิ์รัฐธรรมนูญหรือข้อยกเว้นทาง พ.ร.บ. ฉบับนี้ออกไป โรงเรียนเอกชนจึงต้องใช้ครูที่มีใบอนุญาตฯ และมีความรับผิดชอบทางอาญาหากฝ่าฝืน"},{"id":87,"q":"มหาวิทยาลัยแห่งหนึ่งเปิดโรงเรียนสาธิตในสังกัด เพื่อจัดการศึกษาขั้นพื้นฐาน โดยมีผู้สอนบางคนยังไม่มีใบอนุญาตประกอบวิชาชีพทางการศึกษา เพราะเข้าใจว่าโรงเรียนสาธิตอยู่ภายใต้มหาวิทยาลัย จึงได้รับการยกเว้นตามกฎหมาย เมื่อมีการตรวจสอบจากหน่วยงานที่เกี่ยวข้อง จึงเกิดข้อถกเถียงเกี่ยวกับสถานะของครูในโรงเรียนสาธิต จากสถานการณ์ดังกล่าว ข้อใดกล่าวสอดคล้องตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546","opts":{"ก":"ครูโรงเรียนสาธิตมหาวิทยาลัยไม่จำเป็นต้องมีใบอนุญาตประกอบวิชาชีพ","ข":"ครูโรงเรียนสาธิตมหาวิทยาลัยกำหนดให้มีใบอนุญาตเฉพาะผู้สอนระดับมัธยมศึกษา","ค":"ครูโรงเรียนสาธิตมหาวิทยาลัยที่จัดการศึกษาขั้นพื้นฐาน ต้องมีใบอนุญาตประกอบวิชาชีพทางการศึกษา","ง":"ครูโรงเรียนสาธิตมหาวิทยาลัยได้รับการยกเว้นใบอนุญาตประกอบวิชาชีพทางการศึกษา เพราะเป็นหน่วยงานของมหาวิทยาลัย"},"a":"ค","exp":"แม้คณาจารย์ในมหาวิทยาลัยระดับปริญญาจะได้รับยกเว้นไม่ต้องมีใบอนุญาตตามมาตรา 43 วรรคสอง (5) แต่เจตนารมณ์วิชาชีพควบคุมของคุรุสภา มุ่งคุ้มครองผู้บริโภคหรือผู้เรียนในระดับปฐมวัยและขั้นพื้นฐาน โรงเรียนสาธิตเป็นสถานศึกษาที่จัดการศึกษาในระดับ \"ขั้นพื้นฐาน\" ครูผู้ปฏิบัติหน้าที่สอนหลักในโรงเรียนสาธิตจึงต้องอยู่ภายใต้กฎหมายวิชาชีพควบคุม จำต้องมีใบอนุญาตประกอบวิชาชีพครู และไม่ได้รับข้อยกเว้นในการสังกัดมหาวิทยาลัยแต่อย่างใด"},{"id":88,"q":"นายวรพลเคยต้องโทษจำคุกในคดีอาญา และพ้นโทษมาแล้วเป็นเวลา 5 ปี ต่อมาได้สำเร็จการศึกษาทางครุศาสตร์และมีความประสงค์จะสมัครเป็นครู พร้อมยื่นขอรับใบอนุญาตประกอบวิชาชีพทางการศึกษา ในการพิจารณาคุณสมบัติ มีผู้ตั้งข้อสังเกตว่า บุคคลที่เคยต้องโทษจำคุกจะไม่สามารถขอรับใบอนุญาตประกอบวิชาชีพได้ตลอดชีวิต จากสถานการณ์ดังกล่าว ข้อใดกล่าวสอดคล้องตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546","opts":{"ก":"บุคคลที่เคยต้องโทษจำคุกไม่สามารถขอรับใบอนุญาตได้","ข":"ผู้ที่พ้นการต้องโทษจำคุกมาแล้วไม่น้อยกว่า 5 ปี สามารถขอรับใบอนุญาตเป็นผู้ประกอบวิชาชีพควบคุม","ค":"ผู้ที่เคยต้องโทษจำคุกสามารถขอรับใบอนุญาตได้ทันทีหลังพ้นโทษ","ง":"บุคคลที่เคยต้องโทษจำคุกสามารถขอรับใบอนุญาตได้เฉพาะโรงเรียนเอกชน"},"a":"ข","exp":"ในทางการวิเคราะห์ข้อสอบและเปรียบเทียบคุณสมบัติ คุณสมบัติในการขอรับใบอนุญาตประกอบวิชาชีพตามมาตรา 44 (ข) (3) บัญญัติลักษณะต้องห้ามไว้คือ \"เคยต้องโทษจำคุกในคดีที่คุรุสภาเห็นว่าอาจนำมาซึ่งความเสื่อมเสียเกียรติศักดิ์แห่งวิชาชีพ\" ซึ่งจะแตกต่างจากลักษณะต้องห้ามการเป็นข้าราชการครูที่จะมีระยะเวลาพ้นโทษ \"5 ปี\" เป็นเกณฑ์คัดสรรคุณสมบัติข้ามผ่าน ดังนั้น หากวิเคราะห์สถานการณ์ตามตัวเลือกที่มี นายวรพลซึ่งพ้นโทษมาแล้ว 5 ปี จึงจัดเป็นบุคคลที่สามารถยื่นเรื่องเพื่อขอประเมินและขอรับใบอนุญาตประกอบวิชาชีพจากคุรุสภาได้ตามเงื่อนไขของข้อสอบ"},{"id":89,"q":"นางสาวอรทัย เป็นครูในโรงเรียนเอกชนแห่งหนึ่ง โดยใบอนุญาตประกอบวิชาชีพครูกำลังจะหมดอายุในอีก 4 เดือน แต่ยังไม่ได้ยื่นคำขอต่ออายุ เพราะเข้าใจว่าสามารถยื่นหลังใบอนุญาตหมดอายุได้ไม่เกิน 1 ปี ในช่วงเวลาเดียวกัน ผู้ปกครองนักเรียนรายหนึ่งร้องเรียนต่อคุรุสภาว่า นางสาวอรทัยมีพฤติกรรมไม่เหมาะสมต่อผู้เรียน ซึ่งเข้าข่ายผิดจรรยาบรรณวิชาชีพครู โดยเหตุการณ์ดังกล่าวเกิดขึ้นเมื่อประมาณ 10 เดือนก่อน และผู้ปกครองเพิ่งทราบข้อเท็จจริงจากคลิปวิดีโอที่เผยแพร่ในสื่อสังคมออนไลน์ จึงได้ยื่นเรื่องกล่าวหาต่อคุรุสภาเพื่อให้ตรวจสอบจรรยาบรรณวิชาชีพ ระหว่างการพิจารณา มีครูบางคนให้ข้อมูลว่า “มาตรฐานการปฏิบัติงาน” ไม่เกี่ยวข้องกับจรรยาบรรณวิชาชีพ และหากมีการพิจารณาความผิดเกี่ยวกับจรรยาบรรณ จะต้องเป็นอำนาจของกระทรวงศึกษาธิการโดยตรง ไม่ใช่คณะกรรมการมาตรฐานวิชาชีพ จากสถานการณ์ดังกล่าว ข้อใดกล่าวสอดคล้องตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546","opts":{"ก":"นางสาวอรทัยสามารถยื่นต่ออายุใบอนุญาตหลังหมดอายุได้โดยไม่มีเงื่อนไข และคณะกรรมการคุรุสภามีอำนาจพิจารณาความผิดเกี่ยวกับจรรยาบรรณวิชาชีพทางการศึกษา","ข":"ผู้ปกครองไม่มีสิทธิยื่นกล่าวหา เพราะผู้เสียหายโดยตรงต้องเป็นนักเรียนเท่านั้น และ คณะกรรมการมาตรฐานวิชาชีพไม่มีอำนาจพิจารณาจรรยาบรรณ แต่เป็นอำนาจของคณะกรรมการคุรุสภา","ค":"ผู้ปกครองมีสิทธิยื่นกล่าวหาได้ หากยื่นภายใน 1 ปีนับแต่วันที่ทราบเหตุแห่งการเสียหาย และ คณะกรรมการมาตรฐานวิชาชีพมีอำนาจพิจารณาความผิดเกี่ยวกับจรรยาบรรณวิชาชีพทางการศึกษา","ง":"การต่ออายุใบอนุญาตต้องยื่นภายใน 30 วันก่อนหมดอายุ และมาตรฐานวิชาชีพครูมีเพียง มาตรฐานความรู้กับมาตรฐานการสอนเท่านั้น"},"a":"ค","exp":"อายุความเรื่องจรรยาบรรณ: มาตรา 51 วรรคสาม ระบุว่าสิทธิการกล่าวหากล่าวโทษจะสิ้นสุดลงเมื่อพ้น 1 ปีนับแต่วันที่ผู้ได้รับความเสียหายหรือผู้กล่าวโทษ \"รู้เรื่องการประพฤติผิดและรู้ตัวผู้ประพฤติผิด\" ผู้ปกครองทราบเรื่องจากคลิปวิดีโอซึ่งเกิดขึ้นมา 10 เดือนแต่เพิ่งรู้ตัวผู้กระทำผิดจึงยังไม่เกิน 1 ปี และถือเป็นผู้ได้รับความเสียหายในฐานะผู้ปกครองตามมาตรา 51 วรรคหนึ่ง จึงมีสิทธิ์ยื่นกล่าวหาได้ อำนาจพิจารณาจรรยาบรรณ: เป็นของ คณะกรรมการมาตรฐานวิชาชีพ (กมว.) ตามมาตรา 25 (2) และมาตรา 54 ไม่ใช่อำนาจส่วนรวมของกระทรวงศึกษาธิการ (ข้อ ก. ผิดเพราะการต่ออายุล่าช้าต้องโดนค่าปรับและต้องยื่นล่วงหน้า 180 วัน ข้อ ง. ผิดเพราะการต่ออายุต้องยื่นภายใน 180 วันก่อนหมดอายุ และมาตรฐานวิชาชีพมี 3 ด้านไม่ใช่มีแค่ความรู้และประสบการณ์ )"},{"id":90,"q":"ในการประชุมคณะครูของโรงเรียนแห่งหนึ่ง มีการอภิปรายกรณีครูผู้หนึ่งถูกลงโทษจากการประพฤติผิดจรรยาบรรณวิชาชีพ โดยครูบางคนกล่าวว่า “การพักใช้ใบอนุญาตประกอบวิชาชีพถือเป็นโทษสูงสุดแล้ว เพราะทำให้ไม่สามารถปฏิบัติหน้าที่ได้” อย่างไรก็ตาม มีครูอาวุโสคนหนึ่งแย้งว่า ตามกฎหมายยังมีโทษที่ร้ายแรงกว่านั้น ซึ่งส่งผลต่อสถานการณ์เป็นผู้ประกอบวิชาชีพโดยตรง จากสถานการณ์ดังกล่าว ข้อใดกล่าวสอดคล้องตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546","opts":{"ก":"การพักใช้ใบอนุญาตเป็นโทษสูงสุดของผู้ประพฤติผิดจรรยาบรรณ","ข":"การเพิกถอนใบอนุญาตเป็นโทษสูงสุดของผู้ประพฤติผิดจรรยาบรรณ","ค":"การไล่ออกเป็นโทษสูงสุดของผู้ประพฤติผิดจรรยาบรรณ","ง":"การภาคทัณฑ์เป็นโทษสูงสุดของผู้ประพฤติผิดจรรยาบรรณ"},"a":"ข","exp":"ตามมาตรา 54 โทษทางจรรยาบรรณเรียงลำดับความร้ายแรงจากเบาไปหาหนัก ได้แก่ ตักเตือน, ภาคทัณฑ์, พักใช้ใบอนุญาต (ไม่เกิน 5 ปี) และสูงสุดคือ การเพิกถอนใบอนุญาต ซึ่งส่งผลต่อสถานการณ์ประกอบอาชีพถาวรและไม่สามารถยื่นคำขอรับใบอนุญาตใหม่ได้อีกจนกว่าจะพ้น 5 ปีนับแต่วันประกาศคำสั่ง"},{"id":91,"q":"ครูคนหนึ่งถูกสอบสวนเรื่องการใช้ถ้อยคำไม่เหมาะสมกับผู้เรียน แต่พฤติกรรมดังกล่าวไม่ได้ก่อให้เกิดความเสียหายร้ายแรง คณะกรรมการมาตรฐานวิชาชีพจึงพิจารณาโทษทางจรรยาบรรณวิชาชีพ “ตักเตือน” เพื่อให้ครูปรับปรุงพฤติกรรมโดยไม่กระทบต่อการประกอบวิชาชีพมากเกินไป จากสถานการณ์ดังกล่าว ข้อใดกล่าวได้สอดคล้อง ตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546","opts":{"ก":"กล่าวถูกต้อง เพราะตักเตือนไม่ถือเป็นโทษทางจรรยาบรรณ","ข":"กล่าวไม่ถูกต้อง เพราะตักเตือนเป็นโทษของผู้ประพฤติผิดจรรยาบรรณ","ค":"ถูกต้อง เพราะตักเตือนเป็นโทษของผู้ประพฤติผิดจรรยาบรรณ","ง":"ไม่ถูกต้อง เพราะตักเตือนไม่ใช่โทษของผู้ประพฤติผิดจรรยาบรรณ"},"a":"ค","exp":"ตามมาตรา 54 (2) บัญญัติให้โทษทางจรรยาบรรณวิชาชีพสถานแรกสุดต่อจากยกข้อกล่าวหาคือ \"ตักเตือน\" ดังนั้น ในกรณีที่กระทำความผิดเล็กน้อย การตักเตือนจึงเป็นสถานลงโทษทางกฎหมายที่ถูกต้องสอดคล้องกับอำนาจหน้าที่ของ กมว."},{"id":92,"q":"ในการพิจารณาความผิดของครูรายหนึ่ง คณะกรรมการมาตรฐานวิชาชีพเห็นว่า พฤติกรรมดังกล่าวยังไม่ร้ายแรงถึงขั้นพักใช้ใบอนุญาต แต่ควรมีการลงโทษ “ภาคทัณฑ์” เพื่อบันทึกความผิดไว้และย้ำเตือนไม่ให้กระทำซ้ำอีก จากสถานการณ์ดังกล่าว ข้อใดกล่าวได้สอดคล้อง ตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546","opts":{"ก":"ภาคทัณฑ์ไม่ใช่โทษทางจรรยาบรรณ","ข":"ภาคทัณฑ์ใช้เฉพาะข้าราชการพลเรือนทั่วไป","ค":"ภาคทัณฑ์เป็นโทษของผู้ประพฤติผิดจรรยาบรรณ","ง":"ภาคทัณฑ์เป็นโทษทางวินัยของข้าราชการครูเท่านั้น"},"a":"ค","exp":"ตามมาตรา 54 (3) บัญญัติกำหนดให้สถานโทษ \"ภาคทัณฑ์\" เป็นสถานโทษทางจรรยาบรรณวิชาชีพลำดับที่สามของพระราชบัญญัติ ซึ่ง กมว. มีสิทธิ์หยิบยกมาลงทัณฑ์ผู้กระทำผิดจรรยาบรรณวิชาชีพได้"},{"id":93,"q":"ครูรายหนึ่งถูกต้นสังกัดลงโทษ “ไล่ออก” จากราชการ เนื่องจากกระทำผิดวินัยร้ายแรง ทำให้มีผู้เข้าใจว่า การไล่ออกถือเป็นหนึ่งในโทษทางจรรยาบรรณตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546 ด้วย อย่างไรก็ตาม นักกฎหมายด้านการศึกษาชี้แจงว่า โทษทางวินัยกับโทษทางจรรยาบรรณเป็นคนละส่วนกันตามกฎหมาย จากสถานการณ์ดังกล่าว ข้อใดกล่าวสอดคล้องตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546","opts":{"ก":"ไล่ออกเป็นโทษทางจรรยาบรรณวิชาชีพครูตาม พ.ร.บ.สภาครฯู","ข":"ไล่ออกเป็นโทษสูงสุดทางจรรยาบรรณวิชาชีพครู","ค":"ไล่ออกไม่ใช่โทษทางจรรยาบรรณวิชาชีพครูตาม พ.ร.บ.สภาครฯู","ง":"ไล่ออกเป็นโทษที่คณะกรรมการมาตรฐานวิชาชีพกำหนดได้โดยตรง"},"a":"ค","exp":"โทษทางวินัยข้าราชการครูตาม พ.ร.บ.ระเบียบข้าราชการครูฯ (เช่น ภาคทัณฑ์, ตัดเงินเดือน, ลดเงินเดือน, ปลดออก, ไล่ออก) ทำงานแยกขาดจากโทษทางวิชาชีพควบคุมของคุรุสภา โทษทางจรรยาบรรณวิชาชีพมีเพียง 5 สถานเท่านั้น (ยก, ตัก, ภาค, พัก, เพิก) โทษ \"ไล่ออก\" จึงไม่ใช่โทษทางจรรยาบรรณวิชาชีพของคุรุสภาแต่อย่างใด"},{"id":94,"q":"นายสมบัติถูกเพิกถอนใบอนุญาตประกอบวิชาชีพครูจากกรณีประพฤติผิดจรรยาบรรณอย่างร้ายแรง ต่อมาหลังเวลาผ่านไป เขามีความประสงค์จะกลับเข้าสู่วิชาชีพครูอีกครั้ง จึงสอบถามเกี่ยวกับสิทธิในการยื่นขอรับใบอนุญาตใหม่ บางคนให้ข้อมูลว่า เมื่อถูกเพิกถอนใบอนุญาตแล้ว จะไม่สามารถกลับเข้าสู่วิชาชีพได้อีกตลอดชีวิต จากสถานการณ์ดังกล่าว ข้อใดกล่าวได้สอดคล้อง ตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546","opts":{"ก":"ผู้ถูกเพิกถอนใบอนุญาตไม่สามารถยื่นขอใหม่ได้อีก","ข":"หากถูกเพิกถอนใบอนุญาต สามารถยื่นขอใหม่ได้เมื่อพ้น 5 ปีนับแต่วันที่ถูกเพิกถอน","ค":"สามารถยื่นขอใหม่ได้ทันทีหลังถูกเพิกถอน","ง":"สามารถยื่นขอใหม่ได้เฉพาะกรณีได้รับอนุญาตจากรัฐมนตรีว่าการกระทรวงศึกษาธิการ"},"a":"ข","exp":"ตามบทบัญญัติในมาตรา 57 ระบุไว้อย่างชัดเจนว่า \"ผู้ได้รับใบอนุญาตซึ่งถูกสั่งเพิกถอนใบอนุญาตจะยื่นขออีกไม่ได้ จนกว่าจะพ้นห้าปีนับแต่วันที่ถูกสั่งเพิกถอน\" ดังนั้น จึงไม่ได้แปลว่าเขาไม่มีสิทธิ์ขอรับใบอนุญาตใหม่ตลอดชีวิต แต่ต้องเป็นไปตามเงื่อนไขที่พ้นระยะเวลา 5 ปีไปแล้ว"},{"id":95,"q":"ในการประชุมเชิงนโยบายด้านสวัสดิการครู มีการกล่าวถึงบทบาทของคณะกรรมการส่งเสริมสวัสดิการและสวัสดิภาพครูและบุคลากรทางการศึกษา (สกสค.) โดยผู้เข้าร่วมประชุมบางคนเข้าใจว่า หน่วยงานดังกล่าวมีหน้าที่เฉพาะการให้เงินกู้แก่ครูเท่านั้น และมีปลัดกระทรวงศึกษาธิการเป็นประธานกรรมการ อย่างไรก็ตาม ผู้เชี่ยวชาญด้านกฎหมายการศึกษาได้อธิบายว่า วัตถุประสงค์และโครงสร้างของ สกสค. มีขอบเขตกว้างกว่านั้นตามที่กฎหมายกำหนด จากข้อความดังกล่าว ข้อใดกล่าวได้สอดคล้อง ตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546","opts":{"ก":"สกสค. มีหน้าที่เฉพาะจัดสวัสดิการด้านการเงินแก่ครูโดยมีปลัดกระทรวงศึกษาธิการเป็นประธานกรรมการ","ข":"สกสค. มีวัตถุประสงค์ส่งเสริมสวัสดิภาพ ความมั่นคง และผดุงเกียรติของผู้ประกอบวิชาชีพทางการศึกษา โดยมีรัฐมนตรีว่าการกระทรวงศึกษาธิการเป็นประธานกรรมการ","ค":"สกสค. เป็นหน่วยงานภายใต้คุรุสภาที่มีหน้าที่ออกใบอนุญาตประกอบวิชาชีพ โดยมีรัฐมนตรีว่าการกระทรวงศึกษาธิการเป็นประธานกรรมการ","ง":"สกสค. มีหน้าที่เฉพาะช่วยเหลือข้าราชการครูที่เกษียณอายุราชการแล้ว โดยมีเลขาธิการ สกสค. เป็นประธานกรรมการ"},"a":"ข","exp":"ตามวัตถุประสงค์ในมาตรา 62 โครงสร้าง สกสค. มีขอบเขตการทำงานกว้างขวางเพื่อส่งเสริมสวัสดิการ, สวัสดิภาพ, ความมั่นคง และส่งเสริมความสามัคคีผดุงเกียรติแก่ผู้ประกอบวิชาชีพและผู้ปฏิบัติงานทางการศึกษาทั้งหมด และโครงสร้างบอร์ดปัจจุบัน (ตามสูตรสรุปการสอบและกฎหมายที่มีผลปฏิบัติ) กำหนดให้ \"รัฐมนตรีว่าการกระทรวงศึกษาธิการ\" ดำรงตำแหน่งเป็น ประธานกรรมการ สกสค. (ไม่ใช่ปลัด ศธ. เช่นบทบัญญัติดั้งเดิมในมาตรา 64 )"},{"id":96,"q":"โรงเรียนเอกชนแห่งหนึ่งขาดแคลนครูผู้สอนอย่างเร่งด่วน จึงว่าจ้างนายเอกซึ่งยังไม่ได้รับใบอนุญาตประกอบวิชาชีพครู ให้ทำหน้าที่สอนเต็มเวลาในระดับมัธยมศึกษา โดยฝ่ายบริหารโรงเรียนเห็นว่า หากผู้สอนมีความรู้ความสามารถก็สามารถสอนได้ แม้ยังไม่มีใบอนุญาตก็ตาม ต่อมามีการร้องเรียนไปยังหน่วยงานที่เกี่ยวข้องว่า การกระทำดังกล่าวอาจเข้าข่ายความผิดตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546 จากข้อความดังกล่าว ข้อใดกล่าวสอดคล้อง ตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546","opts":{"ก":"ผู้ประกอบวิชาชีพโดยไม่มีใบอนุญาต ไม่มีความผิดหากสถานศึกษายินยอม","ข":"ผู้ประกอบวิชาชีพโดยไม่มีใบอนุญาต ต้องระวางโทษจำคุกไม่เกิน 1 ปี ปรับไม่เกิน 2 หมื่นบาท หรือทั้งจำทั้งปรับ","ค":"ผู้ประกอบวิชาชีพโดยไม่มีใบอนุญาต มีโทษเพียงปรับทางปกครอง ต้องระวางโทษจำคุกไม่เกิน 3 ปี ปรับไม่เกิน 6 หมื่นบาท หรือทั้งจำทั้งปรับ","ง":"ความผิดดังกล่าวเป็นความรับผิดเฉพาะของสถานศึกษาเท่านั้น ต้องระวางโทษจำคุกไม่เกิน 1 ปี ปรับไม่เกิน 2 หมื่นบาท หรือทั้งจำทั้งปรับ"},"a":"ข","exp":"ตามบทกำหนดโทษในมาตรา 78 กำหนดโทษอาญาแก่บุคคลผู้ใดที่ฝ่าฝืนมาตรา 43 วรรคสาม (ประกอบวิชาชีพควบคุมครูโดยไม่ได้ใบอนุญาต) ต้องระวางโทษจำคุกไม่เกินหนึ่งปี หรือปรับไม่เกินสองหมื่นบาท หรือทั้งจำทั้งปรับ"},{"id":97,"q":"นายชัยวัฒน์ถูกคณะกรรมการมาตรฐานวิชาชีพมีคำสั่งพักใช้ใบอนุญาตประกอบวิชาชีพครูเป็นเวลา 2 ปี จากกรณีประพฤติผิดจรรยาบรรณวิชาชีพ แต่ยังคงแอบทำหน้าที่สอนหนังสือในโรงเรียนแห่งหนึ่งโดยอ้างว่า “ยังไม่ได้ถูกเพิกถอนใบอนุญาต” เมื่อมีการตรวจสอบ พบว่ามีการปฏิบัติหน้าที่ในช่วงเวลาที่ถูกพักใช้ใบอนุญาตจริง จึงเกิดข้อถกเถียงเกี่ยวกับบทกำหนดโทษตามกฎหมาย จากข้อความดังกล่าว ข้อใดกล่าวสอดคล้อง ตาม พ.ร.บ.สภาครูและบุคลากรทางการศึกษา พ.ศ. 2546","opts":{"ก":"ผู้ที่ประกอบวิชาชีพในระหว่างพักใช้ใบอนุญาต ไม่มีความผิดหากไม่ได้รับเงินเดือนจากรัฐ","ข":"ผู้ที่ประกอบวิชาชีพในระหว่างพักใช้ใบอนุญาต มีความผิดต้องระวางโทษจำคุกไม่เกิน 3 ปี ปรับไม่เกิน 3 หมื่นบาท หรือทั้งจำทั้งปรับ","ค":"ผู้ที่ประกอบวิชาชีพในระหว่างพักใช้ใบอนุญาต มีโทษต้องระวางโทษจำคุกไม่เกิน 1 ปี ปรับไม่เกิน 2 หมื่นบาท หรือทั้งจำทั้งปรับ","ง":"ผู้ที่ถูกพักใช้ใบอนุญาตยังสามารถสอนได้ หากได้รับอนุญาตจากผู้บริหารสถานศึกษา และคุรุสภา"},"a":"ข","exp":"มาตรา 79 บัญญัติโทษทางอาญาสำหรับผู้ที่ฝ่าฝืนมาตรา 56 (ห้ามผู้ได้รับใบอนุญาตซึ่งอยู่ในระหว่างถูกสั่งพักใช้ใบอนุญาตประกอ รศึกษา"},"a":"ก","exp":"ตามมาตรา 122 บัญญัติว่า กรณีข้าราชการครูถูกสั่งลงโทษวินัยอย่างร้ายแรง (ปลดออก, ไล่ออก) ให้ยื่นอุทธรณ์โดยตรงต่อ คณะกรรมการ ก.ค.ศ."},{"id":108,"q":"“กรณีไม่ได้บัญญัติให้มีสิทธิอุทธรณ์ หรือผู้ร้องทุกข์ได้มีสิทธิอุทธรณ์ตามระเบียบ","opts":{"ก":"7 วัน","ข":"15 วัน","ค":"30 วัน","ง":"90 วัน"},"a":"ง","exp":"ตามมาตรา 125 หากไม่มีกฎหมายรองรับสิทธิ์อุทธรณ์/ร้องทุกข์ในระเบียบปกติ ข้าราชการผู้นั้นมีสิทธิ์นำคดีไปยื่นฟ้องร้องต่อศาลปกครองได้ภายในระยะเวลา 90 วัน นับแต่วันที่ทราบคำวินิจฉัย"},{"id":109,"q":"สำนักงานเขตพื้นที่การศึกษาแห่งหนึ่งได้จัดประชุมเพื่อทำความเข้าใจเกี่ยวกับคำนิยามตาม พ.ร.บ.ระเบียบข้าราชการครูและบุคลากรทางการศึกษา พ.ศ. 2547 โดยมีการยกตัวอย่างบุคคลและหน่วยงานหลายประเภทเข้ามาพิจารณา เช่น แดงซึ่งเป็นครูโรงเรียนเอกชน, โรงเรียนกรุงเทพคริสเตียนวิทยาลัย, สถานพัฒนาเด็กปฐมวัยของรัฐ, และสำนักงานเขตพื้นที่การศึกษา รวมทั้งมีการอภิปรายถึงความหมายของ “บุคลากรทางการศึกษา” ว่าครอบคลุมเฉพาะครูผู้สอนหรือรวมถึงผู้บริหารและผู้สนับสนุนทางการศึกษาด้วย ต่อมาผู้เข้าประชุมเกิดข้อถกเถียงว่า บุคคลและหน่วยงานดังกล่าวสามารถตีความให้สอดคล้องกับคำนิยามตามกฎหมายได้ครบถ้วนหรือไม่ ข้อใดวิเคราะห์ความสอดคล้องของคำนิยามตามกฎหมายได้เหมาะสมที่สุด","opts":{"ก":"แดงเป็นครูโรงเรียนเอกชน จึงถือเป็นข้าราชการครูตามกฎหมาย และโรงเรียนเอกชนไม่ถือเป็นสถานศึกษาของรัฐ","ข":"โรงเรียนกรุงเทพคริสเตียนวิทยาลัย เป็นสถานศึกษาตาม พ.ร.บ. นี้ ส่วนสถานพัฒนาเด็กปฐมวัยของรัฐไม่ใช่สถานศึกษา","ค":"แดงไม่ใช่ข้าราชการครูเนื่องจากไม่ได้ปฏิบัติหน้าที่สอนในสถานศึกษาของรัฐ ส่วนสถานพัฒนาเด็กปฐมวัยของรัฐ และสำนักงานเขตพื้นที่การศึกษา ต่างเป็นสถานศึกษาและหน่วยงานการศึกษาตามลำดับตามมาตรา 4","ง":"บุคลากรทางการศึกษาครอบคลุมเฉพาะข้าราชการครูผู้สอนเท่านั้น ไม่รวมถึงผู้สนับสนุนการศึกษา"},"a":"ค","exp":"ตามบทนิยามมาตรา 4 แดงปฏิบัติงานในโรงเรียนเอกชนจึงไม่ใช่ข้าราชการครู (ซึ่งต้องสังกัดรัฐ), โรงเรียนเอกชนไม่เข้าเกณฑ์สถานศึกษาของรัฐใน พ.ร.บ. นี้, สถานพัฒนาเด็กปฐมวัยของรัฐเป็นสถานศึกษา, และสำนักงานเขตพื้นที่ฯ เป็นหน่วยงานการศึกษา ส่วนบุคลากรทางการศึกษานั้นหมายรวมถึงผู้บริหารและผู้สนับสนุนด้วย ไม่ใช่แค่ครูผู้สอน"},{"id":110,"q":"ข้อใดวิเคราะห์บทบาท อำนาจหน้าที่ และโครงสร้างของ","opts":{"ก":"ค.ศ.","ข":"ก.ค.ศ. มีหน้าที่เกี่ยวกับมาตรฐานตำแหน่ง วิทยฐานะ และสิทธิประโยชน์ของข้าราชการครู ส่วนการกำหนดหลักเกณฑ์การสอบแข่งขันเป็นอำนาจของคุรุสภา","ค":"ผู้ทรงคุณวุฒิที่รัฐมนตรีเลือกไม่ได้เป็นประธาน","ง":"เลขาธิการ","จ":"ไม่มีข้อใดกล่าวถูกต้อง"},"a":"ค","exp":"ตามมาตรา 7 ประธาน ก.ค.ศ. คือรัฐมนตรีว่าการกระทรวงศึกษาธิการโดยตำแหน่ง ส่วนเลขาธิการ ก.ค.ศ. มีฐานะเทียบเท่าอธิบดีและเป็นกรรมการและเลขานุการโดยตำแหน่ง การกำหนดหลักเกณฑ์การสอบแข่งขันเป็นอำนาจหน้าที่ของ ก.ค.ศ. ไม่ใช่คุรุสภา"},{"id":111,"q":"การอภิปรายเกี่ยวกับ \"อ.ก.ค.ศ. เขตพื้นที่การศึกษา\" แบ่งเนื้อหาออกเป็นตอนต่าง ๆ ดังนี้: ตอนที่ 1: วิทยากรกล่าวว่า “อ.ก.ค.ศ. เขตพื้นที่การศึกษา” มีจำนวน 265 คณะ และประธาน","opts":{"ก":"ตอนที่ 1 กล่าวผิด ตอนที่ 2 กล่าวผิด ตอนที่ 3 กล่าวผิด ตอนที่ 4 กล่าวถูก","ข":"ตอนที่ 1 กล่าวผิด ตอนที่ 2 กล่าวถูก ตอนที่ 3 กล่าวถูก ตอนที่ 4 กล่าวผิด","ค":"ตอนที่ 1 กล่าวถูก ตอนที่ 2 กล่าวผิด ตอนที่ 3 กล่าวถูก ตอนที่ 4 กล่าวผิด","ง":"ตอนที่ 1 กล่าวถูก ตอนที่ 2 กล่าวถูก ตอนที่ 3 กล่าวผิด ตอนที่ 4 กล่าวผิด","จ":"ไม่มีข้อใดวิเคราะห์ได้ถูกต้อง "},"a":"จ","exp":"ตอนที่ 1 กล่าวผิด: ปัจจุบัน อ.ก.ค.ศ. เขตพื้นที่การศึกษามีจำนวน 245 คณะ (สพป. 183 แห่ง และ สพม. 62 แห่ง) และประธานและอนุกรรมการได้รับการแต่งตั้งโดย \"รัฐมนตรีว่าการกระทรวงศึกษาธิการ\" ภายใต้ความเห็นชอบของ ก.ค.ศ. ไม่ใช่ประธาน ก.ค.ศ. เป็นผู้แต่งตั้งโดยตรง ตอนที่ 2 กล่าวถูก: ตามมาตรา 22 ประกอบมาตรา 13 กำหนดวาระดำรงตำแหน่งของอนุกรรมการ อ.ก.ค.ศ. ไว้คราวละ 4 ปี และดำรงตำแหน่งติดต่อกันได้ไม่เกิน 2 วาระ ตอนที่ 3 กล่าวผิด: อ.ก.ค.ศ. เขตพื้นที่การศึกษามีอำนาจอนุมัติและเห็นชอบการบรรจุและแต่งตั้ง การย้าย การดำเนินการทางวินัย และการเลื่อนวิทยฐานะของข้าราชการครูในเขตพื้นที่ (ไม่ใช่มีอำนาจเพียงแค่ให้คำปรึกษา) ตอนที่ 4 กล่าวผิด: หน้าที่พิจารณาและเสนอความดีความชอบของข้าราชการครูในโรงเรียนเป็นอำนาจหน้าที่ของ \"ผู้อำนวยการสถานศึกษา\" (ตามมาตรา 27) ไม่ใช่ \"ผู้อำนวยการสำนักงานเขตพื้นที่การศึกษา\" สรุปสถานการณ์: มีเพียงตอนที่ 2 เท่านั้นที่กล่าวถูก ส่วนตอนที่ 1, 3, 4 กล่าวผิดทั้งหมด ซึ่งไม่มีในตัวเลือก ก-ง ดังนั้นจึงตอบตัวเลือก จ. เป็นคำตอบที่ถูกต้องที่สุด"},{"id":112,"q":"การจัดประชุมเชิงปฏิบัติการเพื่อเตรียมความพร้อมสำหรับการบรรจุและแต่งตั้งข้าราชการครูรุ่นใหม่ แบ่งการอภิปรายออกเป็นหลายตอน ดังนี้: ตอนที่ 1: วิทยากรกล่าวว่า การดำเนินการตาม พ.ร.บ.ระเบียบข้าราชการครูและบุคลากรทางการศึกษา ให้เป็นไปตามหลักการบริหารกิจการบ้านเมืองที่ดี โดยยึดระบบคุณธรรม  ตอนที่ 2: วิทยากรกล่าวว่า ครูผู้ช่วย ลาคลอดบุตร สามารถนับวันลาดังกล่าวในการเตรียมความพร้อมและพัฒนาอย่างเข้มได้ไม่เกิน 90 วัน  ตอนที่ 3: วิทยากรกล่าวว่า ครูผู้ช่วยที่กระทำผิดวินัยอย่างร้ายแรงระหว่างเตรียมความพร้อม ให้ถือว่าผู้นั้นพ้นจากราชการและไม่มีสิทธิ์สมัครสอบแข่งขันอีก  ตอนที่ 4: วิทยากรกล่าวว่า การสอบแข่งขันเพื่อบรรจุแต่งตั้งครูผู้ช่วย สังกัด สพฐ. เป็นหน้าที่ของ อ.ก.ค.ศ. เขตพื้นที่การศึกษา ในการกำหนดหลักเกณฑ์และวิธีการสอบแข่งขัน  ตอนที่ 5: หัวหน้าส่วนราชการแห่งหนึ่งกล่าวว่า “ผู้ช่วยศาสตราจารย์” และ “อาจารย์” ของของรัฐ ถือเป็นตำแหน่งทางวิชาการเช่นเดียวกัน\n\nคำถาม: จากตอนที่ 1–5 ข้างต้น ข้อใดวิเคราะห์ได้ถูกต้องที่สุด","opts":{"ก":"ตอนที่ 1 กล่าวถูก ตอนที่ 2 กล่าวผิด ตอนที่ 3 กล่าวถูก ตอนที่ 4 กล่าวผิด ตอนที่ 5 กล่าวถูก","ข":"ตอนที่ 1 กล่าวผิด ตอนที่ 2 กล่าวถูก ตอนที่ 3 กล่าวผิด ตอนที่ 4 กล่าวถูก ตอนที่ 5 กล่าวผิด","ค":"ตอนที่ 1 กล่าวถูก ตอนที่ 2 กล่าวผิด ตอนที่ 3 กล่าวผิด ตอนที่ 4 กล่าวผิด ตอนที่ 5 กล่าวถูก","ง":"ตอนที่ 1 กล่าวผิด ตอนที่ 2 กล่าวผิด ตอนที่ 3 กล่าวถูก ตอนที่ 4 กล่าวผิด ตอนที่ 5 กล่าวผิด","จ":"ไม่มีข้อใดวิเคราะห์ได้ถูกต้อง"},"a":"จ","exp":"ตอนที่ 1 กล่าวถูก: สอดคล้องตามมาตรา 29 ที่บัญญัติให้ยึดหลักการบริหารกิจการบ้านเมืองที่ดี ระบบคุณธรรม และความเสมอภาค ตอนที่ 2 กล่าวถูก: ครูผู้ช่วยที่ลาคลอดบุตร ลาป่วย ลาตรวจเลือกทหาร สามารถนับวันลาดังกล่าวรวมในเวลาเตรียมความพร้อมได้อย่างเข้มได้ไม่เกิน 90 วัน ตอนที่ 3 กล่าวถูก: หากกระทำผิดวินัยร้ายแรงระหว่างเตรียมความพร้อม จะถูกสั่งลงโทษพ้นจากราชการทันทีและหมดสิทธิ์กลับเข้ารับราชการครู ตอนที่ 4 กล่าวผิด: การกำหนดหลักเกณฑ์และวิธีการสอบแข่งขันครูผู้ช่วยเป็นอำนาจหน้าที่ของ \"ก.ค.ศ.\" ส่วน อ.ก.ค.ศ. เขตพื้นที่การศึกษา มีหน้าที่ประกาศรับสมัครและดำเนินการจัดสอบตามเกณฑ์ที่ ก.ค.ศ. กำหนด ตอนที่ 5 กล่าวถูก: ผู้ช่วยศาสตราจารย์ และอาจารย์ จัดเป็นตำแหน่งผู้สอนทางวิชาการระดับปริญญาของรัฐตามมาตรา 38 และมาตรา 40"},{"id":113,"q":"การอบรมเกี่ยวกับการวิเคราะห์หน้าที่และอำนาจตามระเบียบข้าราชการครูฯ แบ่งออกเป็นตอนต่าง ๆ ดังนี้: ตอนที่ 1:","opts":{"ก":"ตอนที่ 1 กล่าวถูก ตอนที่ 2 กล่าวผิด ตอนที่ 3 กล่าวถูก ตอนที่ 4 กล่าวผิด","ข":"ตอนที่ 1 กล่าวผิด ตอนที่ 2 กล่าวถูก ตอนที่ 3 กล่าวผิด ตอนที่ 4 กล่าวถูก","ค":"ตอนที่ 1 กล่าวถูก ตอนที่ 2 กล่าวถูก ตอนที่ 3 กล่าวผิด ตอนที่ 4 กล่าวถูก","ง":"ตอนที่ 1 กล่าวผิด ตอนที่ 2 กล่าวผิด ตอนที่ 3 กล่าวถูก ตอนที่ 4 กล่าวถูก","จ":"ไม่มีข้อใดวิเคราะห์ได้ถูกต้อง "},"a":"ก","exp":"ตอนที่ 1 กล่าวถูก: ก.ค.ศ. มีอำนาจจัดทำมาตรฐานตำแหน่งครูผู้ช่วย และถือเป็นผู้สอนในหน่วยงานของรัฐตามมาตรา 38 ก. และมาตรา 42 ตอนที่ 2 กล่าวผิด: \"รองศาสตราจารย์\" จัดเป็นตำแหน่งทางวิชาการของผู้สอนระดับอุดมศึกษาปริญญาของรัฐตามมาตรา 38 และมาตรา 40 ตอนที่ 3 กล่าวถูก: ศึกษานิเทศก์จัดเป็นตำแหน่งประเภท ค. \"บุคลากรทางการศึกษาอื่น\" ซึ่งมีบทบาทสนับสนุน นิเทศ ติดตาม และพัฒนาการศึกษา ไม่ใช่ตำแหน่งผู้สอนโดยตรง ตอนที่ 4 กล่าวผิด: อำนาจสั่งบรรจุแต่งตั้งครูผู้ช่วยเป็นของผู้อำนวยการสถานศึกษาจริง แต่ต้องผ่านความเห็นชอบของ \"อ.ก.ค.ศ. เขตพื้นที่การศึกษา\" (ไม่ใช่คณะกรรมการสถานศึกษาขั้นพื้นฐาน) และการประเมินเตรียมความพร้อมต้องดำเนินการเป็นเวลา \"2 ปี\" ไม่ใช่ 1 ปี"},{"id":114,"q":"ตาม พ.ร.บ.ระเบียบข้าราชการครูและบุคลากรทางการศึกษา พ.ศ. 2547 และที่แก้ไขเพิ่มเติม ข้อใดเป็นสถานการณ์ที่สอดคล้องกับหลักเกณฑ์การเลื่อนเงินเดือนมากที่สุด","opts":{"ก":"ครู ก มีผลงานวิจัยจำนวนมาก แม้ไม่ถูกนำไปใช้ในสถานศึกษา แต่ได้รับการเลื่อนเงินเดือนเพราะมีผลงานตีพิมพ์ระดับชาติ","ข":"ครู ข มีผลการสอนที่ทำให้ผลสัมฤทธิ์ของผู้เรียนสูงขึ้น และพัฒนาระบบดูแลช่วยเหลือนักเรียนจนเกิดประโยชน์ต่อโรงเรียน","ค":"ครู ค ได้รับการเลื่อนเงินเดือน เนื่องจากมีอายุราชการมากกว่าครูคนอื่นในกลุ่มสาระเดียวกัน","ง":"ครู ง ได้รับการเลื่อนเงินเดือนเพราะได้รับความนิยมจากผู้ปกครอง แม้ผลการปฏิบัติงานไม่ผ่านเกณฑ์ประเมินก็ตาม","จ":"ไม่มีข้อใดวิเคราะห์ได้สอดคล้อง "},"a":"ข","exp":"พระราชบัญญัติมาตรา 73 กำหนดไว้อย่างชัดแจ้งว่า การพิจารณาเลื่อนเงินเดือนข้าราชการครูและบุคลากรทางการศึกษา จะต้องคำนึงถึง \"ผลการปฏิบัติงานที่เป็นประโยชน์ต่อผู้เรียนเป็นหลัก\" ตามแนวทางการจัดการศึกษาแห่งชาติ การที่ครู ข ทำผลงานเพิ่มสัมฤทธิผลและช่วยเหลือดูแลนักเรียนจึงสอดคล้องกับเจตนารมณ์ของกฎหมายสูงสุด"},{"id":115,"q":"โรงเรียนสังกัด สพป. แห่งหนึ่ง กำลังดำเนินการพิจารณาเลื่อนเงินเดือนประจำปี ผู้อำนวยการโรงเรียนจึงแต่งตั้งคณะกรรมการขึ้นเพื่อประเมินผลการปฏิบัติงานของครูในสถานศึกษา การดำเนินการดังกล่าวสอดคล้องตาม พ.ร.บ.ระเบียบข้าราชการครูและบุคลากรทางการศึกษา พ.ศ. 2547 และที่แก้ไขเพิ่มเติม ได้ถูกต้องที่สุด","opts":{"ก":"ผู้อำนวยการโรงเรียนมีอำนาจแต่งตั้งคณะกรรมการเลื่อนเงินเดือนในโรงเรียน","ข":"คณะกรรมการสถานศึกษาขั้นพื้นฐานเป็นผู้มีอำนาจแต่งตั้งคณะกรรมการเลื่อนเงินเดือน"},"a":"ก","exp":"ตามมาตรา 73 กำหนดว่าการเลื่อนเงินเดือนให้ \"ผู้บังคับบัญชา\" (ในที่นี้คือ ผู้อำนวยการสถานศึกษา) แต่งตั้งคณะกรรมการ (ไม่น้อยกว่า 3 คน) ขึ้นพิจารณาผลการปฏิบัติงานของข้าราชการครูในหน่วยงานนั้น"},{"id":116,"q":"ครูสมหมาย ถูกดำเนินการทางวินัยจากการละทิ้งหน้าที่ราชการเป็นเวลานานโดยไม่มีเหตุอันสมควร เมื่อพิจารณาหลักเกณฑ์เกี่ยวกับวินัยข้าราชการครู ข้อใดถูกต้องที่สุด","opts":{"ก":"วินัยของข้าราชการครูกำหนดไว้เฉพาะในกฎกระทรวงศึกษาธิการเท่านั้น","ข":"หลักเกณฑ์ด้านวินัยของข้าราชการครูมีที่มาจาก พ.ร.บ.ระเบียบข้าราชการครูและบุคลากรทางการศึกษา","ค":"เรื่องวินัยของข้าราชการครูเป็นอำนาจของแต่ละโรงเรียนกำหนดขึ้นเองโดยอิสระ","ง":"วินัยของข้าราชการครูถูกกำหนดไว้ในระเบียบสำนักนายกรัฐมนตรีเพียงฉบับเดียว","จ":"ไม่มีข้อใดวิเคราะห์ได้ถูกต้อง "},"a":"ข","exp":"ข้อห้ามและข้อปฏิบัติต่าง ๆ ด้านวินัยและการรักษาวินัยของข้าราชการครู บัญญัติไว้อย่างมีสถานะทางกฎหมายโดยตรงในหมวด 6 มาตรา 82 ถึงมาตรา 95 ของพระราชบัญญัตินี้ ซึ่งเป็นมาตรฐานหลักเกณฑ์ที่ประกาศใช้ระดับชาติ"},{"id":117,"q":"ครู ก ไม่มาปฏิบัติราชการติดต่อกันหลายวันโดยไม่แจ้งเหตุผลต่อผู้บังคับบัญชา ขณะที่ครู ข มาปฏิบัติราชการทุกวัน แต่ใช้เวลาส่วนใหญ่เล่นโทรศัพท์ ไม่จัดการเรียนการสอน และไม่ดำเนินงานตามที่ได้รับมอบหมาย จนเกิดผลเสียต่อโรงเรียน ข้อใดกล่าวถูกต้อง ตาม พ.ร.บ.ระเบียบข้าราชการครูและบุคลากรทางการศึกษา พ.ศ. 2547 และที่แก้ไขเพิ่มเติม","opts":{"ก":"ครู ก ถือเป็นการทอดทิ้งหน้าที่ราชการ เพราะไม่ปฏิบัติงานตามหน้าที่ ส่วนครู ข ถือเป็นการละทิ้งหน้าที่ราชการ เพราะแม้อยู่โรงเรียนแต่ไม่ทำงาน","ข":"ครู ก ถือเป็นการละทิ้งหน้าที่ราชการ เพราะไม่มาปฏิบัติราชการตามหน้าที่ ส่วนครู ข ถือเป็นการทอดทิ้งหน้าที่ราชการ เพราะตัวอยู่แต่ไม่เอาใจใส่งาน","ค":"ครู ก และครู ข ถือเป็นการละทิ้งหน้าที่ราชการเหมือนกัน เพราะต่างก็ไม่ปฏิบัติงานตามคำสั่งผู้บังคับบัญชา","ง":"ครู ก และครู ข ถือเป็นการทอดทิ้งหน้าที่ราชการเหมือนกัน เพราะต่างก่อให้เกิดความเสียหายต่อราชการ","จ":"ไม่มีข้อใดวิเคราะห์ได้ถูกต้อง "},"a":"ข","exp":"ละทิ้งหน้าที่ราชการ: คือการที่ข้าราชการตัวไม่อยู่ปฏิบัติหน้าที่ ไม่เดินทางมาทำงาน หรือหลบหนีไปธุระภายนอกในเวลาราชการ (เช่น กรณีครู ก ที่ไม่มาปฏิบัติราชการหลายวัน) ทอดทิ้งหน้าที่ราชการ: คือการที่ข้าราชการตัวอยู่ในสถานที่ทำงานและเวลาปฏิบัติหน้าที่จริง แต่เพิกเฉย ละเลย ไม่สนใจใส่ใจทำงานตามหน้าที่ (เช่น กรณีครู ข ที่มาโรงเรียนแต่เล่นโทรศัพท์มือถือตลอดเวลาและไม่จัดการเรียนการสอน)"},{"id":118,"q":"ในการอบรมวินัยข้าราชการครู วิทยากรได้กล่าวว่า “โทษทางวินัยของข้าราชการครูมีทั้งหมด 5 สถาน ได้แก่ ภาคทัณฑ์ ตัดเงินเดือน ลดเงินเดือน ปลดออก และไล่ออก ส่วนคำสั่ง “ให้ออกจากราชการ” ไม่ถือว่าเป็นโทษทางวินัย เพราะเป็นการพ้นจากราชการในลักษณะอื่นตามที่กฎหมายกำหนด” จากข้อความดังกล่าว ข้อใดวิเคราะห์สอดคล้องกับ พ.ร.บ.ระเบียบข้าราชการครูและบุคลากรทางการศึกษา พ.ศ. 2547 และที่แก้ไขเพิ่มเติม","opts":{"ก":"วิทยากรกล่าวไม่ถูกต้อง เพราะคำสั่งให้ออกถือเป็นโทษทางวินัยเช่นเดียวกับปลดออกและไล่ออก","ข":"วิทยากรกล่าวถูกต้องเฉพาะเรื่องโทษทางวินัย แต่ไม่ถูกต้องเรื่องให้ออก เพราะการให้ออกถือว่าเป็นส่วนหนึ่งของโทษทางวินัยโดยอ้อม","ค":"วิทยากรกล่าวถูกต้อง เพราะกฎหมายกำหนดโทษทางวินัยไว้ 5 สถาน และการให้ออกเป็นการพ้นจากราชการตามกฎหมายโดยไม่ใช่โทษทางวินัย","ง":"วิทยากรกล่าวไม่ถูกต้อง เพราะโทษทางวินัยของข้าราชการครูมีเพียง 4 สถานเท่านั้น ไม่มีโทษปลดออก","จ":"ไม่มีข้อใดวิเคราะห์ได้สอดคล้อง "},"a":"ค","exp":"ตามมาตรา 96 โทษทางวินัยมีระบุไว้ 5 สถานอย่างจำกัด คือ ภาคทัณฑ์, ตัดเงินเดือน, ลดเงินเดือน (ปรับปรุงแก้ไข), ปลดออก, ไล่ออก คำสั่งให้ออกจากราชการ หรือ สั่งพักราชการ หรือ ลาออก ถือเป็นเรื่องของการพ้นสภาพข้าราชการหรือมาตรการอื่นทางปกครองเท่านั้น ไม่จัดเป็นมาตรการลงโทษทางวินัยแต่อย่างใด"},{"id":119,"q":"ครู ค ถูกดำเนินคดีในความผิดลหุโทษฐานก่อความเดือดร้อนรำคาญ และศาลลงโทษปรับจำนวนหนึ่ง ต่อมาในการประชุมโรงเรียน มีครูอภิปรายเกี่ยวกับความหมายของ “ลหุโทษ” ดังนี้: คนที่ 1 กล่าวว่า ลหุโทษ คือ ความผิดที่มีโทษจำคุกไม่เกิน 1 เดือน หรือปรับไม่เกิน 10,000 บาท หรือทั้งจำทั้งปรับ  คนที่ 2 กล่าวว่า หากมีโทษปรับเพียงอย่างเดียว จะไม่ถือเป็นลหุโทษ  คนที่ 3 กล่าวว่า ลหุโทษเป็นความผิดอาญาที่กฎหมายมองว่ามีความร้ายแรงไม่มากนัก","opts":{"ก":"คนที่ 1 และคนที่ 3 กล่าวถูกต้อง ส่วนคนที่ 2 กล่าวไม่ถูกต้อง เพราะลหุโทษอาจมีโทษจำคุก หรือโทษปรับด้วย","ข":"คนที่ 1 กล่าวไม่ถูกต้อง เพราะลหุโทษต้องมีโทษจำคุกเสมอ ส่วนคนที่ 2 และคนที่ 3 กล่าวถูกต้อง","ค":"คนที่ 2 กล่าวถูกต้อง เพราะหากไม่มีโทษจำคุกจะไม่ถือเป็นความผิดลหุโทษ","ง":"ทั้ง 3 คนกล่าวไม่ถูกต้อง เพราะลหุโทษไม่ใช่ความผิดทางอาญา","จ":"ไม่มีข้อใดสรุปได้ถูกต้อง "},"a":"ก","exp":"คนที่ 1 และคนที่ 3 กล่าวถูกต้อง: ลหุโทษจัดเป็นความผิดประเภทลหุ (ความผิดลหุแปลว่าความผิดสถานเบา) ซึ่งระวางโทษจำคุกไม่เกิน 1 เดือน หรือปรับไม่เกิน 10,000 บาท หรือทั้งจำทั้งปรับตามประมวลกฎหมายอาญา คนที่ 2 กล่าวไม่ถูกต้อง: เนื่องจากความผิดลหุโทษบางมาตรามีบทลงโทษเป็นอัตราโทษปรับอย่างเดียว (ไม่เกิน 10,000 บาท) โดยปราศจากโทษจำคุกได้ จึงยังคงถือเป็นความผิดลหุโทษ"},{"id":120,"q":"ผู้อำนวยการโรงเรียน สังกัด สพม. แห่งหนึ่งกล่าวในที่ประชุมว่า “หากข้าราชการครูมีพฤติกรรมผิดวินัยร้ายแรง สามารถลงโทษปลดออก หรือไล่ออกได้ แต่หากเป็นกรณีที่ขาดคุณสมบัติหรือมีเหตุให้พ้นจากราชการตามกฎหมาย อาจใช้คำสั่ง “ลาออก” ซึ่งไม่ถือว่าเป็นโทษทางวินัย” ข้อใดเป็นการวิเคราะห์สอดคล้องกับ พ.ร.บ.ระเบียบข้าราชการครูและบุคลากรทางการศึกษา พ.ศ. 2547 และที่แก้ไขเพิ่มเติม","opts":{"ก":"ข้อความดังกล่าวถูกต้อง เพราะปลดออกและไล่ออกเป็นโทษทางวินัย ส่วนลาออกเป็นการพ้นจากราชการที่ไม่ใช่โทษทางวินัย","ข":"ข้อความดังกล่าวไม่ถูกต้อง เพราะการลาออกมีผลกระทบต่อสิทธิราชการ จึงถือเป็นโทษทางวินัยเสมอ","ค":"ข้อความดังกล่าวไม่ถูกต้อง เพราะปลดออกไม่ใช่โทษทางวินัย มีเพียงไล่ออกเท่านั้นที่เป็นโทษทางวินัย","ง":"ข้อความดังกล่าวถูกต้องเฉพาะกรณีครูผู้ช่วย แต่ใช้ไม่ได้กับข้าราชการครูตำแหน่งอื่น","จ":"ไม่มีข้อใดวิเคราะห์ได้สอดคล้อง "},"a":"ก","exp":"ตามบทบัญญัติ โทษทางวินัยร้ายแรงมีเพียง 2 สถานคือปลดออกและไล่ออก ส่วนคำสั่งอนุมัติให้ลาออกจากราชการถือเป็นการสิ้นสุดสถานภาพข้าราชการตามเจตจำนงของผู้ยื่นและเป็นกรณีของการพ้นจากราชการที่ไม่ใช่โทษทางวินัยอย่างถูกต้อง"},{"id":121,"q":"โรงเรียนแห่งหนึ่งตรวจสอบพบว่า ครูส้ม มาปฏิบัติราชการทุกวัน ลงเวลาครบถ้วน แต่ไม่จัดทำแผนการสอน เข้าสอนตามตารางแต่ไม่ใส่ใจการสอน และเพิกเฉยต่อคำสั่งของหัวหน้ากลุ่มสาระเป็นเวลานาน ขณะที่ครูแจง ไม่มาปฏิบัติราชการติดต่อกัน 7 วันโดยไม่มีเหตุผลอันสมควร โดยไม่แจ้งการลาต่อผู้อำนวยการโรงเรียนเพื่อทราบ หากพิจารณาตามหลักกฎหมายเกี่ยวกับวินัยข้าราชการครู ข้อใดกล่าวสอดคล้องที่สุด","opts":{"ก":"ครูส้ม และครูแจง มีพฤติกรรมเข้าลักษณะเดียวกัน คือ ละทิ้งหน้าที่ราชการ เพราะต่างไม่ปฏิบัติงานตามหน้าที่","ข":"ครูส้มมีลักษณะทอดทิ้งหน้าที่ราชการ ส่วนครูแจง มีลักษณะละทิ้งหน้าที่ราชการ","ค":"ครูส้มไม่ถือว่าผิดวินัย เพราะยังมาปฏิบัติราชการและลงเวลาครบถ้วน ส่วนครูแจงเท่านั้นที่ผิดวินัย","ง":"ครูแจงถือเป็นการทอดทิ้งหน้าที่ราชการ เพราะการไม่มาปฏิบัติราชการเป็นการไม่เอาใจใส่ต่อหน้าที่โดยตรง","จ":"ไม่มีข้อใดวิเคราะห์ได้สอดคล้อง "},"a":"ข","exp":"ครูส้ม ตัวอยู่ปฏิบัติหน้าที่และมาลงเวลาทำงานเป็นปกติ แต่ไม่ปฏิบัติหน้าที่สอนอย่างเอาใจใส่ ปล่อยเพิกเฉย จึงเป็นการ \"ทอดทิ้งหน้าที่ราชการ\" ครูแจง ขาดราชการโดยไม่ยื่นใบลาและตัวไม่มาโรงเรียนติดต่อกันถึง 7 วัน จึงเป็นการ \"ละทิ้งหน้าที่ราชการ\""},{"id":122,"q":"นายไก่ เป็นครูผู้ช่วยอยู่ระหว่างการเตรียมความพร้อมและพัฒนาอย่างเข้ม ได้ร่วมกันกับพนักงานการเงินของโรงเรียนปลอมเอกสารเบิกงบประมาณจนรัฐเสียหาย ต่อมาคณะกรรมการสอบสวนมีมติว่า กระทำผิดวินัยอย่างร้ายแรง จึงมีคำสั่งไล่ออกจากราชการ สามปีต่อมา นายไก่ ประสงค์จะสมัครสอบแข่งขันเพื่อบรรจุเข้ารับราชการครูอีกครั้ง โดยอ้างว่าตนยังไม่เคยถูกศาลพิพากษาถึงที่สุดในคดีอาญา ข้อใดกล่าวสอดคล้องกับ พ.ร.บ.ระเบียบข้าราชการครูและบุคลากรทางการศึกษา พ.ศ. 2547 และที่แก้ไขเพิ่มเติม","opts":{"ก":"ค.ศ. มีมติยกเว้นเป็นรายกรณี แม้ถูกลงโทษวินัยร้ายแรงแล้ว","ข":"นายไก่ ไม่มีสิทธิสมัครสอบใหม่ได้ เพราะผู้ถูกไล่ออกจากราชการ กรณีกระทำผิดวินัยร้ายแรงระหว่างเตรียมความพร้อมพัฒนาอย่างเข้ม ถือว่าขาดคุณสมบัติในการรับราชการครู","ค":"นายไก่ สามารถสมัครสอบได้ หากพ้นโทษทางอาญาแล้ว เพราะความผิดทางวินัย ต้องยุติตามคดีอาญา","ง":"นายไก่ ยังมีสิทธิสมัครสอบได้ หาก","จ":"ไม่มีข้อใดวิเคราะห์ได้สอดคล้อง "},"a":"ข","exp":"ข้าราชการครูผู้ช่วยแม้จะอยู่ระหว่างเตรียมความพร้อมและพัฒนาอย่างเข้ม 2 ปี หากกระทำผิดวินัยร้ายแรงก็ต้องรับโทษตามกฎหมาย และการถูกลงโทษทางวินัยร้ายแรงระดับ \"ไล่ออก\" จะส่งผลลัพธ์ให้ขาดคุณสมบัติทั่วไปในการเข้ารับราชการตามมาตรา 30 (12) ทันที ส่งผลให้นายไก่หมดสิทธิ์ในการสมัครสอบเข้ารับราชการเป็นข้าราชการครูตลอดไป"},{"id":123,"q":"นางสาวขอน เป็นครูผู้ช่วย ระหว่างการประเมินเตรียมความพร้อมและพัฒนาอย่างเข้ม ประพฤติทำนองชู้สาวกับนักเรียน อีกทั้งยังไม่ปฏิบัติตามคำสั่งผู้บังคับบัญชา โดยคณะกรรมการสอบสวนทางวินัยเห็นว่ายังไม่ถึงขั้นวินัยร้ายแรง จึงมีคำสั่งลงโทษลดเงินเดือน ทำให้ต้องออกจากราชการตามกฎหมาย ต่อมานางสาวขอน มีความประสงค์สมัครสอบบรรจุครูผู้ช่วยอีกครั้ง โดยอ้างว่าการออกจากราชการครั้งก่อน มิใช่การถูกลงโทษทางวินัยร้ายแรง ข้อใดกล่าวได้ถูกต้อง ตาม พ.ร.บ.ระเบียบข้าราชการครูและบุคลากรทางการศึกษา พ.ศ. 2547 และที่แก้ไขเพิ่มเติม","opts":{"ก":"นางสาวขอน ไม่มีสิทธิสมัครสอบใหม่ เพราะเคยถูกให้ออกจากราชการแล้วไม่ว่ากรณีใด","ข":"นางสาวขอน มีสิทธิสมัครสอบใหม่ได้ เพราะกฎหมายให้ถือเสมือนไม่เคยเป็นข้าราชการครูมาก่อน","ค":"นางสาวขอน สมัครสอบได้เฉพาะตำแหน่งพนักงานราชการ แต่ไม่สามารถเป็นข้าราชการครูได้อีก","ง":"นางสาวขอน จะสมัครสอบได้ต่อเมื่อพ้นระยะเวลา 5 ปี นับแต่วันออกจากราชการ","จ":"ไม่มีข้อใดวิเคราะห์ได้สอดคล้อง "},"a":"ข","exp":"ตาม พ.ร.บ.ระเบียบข้าราชการครูฯ มาตรา 56 วรรคห้า (และมาตรา 190) ระบุอย่างชัดเจนว่า กรณีข้าราชการครูที่อยู่ในระหว่างเตรียมความพร้อมและพัฒนาอย่างเข้ม ถูกสั่งให้ออกจากราชการที่มิใช่เป็นการถูกลงโทษปลดออกหรือไล่ออก \"ให้ถือเสมือนว่าผู้นั้นไม่เคยเป็นข้าราชการครูและบุคลากรทางการศึกษามาก่อน\" ดังนั้น การลงโทษลดเงินเดือน (วินัยไม่ร้ายแรง) จนทำให้ต้องออกจากราชการ จึงไม่ส่งผลให้ขาดคุณสมบัติทั่วไป และมีสิทธิ์สมัครสอบบรรจุเข้ารับราชการครูใหม่ได้เสมือนบุคคลทั่วไป"},{"id":124,"q":"ผู้อำนวยการโรงเรียนสังกัด สพป. แห่งหนึ่ง เรียกรับเงินจากครูผู้ช่วย เพื่อแลกกับการช่วยให้ผ่านการประเมิน ต่อมาคณะกรรมการสอบสวนโทษทางวินัยตรวจสอบพบข้อเท็จจริง แต่ผู้อำนวยการอ้างว่า เงินดังกล่าวเป็น “ค่าน้ำใจ” ที่ครูผู้ช่วยเต็มใจที่จะให้ มิใช่การทุจริตแต่อย่างใด ข้อใดกล่าวได้ถูกต้อง ตาม พ.ร.บ.ระเบียบข้าราชการครูและบุคลากรทางการศึกษา พ.ศ. 2547 และที่แก้ไขเพิ่มเติม","opts":{"ก":"ไม่มีความผิดทางวินัย เพราะการให้โดยการให้โดยเสน่หา","ข":"เป็นความผิดวินัยไม่ร้ายแรง เพราะยังไม่มีความเสียหายแก่ราชการ","ค":"เป็นความผิดวินัยอย่างร้ายแรง ฐานทุจริตต่อหน้าที่ราชการ","ง":"เป็นเพียงความผิดทางอาญา แต่ไม่เกี่ยวกับวินัยข้าราชการครู","จ":"ไม่มีข้อใดวิเคราะห์ได้ถูกต้อง "},"a":"ค","exp":"การเรียกรับทรัพย์สินหรือเงินทองจากผู้ใต้บังคับบัญชาเพื่อเอื้ออำนวยผลประโยชน์หรือช่วยให้ผ่านเกณฑ์ประเมิน ถือเป็นการใช้อำนาจและหน้าที่ราชการแสวงหาประโยชน์โดยมิชอบ เข้าข่ายความผิดวินัยอย่างร้ายแรงฐาน \"ทุจริตต่อหน้าที่ราชการ\" มีโทษสถานหนักคือไล่ออกจากราชการ"},{"id":125,"q":"นายดำ ต้องการเลื่อนวิทยฐานะให้รวดเร็ว จึงจ่ายเงินให้นายหน้าคนหนึ่งที่อ้างว่าสามารถวิ่งเต้นให้ได้รับแต่งตั้งเป็นชำนาญการพิเศษได้ ภายหลังตรวจสอบพบว่า นายหน้าคนนี้มีการแทรกแซงกระบวนการแต่งตั้งให้นายดำได้รับแต่งตั้งเป็นชำนาญการพิเศษได้จริงตามที่พูดคุยกัน ข้อใดกล่าวถูกต้อง ตาม พ.ร.บ.ระเบียบข้าราชการครูและบุคลากรทางการศึกษา พ.ศ. 2547 และที่แก้ไขเพิ่มเติม","opts":{"ก":"นายดำ ไม่มีความผิด หากไม่ได้เป็นผู้มีอำนาจแต่งตั้งโดยตรง","ข":"นายดำ มีความผิดทางอาญาเท่านั้น เพราะการซื้อขายตำแหน่งไม่ใช่เรื่องวินัย","ค":"นายดำ มีความผิดวินัยอย่างร้ายแรง เพราะมีส่วนร่วมในการซื้อขายตำแหน่งหรือวิทยฐานะ"},"a":"ค","exp":"พระราชบัญญัติระเบียบข้าราชการครูฯ มาตรา 90 วรรคสอง กำหนดห้ามมิให้ข้าราชการครูเข้ามีส่วนร่วมหรือกระทำการใดอันมีลักษณะเป็นการซื้อขายตำแหน่ง หรือจ่ายทรัพย์สินผลประโยชน์เพื่อให้ได้มาซึ่งตำแหน่งหรือวิทยฐานะโดยมิชอบด้วยกฎหมาย การฝ่าฝืนข้อห้ามดังกล่าวถือเป็นความผิดวินัยอย่างร้ายแรง"},{"id":126,"q":"พิจารณาข้อความดังต่อไปนี้เกี่ยวกับวินัยข้าราชการครู: ครูผู้ช่วยที่ถูกลงโทษวินัยร้ายแรงระหว่างเตรียมความพร้อมและพัฒนาอย่างเข้ม ย่อมหมดสิทธิกลับเข้ารับราชการครูอีก  ครูผู้ช่วยที่กระทำผิดวินัยไม่ร้ายแรงระหว่างเตรียมความพร้อมและพัฒนาอย่างเข้ม อาจสมัครสอบบรรจุเข้ารับราชการครูได้อีก  การทุจริตต่อหน้าที่ราชการถือเป็นความผิดวินัยอย่างร้ายแรง  การละทิ้งราชการติดต่อกันเกิน 15 วันโดยไม่มีเหตุผลอันควร มีโทษปลดออก เพราะมิได้ก่อความเสียหายแก่ราชการโดยตรง","opts":{"ก":"ถูกทุกข้อ","ข":"ถูกเฉพาะข้อ 1, 2 และ 3","ค":"ถูกเฉพาะข้อ 2 และ 4","ง":"ถูกเฉพาะข้อ 1 และ 4","จ":"ไม่มีข้อใดวิเคราะห์ได้สอดคล้อง "},"a":"ข","exp":"ข้อ 1) ถูกต้อง: ครูผู้ช่วยที่ถูกไล่ออก/ปลดออก จะขาดคุณสมบัติทั่วไปในการบรรจุแต่งตั้งเป็นข้าราชการตามมาตรา 30 (12) ข้อ 2) ถูกต้อง: เสมือนไม่เคยเป็นข้าราชการครูมาก่อนตามมาตรา 56 วรรคห้า จึงไม่ขาดคุณสมบัติและสมัครสอบแข่งขันได้ใหม่ ข้อ 3) ถูกต้อง: การทุจริตต่อหน้าที่ราชการถือเป็นวินัยร้ายแรงและมีบทลงโทษไล่ออกจากราชการ ข้อ 4) ผิด: การละทิ้งราชการติดต่อกันเกินกว่า 15 วันในคราวเดียวกันโดยไม่มีเหตุผลอันสมควร ถือเป็นวินัยอย่างร้ายแรงและมีโทษคือ \"ไล่ออก\" (ไม่ใช่ปลดออก)"},{"id":127,"q":"การพิจารณาเปรียบเทียบพฤติกรรมการเสื่อมเสียและการกระทำความผิดวินัยของข้าราชการครู มีตอนต่าง ๆ ดังนี้: ตอนที่ 1: การดื่มสุราในบ้านพักครู ถือเป็นความประพฤติชั่วอย่างร้ายแรง  ตอนที่ 2: การล่วงละเมิดทางเพศนักเรียน ไม่ว่าจะอยู่ในความดูแลหรือไม่ มีโทษวินัยร้ายแรง \"ไล่ออก\"  ตอนที่ 3: การประพฤติผิดทางชู้สาวกับครูด้วยกัน มีโทษวินัยร้ายแรง \"ปลดออก\"  ตอนที่ 4: การเล่นการพนันเป็นอาจิณ มีโทษวินัยร้ายแรง \"ไล่ออก\"  ตอนที่ 5: การเสพหรือค้ายาเสพติด มีโทษวินัยร้ายแรง \"ไล่ออก\"\n\nคำถาม: จากตอนต่างๆ ข้างต้น ข้อใดวิเคราะห์ได้ถูกต้องที่สุด","opts":{"ก":"ตอนที่ 1 กล่าวถูก ตอนที่ 2 กล่าวถูก ตอนที่ 3 กล่าวถูก ตอนที่ 4 กล่าวผิด ตอนที่ 5 กล่าวผิด","ข":"ตอนที่ 1 กล่าวผิด ตอนที่ 2 กล่าวถูก ตอนที่ 3 กล่าวผิด ตอนที่ 4 กล่าวถูก ตอนที่ 5 กล่าวถูก","ค":"ตอนที่ 1 กล่าวผิด ตอนที่ 2 กล่าวผิด ตอนที่ 3 กล่าวถูก ตอนที่ 4 กล่าวถูก ตอนที่ 5 กล่าวถูก","ง":"ตอนที่ 1 กล่าวถูก ตอนที่ 2 กล่าวถูก ตอนที่ 3 กล่าวผิด ตอนที่ 4 กล่าวถูก ตอนที่ 5 กล่าวผิด","จ":"ไม่มีข้อใดวิเคราะห์ได้ถูกต้อง "},"a":"จ","exp":"ตอนที่ 1 กล่าวผิด: การดื่มสุราในเวลาราชการหรือเมาสุราขณะปฏิบัติหน้าที่ราชการเป็นวินัยอย่างร้ายแรง แต่การดื่มสุราส่วนตัวในบ้านพักครูนอกเวลาราชการโดยมิได้ก่อความเดือดร้อนรำคาญใจรุนแรง จัดอยู่ในเกณฑ์วินัยไม่ร้ายแรง ตอนที่ 2 กล่าวถูก: การล่วงละเมิดทางเพศหรือกระทำอนาจารผู้เรียนจัดเป็นวินัยอย่างร้ายแรง มีโทษสถานหนักคือไล่ออก ตอนที่ 3 กล่าวถูก: การประพฤติผิดทางเพศหรือชู้สาวกับข้าราชการครูด้วยกัน ถือเป็นความประพฤติเสื่อมเสียร้ายแรง มีโทษปลดออกหรือไล่ออก ตอนที่ 4 และ 5 กล่าวถูก: การเล่นการพนันเป็นอาจิณ หรือการเสพ/ค้ายาเสพติดให้โทษร้ายแรง ถือเป็นความประพฤติชั่วอย่างร้ายแรง มีบทลงโทษคือไล่ออกจากราชการ"},{"id":128,"q":"พิจารณาข้อความต่อไปนี้เกี่ยวกับวินัยข้าราชการครูและบุคลากรทางการศึกษา  การไม่วางตัวเป็นกลางทางการเมือง มีความผิดทางวินัยไม่ร้ายแรง  ทุจริตการซื้อสิทธิขายเสียงในการเลือกตั้ง มีความผิดทางวินัยไม่ร้ายแรง  โทษทางวินัยร้ายแรง หากมีเหตุลดหย่อนโทษ ห้ามมิให้ลงโทษต่ำกว่าปลดออก  หากถูกลงโทษทางวินัย ในขั้นแรกท่านจะต้องดำเนินการร้องทุกข์  การแจ้งคำสั่งให้ผู้ถูกลงโทษทางวินัยทราบ ต้องแจ้งภายใน 7 วัน","opts":{"ก":"ตอนที่ 1 กล่าวถูก ตอนที่ 2 กล่าวถูก ตอนที่ 3 กล่าวถูก ตอนที่ 4 กล่าวผิด ตอนที่ 5 กล่าวผิด","ข":"ตอนที่ 1 กล่าวผิด ตอนที่ 2 กล่าวผิด ตอนที่ 3 กล่าวถูก ตอนที่ 4 กล่าวผิด ตอนที่ 5 กล่าวถูก","ค":"ตอนที่ 1 กล่าวผิด ตอนที่ 2 กล่าวผิด ตอนที่ 3 กล่าวถูก ตอนที่ 4 กล่าวถูก ตอนที่ 5 กล่าวถูก","ง":"ตอนที่ 1 กล่าวถูก ตอนที่ 2 กล่าวถูก ตอนที่ 3 กล่าวผิด ตอนที่ 4 กล่าวถูก ตอนที่ 5 กล่าวผิด","จ":"ไม่มีข้อใดวิเคราะห์ได้ถูกต้อง "},"a":"จ","exp":"ข้อ 1 ถูกต้อง: การไม่วางตัวเป็นกลางทางการเมืองเป็นวินัยไม่ร้ายแรง ข้อ 2 ผิด: การทุจริตซื้อสิทธิขายเสียงการเลือกตั้งเป็นความผิดวินัยอย่างร้ายแรงตามมาตรา 93 วรรคสอง"},{"id":129,"q":"นายสมชาย เป็นข้าราชการครู สังกัดสำนักงานเขตพื้นที่การศึกษาประถมศึกษาแห่งหนึ่ง ได้ยื่นหนังสือลาออกจากราชการต่อผู้อำนวยการโรงเรียนล่วงหน้า 35 วัน เนื่องจากต้องการไปประกอบอาชีพส่วนตัว ขณะเดียวนางสมสวย เป็นข้าราชการครูสังกัดเดียวกัน ถูกตั้งกรรมการสอบสวนทางวินัยจากกรณีไม่ปฏิบัติตามคำสั่งผู้บังคับบัญชา และท้ายที่สุดถูกสั่งลงโทษวินัยไม่ร้ายแรง โดยคำสั่งดังกล่าวแจ้งให้นางสมสวยทราบอย่างเป็นทางการในวันที่ 1 มิถุนายน 2569 หลังจากนั้นนางสมสวยได้ยื่นอุทธรณ์ต่อ อ.ก.ค.ศ. เขตพื้นที่การศึกษา ภายในวันที่ 25 มิถุนายน 2569 และขณะเดียวกันนางสาวอรทัย ซึ่งเป็นข้าราชการครูในสังกัดเดียวกัน ถูกลงโทษวินัยร้ายแรงฐานกระทำผิดอย่างร้ายแรง และได้ยื่นอุทธรณ์ต่อ","opts":{"ก":"ค.ศ. หรือ อ.ก.ค.ศ. เขตพื้นที่การศึกษาไม่มีอำนาจรับอุทธรณ์โดยตรง ","ข":"นายสมชาย ดำเนินการยื่นลาออกถูกต้อง เพราะการลาออกต้องยื่นล่วงหน้าไม่น้อยกว่า 30 วัน กรณีนางสมสวยถูกลงโทษวินัยไม่ร้ายแรง มีสิทธิอุทธรณ์ต่อ อ.ก.ค.ศ. เขตพื้นที่การศึกษา ดำเนินการถูกต้อง ขณะที่นางสาวอรทัยต้องอุทธรณ์ต่อ","ค":"นายสมชาย ดำเนินการยื่นลาออกถูกต้อง นางสมสวยดำเนินการถูกต้องกรณีถูกลงโทษวินัยไม่ร้ายแรง ส่วนกรณีของนางสาวอรทัย แม้จะถูกลงโทษวินัยร้ายแรง ต้องยื่นอุทธรณ์ภายใน 15 วัน มิฉะนั้นถือว่าพ้นระยะเวลาตามกฎหมาย ","ง":"นางสมสวย และนางสาวอรทัย ดำเนินการไม่ถูกต้อง เพราะการอุทธรณ์คำสั่งทางวินัยของข้าราชการครูทุกกรณีต้องยื่นต่อศาลปกครองก่อน และ","จ":"ไม่มีข้อใดวิเคราะห์สถานการณ์ข้างต้นได้ถูกต้อง "},"a":"ข","exp":"นายสมชายยื่นลาออกถูกต้อง: การลาออกราชการทั่วไปให้ยื่นหนังสือต่อผู้บังคับบัญชาล่วงหน้าไม่น้อยกว่า 30 วัน นายสมชายยื่นล่วงหน้า 35 วันจึงถูกต้องตามมาตรา 108 นางสมสวยอุทธรณ์ถูกต้อง: กรณีถูกสั่งลงโทษวินัยไม่ร้ายแรง มีสิทธิ์อุทธรณ์ต่อ อ.ก.ค.ศ. เขตพื้นที่การศึกษา ได้ภายใน 30 วันนับแต่วันรับแจ้งคำสั่งอย่างเป็นทางการ (ได้รับแจ้งวันที่ 1 มิ.ย. ยื่นอุทธรณ์วันที่ 25 มิ.ย. คิดเป็นระยะเวลา 24 วัน ซึ่งไม่เกิน 30 วันจึงถูกต้อง) นางสาวอรทัยอุทธรณ์ถูกต้อง: กรณีถูกลงโทษวินัยร้ายแรง (ปลดออก, ไล่ออก) กฎหมายกำหนดให้ยื่นอุทธรณ์ต่อ คณะกรรมการ ก.ค.ศ. (ระดับชาติ) ภายใน 30 วันนับแต่วันรับแจ้งคำสั่ง"}],"พ.ร.บ.คุ้มครองเด็ก พ.ศ. 2546":[{"id":1,"q":"พรบ.คุ้มครองเด็ก 2546 เริ่มบังคับใช้ตามข้อใด (ครูผู้ช่วย กทม.2566)","opts":{"ก":"เมื่อพ้น 30 วันนับแต่วันประกาศในราชกิจจานุเบกษา","ข":"เมื่อพ้น 60 วันนับแต่วันประกาศในราชกิจจานุเบกษา","ค":"เมื่อพ้น 90 วันนับแต่วันประกาศในราชกิจจานุเบกษา","ง":"เมื่อพ้น 180 วันนับแต่วันประกาศในราชกิจจานุเบกษา"},"a":"ง","exp":"ตามมาตรา 2 ของ พ.ร.บ. คุ้มครองเด็ก พ.ศ. 2546 กำหนดให้ใช้บังคับเมื่อพ้นกำหนด 180 วัน นับแต่วันประกาศในราชกิจจานุเบกษา ซึ่งประกาศ ัย 4 ขวบเอง หาอาหารกินเอง และขาดเรียนบ่อยครั้งเพราะต้องไปรับจ้างทำงานในตลาดเพื่อเลี้ยงน้อง ครูประจำชั้นพบว่าเด็กมีอาการอ่อนเพลียและขาดผู้ดูแลที่เหมาะสม ข้อใดวิเคราะห์สถานะของเด็กชายไก่ได้ถูกต้องที่สุดตาม พ.ร.บ. คุ้มครองเด็ก พ.ศ. 2546","opts":{"ก":"เข้าเงื่อนไขเป็นเด็กกำพร้า เพราะไม่มีบิดาเลี้ยงดู","ข":"เข้าเงื่อนไขเป็นเด็กเร่ร่อน เพราะต้องออกไปทำงานหาเงินเอง","ค":"เข้าเงื่อนไขเป็นเด็กอยู่ในสภาพลำบาก เพราะต้องรับภาระเกินวัยและขาดผู้ดูแลที่เหมาะสม","ง":"เข้าเงื่อนไขเป็นเด็กเสี่ยงต่อการกระทำผิด เพราะขาดการศึกษาและออกตลาดบ่อย"},"a":"ค","exp":"นิยามมาตรา 4 \"เด็กที่อยู่ในสภาพยากลำบาก\" ครอบคลุมเด็กที่อยู่ในครอบครัวยากจน บิดามารดาถูกคุมขัง หรือเด็กที่ต้องรับภาระหน้าที่เกินวัย ซึ่งสถานการณ์ของเด็กชายไก่ตรงกับนิยามนี้อย่างชัดเจน"},{"id":63,"q":"เด็กหญิงแบม อายุ 15 ปี อาศัยอยู่ในชุมชนแออัด มักออกจากบ้านไปอยู่กับกลุ่มวัยรุ่นที่มีพฤติกรรมมั่วสุม เล่นการพนัน และชักชวนให้ลักขโมยสินค้าในร้านสะดวกซื้อ แม้แบมยังไม่เคยก่อเหตุ แต่เริ่มหนีเรียนและกลับบ้านดึกเป็นประจำ ข้อใดวิเคราะห์สถานะของเด็กหญิงแบมได้ถูกต้องที่สุดตาม พ.ร.บ. คุ้มครองเด็ก พ.ศ. 2546","opts":{"ก":"เข้าเงื่อนไขเป็นเด็กเร่ร่อน","ข":"เข้าเงื่อนไขเป็นเด็กเสี่ยงต่อการกระทำผิด","ค":"เข้าเงื่อนไขเป็นเด็กอยู่ในสภาพลำบาก","ง":"เข้าเงื่อนไขเป็นเด็กถูกทารุณกรรม"},"a":"ข","exp":"ตามมาตรา 4 \"เด็กที่เสี่ยงต่อการกระทำผิด\" คือเด็กที่มีพฤติกรรมไม่สมควร คบหาสมาคมกับบุคคลที่น่าจะชักนำไปในทางทำผิดกฎหมาย ขัดต่อศีลธรรมอันดี หรืออยู่ในแวดล้อมที่ชักนำในทางเสียหาย แบมจึงจัดอยู่ในประเภทเด็กเสี่ยงต่อการกระทำผิด"},{"id":64,"q":"เจ้าหน้าที่พบเด็กชายช้าง อายุประมาณ 7 ปี เดินขอทานอยู่บริเวณสถานีขนส่ง เด็กไม่สามารถบอกข้อมูลบิดามารดาได้ และจากการตรวจสอบไม่พบเอกสารทะเบียนราษฎรหรือผู้ใดมาแสดงตนรับเป็นผู้ปกครอง แม้หน่วยงานรัฐพยายามสืบหาครอบครัวแล้วแต่ยังไม่พบข้อมูลใดๆ ข้อใดวิเคราะห์สถานะของเด็กชายช้างได้ถูกต้องที่สุดตาม พ.ร.บ. คุ้มครองเด็ก พ.ศ. 2546","opts":{"ก":"เข้าเงื่อนไขเป็นเด็กกำพร้า เพราะไมปรากฏและสืบหาบิดามารดาไม่ได้","ข":"เข้าเงื่อนไขเป็นเด็กเร่ร่อน เพราะไม่ปรากฏและสืบหาบิดามารดาไม่ได้","ค":"เข้าเงื่อนไขเป็นเด็กอยู่ในสภาพลำบาก เพราะไม่มีที่อยู่อาศัยแน่นอน","ง":"เข้าเงื่อนไขเป็นเด็กเสี่ยงต่อการกระทำผิด เพราะใช้ชีวิตในพื้นที่เสี่ยงอาชญากรรม"},"a":"ก","exp":"มาตรา 4 กำหนดนิยาม \"เด็กกำพร้า\" หมายถึงเด็กที่บิดาหรือมารดาเสียชีวิต หรือเด็กที่ไม่ปรากฏบิดามารดา หรือไม่สามารถสืบหาบิดามารดาได้ สถานการณ์ของเด็กชายช้างจึงตรงกับนิยามเด็กกำพร้าโดยตรงที่สุด"},{"id":65,"q":"เด็กหญิงดาด้า อายุ 12 ปี ถูกผู้ปกครองลงโทษด้วยการตีอย่างรุนแรงเป็นประจำเมื่อทำการบ้านผิดหรือสอบได้คะแนนต่ำ เด็กมีรอยฟกช้ำตามร่างกายและมีอาการหวาดกลัว ไม่กล้าพูดคุยกับผู้อื่น ครูแนะแนวแจ้งเจ้าหน้าที่เข้าตรวจสอบพฤติกรรมของผู้ปกครอง ข้อใดวิเคราะห์สถานะของเด็กหญิงดาด้าได้ถูกต้องที่สุดตาม พ.ร.บ. คุ้มครองเด็ก พ.ศ. 2546","opts":{"ก":"เป็นเพียงปัญหาภายในครอบครัว ไม่เข้าข่ายกฎหมายคุ้มครองเด็ก","ข":"เป็นการอบรมสั่งสอนตามสิทธิโดยชอบธรรมของผู้ปกครอง","ค":"เป็นการทารุณกรรมเด็ก เพราะก่อให้เกิดอันตรายต่อร่างกายและจิตใจ","ง":"เป็นกรณีเด็กอยู่ในสภาพลำบาก เพราะเด็กมีความเครียดจากการเรียน"},"a":"ค","exp":"การใช้ความรุนแรงตีจนฟกช้ำและทำลายสภาพจิตใจจนเด็กเกิดความหวาดกลัว เข้าข่ายการกระทำ \"ทารุณกรรม\" ตามมาตรา 4 ซึ่งหมายความถึงการกระทำอันก่อให้เกิดอันตรายแก่ร่างกายและจิตใจของเด็ก ไม่สามารถอ้างเป็นสิทธิอบรมสั่งสอนโดยชอบธรรมได้"},{"id":66,"q":"เด็กชายอาร์ม อายุ 10 ปี ไม่มีผู้ปกครองดูแลอย่างจริงจัง มักเดินขายพวงมาลัยตามสี่แยกในช่วงเวลากลางคืนและนอนตามศาลาริมถนน บางวันมีคนให้อาหาร บางวันต้องขอเงินจากคนผ่านไปมา ชาวบ้านพบเห็นการใช้ชีวิตเช่นนี้อย่างต่อเนื่อง ข้อใดวิเคราะห์สถานะของเด็กชายอาร์มได้ถูกต้องที่สุดตาม พ.ร.บ. คุ้มครองเด็ก พ.ศ. 2546","opts":{"ก":"เข้าเงื่อนไขเป็นเด็กกำพร้า","ข":"เข้าเงื่อนไขเป็นเด็กเร่ร่อน","ค":"เข้าเงื่อนไขเป็นเด็กเสี่ยงต่อการกระทำผิด","ง":"เข้าเงื่อนไขเป็นเด็กอยู่ในสภาพลำบาก"},"a":"ข","exp":"ตามมาตรา 4 \"เด็กเร่ร่อน\" คือเด็กที่ไม่มีบิดามารดาหรือผู้ปกครอง หรือมีแต่ไม่เลี้ยงดูหรือไม่สามารถเลี้ยงดูได้ จนเป็นเหตุให้ต้องใช้ชีวิตเร่ร่อนนอนริมทาง พฤติกรรมของอาร์มจึงตรงนิยามนี้เป็นประการหลัก"},{"id":67,"q":"เด็กหญิงเอ อายุ 5 ปี ถูกพบเดินอยู่ลำพังในตลาดกลางคืน เจ้าหน้าที่จึงนำตัวส่งไปยัง \"สถานที่แห่งแรก\" เพื่อดูแลชั่วคราว สืบเสาะประเมินจิตใจ ต่อมาพบว่าไม่มีญาติอุปการะได้ จึงส่งตัวต่อไปยัง \"สถานที่แห่งที่สอง\" ซึ่งมีระบบดูแล ที่พัก อาหาร การศึกษา และกระบวนการฟื้นฟูเด็กจำต้องได้รับการสงเคราะห์ร่วมกันกว่า 20 คน ภายใต้กระบวนการคุ้มครองสิทธิเด็กผ่านทางศาลเฉพาะด้าน ข้อใดวิเคราะห์ประเภทสถานที่และศาลที่เกี่ยวข้องได้ถูกต้องที่สุด","opts":{"ก":"สถานที่แรกเป็นสถานสงเคราะห์ สถานที่สองเป็นสถานแรกรับ เกี่ยวข้องกับศาลเยาวชนฯ","ข":"สถานที่แรกเป็นสถานแรกรับ สถานที่สองเป็นสถานสงเคราะห์ เกี่ยวข้องกับศาลเยาวชนฯ","ค":"สถานที่แรกเป็นศูนย์พัฒนาเด็กเล็ก สถานที่สองเป็นสถานพินิจ เกี่ยวข้องกับศาลอาญา","ง":"สถานที่แรกและสถานที่สองเป็นสถานแรกรับเหมือนกัน ไม่เกี่ยวข้องกับกระบวนการศาล"},"a":"ข","exp":"\"สถานแรกรับ\" ทำหน้าที่รับอุปการะเป็นการชั่วคราวเพื่อสืบเสาะพินิจเบื้องต้น ส่วน \"สถานสงเคราะห์\" ให้การอุปการะดูแลระยะยาวแก่เด็กที่พึงได้รับการสงเคราะห์ตั้งแต่ 6 คนขึ้นไป และมีศาลที่มีอำนาจพิจารณาในเรื่องนี้คือ \"ศาลเยาวชนและครอบครัว\" ตามมาตรา 4 และ 5"},{"id":68,"q":"ในการจัดประชุมแต่งตั้งคณะกรรมการคุ้มครองเด็ก มีข้อเสนอให้รองผู้ว่าฯ ทำหน้าที่ประธานกรรมการจังหวัดแทนผู้ว่าฯ ส่วนระดับ กทม. มีการตั้งคณะกรรมการโดยมีผู้ว่าฯ กทม. เป็นประธาน แต่มีสัดส่วนสตรีเป็นผู้ทรงคุณวุฒิไม่ถึง 1 ใน 3 และมีข้อเสนอให้ปรับวาระเพิ่มเป็น 5 ปี ขณะที่ระดับชาติเสนอให้ รมว.ศึกษาธิการ เป็นประธานคณะกรรมการคุ้มครองเด็กแห่งชาติแทน รมว.พม. จากข้อเสนอดังกล่าว ข้อใดประเมินความสอดคล้องตามกฎหมายได้ถูกต้องที่สุด","opts":{"ก":"รองผู้ว่าฯ เป็นประธานแทนได้ และวาระ 5 ปีเป็นดุลยพินิจของแต่ละจังหวัด","ข":"คณะกรรมการ กทม. ถูกต้องแล้ว แม้สัดส่วนสตรีไม่ถึง 1 ใน 3 ก็ไม่มีผลลบล้างกฎหมาย","ค":"รมว.พม. ต้องเป็นประธานระดับชาติ, ผู้ว่าฯ จังหวัดต้องเป็นประธานระดับจังหวัด, สัดส่วนสตรีต้องไม่น้อยกว่า 1 ใน 3 และกรรมการผู้ทรงคุณวุฒิมีวาระคราวละ 3 ปี","ง":"การแต่งตั้งประธานสามารถปรับเปลี่ยนได้ตามความเหมาะสม และสัดส่วนสตรีไม่ได้ระบุไว้ชัดเจน"},"a":"ค","exp":"พระราชบัญญัติคุ้มครองเด็กกำหนดโครงสร้างคณะกรรมการไว้แน่นอน (รมว.พม. เป็นประธานระดับชาติ มาตรา 7 / ผู้ว่าฯ เป็นประธานระดับจังหวัด มาตรา 17 / สตรีไม่น้อยกว่า 1 ใน 3 และวาระการดำรงตำแหน่ง 3 ปี มาตรา 9) ดังนั้นข้อเสนออื่นๆ ล้วนขัดกับตัวบทกฎหมาย"},{"id":69,"q":"พิจารณาข้อความเกี่ยวกับพระราชบัญญัติคุ้มครองเด็ก พ.ศ. 2546 ต่อไปนี้:  ตอนที่ 1: การปฏิบัติต่อเด็กทุกกรณีต้องคำนึงถึงประโยชน์สูงสุดของเด็กเป็นสำคัญ และให้มีการเลือกปฏิบัติโดยไม่เป็นธรรม  ตอนที่ 2: ผู้ปกครองมีหน้าที่อุปการะเลี้ยงดู อบรมสั่งสอน และพัฒนาเด็กที่อยู่ในความปกครองดูแลของตนตามสมควร  ตอนที่ 3: การทอดทิ้งเด็กไว้ในสถานรับเลี้ยงเด็กโดยเจตนาไม่รับกลับคืน และการทารุณกรรมเด็ก ถือเป็นการปฏิบัติที่กฎหมายยอมรับได้ ข้อใดวิเคราะห์ความถูกต้องสอดคล้องของข้อความตามกฎหมายได้ถูกต้อง","opts":{"ก":"ตอนที่ 1 กล่าวถูก | ตอนที่ 2 กล่าวถูก | ตอนที่ 3 กล่าวถูก","ข":"ตอนที่ 1 กล่าวถูก | ตอนที่ 2 กล่าวผิด | ตอนที่ 3 กล่าวถูก","ค":"ตอนที่ 1 กล่าวผิด | ตอนที่ 2 กล่าวถูก | ตอนที่ 3 กล่าวผิด","ง":"ตอนที่ 1 กล่าวผิด | ตอนที่ 2 กล่าวถูก | ตอนที่ 3 กล่าวถูก"},"a":"ค","exp":"ตอนที่ 1 ผิดเพราะมาตรา 22 ระบุชัดเจนว่า \"และไม่ให้มีการเลือกปฏิบัติโดยไม่เป็นธรรม\" ตอนที่ 2 ถูกต้องตามมาตรา 23 ส่วนตอนที่ 3 ผิด เนื่องจากพฤติกรรมเหล่านั้นขัดต่อกฎหมายและมีบทลงโทษอาญาชัดเจนตามมาตรา 25 และ 26"},{"id":70,"q":"พิจารณาสถานการณ์: เจ้าหน้าที่ได้รับแจ้งว่า เด็กชายเอ อายุ 12 ปี ถูกพ่อเลี้ยงทำร้ายร่างกายและถูกปล่อยเร่ร่อน เจ้าหน้าที่จึงนำตัวส่งสืบเสาะโดยรับฟังรายงานจากแพทย์และนักสังคมสงเคราะห์ก่อนเสนอผู้ว่าฯ สั่งส่งเด็กเข้ารับการสงเคราะห์ นอกจากนี้ยังให้การสงเคราะห์ต่อเนื่องแก่ เด็กหญิงบี ซึ่งเป็นเด็กกำพร้าจนกระทั่งอายุครบ 22 ปีบริบูรณ์ เนื่องจากมีความจำเป็นบางประการ ข้อความวิเคราะห์ต่อไปนี้ข้อใดถูกต้องสอดคล้องตามกฎหมาย  ตอนที่ 1: เด็กที่ถูกพ่อเลี้ยงทำร้ายร่างกายต้องได้รับการช่วยเหลือเบื้องต้นและได้รับการคุ้มครองสวัสดิภาพโดยมิชักช้า  ตอนที่ 2: เด็กเร่ร่อนและเด็กกำพร้า จัดเป็นเด็กที่พึงได้รับการสงเคราะห์ตามกฎหมาย  ตอนที่ 3: ผู้ว่าราชการจังหวัดสามารถสั่งส่งเด็กเข้ารับการสงเคราะห์ได้โดยไม่จำเป็นต้องรับฟังความเห็นจากผู้เชี่ยวชาญก่อน  ตอนที่ 4: การสงเคราะห์บุคคลสามารถให้ได้ต่อเนื่องตามความจำเป็นสูงสุดไม่เกินอายุครบ 24 ปีบริบูรณ์","opts":{"ก":"ตอนที่ 1 ผิด | ตอนที่ 2 ถูก | ตอนที่ 3 ถูก | ตอนที่ 4 ผิด","ข":"ตอนที่ 1 ผิด | ตอนที่ 2 ผิด | ตอนที่ 3 ถูก | ตอนที่ 4 ผิด","ค":"ตอนที่ 1 ถูก | ตอนที่ 2 ถูก | ตอนที่ 3 ผิด | ตอนที่ 4 ผิด","ง":"ตอนที่ 1 ถูก | ตอนที่ 2 ถูก | ตอนที่ 3 ผิด | ตอนที่ 4 ถูก"},"a":"ง","exp":"ตอนที่ 1 ถูก (ตามมาตรา 29, 41) ตอนที่ 2 ถูก (ตามมาตรา 32 (1)) ตอนที่ 3 ผิด เนื่องจากมาตรา 33 กำหนดว่ากรณีสั่งส่งสงเคราะห์เมื่อผู้ปกครองไม่ยินยอม \"ผู้ว่าราชการจังหวัดต้องฟังรายงานและความเห็นของแพทย์และนักสังคมสงเคราะห์ก่อน\" และตอนที่ 4 ถูก (ขยายเวลาได้ไม่เกิน 24 ปีตามมาตรา 33 วรรคห้า)"},{"id":71,"q":"ข้อใดกล่าวไม่ถูกต้องตามพระราชบัญญัติคุ้มครองเด็ก พ.ศ. 2546","opts":{"ก":"เด็กที่พ่อแม่หย่าร้าง เข้าเงื่อนไขเด็กที่พึงได้รับการคุ้มครองสวัสดิภาพ","ข":"เด็กที่เสี่ยงต่อการเป็นผู้ค้ายาเสพติด เข้าเงื่อนไขเด็กที่พึงได้รับการคุ้มครองสวัสดิภาพ","ค":"เด็กที่ถูกข่มขืน ทำให้เป็นโรคซึมเศร้า เข้าเงื่อนไขเด็กที่พึงได้รับการคุ้มครองสวัสดิภาพ","ง":"การส่งเสริมความประพฤตินักเรียน โรงเรียนต้องจัดให้มีระบบงานแนะแนวให้คำปรึกษาแก่เด็กและผู้ปกครอง"},"a":"ก","exp":"เด็กที่พ่อแม่หย่าร้างและเดือดร้อน จัดเป็น \"เด็กที่อยู่ในสภาพยากลำบาก\" ซึ่งกฎหมายกำหนดให้เป็นเด็กที่พึงได้รับการสงเคราะห์ (มาตรา 32 (3)) ไม่ใช่กลุ่มคุ้มครองสวัสดิภาพ (มาตรา 40) ตัวเลือก ก. จึงเป็นคำอธิบายที่ผิด"},{"id":72,"q":"จากการตรวจสอบพบเด็ก 6 รายในสภาวะต่อไปนี้: 1. เด็กหญิงน้อยหน่า ถูกพ่อแม่ตีและทำร้ายร่างกายเป็นประจำ 2. เด็กชายมดแดง ใช้ชีวิตเร่ร่อนตามสถานีขนส่ง 3. เด็กชายกัปตัน ถูกผู้ใหญ่จ้างวานให้ลักลอบขายบุหรี่และสุราในโรงเรียน 4. เด็กหญิงเค้ก ถูกทอดทิ้งและพลัดหลงจากผู้ปกครอง 5. เด็กชายบอล ถูกผู้ปกครองล่ามโซ่ขังไว้ภายในบ้าน 6. เด็กชายแดง ป่วยเป็นโรคภูมิคุ้มกันบกพร่อง ข้อใดวิเคราะห์กลุ่มเด็กที่เข้าเกณฑ์ \"เด็กที่พึงได้รับการคุ้มครองสวัสดิภาพ\" ได้ถูกต้องทั้งหมด","opts":{"ก":"ตอนที่ 1, 3 และ 5 วิเคราะห์ไม่ถูกต้อง ส่วนตอนที่ 2, 4 และ 6 วิเคราะห์ถูกต้อง","ข":"ตอนที่ 1 และ 2 วิเคราะห์ถูกต้อง ส่วนข้ออื่นวิเคราะห์ไม่ถูกต้อง","ค":"ตอนที่ 1, 3 และ 5 วิเคราะห์ถูกต้อง ส่วนตอนที่ 2, 4 และ 6 วิเคราะห์ไม่ถูกต้อง","ง":"ตอนที่ 1, 2, 3 และ 5 วิเคราะห์ถูกต้อง ส่วนตอนที่ 4 และ 6 วิเคราะห์ไม่ถูกต้อง"},"a":"ค","exp":"เด็กพึงได้รับการคุ้มครองสวัสดิภาพ (มาตรา 40) ได้แก่ (1) น้อยหน่า (ถูกทารุณกรรม) (3) กัปตัน (เสี่ยงต่อการกระทำผิด) และ (5) บอล (ถูกทารุ
