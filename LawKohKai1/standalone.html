<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --accent: #14b8a6;
  --accent2: #f59e0b;
  --danger: #ef4444;
  --success: #22c55e;
  --text: #f1f5f9;
  --muted: #94a3b8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Sarabun', 'Segoe UI', system-ui, sans-serif;
  background: linear-gradient(160deg, #0f172a 0%, #134e4a 100%);
  color: var(--text);
  min-height: 100dvh;
  overflow-x: hidden;
}
.app { max-width: 520px; margin: 0 auto; padding: 12px; min-height: 100dvh; display: flex; flex-direction: column; }
header {
  text-align: center; padding: 16px 8px 8px;
}
header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
header p { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
.screen { display: none; flex: 1; flex-direction: column; }
.screen.active { display: flex; }
.level-grid { display: grid; gap: 10px; margin-top: 12px; }
.level-card {
  background: var(--card);
  border-radius: 14px;
  padding: 14px 16px;
  border: 1px solid #334155;
  cursor: pointer;
  transition: transform .15s, border-color .15s;
  display: flex; justify-content: space-between; align-items: center;
}
.level-card:active { transform: scale(0.98); }
.level-card:hover { border-color: var(--accent); }
.level-card .info h3 { font-size: 0.95rem; margin-bottom: 2px; }
.level-card .info span { font-size: 0.75rem; color: var(--muted); }
.badge {
  background: #0f766e33; color: var(--accent);
  font-size: 0.7rem; padding: 4px 8px; border-radius: 999px; font-weight: 600;
}
.progress-bar {
  height: 6px; background: #334155; border-radius: 3px; margin-top: 8px; overflow: hidden;
}
.progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--accent); color: #042f2e; border: none; border-radius: 12px;
  padding: 12px 20px; font-size: 1rem; font-weight: 700; cursor: pointer;
  transition: opacity .15s, transform .1s;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-outline {
  background: transparent; border: 1.5px solid #475569; color: var(--text);
}
.btn-danger { background: var(--danger); color: white; }
.btn-row { display: flex; gap: 10px; margin-top: 16px; }
.btn-row .btn { flex: 1; }

/* Quiz */
.quiz-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0 12px; border-bottom: 1px solid #334155; margin-bottom: 12px;
}
.quiz-header .score { font-weight: 700; color: var(--accent2); }
.q-num { font-size: 0.8rem; color: var(--muted); }
.question-box {
  background: var(--card); border-radius: 16px; padding: 18px;
  border: 1px solid #334155; margin-bottom: 14px; line-height: 1.55;
  font-size: 1.02rem;
}
.options { display: flex; flex-direction: column; gap: 8px; }
.opt {
  background: #0f172a; border: 1.5px solid #334155; border-radius: 12px;
  padding: 12px 14px; text-align: left; cursor: pointer; font-size: 0.95rem;
  transition: border-color .15s, background .15s; display: flex; gap: 10px; align-items: flex-start;
}
.opt:hover { border-color: var(--accent); }
.opt .letter {
  flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;
  background: #1e293b; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 0.85rem; color: var(--accent);
}
.opt.correct { border-color: var(--success); background: #14532d44; }
.opt.wrong { border-color: var(--danger); background: #7f1d1d44; }
.opt.disabled { pointer-events: none; opacity: 0.85; }
.feedback {
  margin-top: 12px; padding: 10px 14px; border-radius: 10px; font-size: 0.9rem;
  display: none;
}
.feedback.show { display: block; }
.feedback.ok { background: #14532d55; color: #86efac; }
.feedback.bad { background: #7f1d1d55; color: #fca5a5; }

/* Result */
.result-card {
  background: var(--card); border-radius: 18px; padding: 24px; text-align: center;
  border: 1px solid #334155; margin-top: 20px;
}
.result-card .big-score { font-size: 3rem; font-weight: 800; color: var(--accent); }
.result-card .stars { font-size: 1.8rem; margin: 8px 0; letter-spacing: 4px; }
.stat-row { display: flex; justify-content: space-around; margin: 16px 0; }
.stat-row div { text-align: center; }
.stat-row .n { font-size: 1.4rem; font-weight: 700; }
.stat-row .l { font-size: 0.75rem; color: var(--muted); }

.footer-note {
  text-align: center; font-size: 0.7rem; color: #64748b; margin-top: auto; padding: 16px 0 8px;
}
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
  background: #1e293b; color: white; padding: 10px 18px; border-radius: 10px;
  font-size: 0.85rem; border: 1px solid #334155; transition: transform .3s; z-index: 99;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.mode-toggle {
  display: flex; gap: 6px; margin: 10px 0; justify-content: center;
}
.mode-toggle button {
  background: #1e293b; border: 1px solid #334155; color: var(--muted);
  padding: 6px 14px; border-radius: 999px; font-size: 0.8rem; cursor: pointer;
}
.mode-toggle button.active { background: var(--accent); color: #042f2e; border-color: var(--accent); font-weight: 600; }

.level-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.level-actions button{font-size:.75rem;padding:6px 12px;border-radius:8px;border:none;cursor:pointer;font-family:inherit}
.btn-continue{background:#14b8a6;color:#fff}
.btn-wrong{background:#f59e0b;color:#fff}
.btn-restart{background:#334155;color:#e2e8f0}
.wrong-badge{background:#f59e0b;color:#fff;font-size:.7rem;padding:2px 8px;border-radius:10px;margin-left:6px}

#qText, .q-text {
  white-space: pre-wrap !important;
  word-break: break-word !important;
  overflow: visible !important;
  max-height: none !important;
  font-size: 1rem;
  line-height: 1.65;
}
.q-box, #qBox {
  overflow: visible !important;
  max-height: none !important;
}
.opt, .option {
  white-space: pre-wrap !important;
  word-break: break-word !important;
  overflow: visible !important;
  max-height: none !important;
  line-height: 1.5;
}
#quiz, .quiz-area {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}



#qText {
  white-space: pre-wrap !important;
  word-break: break-word !important;
  overflow: visible !important;
  max-height: none !important;
  line-height: 1.65;
}
.opt {
  white-space: pre-wrap !important;
  word-break: break-word !important;
}

.feedback, .feedback.show, #feedback {
  white-space: pre-wrap !important;
  word-break: break-word !important;
  overflow: visible !important;
  max-height: none !important;
  height: auto !important;
  line-height: 1.6 !important;
  font-size: 0.88rem !important;
  padding: 12px 14px !important;
  margin: 10px 0 !important;
}
#qText {
  white-space: pre-wrap !important;
  word-break: break-word !important;
  overflow: visible !important;
  max-height: none !important;
}
.opt { white-space: pre-wrap !important; word-break: break-word !important; }
#quiz { overflow-y: auto !important; -webkit-overflow-scrolling: touch; }

</style>
</head>
<body>
<div class="app">
  <!-- HOME -->
  <div id="home" class="screen active">
    <header>
      <h1>📚 ตะลุยข้อสอบครูผู้ช่วย</h1>
      <p>เกมทบทวนกฎหมายการศึกษา • ข้อมูลเก็บบนเครื่องคุณเท่านั้น</p>
    </header>
    <div class="mode-toggle">
      <button class="active" data-mode="practice">ฝึกซ้อม</button>
      <button data-mode="exam">จำลองสอบ</button>
    </div>
    <div class="level-grid" id="levelGrid"></div>
    <div class="btn-row" style="margin-top:20px">
      <button class="btn btn-outline" onclick="resetAllProgress()">ล้างประวัติทั้งหมด</button>
    </div>
    <p class="footer-note">PWA • Offline • localStorage • ไม่ส่งข้อมูลออกนอกเครื่อง</p>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="screen">
    <div class="quiz-header">
      <button class="btn btn-outline" style="padding:6px 12px;font-size:0.85rem" onclick="goHome()">← กลับ</button>
      <div class="q-num" id="qProgress">1 / 40</div>
      <div class="score" id="liveScore">0 คะแนน</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="qBar" style="width:0%"></div></div>
    <div class="question-box" id="qText"></div>
    <div class="options" id="opts"></div>
    <div class="feedback" id="feedback"></div>
    <div class="btn-row">
      <button class="btn" id="nextBtn" style="display:none" onclick="nextQ()">ข้อถัดไป →</button>
    </div>
  </div>

  <!-- RESULT -->
  <div id="result" class="screen">
    <div class="result-card">
      <div class="stars" id="stars">★★★</div>
      <div class="big-score" id="finalScore">0%</div>
      <p id="resultMsg">ยอดเยี่ยม!</p>
      <div class="stat-row">
        <div><div class="n" id="rCorrect">0</div><div class="l">ถูก</div></div>
        <div><div class="n" id="rWrong">0</div><div class="l">ผิด</div></div>
        <div><div class="n" id="rTotal">0</div><div class="l">ทั้งหมด</div></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-outline" onclick="goHome()">หน้าหลัก</button>
        <button class="btn" onclick="retryLevel()">เล่นอีกครั้ง</button>
      </div>
    </div>
  </div>
</div>

<script type="application/json" id="qdata">{"รัฐธรรมนูญ พ.ศ. 2560":[{"id":1,"q":"ข้อใดต่อไปนี้ “อธิบายสถานะของรัฐธรรมนูญแห่งราชอาณาจักรไทย พุทธศักราช 2560 ได้ถูกต้อง”","opts":{"ก":"เป็นรัฐธรรมนูญฉบับแรกของประเทศไทย","ข":"เป็นรัฐธรรมนูญฉบับที่ 20 ของประเทศไทย","ค":"เป็นรัฐธรรมนูญฉบับที่ 21 ของประเทศไทย","ง":"เป็นรัฐธรรมนูญฉบับล่าสุดโดยไม่มีการแก้ไขเพิ่มเติมใด ๆ"},"a":"ข","exp":"รัฐธรรมนูญแห่งราชอาณาจักรไทย พุทธศักราช 2560 ตราไว้ ณ วันที่ 6 เมษายน พ.ศ. 2560 ถือเป็นรัฐธรรมนูญฉบับที่ 20 ของประเทศไทย เป็นกฎหมายสูงสุดของประเทศ มีทั้งสิ้น 16 หมวด 279 มาตรา และ 1 บทเฉพาะกาล [1]"},{"id":2,"q":"พระมหากษัตริย์ผู้ทรงเป็นประมุขทรงใช้อำนาจนิติบัญญัติผ่านทางใด","opts":{"ก":"ศาล","ข":"องคมนตรี","ค":"รัฐสภา","ง":"คณะรัฐมนตรี"},"a":"ค","exp":"ตามรัฐธรรมนูญมาตรา 3 บัญญัติไว้ว่า อำนาจอธิปไตยเป็นของปวงชนชาวไทย พระมหากษัตริย์ผู้ทรงเป็นประมุขทรงใช้อำนาจนั้นทางรัฐสภา คณะรัฐมนตรี และศาล โดยอำนาจนิติบัญญัติจะทรงใช้ผ่านทาง \"รัฐสภา\" [5, 68]"},{"id":3,"q":"พระมหากษัตริย์ผู้ทรงเป็นประมุขทรงใช้อำนาจตุลาการผ่านทางใด","opts":{"ก":"รัฐสภา","ข":"คณะรัฐมนตรี","ค":"ศาล","ง":"องคมนตรี"},"a":"ค","exp":"ตามรัฐธรรมนูญมาตรา 3 พระมหากษัตริย์ผู้ทรงเป็นประมุขทรงใช้อำนาจอธิปไตยฝ่ายตุลาการผ่านทาง \"ศาล\" ซึ่งมีหน้าที่ในการพิจารณาพิพากษาอรรถคดีตามรัฐธรรมนูญและกฎหมาย [5, 68, 245]"},{"id":4,"q":"พระมหากษัตริย์ผู้ทรงเป็นประมุขทรงใช้อำนาจบริหารผ่านทางใด","opts":{"ก":"รัฐสภา","ข":"คณะรัฐมนตรี","ค":"ศาล","ง":"องคมนตรี"},"a":"ข","exp":"ตามรัฐธรรมนูญมาตรา 3 พระมหากษัตริย์ผู้ทรงเป็นประมุขทรงใช้อำนาจอธิปไตยฝ่ายบริหารผ่านทาง \"คณะรัฐมนตรี\" ซึ่งประกอบด้วยนายกรัฐมนตรีและรัฐมนตรีอื่น [5, 68, 216]"},{"id":5,"q":"ใครให้ความเห็นชอบกฎหมายสำหรับการปกครองและการบริหารประเทศ","opts":{"ก":"ศาล","ข":"คณะรัฐมนตรี","ค":"องค์กรอิสระ","ง":"รัฐสภา"},"a":"ง","exp":"ตามมาตรา 81 บัญญัติไว้ชัดเจนว่า ร่างพระราชบัญญัติประกอบรัฐธรรมนูญและร่างพระราชบัญญัติ จะตราขึ้นเป็นกฎหมายได้ก็แต่โดย \"คำแนะนำและยินยอมของรัฐสภา\" [128]"},{"id":6,"q":"ใครมีอำนาจหน้าที่การบริหารราชการแผ่นดินให้เป็นไปตามตัวบทกฎหมาย","opts":{"ก":"ศาล","ข":"คณะรัฐมนตรี","ค":"องค์กร าพโดยไม่เก็บค่าใช้จ่าย\" [8, 105]"},{"id":11,"q":"ตามรัฐธรรมนูญแห่งราชอาณาจักรไทย พุทธศักราช 2560 และที่แก้ไขเพิ่มเติม กำหนดให้หน่วยงานใดมีส่วนร่วมให้เด็กเล็กได้รับการดูแลและพัฒนาก่อนเข้ารับการศึกษา","opts":{"ก":"กระทรวงศึกษาธิการ","ข":"สพฐ.","ค":"องค์กรปกครองส่วนท้องถิ่น","ง":"ภาคประชาชน"},"a":"ค","exp":"ตามมาตรา 54 วรรคสอง บัญญัติว่า \"รัฐต้องดำเนินการให้เด็กเล็กได้รับการดูแลและพัฒนาก่อนเข้ารับการศึกษา... โดยส่งเสริมและสนับสนุนให้องค์กรปกครองส่วนท้องถิ่นและภาคเอกชนเข้ามีส่วนร่วมในการดำเนินการด้วย\" [8, 105]"},{"id":12,"q":"ตามรัฐธรรมนูญแห่งราชอาณาจักรไทย พุทธศักราช 2560 “รัฐต้องดำเนินการจัดตั้งกองทุนเพื่อใช้ในการช่วยเหลือผู้ขาดแคลนทุนทรัพย์เพื่อลดความเหลื่อมล้ำในการศึกษาตามข้อใด”","opts":{"ก":"จัดตั้งกองทุนเพื่อความเสมอภาคทางการศึกษา (กสศ.)","ข":"จัดตั้งกองทุนสำรองเลี้ยงชีพ","ค":"จัดตั้งกองทุนเงินกู้ยืมเพื่อการศึกษาที่ผูกกับรายได้ในอนาคต (กรอ.)","ง":"จัดตั้งกองทุนเงินให้กู้ยืมเพื่อการศึกษา (กยศ.)"},"a":"ก","exp":"รัฐธรรมนูญมาตรา 54 วรรคท้าย กำหนดให้จัดตั้งกองทุนช่วยเหลือผู้ขาดแคลนทุนทรัพย์เพื่อลดความเหลื่อมล้ำทางการศึกษา และพัฒนาครู ซึ่งส่งผลให้เกิดการตรากฎหมายจัดตั้ง \"กองทุนเพื่อความเสมอภาคทางการศึกษา (กสศ.)\" ที่มีสถานะเป็นหน่วยงานของรัฐในกำกับของฝ่ายบริหาร [9, 10, 107]"},{"id":13,"q":"ตามรัฐธรรมนูญแห่งราชอาณาจักรไทย พุทธศักราช 2560 “รัฐต้องดำเนินการให้เด็กทุกคนได้รับการศึกษาเป็นเวลา 12 ปี ตั้งแต่ก่อนวัยเรียนจนจบการศึกษาภาคบังคับอย่างมีคุณภาพอย่างไร”","opts":{"ก":"จัดตั้งแต่แรกเกิดหรือจัดตั้งแต่พบความพิการ","ข":"เงินอุดหนุนจากรัฐรายเดือนสำหรับผู้ปกครอง","ค":"เรียนฟรีโดยไม่เก็บค่าใช้จ่าย","ง":"สินเชื่อทางการเงินผ่อนชำระค่าการศึกษา"},"a":"ค","exp":"รัฐธรรมนูญมาตรา 54 วรรคหนึ่ง บัญญัติชัดเจนว่า \"อย่างมีคุณภาพโดยไม่เก็บค่าใช้จ่าย\" หรือที่เรียกทั่วไปว่าเรียนฟรี [8, 105]"},{"id":14,"q":"ข้อใดกล่าวไม่ถูกต้องเกี่ยวกับคุณลักษณะของปวงชนชาวไทยตามรัฐธรรมนูญแห่งราชอาณาจักรไทย พ.ศ. 2560 และที่แก้ไขเพิ่มเติม","opts":{"ก":"มุ่งพัฒนาผู้เรียนสามารถเชี่ยวชาญได้ตามความถนัดของตน","ข":"มุ่งพัฒนาผู้เรียนให้มีวินัย","ค":"มุ่งพัฒนาผู้เรียนให้ภูมิใจในตน","ง":"มุ่งพัฒนาผู้เรียนให้ภูมิใ ค":"รัฐต้องดำเนินการให้เด็กทุกคนได้รับการศึกษาเป็นเวลา 12 ปี ตั้งแต่ก่อนวัยเรียนจนจบการศึกษาขั้นพื้นฐาน (ป.1-ม.6) อย่างมีคุณภาพโดยไม่เก็บค่าใช้จ่าย","ง":"กองทุนเพื่อความเสมอภาคทางการศึกษา (กสศ.) เพื่อลดความเหลื่อมล้ำในการศึกษา และเพื่อเสริมสร้างและพัฒนาคุณภาพและประสิทธิภาพครู"},"a":"ค","exp":"เพราะตามมาตรา 54 รัฐต้องดำเนินการจัดการศึกษาให้ \"ตั้งแต่ก่อนวัยเรียนจนจบการศึกษาภาคบังคับ\" (ป.1 - ม.3) ไม่ใช่ \"จนจบการศึกษาขั้นพื้นฐาน (ป.1 - ม.6)\" [8, 10, 105]"},{"id":27,"q":"ข้อใดกล่าวไม่ถูกต้องตามรัฐธรรมนูญแห่งราชอาณาจักรไทย พ.ศ. 2560 และที่แก้ไขเพิ่มเติม","opts":{"ก":"ให้เด็กเล็กได้รับการดูแลและพัฒนาก่อนเข้ารับการศึกษา ส่งเสริมและสนับสนุนให้องค์กรปกครองส่วนท้องถิ่นและภาคเอกชนเข้ามีส่วนร่วม","ข":"รัฐต้องดำเนินการให้เด็กทุกคนได้รับการศึกษาตั้งแต่ระดับก่อนประถมศึกษาจนจบการศึกษาภาคบังคับอย่างมีคุณภาพโดยไม่เก็บค่าใช้จ่าย","ค":"รัฐต้องดำเนินการให้เด็กทุกคนได้รับการศึกษาเป็นเวลา 12 ปี","ง":"ตุลาการศาลรัฐธรรมนูญ มีจำนวน 9 คน ซึ่งพระมหากษัตริย์ทรงแต่งตั้ง"},"a":"ข","exp":"เช่นเดียวกับข้อ 25 บทบัญญัติแห่งรัฐธรรมนูญใช้คำว่า \"ตั้งแต่ก่อนวัยเรียน\" มิใช่ \"ก่อนประถมศึกษา\" [8, 105]"},{"id":28,"q":"ข้อใดกล่าวไม่ถูกต้องตามรัฐธรรมนูญแห่งราชอาณาจักรไทย พ.ศ. 2560 และที่แก้ไขเพิ่มเติม","opts":{"ก":"รัฐธรรมนูญแห่งราชอาณาจักรไทย พ.ศ. 2560 มีการแก้ไขเพิ่มเติมถึงฉบับที่ 1","ข":"รัฐพึงอุปถัมภ์และคุ้มครองพระพุทธศาสนาและศาสนาอื่น","ค":"บุคคลมีหน้าที่ดำเนินการบังคับใช้กฎหมายอย่างเคร่งครัด","ง":"บุคคลมีหน้าที่ร่วมมือและสนับสนุนการอนุรักษ์และคุ้มครองสิ่งแวดล้อม และมรดกทางวัฒนธรรม"},"a":"ค","exp":"ตามมาตรา 53 การบังคับใช้กฎหมายอย่างเคร่งครัดบัญญัติให้เป็น \"หน้าที่ของรัฐ\" (\"รัฐต้องดูแลให้มีการปฏิบัติตามและบังคับใช้กฎหมายอย่างเคร่งครัด\") ส่วนบุคคลหรือประชาชนมีหน้าที่เพียง \"ปฏิบัติตามกฎหมายอย่างเคร่งครัด\" ตามมาตรา 50 (๓) เท่านั้น [8, 103, 105]"},{"id":29,"q":"ตามรัฐธรรมนูญแห่งราชอาณาจักรไทย พ.ศ. 2560 สิทธิและเสรีภาพในการแสดงความคิดเห็น ยกเว้นข้อใด","opts":{"ก":"เสรีภาพในการแสดงความคิดเห็นที่อยู่ภายใต้ข้อจำกัดเพื่อประโยชน์ในการรักษาความมั่นคงของรัฐ","ข":"เสรีภาพในการแสดงความคิดเห็น การพูด การพิมพ์ และการโฆษณา","ค":"เสรีภาพในการแสดงความคิดเห็นที่มีลักษณะกระทบต่อสิทธิและเสรีภาพของบุคคลอื่น","ง":"ถูกทั้งข้อ ก และ ข้อ ค"},"a":"ง","exp":"ตามมาตรา 34 วรรคหนึ่ง กำหนดให้บุคคลย่อมมีเสรีภาพในการแสดงความคิดเห็น การพูด การเขียน การพิมพ์ และการโฆษณา แต่จะจำกัดเสรีภาพดังกล่าวไม่ได้ \"เว้นแต่\" อาศัยอำนาจตามบทบัญญัติแห่งกฎหมายที่ตราขึ้นเฉพาะเพื่อรักษาความมั่นคงของรัฐ คุ้มครองสิทธิหรือเสรีภาพของบุคคลอื่น รักษาความสงบเรียบร้อยหรือศีลธรรมอันดี หรือเพื่อป้องกันสุขภาพของประชาชน ดังนั้น ทั้งข้อ ก และ ค จึงเป็นข้อยกเว้นและข้อจำกัดสิทธิที่รัฐธรรมนูญยินยอมให้ตรากฎหมายจำกัดได้ [88]"},{"id":30,"q":"ตามรัฐธรรมนูญแห่งราชอาณาจักรไทย พ.ศ. 2560 ข้อใดเป็นการกระทำที่ละเมิดสิทธิและเสรีภาพในชีวิตและร่างกายที่ไม่สามารถกระทำได้","opts":{"ก":"บุคคลใช้ความรุนแรงทำร้ายร่างกายสมาชิกในครอบครัวจนได้รับบาดเจ็บจากการทะเลาะวิวาทภายในบ้าน","ข":"เจ้าหน้าที่รัฐเข้าระงับเหตุความรุนแรงในครอบครัวและควบคุมตัวผู้ก่อเหตุเพื่อป้องกันอันตรายที่อาจเกิดขึ้น","ค":"ประชาชนในชุมชนช่วยกันยับยั้งเหตุทำร้ายร่างกายและใช้กำลังตามสมควรเพื่อป้องกันความรุนแรง","ง":"บุคคลใช้กำลังตอบโต้เพื่อป้องกันตนเองเมื่อถูกคุกคามต่อชีวิตและร่างกายในสถานการณ์ฉุกเฉิน"},"a":"ก","exp":"บุคคลย่อมมีสิทธิและเสรีภาพในชีวิตและร่างกายตามมาตรา 28 การใช้ความรุนแรงทำร้ายร่างกายสมาชิกในครอบครัวจนได้รับบาดเจ็บถือเป็นการละเมิดสิทธิในร่างกายและขัดต่อกฎหมายอย่างชัดเจน ส่วนข้อ ข ค และ ง เป็นการเข้าระงับเหตุหรือป้องกันตนเองโดยชอบตามสมควรแก่เหตุภายใต้หลักกฎหมาย [84] ส่วนที่ 2: ข้อสอบแนว PISA ระดับวิเคราะห์และประยุกต์ใช้ (ข้อ 31 - 40)"},{"id":31,"q":"จากสถานการณ์ต่อไปนี้ ให้พิจารณาว่าข้อความใดสอดคล้องกับรัฐธรรมนูญแห่งราชอาณาจักรไทย พ.ศ. 2560 และที่แก้ไขเพิ่มเติม สถานการณ์: โรงเรียนแห่งหนึ่งปฏิเสธไม่รับเด็กเข้าเรียนโดยให้เหตุผลว่าไม่ใช่ภาคบังคับ ขณะเดียวกันมีประชาชนกลุ่มหนึ่งเรียกร้องให้รัฐสภาเข้ามาบริหารประเทศโดยตรงแทนคณะรัฐมนตรี และมีการวิพากษ์วิจารณ์ว่าการแต่งตั้งนายกรัฐมนตรีไม่ควรเกี่ยวข้องกับองค์กรอิสระตามรัฐธรรมนูญ พิจารณาข้อความต่อไปนี้: บุคคลมีหน้าที่เข้ารับการศึกษาในระดับการศึกษาภาคบังคับตามที่กฎหมายกำหนด แม้จะมีเหตุผลส่วนตัวหรือภาระครอบครัวก็ไม่อาจหลีกเลี่ยงหน้าที่ดังกล่าวได้ (สอดคล้องมาตรา 50(๔)) รัฐมีหน้าที่จัดให้เด็กทุกคนได้รับการศึกษาโดยไม่เสียค่าใช้จ่ายไม่น้อยกว่า 12 ปี ตั้งแต่ก่อนวัยเรียนจนจบการศึกษาภาคบังคับอย่างทั่วถึงและมีคุณภาพ (สอดคล้องมาตรา 54 วรรคหนึ่ง) รัฐสภาในฐานะผู้แทนของประชาชนมีอำนาจกำหนดนโยบายและอาจเข้ามาบริหารราชการแผ่นดินได้โดยตรงในกรณีที่มีความจำเป็น (ไม่สอดคล้อง - การบริหารประเทศเป็นหน้าที่ของคณะรัฐมนตรี รัฐสภามีอำนาจนิติบัญญัติ) พระมหากษัตริย์ทรงแต่งตั้งนายกรัฐมนตรีตามมติของรัฐสภาและตามบทบัญญัติแห่งรัฐธรรมนูญ (สอดคล้อง) คำถาม: หากพิจารณาตามรัฐธรรมนูญ ข้อใด “สอดคล้อง” และ “ไม่สอดคล้อง” อย่างถูกต้อง","opts":{"ก":"ข้อ 1) และ 2)","ข":"ข้อ 1) 2) และ 4)","ค":"ข้อ 2) และ 3)","ง":"ถูกทุกข้อ"},"a":"ข","exp":"ข้อความที่ 1, 2 และ 4 มีความสอดคล้องกับตัวบทกฎหมายรัฐธรรมนูญ ส่วนข้อความที่ 3 ไม่สอดคล้อง เพราะตามระบบการปกครองของไทยมีการแบ่งแยกอำนาจอธิปไตยออกเป็นสามฝ่ายอย่างชัดเจน รัฐสภามีอำนาจนิติบัญญัติ ไม่มีอำนาจก้าวก่ายและเข้ามาบริหารราชการแผ่นดินโดยตรงซึ่งเป็นอำนาจเฉพาะของคณะรัฐมนตรี [5, 68, 216]"},{"id":32,"q":"[สถานการณ์ข้อ 31] โรงเรียนแห่งหนึ่งปฏิเสธไม่รับเด็กเข้าเรียนโดยให้เหตุผลว่าไม่ใช่ภาคบังคับ ขณะเดียวกันมีประชาชนกลุ่มหนึ่งเรียกร้องให้รัฐสภาเข้ามาบริหารประเทศโดยตรงแทนคณะรัฐมนตรี และมีการวิพากษ์วิจารณ์ว่าการแต่งตั้งนายกรัฐมนตรีไม่ควรเกี่ยวข้องกับองค์กรอิสระตามรัฐธรรมนูญ พิจารณาข้อความต่อไปนี้: บุคคลมีหน้าที่เข้ารับการศึกษาในระดับการศึกษาภาคบังคับตามที่กฎหมายกำหนด แม้จะมีเหตุผลส่วนตัวหรือภาระครอบครัวก็ไม่อาจหลีกเลี่ยงหน้าที่ดังกล่าวได้ (สอดคล้องมาตรา 50(๔)) รัฐมีหน้าที่จัดให้เด็กทุกคนได้รับการศึกษาโดยไม่เสียค่าใช้จ่ายไม่น้อยกว่า 12 ปี ตั้งแต่ก่อนวัยเรียนจนจบการศึกษาภาคบังคับอย่างทั่วถึงและมีคุณภาพ (สอดคล้องมาตรา 54 วรรคหนึ่ง) รัฐสภาในฐานะผู้แทนของประชาชนมีอำนาจกำหนดนโยบายและอาจเข้ามาบริหารราชการแผ่นดินได้โดยตรงในกรณีที่มีความจำเป็น (ไม่สอดคล้อง - การบริหารประเทศเป็นหน้าที่ของคณะรัฐมนตรี รัฐสภามีอำนาจนิติบัญญัติ) พระมหากษัตริย์ทรงแต่งตั้งนายกรัฐมนตรีตามมติของรัฐสภาและตามบทบัญญัติแห่งรัฐธรรมนูญ (สอดคล้อง)\n\nจากสถานการณ์ข้อ 31 หากให้พิจารณาเปรียบเทียบแนวคิดต่อไปนี้: A) ให้รัฐสภามีอำนาจบริหารราชการแผ่นดินโดยตรง (ไม่สอดคล้อง) B) ให้เอกชนและท้องถิ่นร่วมจัดศูนย์พัฒนาเด็กเล็ก (สอดคล้องตามมาตรา 54 วรรคสอง) C) ลดบทบาทรัฐในการจัดการศึกษาก่อนวัยเรียน (ไม่สอดคล้อง - รัฐมีหน้าที่โดยตรง) D) รณรงค์ให้ประชาชนต่อต้านการทุจริตทุกรูปแบบ (สอดคล้องตามมาตรา 50(๑๐) และมาตรา 78) คำถาม: หากพิจารณาตามรัฐธรรมนูญ ข้อใด “สอดคล้อง” และ “ไม่สอดคล้อง” อย่างถูกต้อง","opts":{"ก":"สอดคล้อง: B, C \\| ไม่สอดคล้อง: A, D","ข":"สอดคล้อง: A, B \\| ไม่สอดคล้อง: C, D","ค":"สอดคล้อง: B, D \\| ไม่สอดคล้อง: A, C","ง":"สอดคล้อง: ทุกข้อ"},"a":"ค","exp":"นโยบายที่สอดคล้องคือ B (มาตรา 54 วรรคสอง กำหนดส่งเสริมให้ อปท. และเอกชนร่วมพัฒนาเด็กเล็กก่อนวัยเรียน) และ D (สอดคล้องกับหน้าที่ปวงชนในการไม่ร่วมมือและต่อต้านการทุจริต) ส่วนนโยบายที่ไม่สอดคล้องคือ A (รัฐสภาไม่มีอำนาจบริหารโดยตรง) และ C (ขัดแย้งกับหน้าที่ของรัฐที่ต้องดูแลเด็กก่อนวัยเรียน) [102, 105, 126]"},{"id":33,"q":"ให้พิจารณาข้อความแล้วตอบคำถาม สถานการณ์: ชุมชนแห่งหนึ่งรวมตัวกันคัดค้านโครงการก่อสร้างโรงงานในพื้นที่ เนื่องจากเกรงว่าจะส่งผลกระทบต่อสิ่งแวดล้อมและสุขภาพของประชาชน โดยมีการยื่นหนังสือร้องเรียนต่อหน่วยงานรัฐและจัดเวทีแสดงความคิดเห็น ขณะเดียวกัน หน่วยงานรัฐได้ชี้แจงว่าโครงการดังกล่าวผ่านการพิจารณาตามขั้นตอนแล้ว และประชาชนบางส่วนไม่จำเป็นต้องเข้าร่วมการแสดงความคิดเห็นก็ได้คำถาม: จากสถานการณ์ข้างต้น ข้อใดกล่าวได้ถูกต้องตามหลักสิทธิและหน้าที่ของรัฐตามรัฐธรรมนูญแห่งราชอาณาจักรไทย พ.ศ. 2560 และที่แก้ไขเพิ่มเติม","opts":{"ก":"ประชาชนมีสิทธิแสดงความคิดเห็นภายใต้กรอบที่รัฐกำหนด และเมื่อโครงการผ่านขั้นตอนแล้ว รัฐอาจไม่จำเป็นต้องเปิดรับฟังเพิ่มเติม","ข":"ประชาชนมีสิทธิแสดงความคิดเห็นและมีส่วนร่วมในกระบวนการตัดสินใจของรัฐ โดยรัฐยังคงมีหน้าที่ต้องเปิดโอกาสให้มีส่วนร่วมอย่างต่อเนื่องแม้โครงการจะผ่านขั้นตอนแล้ว","ค":"ประชาชนสามารถแสดงความคิดเห็นได้เฉพาะในขั้นตอนที่รัฐกำหนดเท่านั้น และเมื่อพ้นระยะเวลาดังกล่าวสิทธิย่อมสิ้นสุดลง","ง":"การมีส่วนร่วมของประชาชนเป็นเพียงกลไกเสริม มิใช่หน้าที่ที่รัฐต้องดำเนินการอย่างเป็นรูปธรรม"},"a":"ข","exp":"ตามมาตรา 43 (๓) บัญญัติรับรองสิทธิของบุคคลและชุมชนในการเข้าชื่อกันเสนอแนะต่อหน่วยงานของรัฐเพื่อดำเนินการอันเป็นประโยชน์ หรือให้งดเว้นการดำเนินการที่กระทบต่อความเป็นอยู่อย่างสงบสุข และมาตรา 58 กำหนดว่าการดำเนินการใดๆ ของรัฐหรือที่รัฐอนุญาตอันอาจกระทบต่อสิ่งแวดล้อมและสุขภาพอย่างรุนแรง รัฐ \"ต้อง\" ดำเนินการศึกษาประเมินผลกระทบและจัดรับฟังความคิดเห็นของประชาชนก่อน และต้องระวังให้เกิดผลกระทบต่อประชาชนน้อยที่สุดและมีการเยียวยาอย่างเป็นธรรม การรับฟังจึงต้องเปิดกว้างและต่อเนื่อง มิใช่ตัดสิทธิเมื่อผ่านกระบวนการเบื้องต้นแล้ว [97, 111, 112]"},{"id":34,"q":"จากสถานการณ์ต่อไปนี้ ให้พิจารณาว่าข้อความใดสอดคล้องกับรัฐธรรมนูญแห่งราชอาณาจักรไทย พ.ศ. 2560 และที่แก้ไขเพิ่มเติม A) อนุญาตให้สถานศึกษาเรียกเก็บค่าใช้จ่ายในระดับการศึกษาภาคบังคับ (ไม่สอดคล้อง - ขัดกับมาตรา 54 ที่ต้องเรียนฟรี) B) สนับสนุนกองทุนเพื่อความเสมอภาคทางการศึกษา (กสศ.) เพื่อลดความเหลื่อมล้ำ (สอดคล้องตามมาตรา 54 วรรคท้าย) C) ปรับหลักสูตรโดยลดเนื้อหาด้านคุณธรรม เหลือเน้นเฉพาะวิชาการ (ไม่สอดคล้อง - ขัดกับมาตรา 54 วรรคสี่ ที่การศึกษาต้องมุ่งพัฒนาผู้เรียนให้เป็นคนดี มีวินัย) D) คงจำนวนสมาชิกสภาผู้แทนราษฎร 500 คน และสมาชิกวุฒิสภา 200 คน (สอดคล้องตามมาตรา 83 และ 107) E) รับรองสิทธิเลือกตั้งของผู้ได้รับการแปลงสัญชาติไทยเกิน 5 ปี (สอดคล้องตามมาตรา 95(๑)) คำถาม: ข้อใดสอดคล้องของนโยบายกับรัฐธรรมนูญ ได้ถูกต้องที่สุด","opts":{"ก":"นโยบายที่สอดคล้องคือ B และ C / ไม่สอดคล้องคือ A D และ E","ข":"นโยบายที่สอดคล้องคือ A B และ D / ไม่สอดคล้องคือ C และ E","ค":"นโยบายที่สอดคล้องคือ B D และ E / ไม่สอดคล้องคือ A และ C","ง":"นโยบายทั้งหมดสอดคล้องรัฐธรรมนูญ"},"a":"ค","exp":"นโยบาย B, D, E เป็นสิ่งที่สอดคล้องและได้รับการรับรองตามรัฐธรรมนูญอย่างถูกต้อง ส่วนนโยบาย A (เรียกเก็บเงินในภาคบังคับ) และนโยบาย C (ตัดคุณธรรม) ขัดต่อมาตรา 54 เรื่องสิทธิการเรียนฟรีอย่างมีคุณภาพและการมุ่งพัฒนาผู้เรียนให้เป็นคนดีมีวินัย [105, 107, 131, 146, 160]"},{"id":35,"q":"จากสถานการณ์ต่อไปนี้ ให้พิจารณาว่าข้อความใดสอดคล้องกับรัฐธรรมนูญแห่งราชอาณาจักรไทย พ.ศ. 2560 และที่แก้ไขเพิ่มเติม A) กำหนดให้องค์กรอิสระตามรัฐธรรมนูญมีวาระการดำรงตำแหน่ง 7 ปี และดำรงตำแหน่งได้เพียงวาระเดียว (สอดคล้อง) B) การยกเลิกหรือแก้ไขคำสั่งของ คสช. ให้กระทำได้โดยตราเป็นพระราชกฤษฎีกาหรือกฎหมายเทียบเท่า (ไม่สอดคล้อง - ต้องกระทำเป็นพระราชบัญญัติ) C) การปรับโครงสร้างคณะกรรมการ ป.ป.ช. โดยกำหนดจำนวนกรรมการไม่เกิน 5 คน (ไม่สอดคล้อง - รธน. กำหนดให้มีกรรมการ 9 คน) D) กำหนดให้ผู้ตรวจการแผ่นดินประกอบด้วยบุคคลจำนวนไม่เกิน 3 คน (สอดคล้อง) E) กำหนดให้คณะกรรมการป้องกันและปราบปรามยาเสพติดมีสถานะเป็นองค์กรอิสระ (ไม่สอดคล้อง - รธน. กำหนดองค์กรอิสระไว้ 5 องค์กรเท่านั้น ป.ป.ส. ไม่เกี่ยว) คำถาม: ข้อใดกล่าวได้สอดคล้องกับรัฐธรรมนูญ 2560 และที่แก้ไขเพิ่มเติม","opts":{"ก":"สอดคล้อง: A B และ D / ไม่สอดคล้อง: C และ E","ข":"สอดคล้อง: A และ D / ไม่สอดคล้อง: B C และ E","ค":"สอดคล้อง: B และ C / ไม่สอดคล้อง: A D และ E","ง":"สอดคล้อง: ทุกข้อ"},"a":"ข","exp":"ข้อความ A (วาระองค์กรอิสระ 7 ปี วาระเดียว) และข้อความ D (ผู้ตรวจการแผ่นดินมี 3 คนตามมาตรา 228) มีความสอดคล้องถูกต้องตามกฎหมายรัฐธรรมนูญ ข้อความ B ผิด เพราะมาตรา 279 กำหนดให้ยกเลิกหรือแก้ไขประกาศ/คำสั่ง คสช. เป็น \"พระราชบัญญัติ\" (พ.ร.บ.) ไม่ใช่พระราชกฤษฎีกา ข้อความ C ผิด เพราะมาตรา 232 กำหนดให้ ป.ป.ช. มี 9 คนไม่ใช่ 5 คน ข้อความ E ผิด เพราะองค์กรอิสระตามรัฐธรรมนูญหมวด 12 มีเพียง 5 องค์กร (กกต. ผู้ตรวจการแผ่นดิน ป.ป.ช. คตง. กสม.) ไม่มี ป.ป.ส. [272, 274, 287, 291, 376]"},{"id":36,"q":"จากสถานการณ์ต่อไปนี้ ให้พิจารณาว่าข้อความใดสอดคล้องกับรัฐธรรมนูญแห่งราชอาณาจักรไทย พ.ศ. 2560 และที่แก้ไขเพิ่มเติม สถานการณ์: ในชุมชนแห่งหนึ่ง มีเหตุการณ์ดังนี้ นาย ก เห็นการทุจริตในหน่วยงานรัฐ แต่เลือกเพิกเฉย (ไม่ทำหน้าที่ตามมาตรา 50(๑๐)) นาย ข ไม่ไปใช้สิทธิเลือกตั้ง โดยให้เหตุผลว่า “ไม่สนใจการเมือง” (ไม่ทำหน้าที่ตามมาตรา 50(๗)) นาง ค ส่งบุตรหลานเข้าเรียนในการศึกษาภาคบังคับอย่างต่อเนื่อง (ทำหน้าที่ตามมาตรา 50(๔)) นาย ง เผยแพร่ข้อมูลบิดเบือน สร้างความแตกแยกในสังคม (ไม่ทำหน้าที่ตามมาตรา 50(๖)) นาง จ เข้าร่วมกิจกรรมของชุมชนเพื่อพัฒนาท้องถิ่นอย่างสม่ำเสมอ (ทำหน้าที่ตามมาตรา 50(๘) และ 78) คำถาม: ข้อใด “วิเคราะห์การปฏิบตัิตามหน้าที่ของปวงชนชาวไทย” ได้ถูกต้องที่สุด","opts":{"ก":"นาย ก และ นาย ข ปฏิบัติตามหน้าที่ / นาง ค และ นาง จ ไม่ปฏิบัติตามหน้าที่","ข":"นาง ค และ นาง จ ปฏิบัติตามหน้าที่ / นาย ก นาย ข และ นาย ง ไม่ปฏิบัติตามหน้าที่","ค":"นาย ข และ นาย ง ปฏิบัติตามหน้าที่ / คนอื่นไม่ปฏิบัติ","ง":"ทุกคนปฏิบัติตามหน้าที่ของปวงชนชาวไทย"},"a":"ข","exp":"ตามมาตรา 50 บุคคลมีหน้าที่พิทักษ์รักษาและปฏิบัติตามกฎหมายอย่างเคร่งครัด นาง ค (ทำหน้าที่ส่งบุตรหลานเรียนภาคบังคับตามอนุ ๔) และ นาง จ (ทำหน้าที่ร่วมมือพัฒนาชุมชนและอนุรักษ์ตามอนุ ๘) จึงเป็นผู้ปฏิบัติตามหน้าที่พลเมืองอย่างถูกต้อง ขณะที่ นาย ก, นาย ข และ นาย ง ละเลยหน้าที่ของปวงชนชาวไทยตามกฎหมายรัฐธรรมนูญ [102, 103, 126]"},{"id":37,"q":"จากสถานการณ์ต่อไปนี้ ให้พิจารณาว่าข้อความใดสอดคล้องกับรัฐธรรมนูญแห่งราชอาณาจักรไทย พ.ศ. 2560 และที่แก้ไขเพิ่มเติม สถานการณ์: กระทรวงศึกษาธิการกำลังพิจารณานโยบาย 4 แนวทาง เพื่อแก้ปัญหาความเหลื่อมล้ำทางการศึกษาและยกระดับคุณภาพผู้เรียน ดังนี้ 1.อนุญาตให้โรงเรียนเรียกเก็บค่าใช้จ่ายเพิ่มเติมในระดับการศึกษาภาคบังคับ เพื่อเพิ่มงบประมาณพัฒนาโรงเรียน (ไม่เหมาะสม - ขัดมาตรา 54) 2.จัดตั้งศูนย์พัฒนาเด็กเล็กในทุกชุมชน โดยร่วมมือกับองค์กรปกครองส่วนท้องถิ่นและภาคเอกชน (เหมาะสมตามมาตรา 54 วรรคสอง) 3.ปรับหลักสูตรให้เน้นผลสัมฤทธิ์ทางวิชาการเป็นหลัก โดยลดเนื้อหาด้านคุณธรรมและทักษะชีวิต (ไม่เหมาะสม - ขัดมาตรา 54 วรรคสี่) 4.จัดสรรงบประมาณผ่านกองทุนเพื่อความเสมอภาคทางการศึกษา เพื่อช่วยเหลือเด็กด้อยโอกาสอย่างทั่วถึง (เหมาะสมตามมาตรา 54 วรรคท้าย) คำถาม: หากพิจารณาตาม “หน้าที่ของรัฐด้านการศึกษา” ข้อใดเป็นการประเมินความเหมาะสมของนโยบายได้ถูกต้องที่สุด","opts":{"ก":"นโยบาย A และ C เหมาะสม เพราะช่วยยกระดับคุณภาพการศึกษา","ข":"นโยบาย B และ D เหมาะสม เพราะลดความเหลื่อมล้ำและพัฒนาผู้เรียนอย่างรอบด้าน","ค":"นโยบาย A B และ D เหมาะสม เพราะช่วยเพิ่มทรัพยากรทางการศึกษา","ง":"ทุกนโยบายมีความเหมาะสมเท่าเทียมกัน"},"a":"ข","exp":"นโยบาย B (ร่วมมือ อทร. และเอกชนดูแลเด็กเล็กก่อนวัยเรียน) และนโยบาย D (จัดสรรเงินผ่านกองทุน กสศ. ช่วยคนขาดแคลนทุนทรัพย์) มีความเหมาะสมและถูกต้องตรงตาม \"หน้าที่ของรัฐด้านการศึกษา\" ในมาตรา 54 ขณะที่นโยบาย A (เก็บเงิน) และนโยบาย C (ตัดวิชาคุณธรรม) ไม่เหมาะสมเพราะขัดต่อรัฐธรรมนูญ [105, 107]"},{"id":38,"q":"จากสถานการณ์ต่อไปนี้ ให้พิจารณาว่าข้อความใดสอดคล้องกับรัฐธรรมนูญแห่งราชอาณาจักรไทย พ.ศ. 2560 และที่แก้ไขเพิ่มเติม สถานการณ์: โรงเรียนแห่งหนึ่งในพื้นที่ชนบทพบว่า เด็กบางคนไม่ได้เข้าเรียนในระดับการศึกษาภาคบังคับอย่างต่อเนื่อง โดยมีการขาดเรียนบ่อยครั้งจนหลุดออกจากระบบการศึกษา เมื่อครูลงพื้นที่ติดตาม พบว่าผู้ปกครองให้เหตุผลว่าครอบครัวมีฐานะยากจน จำเป็นต้องให้เด็กช่วยทำงาน เช่น ทำไร่ ทำสวน หรือรับจ้างทั่วไป อีกทั้งยังมีความเชื่อว่าการเรียนหนังสือไม่จำเป็นต่อการดำรงชีวิตในชุมชน แม้โรงเรียนจะพยายามชี้แจงถึงความสำคัญของการศึกษา แต่ผู้ปกครองบางส่วนยังคงยืนยันตามเดิม และไม่ได้ส่งเด็กกลับเข้าสู่ระบบการศึกษา ขณะเดียวกัน หน่วยงานของรัฐในพื้นที่ยังไม่ได้มีมาตรการหรือการดำเนินการที่ชัดเจนในการติดตามหรือแก้ไขปัญหาอย่างจริงจัง ทำให้จำนวนเด็กที่ไม่ได้เข้าเรียนมีแนวโน้มเพิ่มขึ้น คำถาม: หากพิจารณาตาม “หน้าที่ของบุคคลและหน้าที่ของรัฐด้านการศึกษา” ข้อใดเหมาะสมที่สุด","opts":{"ก":"ผู้ปกครองมีสิทธิกำหนดแนวทางการศึกษาของบุตร และรัฐควรเคารพการตัดสินใจดังกล่าวตราบเท่าที่ไม่ขัดต่อความสมัครใจของเด็ก","ข":"การเข้ารับการศึกษาภาคบังคับเป็นหน้าที่ของบุคคล แต่การดำเนินการให้เกิดขึ้นเป็นดุลยพินิจของรัฐตามความพร้อมของพื้นที่","ค":"รัฐมีหน้าที่ต้องดำเนินการให้เด็กได้รับการศึกษาภาคบังคับอย่างทั่วถึง ขณะเดียวกันผู้ปกครองมีหน้าที่ต้องส่งเด็กเข้าเรียนตามที่กฎหมายกำหนด","ง":"หากผู้ปกครองมีเหตุผลทางเศรษฐกิจ รัฐอาจผ่อนผันการเข้าศึกษาภาคบังคับได้ตามความเหมาะสม"},"a":"ค","exp":"รัฐธรรมนูญแบ่งหน้าที่ไว้ชัดแจ้ง โดยการเข้าเรียนภาคบังคับเป็น \"หน้าที่ของบุคคล\" (ผู้ปกครองต้องส่งบุตรหลานเข้าเรียนตามมาตรา 50 (๔)) ในขณะเดียวกัน การจัดการศึกษาให้เด็กทุกคนเข้าถึงอย่างทั่วถึงและมีคุณภาพโดยไม่เก็บค่าใช้จ่ายเป็น \"หน้าที่ของรัฐ\" (ตามมาตรา 54) รัฐจึงต้องมีมาตรการเชิงรุกในการดูแลและผลักดันไม่ให้เด็กหลุดพ้นจากระบบการศึกษา [103, 105]"},{"id":39,"q":"จากสถานการณ์ต่อไปนี้ ให้พิจารณาว่าข้อความใดสอดคล้องกับรัฐธรรมนูญแห่งราชอาณาจักรไทย พ.ศ. 2560 และที่แก้ไขเพิ่มเติม สถานการณ์: โรงเรียนแห่งหนึ่งในชนบทพบว่า “เด็กจำนวนหนึ่งไม่ได้เข้าเรียน” โดยผู้ปกครองให้เหตุผลว่าเด็กต้องช่วยทำงานที่บ้าน และเห็นว่าไม่จำเป็นต้องเรียนครบ 9 ปี ฝ่ายบริหารโรงเรียนจึงประชุมกันเพื่อหาทางแก้ปัญหา โดยมีแนวทางดังนี้ เคารพดุลยพินิจของผู้ปกครองในการกำหนดเส้นทางชีวิตของบุตร โดยโรงเรียนทำหน้าที่เพียงให้ข้อมูลทางเลือกด้านการศึกษาโดยไม่แทรกแซงการตัดสินใจ ประสานหน่วยงานของรัฐที่เกี่ยวข้องเพื่อให้เด็กเข้าสู่ระบบการศึกษาภาคบังคับ พร้อมทั้งสร้างความเข้าใจแก่ผู้ปกครองถึงหน้าที่ตามกฎหมายและสิทธิของเด็กในการได้รับการศึกษาอย่างต่อเนื่อง เปิดโอกาสให้เด็กเข้าศึกษาตามความสมัครใจ โดยโรงเรียนอำนวยความสะดวกแก่ผู้ที่พร้อมเรียน และไม่บังคับผู้ที่มีภาระครอบครัว ปรับรูปแบบการจัดการศึกษาให้ยืดหยุ่น โดยลดระยะเวลาการศึกษาในระบบภาคบังคับลง และส่งเสริมการเรียนรู้ตามบริบทชีวิตของเด็กในชุมชน คำถาม: หากพิจารณาตาม “หน้าที่ของบุคคลและหน้าที่ของรัฐด้านการศึกษา” แนวทางใดเหมาะสมที่สุด","opts":{"ก":"1) เท่านั้น","ข":"2) เท่านั้น","ค":"2) และ 3)","ง":"1) และ 4)"},"a":"ข","exp":"แนวทางที่ 2) เป็นแนวทางเดียวที่สอดคล้องกับเจตนารมณ์ของรัฐธรรมนูญ เพราะการเรียนศึกษาภาคบังคับ (9 ปี) มีสถานะเป็น \"หน้าที่ของบุคคล\" และ \"หน้าที่ของรัฐ\" มิใช่ดุลยพินิจหรือเรื่องความสมัครใจที่ผู้ปกครองหรือเด็กจะเลือกปฏิเสธได้ตามอำเภอใจ และโรงเรียนไม่มีอำนาจในการลดระยะเวลาการศึกษาภาคบังคับเองตามแนวทางที่ 4) [10, 103, 105]"},{"id":40,"q":"จากสถานการณ์ต่อไปนี้ ให้พิจารณาว่าข้อความใดสอดคล้องกับรัฐธรรมนูญแห่งราชอาณาจักรไทย พ.ศ. 2560 และที่แก้ไขเพิ่มเติม สถานการณ์: ในพื้นที่กึ่งเมืองกึ่งชนบทแห่งหนึ่ง พบว่าเด็กเล็กจำนวนมากไม่ได้เข้าเรียนในระดับก่อนวัยเรียน เนื่องจากผู้ปกครองบางส่วนเห็นว่ายังไม่จำเป็น ขณะเดียวกัน เด็กบางคนที่อยู่ในช่วงการศึกษาภาคบังคับก็ขาดเรียนบ่อยครั้งเพราะต้องช่วยครอบครัวทำงาน องค์กรปกครองส่วนท้องถิ่นได้เสนอแนวทางให้ภาคเอกชนเข้ามาจัดศูนย์พัฒนาเด็กเล็กเพิ่มเติม พร้อมทั้งประสานกับหน่วยงานของรัฐเพื่อขอรับการสนับสนุนจาก “กองทุนเพื่อความเสมอภาคทางการศึกษา (กสศ.)” ในการช่วยเหลือเด็กยากจน และพัฒนาครูในพื้นที่ อย่างไรก็ตาม มีข้อถกเถียงในที่ประชุมว่า การศึกษาก่อนวัยเรียนไม่ใช่ภาคบังคับ รัฐอาจไม่จำเป็นต้องดำเนินการอย่างจริงจัง การส่งเด็กเข้าเรียนควรเป็นสิทธิของผู้ปกครอง ไม่ใช่หน้าที่ การจัดตั้งกองทุนช่วยเหลือเป็นเพียงนโยบาย ไม่ใช่หน้าที่ตามรัฐธรรมนูญ การให้เอกชนเข้ามามีส่วนร่วมอาจไม่สอดคล้องกับหน้าที่ของรัฐ คำถาม: จากสถานการณ์ข้างต้น ข้อใด “ประเมินได้สอดคล้องกับรัฐธรรมนูญมากที่สุด”","opts":{"ก":"รัฐอาจสนับสนุนการศึกษาก่อนวัยเรียนได้ตามความเหมาะสม แต่ไม่ถือเป็นหน้าที่โดยตรง ขณะที่การเข้ารับการศึกษาภาคบังคับขึ้นอยู่กับการตัดสินใจของผู้ปกครองเป็นสำคัญ","ข":"รัฐมีหน้าที่จัดการศึกษาให้เด็กได้รับอย่างต่อเนื่องตั้งแต่ก่อนวัยเรียนจนจบภาคบังคับ ส่งเสริมให้ท้องถิ่นและเอกชนมีส่วนร่วม รวมทั้งจัดให้มีกองทุนเพื่อลดความเหลื่อมล้ำ ขณะเดียวกันบุคคลมีหน้าที่เข้ารับการศึกษาภาคบังคับตามกฎหมาย","ค":"รัฐอาจเปิดโอกาสให้ท้องถิ่นและเอกชนมีส่วนร่วมในการจัดการศึกษาได้ตามความเหมาะสม แต่การจัดตั้งกองทุนด้านการศึกษาเป็นเพียงมาตรการเชิงนโยบาย มิใช่หน้าที่ที่ต้องดำเนินการโดยตรง","ง":"รัฐมีหน้าที่ด้านการศึกษาเป็นหลักในระดับภาคบังคับ โดยอาจขยายไปสู่ก่อนวัยเรียนหรือกองทุนช่วยเหลือได้ตามความพร้อม โดยไม่จำเป็นต้องดำเนินการให้ครอบคลุมทุกด้านอย่างต่อเนื่อง"},"a":"ข","exp":"เป็นข้อที่ประเมินและสรุปสาระสำคัญได้ถูกต้องและสอดคล้องกับมาตรา 54 (หน้าที่ของรัฐ) และมาตรา 50 (หน้าที่ของบุคคล) ในรัฐธรรมนูญ 2560 อย่างครอบคลุมครบถ้วนที่สุด เพราะระบุถึงความต่อเนื่องของการศึกษาตั้งแต่ \"ก่อนวัยเรียนถึงจบภาคบังคับ\" การร่วมมือของ อปท. และเอกชน การมีกองทุน กสศ. และการระบุว่าการเรียนศึกษาภาคบังคับเป็นหน้าที่ของปวงชนตามกฎหมาย [103, 105, 107]"}],"พ.ร.บ.การศึกษาแห่งชาติ พ.ศ. 2542":[{"id":1,"q":"กฎหมายแม่บทการศึกษา หมายถึงข้อใด (สพฐ.รอบทั่วไป 63, สอศ.กรณีพิเศษ 66, กรณีพิเศษ 68)","opts":{"ก":"พ.ร.บ.การศึกษาภาคบังคับ","ข":"พ.ร.บ. สภาครูและบุคลากรทางการศึกษา","ค":"พ.ร.บ.การศึกษาแห่งชาติ","ง":"แผนการศึกษาแห่งชาติ"},"a":"ค","exp":""},{"id":2,"q":"ผู้รักษาการตาม พ.ร.บ. การศึกษาแห่งชาติ 2542 และที่แก้ไขเพิ่มเติม คือใคร","opts":{"ก":"รัฐมนตรีว่าการกระทรวงศึกษาธิการ","ข":"นายกรัฐมนตรี","ค":"เลขาธิการ กพฐ.","ง":"เลขาธิการคุรุสภา"},"a":"ก","exp":""},{"id":3,"q":"\"การศึกษาขั้นพื้นฐาน\" ตาม พ.ร.บ.การศึกษาแห่งชาติ พ.ศ. 2542 ข้อใดกล่าวถูกต้องที่สุด (สพฐ. กรณีพิเศษ ปี 2560, สพฐ.กรณีพิเศษ 67, สพฐ.รอบทั่วไป 2568)","opts":{"ก":"การศึกษาก่อนวัยเรียนจนถึงระดับชั้นมัธยมศึกษาปีที่3","ข":"การศึกษาก่อนวัยเรียนจนถึงระดับชั้นมัธยมศึกษาปีที่ 6","ค":"การศึกษาก่อนวัยเรียนจนถึงระดับชั้นประถมศึกษาปีที่ 6","ง":"การศึกษาผสมผสานในระบบ การศึกษานอกระบบ และการศึกษาตามอัธยาศัย"},"a":"ข","exp":"สอดคล้องกับการศึกษาก่อนระด ระราชบัญญัติการศึกษาแห่งชาติ พ.ศ. 2542 และที่แก้ไขเพิ่มเติม” (1) นายสมชาย จัดเป็น “บุคลากรทางการศึกษา” ในฐานะผู้บริหารสถานศึกษา (2) นางสาวอรทัย จัดเป็น “บุคลากรทางการศึกษา” ในฐานะผู้บริหารการศึกษา (3) นายบอย จัดเป็น “ผู้สอน” ตามนิยามของกฎหมายฉบับนี้ (4) นางสาวนก สอดคล้องกับนิยามคำว่า “คณาจารย์” (5) นายหนึ่ง สอดคล้องกับนิยามคำว่า “คณาจารย์” คำถาม: ข้อความตอนใดกล่าว ถูกต้อง","opts":{"ก":"ตอนที่ 1) ตอนที่ 2) และตอนที่ 3)","ข":"ตอนที่ 1) ตอนที่ 2) และตอนที่ 4)","ค":"ตอนที่ 2) ตอนที่ 3) และตอนที่ 4)","ง":"ตอนที่ 2 ตอนที่ 3) และตอนที่ 5)","จ":"ตอนที่ 3) ตอนที่ 4) และตอนที่ 5)"},"a":"ข","exp":"นายสมชายและนางสาวอรทัยเป็นบุคลากรทางการศึกษาตามนิยามจริง นางสาวนกสอนอุดมศึกษาปริญญาจึงเป็นคณาจารย์จริง ส่วนนายบอยสอนกวดวิชาไม่เข้าข่ายผู้สอนตามระบบโรงเรียน และนายหนึ่งสอน ปวช.3 อาชีวะ ถือเป็นครู ไม่ใช่คณาจารย์ในอุดมศึกษา)"},{"id":97,"q":"สถานการณ์ : โรงเรียนแห่งหนึ่งในจังหวัดมหาสารคาม กำลังจัดประชุมครูใหม่เพื่อทำความเข้าใจเกี่ยวกับ พระราชบัญญัติการศึกษาแห่งชาติ พ.ศ. 2542 และที่แก้ไขเพิ่มเติม ในการประชุม ผู้อำนวยการโรงเรียนได้อธิบายว่า (1) พ.ร.บ.ฉบับนี้ถือเป็นกฎหมายแม่บทในการจัดการศึกษาของประเทศ (2) ผู้รักษาการตามกฎหมายฉบับนี้คือรัฐมนตรีว่าการกระทรวงศึกษาธิการ (3) การศึกษาขั้นพื้นฐาน หมายถึง การศึกษาที่ต่ำกว่าระดับขั้นพื้นฐาน (4) การศึกษาตลอดชีวิต คือ การศึกษาที่ผสมผสานระหว่างการศึกษานอกระบบและการศึกษาตามอัธยาศัยอย่างต่อเนื่องตลอดชีวิต (5) มาตรฐานการศึกษาขั้นพื้นฐาน คือข้อกำหนดเกี่ยวกับคุณลักษณะและคุณภาพที่พึงประสงค์ของผู้เรียนในสถานศึกษาทุกแห่ง คำถาม : จากสถานการณ์ข้างต้น ข้อความตอนใด “กล่าวไม่ถูกต้อง” ตาม พ.ร.บ.การศึกษาแห่งชาติ พ.ศ.2542 และที่แก้ไขเพิ่มเติม","opts":{"ก":"ตอนที่ 1) ตอนที่ 2)","ข":"ตอนที่ 2) ตอนที่ 3)","ค":"ตอนที่ 3) ตอนที่ 4)","ง":"ตอนที่ 4) ตอนที่ 5)","จ":"ตอนที่ 3) ตอนที่ 4) และตอนที่ 5)"},"a":"ค","exp":"ตอนที่ 3 ผิดเพราะการศึกษาขั้นพื้นฐานคือการศึกษาก่อนระดับอุดมศึกษา ไม่ใช่ต่ำกว่าขั้นพื้นฐาน และตอนที่ 4 ผิดเพราะการศึกษาตลอดชีวิตต้องผสมผสานทั้ง 3 ระบบคือ ในระบบ นอกระบบ และตามอัธยาศัย ขาดในระบบไป)"},{"id":98,"q":"สถานการณ์ : โรงเรียนเอกชนและโรงเรียนรัฐหลายแห่ง ในจังหวัดแห่งหนึ่ง ได้รับการประเมินคุณภาพภายนอก โดยคณะกรรมการได้สัมภาษณ์บุคลากรหลายฝ่าย พร้อมตรวจสอบบทบาทหน้าที่ของแต่ละบุคคล โดยมีรายละเอียดดังนี้ นายวิทยา ซึ่งมีใบอนุญาตประกอบวิชาชีพครู ทำหน้าที่สอนนักเรียนระดับประถมศึกษาปีที่ 6 ในสถานศึกษาของรัฐ สอดคล้องกับคำนิยามของครูตามความหมายของกฎหมาย นางสาวศิริพร ได้กล่าวในที่ประชุมว่า “ผู้ที่ทำหน้าที่สอนในสถานศึกษาระดับอุดมศึกษา หมายถึงครู ตามความหมายของกฎหมาย” นายอนุชา ดำรงตำแหน่งผู้อำนวยการโรงเรียนเอกชน ทำหน้าที่บริหารสถานศึกษา นางอารี ซึ่งปฏิบัติหน้าที่สอนในโรงเรียนเอกชนระดับชั้นประถมศึกษาปีที่ 6 นายประทีป ดำรงตำแหน่งศึกษานิเทศก์ ทำหน้าที่นิเทศ ติดตาม และประเมินผลการจัดการเรียนการสอนของครูในเขตพื้นที่การศึกษา ต่อมาคณะกรรมการได้ตั้งข้อสังเกตเกี่ยวกับ “ความสอดคล้องของนิยามตามพระราชบัญญัติการศึกษาแห่งชาติ พ.ศ. 2542 และที่แก้ไขเพิ่มเติม” โดยมีข้อพิจารณาดังนี้ คำกล่าวของนายวิทยา สอดคล้องกับบทบัญญัติของกฎหมาย คำกล่าวของนางสาวศิริพร ตามที่กล่าวข้างต้นสอดคล้องกับบทบัญญัติของกฎหมาย ผู้อำนวยการโรงเรียนเอกชน จัดเป็นบุคลากรทางการศึกษา นางอารี ซึ่งสอนในโรงเรียนเอกชน จัดเป็นบุคลากรทางการศึกษา ศึกษานิเทศก์ จัดเป็นบุคลากรทางการศึกษา คำถาม : จากสถานการณ์ข้างต้น ข้อความตอนใดกล่าวไม่ถูกต้อง","opts":{"ก":"ตอนที่ 1) ตอนที่ 2)","ข":"ตอนที่ 2) ตอนที่ 3)","ค":"ตอนที่ 2) ตอนที่ 4)","ง":"ตอนที่ 3) ตอนที่ 5)","จ":"ตอนที่ 4) ตอนที่ 5)"},"a":"ค","exp":"ตอนที่ 2 ผิดเพราะผู้สอนในระดับอุดมศึกษาคือนิยามของ คณาจารย์ ไม่ใช่ครู และตอนที่ 4 ผิดเพราะนางอารีทำหน้าที่สอนในโรงเรียนเอกชนจึงจัดอยู่ในคำนิยามของ ครู ไม่ใช่บุคลากรทางการศึกษาที่ไม่ใช่ผู้สอน)"},{"id":99,"q":"สถานการณ์ : ในการประชุมคณะกรรมการสถานศึกษา และผู้ที่เกี่ยวข้องการศึกษา ผู้เข้าร่วมได้แลกเปลี่ยนความคิดเห็นเกี่ยวกับการจัดการศึกษาตาม พ.ร.บ.การศึกษาแห่งชาติ พ.ศ. 2542 และที่แก้ไขเพิ่มเติม ดังนี้ นายสมชาย (ผู้บริหารสถานศึกษา) กล่าวว่า การศึกษาสำหรับคนพิการต้องจัดด้วยรูปแบบที่เหมาะสม โดยคำนึงถึงความสามารถของแต่ละบุคคล นายอนันต์ (นักวิชาการศึกษา) กล่าวว่า บุคคลที่มีความสามารถพิเศษควรได้รับสิทธิและโอกาสทางการศึกษาในระดับพื้นฐานเป็นพิเศษ นางสาวศิริพร (ตัวแทนภาครัฐ) กล่าวว่า ทุกคนต้องมีสิทธิและโอกาสเสมอกันในการได้รับการศึกษาขั้นพื้นฐานไม่น้อยกว่า 12 ปี โดยรัฐต้องจัดให้อย่างทั่วถึง มีคุณภาพ และไม่เก็บค่าใช้จ่าย นางวิภา (ผู้ปกครอง) กล่าวว่า บิดา มารดา หรือผู้ปกครอง มีหน้าที่จัดให้บุตรหรือบุคคลในความดูแลได้รับการศึกษาขั้นพื้นฐาน นายประยูร (นักสังคมสงเคราะห์) กล่าวว่า บุคคลที่มีความบกพร่องหรือด้อยโอกาส ต้องได้รับการศึกษาตั้งแต่แรกเกิดหรือเมื่อพบความพิการ คำถาม : ข้อใดอธิบายสอดคล้องตาม พ.ร.บ.การศึกษาแห่งชาติ พ.ศ. 2542 และที่แก้ไขเพิ่มเติม","opts":{"ก":"นายสมชายกล่าวถูกต้อง และนางวิภากล่าวไม่ถูกต้อง","ข":"นายอนันต์ และนายสมชาย กล่าวไม่ถูกต้อง","ค":"นางสาวศิริพร และนางวิภา กล่าวถูกต้อง","ง":"นายอนันต์ และนางวิภา กล่าวถูกต้อง"},"a":"ข","exp":"คำพูดของ นายสมชาย และ นายอนันต์ กล่าวสลับกัน โดยรูปแบบเหมาะสมคำนึงถึงความสามารถคือนิยามของ ความสามารถพิเศษ ส่วนโอกาสได้รับการศึกษาขั้นพื้นฐานเป็นพิเศษคือนิยามของ ผู้ที่มีความบกพร่อง นอกจากนี้คำพูดของ นางวิภา ก็ผิดเพราะหน้าที่ผู้ปกครองคือจัดให้ได้รับการศึกษาภาคบังคับ ไม่ใช่ขั้นพื้นฐาน และคำพูดของ นายประยูร ก็ผิดเพราะผู้ได้รับการศึกษาแรกเกิดหรือพบความพิการคือ คนพิการ ไม่ใช่บุคคลด้อยโอกาสทั่วไป)"},{"id":100,"q":"สถานการณ์ : โรงเรียนแห่งหนึ่งในชุมชนชนบทมีนักเรียนหลายกลุ่ม ได้แก่ เด็กบางคนต้องการเรียนฟรี เด็กพิการทางการมองเห็นที่เพิ่งตรวจพบความพิการ เด็กที่มีความสามารถพิเศษด้านคณิตศาสตร์ เด็กยากจนที่ผู้ปกครองไม่ส่งเข้าเรียน นักเรียนชายและหญิงในโรงเรียน คณะกรรมการสถานศึกษามีแนวทางดังนี้ ให้เก็บค่าใช้จ่ายบางส่วนจากนักเรียนทั่วไป รอให้เด็กพิการถึงวัยเรียนก่อนจึงจัดการศึกษาให้ จัดหลักสูตรเพิ่มเฉพาะสำหรับเด็กที่มีความสามารถพิเศษ จัดการเรียนการสอนสำหรับเด็กพิการโดยปรับรูปแบบตามความสามารถ แจ้งผู้ปกครองให้ส่งบุตรเข้าเรียนภาคบังคับ เปิดโอกาสให้ชายและหญิงเข้าเรียนอย่างเท่าเทียม คำถาม : แนวทางข้อใด “สอดคล้องกับ พ.ร.บ.การศึกษาแห่งชาติ พ.ศ.2542 และที่แก้ไขเพิ่มเติม ถูกต้องที่สุด”","opts":{"ก":"ข้อ 1,2,3","ข":"ข้อ 3,5,6","ค":"ข้อ 4,5,6","ง":"ข้อ 2,3,4"},"a":"ข","exp":"แนวทางที่ 3 สอดคล้องกับการจัดหลักสูตรที่เหมาะสมสำหรับเด็กความสามารถพิเศษ แนวทางที่ 5 หน้าที่ส่งบุตรเข้าเรียนภาคบังคับถูกต้อง และแนวทางที่ 6 สิทธิโอกาสเท่าเทียมชายหญิงเสมอกันถูกต้อง ส่วนแนวทางที่ 1 ผิดเพราะเรียนฟรีต้องไม่มีการเก็บค่าใช้จ่าย และแนวทางที่ 2 ผิดเพราะเด็กพิการต้องได้รับการศึกษาตั้งแต่แรกเกิดหรือพบความพิการทันทีโดยไม่รอวัยเรียน)"},{"id":101,"q":"สถานการณ์ : นายสมพรและนางกมลเข้าร่วมเวทีเสวนาเกี่ยวกับ พ.ร.บ.การศึกษาแห่งชาติ พ.ศ. 2542 และที่แก้ไขเพิ่มเติม ระหว่างการพูดคุย มีการแสดงความคิดเห็นดังนี้ นายสมพรกล่าวว่า รัฐควรสนับสนุนให้บิดา มารดามีความรู้ความสามารถในการอบรมเลี้ยงดูและให้การศึกษาแก่บุตร นางกมลกล่าวว่า ผู้ปกครองควรได้รับเงินอุดหนุนจากรัฐเป็นรายเดือนตลอดชีวิต นายวิชัยกล่าวว่า ผู้ปกครองควรได้รับเงินอุดหนุนจากรัฐสำหรับการจัดการศึกษาขั้นพื้นฐานของบุตร นางสาวอรกล่าวว่า ผู้ปกครองควรได้รับการลดหย่อนหรือยกเว้นภาษีสำหรับค่าใช้จ่ายด้านการศึกษา นายธนากล่าวว่า Home School หมายถึง การจัดการศึกษาขั้นพื้นฐานโดยครอบครัว นางศิริกล่าวว่า การศึกษามี 3 รูปแบบ ได้แก่ การศึกษาในระบบ การศึกษานอกระบบ และการศึกษาทางเลือก คำถาม: ข้อใด “กล่าวถูกต้องหรือไม่ถูกต้อง” ได้สอดคล้องกับกฎหมายมากที่สุด","opts":{"ก":"ข้อ 1 ถูกต้อง ข้อ 2 ไม่ถูกต้อง ข้อ 3 ถูกต้อง ข้อ 4 ถูกต้อง ข้อ 5 ถูกต้อง ข้อ 6 ถูกต้อง","ข":"ข้อ 1 ถูกต้อง ข้อ 2 ไม่ถูกต้อง ข้อ 3 ถูกต้อง ข้อ 4 ถูกต้อง ข้อ 5 ถูกต้อง ข้อ 6 ไม่ถูกต้อง","ค":"ข้อ 1 ไม่ถูกต้อง ข้อ 2 ไม่ถูกต้อง ข้อ 3 ถูกต้อง ข้อ 4 ถูกต้อง ข้อ 5 ถูกต้อง ข้อ 6 ถูกต้อง","ง":"ข้อ 1 ถูกต้อง ข้อ 2 ถูกต้อง ข้อ 3 ถูกต้อง ข้อ 4 ถูกต้อง ข้อ 5 ถูกต้อง ข้อ 6 ถูกต้อง"},"a":"ข","exp":"ข้อ 2 ไม่ถูกต้องเพราะไม่มีข้อกฎหมายให้อุดหนุนเงินผู้ปกครองรายเดือนตลอดชีวิต และข้อ 6 ไม่ถูกต้องเพราะรูปแบบการศึกษา 3 รูปแบบหลักคือ ในระบบ นอกระบบ และตามอัธยาศัย ไม่ใช่การศึกษาทางเลือก)"},{"id":102,"q":"สถานการณ์ : ในการประชุมเชิงปฏิบัติการของศูนย์การเรียนรู้ชุมชน นายสมชาย (ผู้อำนวยการศูนย์) ได้อธิบายรูปแบบการศึกษาประเภทต่าง ๆ ให้กับคณะทำงานฟัง ดังนี้ \"การศึกษาที่ให้ผู้เรียนได้เรียนรู้ด้วยตนเอง ตามความสนใจ ศักยภาพ ความพร้อม และโอกาส\" เป็นรูปแบบการศึกษาตามอัธยาศัย \"การศึกษาที่มีความยืดหยุ่นในการกำหนดจุดมุ่งหมาย รูปแบบ วิธีการจัดการศึกษา ระยะเวลา และการวัดประเมินผล โดยเนื้อหาเหมาะสมกับสภาพปัญหาและความต้องการของแต่ละกลุ่ม\" เป็นรูปแบบการศึกษาในระบบ \"การศึกษาที่กำหนดจุดมุ่งหมาย วิธีการศึกษา หลักสูตร ระยะเวลา การวัดและประเมินผล และมีเงื่อนไขการสำเร็จที่แน่นอน\" เป็นรูปแบบการศึกษาผสมผสาน คำถาม: ข้อใด “กล่าวถูกต้องหรือไม่ถูกต้อง” ได้สอดคล้องกับกฎหมายมากที่สุด","opts":{"ก":"ข้อ 1 ถูกต้อง ข้อ 2 ไม่ถูกต้อง ข้อ 3 ไม่ถูกต้อง","ข":"ข้อ 1 ถูกต้อง ข้อ 2 ถูกต้อง ข้อ 3 ไม่ถูกต้อง","ค":"ข้อ 1 ไม่ถูกต้อง ข้อ 2 ถูกต้อง ข้อ 3 ถูกต้อง","ง":"ข้อ 1 ถูกต้อง ข้อ 2 ไม่ถูกต้อง ข้อ 3 ถูกต้อง"},"a":"ก","exp":"ข้อ 1 ถูกต้องตามนิยามการศึกษาตามอัธยาศัยจริง ข้อ 2 ไม่ถูกต้องเพราะเป็นคำนิยามของการศึกษานอกระบบไม่ใช่ในระบบ และข้อ 3 ไม่ถูกต้องเพราะเป็นคำนิยามของการศึกษาในระบบไม่ใช่ผสมผสาน)"},{"id":103,"q":"สถานการณ์ : ในการประชุมครูประจำโรงเรียนแห่งหนึ่ง ครูได้ร่วมกันทบทวนความเข้าใจเกี่ยวกับ พ.ร.บ.การศึกษาแห่งชาติ พ.ศ. 2542 และที่แก้ไขเพิ่มเติม โดยยกตัวอย่างสถานการณ์และแนวคิดดังนี้ เด็กชายสมใจ มีความสนใจการบินโดรน ครูให้ไปศึกษาความรู้เพิ่มเติมทางอินเทอร์เน็ต และระบุว่าเป็นรูปแบบการศึกษานอกระบบ การศึกษาในระบบมี 2 ระดับ คือ การศึกษาขั้นพื้นฐาน และการศึกษาระดับปริญญา การศึกษาภาคบังคับ กำหนด 9 ปี (ป.1–ม.3) Home School เป็นรูปแบบการศึกษาแบบทางเลือก แนวการจัดการศึกษา “การจัดการศึกษายึดหลักว่าผู้เรียนทุกคนล้วนมีความสามารถเรียนรู้และพัฒนาตนเองได้และถือว่าผู้เรียนสำคัญที่สุด กระบวนการจัดการศึกษาต้องส่งเสริมให้ผู้เรียนสามารถพัฒนาธรรมชาติ และเต็มศักยภาพ” ห้องเรียนคุณภาพเป็นแหล่งเรียนรู้ตลอดชีวิต คำถาม: ข้อความตอนใดกล่าวถูกต้อง","opts":{"ก":"ตอนที่ 1) ตอนที่ 2)","ข":"ตอนที่ 2) ตอนที่ 6)","ค":"ตอนที่ 3) ตอนที่ 4)","ง":"ตอนที่ 3) ตอนที่ 5)"},"a":"ง","exp":"ตอนที่ 3 ถูกต้องตามมาตรา 17 และตอนที่ 5 ถูกต้องตามมาตรา 22 ส่วนตอนที่ 1 ผิดเพราะเป็นอัธยาศัยไม่ใช่ศึกษานอกระบบ, ตอนที่ 2 ผิดเพราะสองระดับคือการศึกษาขั้นพื้นฐานและระดับอุดมศึกษา ไม่ใช่ระดับปริญญา และตอนที่ 6 ผิดเพราะห้องเรียนคุณภาพไม่ใช่ประเภทแหล่งเรียนรู้ตลอดชีวิตตามมาตรา 25)"}],"พ.ร.บ.การศึกษาภาคบังคับ พ.ศ. 2545":[{"id":1,"q":"ใครเป็นผู้รักษาการพระราชบัญญัติการศึกษาภาคบังคับ พ.ศ. 2545","opts":{"ก":"เลขาธิการ กพฐ.","ข":"ปลัดกระทรวงศึกษาธิการ","ค":"รัฐมนตรีว่าการกระทรวงศึกษาธิการ","ง":"นายกรัฐมนตรี"},"a":"ค","exp":"ตามมาตรา ๒๐ แห่งพระราชบั  สพฐ. เป็นการแบ่งส่วนราชการในส่วนกลางตามมาตรา 10 ส่วน สพป. เป็นเขตพื้นที่การศึกษา ศึกษาธิการจังหวัดและภาคเป็นราชการในสำนักงานปลัดกระทรวงที่ปฏิบัติงานในส่วนภูมิภาค"},{"id":9,"q":"สำนักงานส่งเสริมการศึกษานอกระบบและการศึกษาตามอัธยาศัย (สนง.กศน.) ยกฐานะเป็นหน่วยงานใด","opts":{"ก":"กรมการศึกษานอกระบบและการศึกษาตามอัธยาศัย","ข":"กรมส่งเสริมการเรียนรู้","ค":"สำนักส่งเสริมการเรียนรู้ตลอดชีพ","ง":"กรมส่งเสริมการเรียนรู้ตลอดชีวิต"},"a":"ข","exp":"กรมส่งเสริมการเรียนรู้ คำอธิบายเพิ่มเติม: ตาม พ.ร.บ.ส่งเสริมการเรียนรู้ พ.ศ. 2566 ได้ยกฐานะ สนง.กศน. เดิมให้เป็น \"กรมส่งเสริมการเรียนรู้\" (สกร.) ในสังกัดกระทรวงศึกษาธิการ มีสถานะเป็นนิติบุคคลและเป็นกรม"},{"id":10,"q":"ข้อใดไม่ใช่ส่วนราชการในส่วนกลางของกระทรวงศึกษาธิการ","opts":{"ก":"สำนักงานเลขาธิการสภาการศึกษา (สกศ.)","ข":"สำนักงานเขตพื้นที่การศึกษาประถมศึกษา (สพป.)","ค":"สำนักงานคณะกรรมการการอาชีวศึกษา (สอศ.)","ง":"สำนักงานคณะกรรมการการศึกษาขั้นพื้นฐาน (สพฐ.)"},"a":"ข","exp":"สำนักงานเขตพื้นที่การศึกษาประถมศึกษา (สพป.) คำอธิบายเพิ่มเติม: สพป. เป็นการจัดระเบียบบริหารราชการเขตพื้นที่การศึกษาตามหมวด 2 ไม่ใช่ส่วนราชการในส่วนกลาง"},{"id":11,"q":"ข้อใดไม่ใช่ส่วนราชการของกระทรวงศึกษาธิการ","opts":{"ก":"กรมส่งเสริมการเรียนรู้ (สกร.)","ข":"สำนักงานคณะกรรมการการศึกษาขั้นพื้นฐาน (สพฐ.)","ค":"สำนักงานปลัดกระทรวงศึกษาธิการ (สป.ศธ.)","ง":"สำนักงานรัฐมนตรี (สร.)"},"a":"ก","exp":"สำนักงานปลัดกระทรวงศึกษาธิการ คำอธิบายเพิ่มเติม: องค์กรหลักในรูปสภาหรือคณะกรรมการของกระทรวงศึกษาธิการมี 3 องค์กร คือ สภาการศึกษา, คณะกรรมการการศึกษาขั้นพื้นฐาน (กพฐ.), และคณะกรรมการการอาชีวศึกษา (กอศ.) ตามมาตรา 10 และ 14-17"},{"id":13,"q":"ตำแหน่งใดไม่ได้ขึ้นตรงต่อรัฐมนตรีว่าการกระทรวงศึกษาธิการ","opts":{"ก":"เลขาธิการคณะกรรมการการศึกษาขั้นพื้นฐาน","ข":"เลขาธิการสภาการศึกษา","ค":"เลขาธิการคณะกรรมการการอาชีวศึกษา","ง":"ผู้ตรวจราชการกระทรวงศึกษาธิการ"},"a":"ง","exp":"ผู้ตรวจราชการกระทรวงศึกษาธิการ คำอธิบายเพิ่มเติม: ตามมาตรา 20 กำหนดให้ผู้ตรวจราชการของกระทรวงทำหน้าที่ตรวจราชการ โดยขึ้นตรงต่อปลัดกระทรวงศึกษาธิการ ส่วนเลขาธิการทั้ง 3 องค์กรหลักขึ้นตรงต่อรัฐมนตรีว่าการกระทรวงศึกษาธิการตามมาตรา 10"},{"id":14,"q":"เลขาธิการคณะกรรมการการศึกษาขั้นพื้นฐาน ขึ้นตรงต่อใคร","opts":{"ก":"รัฐมนตรีว่าการกระทรวงศึกษาธิการ","ข":"คณะกรรมการการศึกษาขั้นพื้นฐาน","ค":"ปลัดกระทรวงศึกษาธิการ","ง":"นายกรัฐมนตรี"},"a":"ก","exp":"รัฐมนตรีว่าการกระทรวงศึกษาธิการ คำอธิบายเพิ่มเติม: ตามมาตรา 10 และมาตรา 29 ข้าราชการที่ดำรงตำแหน่งเลขาธิการของส่วนราชการในส่วนกลางที่ขึ้นตรงต่อรัฐมนตรีฯ มีฐานะเทียบเท่าปลัดกระทรวงและรับผิดชอบขึ้นตรงต่อรัฐมนตรีว่าการกระทรวงศึกษาธิการ"},{"id":15,"q":"หัวหน้าส่วนราชการใดไม่ได้ขึ้นตรงต่อรัฐมนตรีว่าการกระทรวงศึกษาธิการ","opts":{"ก":"เลขาธิการคณะกรรมการการอาชีวศึกษา","ข":"ศึกษาธิการจังหวัด","ค":"เลขานุการรัฐมนตรี","ง":"ปลัดกระทรวงศึกษาธิการ"},"a":"ข","exp":"ศึกษาธิการจังหวัด คำอธิบายเพิ่มเติม: ปลัดกระทรวง, เลขาธิการคณะกรรมการการอาชีวศึกษา และเลขานุการรัฐมนตรี เป็นหัวหน้าส่วนราชการที่ขึ้นตรงต่อรัฐมนตรีฯ โดยตรงตามมาตรา 10 และ 19 ส่วนศึกษาธิการจังหวัดสังกัดสำนักงานปลัดกระทรวงศึกษาธิการ"},{"id":16,"q":"ใครเป็นผู้บังคับบัญชาข้าราชการ กำหนดนโยบาย เป้าหมาย และผลสัมฤทธิ์ของงาน ในกระทรวงศึกษาธิการ","opts":{"ก":"เลขาธิการคณะกรรมการการศึกษาขั้นพื้นฐาน","ข":"รัฐมนตรีว่าการกระทรวงศึกษาธิการ","ค":"เลขานุการรัฐมนตรี","ง":"ปลัดกระทรวงศึกษาธิการ"},"a":"ข","exp":"รัฐมนตรีว่าการกระทรวงศึกษาธิการ คำอธิบายเพิ่มเติม: มาตรา 12 บัญญัติว่า \"กระทรวงศึกษาธิการมีรัฐมนตรีว่าการกระทรวงศึกษาธิการเป็นผู้บังคับบัญชาข้าราชการและกำหนดนโยบาย เป้าหมาย และผลสัมฤทธิ์ของงานในกระทรวงศึกษาธิการ\""},{"id":17,"q":"ใครมีหน้าที่แปลงนโยบายเป็นแนวทางและแผนปฏิบัติราชการกำกับการทำงานของส่วนราชการในกระทรวงศึกษาธิการให้เกิดผลสัมฤทธิ์","opts":{"ก":"ปลัดกระทรวงศึกษาธิการ","ข":"รัฐมนตรีว่าการกระทรวงศึกษาธิการ","ค":"เลขานุการรัฐมนตรีว่าการกระทรวงศึกษาธิการ","ง":"รัฐมนตรีช่วยว่าการกระทรวงศึกษาธิการ"},"a":"ก","exp":"ปลัดกระทรวงศึกษาธิการ คำอธิบายเพิ่มเติม: เป็นอำนาจหน้าที่ของปลัดกระทรวงศึกษาธิการตามมาตรา 23 (1) ในการรับผิดชอบควบคุมราชการประจำในกระทรวง แปลงนโยบายเป็นแนวทางและแผนปฏิบัติราชการ"},{"id":18,"q":"ใครเป็นผู้บังคับบัญชาข้าราชการ ในสำนักงานปลัดกระทรวงศึกษาธิการ (สป.ศธ.)","opts":{"ก":"เลขาธิการคณะกรรมการการศึกษาขั้นพื้นฐาน","ข":"รัฐมนตรีว่าการกระทรวงศึกษาธิการ","ค":"เลขานุการรัฐมนตรีว่าการกระทรวงศึกษาธิการ","ง":"ปลัดกระทรวงศึกษาธิการ"},"a":"ง","exp":"ปลัดกระทรวงศึกษาธิการ คำอธิบายเพิ่มเติม: ตามมาตรา 23 (2) ปลัดกระทรวงศึกษาธิการเป็นผู้บังคับบัญชาข้าราชการของส่วนราชการในสำนักงานปลัดกระทรวงรองจากรัฐมนตรีว่าการกระทรวงศึกษาธิการ"},{"id":19,"q":"ใครเป็นผู้บังคับบัญชาข้าราชการ ในสำนักงานรัฐมนตรี (สร.)","opts":{"ก":"เลขาธิการคณะกรรมการการศึกษาขั้นพื้นฐาน","ข":"รัฐมนตรีว่าการกระทรวงศึกษาธิการ","ค":"เลขานุการรัฐมนตรีว่าการกระทรวงศึกษาธิการ","ง":"ปลัดกระทรวงศึกษาธิการ"},"a":"ค","exp":"เลขานุการรัฐมนตรีว่าการกระทรวงศึกษาธิการ คำอธิบายเพิ่มเติม: มาตรา 19 บัญญัติว่า สำนักงานรัฐมนตรีมีเลขานุการรัฐมนตรีซึ่งเป็นข้าราชการการเมืองเป็นผู้บังคับบัญชาข้าราชการและรับผิดชอบในการปฏิบัติราชการ"},{"id":20,"q":"ใครเป็นผู้บังคับบัญชาข้าราชการ ในสำนักงานคณะกรรมการการศึกษาขั้นพื้นฐาน (สพฐ.)","opts":{"ก":"เลขาธิการคณะกรรมการการศึกษาขั้นพื้นฐาน","ข":"รัฐมนตรีว่าการกระทรวงศึกษาธิการ","ค":"เลขานุการรัฐมนตรีว่าการกระทรวงศึกษาธิการ","ง":"ปลัดกระทรวงศึกษาธิการ"},"a":"ก","exp":"เลขาธิการคณะกรรมการการศึกษาขั้นพื้นฐาน คำอธิบายเพิ่มเติม: มาตรา 30 บัญญัติว่าให้เลขาธิการซึ่งเป็นผู้บังคับบัญชาของส่วนราชการตามมาตรา 28 (3) (4) (5) เป็นผู้บังคับบัญชาข้าราชการและรับผิดชอบปฏิบัติราชการของส่วนราชการนั้นๆ ซึ่งรวมถึงเลขาธิการคณะกรรมการการศึกษาขั้นพื้นฐาน"},{"id":21,"q":"ใครเป็นผู้บังคับบัญชาข้าราชการ ในสำนักงานคณะกรรมการการอาชีวศึกษา (สอศ.)","opts":{"ก":"เลขาธิการคณะกรรมการการศึกษาขั้นพื้นฐาน","ข":"รัฐมนตรีว่าการกระทรวงศึกษาธิการ","ค":"เลขาธิการคณะกรรมการการอาชีวศึกษา","ง":"ปลัดกระทรวงศึกษาธิการ"},"a":"ค","exp":"เลขาธิการคณะกรรมการการอาชีวศึกษา คำอธิบายเพิ่มเติม: เช่นเดียวกับมาตรา 30 เลขาธิการคณะกรรมการการอาชีวศึกษาเป็นผู้บังคับบัญชาและรับผิดชอบปฏิบัติราชการของสำนักงานคณะกรรมการการอาชีวศึกษา"},{"id":22,"q":"ข้อใดไม่ใช่หน้าที่ของสภาการศึกษา","opts":{"ก":"ประเมินคุณภาพการจัดการศึกษาของสถานศึกษา","ข":"พิจารณาเสนอนโยบายแผนการศึกษาแห่งชาติ","ค":"พิจารณาเสนอมาตรฐานการศึกษาของชาติทุกระดับ","ง":"ให้ความเห็นหรือคำแนะนำในเรื่องกฎหมายและกฎกระทรวงที่เกี่ยวกับการศึกษา"},"a":"ก","exp":"ประเมินคุณภาพการจัดการศึกษาของสถานศึกษา คำอธิบายเพิ่มเติม: หน้าที่ประเมินคุณภาพภายนอกเป็นของสำนักงานรับรองมาตรฐานและประเมินคุณภาพการศึกษา (สมศ.) ส่วนสภาการศึกษาทำหน้าที่ประเมินผลการจัดการศึกษาในภาพรวมระดับประเทศตามแผนการศึกษาแห่งชาติเท่านั้นตามมาตรา 14 (4)"},{"id":23,"q":"ข้อใดเป็นอำนาจหน้าที่ของคณะกรรมการศึกษาขั้นพื้นฐาน","opts":{"ก":"พิจารณาเสนอนโยบายแผนการศึกษาแห่งชาติและมาตรฐานการศึกษาของชาติทุกระดับ","ข":"เสนอนโยบายแผนพัฒนามาตรฐาน และหลักสูตรแกนกลางการศึกษาขั้นพื้นฐาน","ค":"เสนอนโยบาย แผนพัฒนามาตรฐาน และหลักสูตรการอาชีวศึกษาทุกระดับ","ง":"อำนาจหน้าที่เกี่ยวกับราชการทางการเมือง"},"a":"ข","exp":"เสนอนโยบายแผนพัฒนามาตรฐาน และหลักสูตรแกนกลางการศึกษาขั้นพื้นฐาน คำอธิบายเพิ่มเติม: มาตรา 15 กำหนดให้คณะกรรมการการศึกษาขั้นพื้นฐาน มีหน้าที่พิจารณาเสนอนโยบาย แผนพัฒนา มาตรฐาน และหลักสูตรแกนกลางการศึกษาขั้นพื้นฐานที่สอดคล้องกับแผนการศึกษาแห่งชาติ"},{"id":24,"q":"หน่วยงานใดมีอำนาจหน้าที่ราชการประจำทั่วไปของกระทรวงศึกษาธิการ","opts":{"ก":"สำนักงานเลขาธิการสภาการศึกษา","ข":"สำนักงานรัฐมนตรี","ค":"สำนักงานปลัดกระทรวงศึกษาธิการ","ง":"สำนักงานคณะกรรมการการศึกษาขั้นพื้นฐาน"},"a":"ค","exp":"สำนักงานปลัดกระทรวงศึกษาธิการ คำอธิบายเพิ่มเติม: ตามมาตรา 24 (1) สำนักงานปลัดกระทรวงศึกษาธิการมีอำนาจหน้าที่ดำเนินการเกี่ยวกับราชการประจำทั่วไปของกระทรวง"},{"id":25,"q":"หน่วยงานใดมีหน้าจัดทำแผนปฏิบัติราชการของกระทรวงศึกษาธิการ","opts":{"ก":"สำนักงานเลขาธิการสภาการศึกษา","ข":"สำนักงานรัฐมนตรี","ค":"สำนักงานปลัดกระทรวงศึกษาธิการ","ง":"สำนักงานคณะกรรมการการศึกษาขั้นพื้นฐาน"},"a":"ค","exp":"สำนักงานปลัดกระทรวงศึกษาธิการ คำอธิบายเพิ่มเติม: มาตรา 24 (3) บัญญัติให้สำนักงานปลัดกระทรวงศึกษาธิการ มีหน้าที่จัดทำงบประมาณและแผนปฏิบัติราชการของกระทรวง"},{"id":26,"q":"หน่วยงานใดกำหนดหลักเกณฑ์และวิธีการประเมินความพร้อมในการจัดการศึกษา ขององค์กรปกครองส่วนท้องถิ่น","opts":{"ก":"กระทรวงมหาดไทย","ข":"กระทรวงศึกษาธิการ","ค":"กรมส่งเสริมการปกครองท้องถิ่น","ง":"สำนักงานคณะกรรมการการศึกษาขั้นพื้นฐาน"},"a":"ข","exp":"กระทรวงศึกษาธิการ คำอธิบายเพิ่ ามมาตรา 38 วรรคท้าย บัญญัติยกเว้นไว้ชัดเจนว่า \"ความในมาตรานี้ไม่ใช้บังคับแก่สถานพัฒนาเด็กปฐมวัยและศูนย์การเรียน\""},{"id":50,"q":"ข้อใดเป็นอำนาจหน้าที่ของคณะกรรมการสถานศึกษาขั้นพื้นฐาน","opts":{"ก":"ให้ความเห็นชอบบรรจุแต่งตั้งครูผู้ช่วยของสถานศึกษา","ข":"ให้ความเห็นชอบแผนปฏิบัติการประจำปีของสถานศึกษา","ค":"ให้ความเห็นชอบการเลื่อนเงินเดือนของข้าราชการครูของสถานศึกษา","ง":"ให้ความเห็นชอบหลักสูตรแกนกลางการศึกษาขั้นพื้นฐาน"},"a":"ข","exp":"ให้ความเห็นชอบแผนปฏิบัติการประจำปีของสถานศึกษา คำอธิบายเพิ่มเติม: บทบาทหน้าที่หลักของคณะกรรมการสถานศึกษาคือการกำกับและส่งเสริมสนับสนุนกิจการของสถานศึกษา ได้แก่ การเห็นชอบแผนพัฒนา แผนปฏิบัติการประจำปี หลักสูตรสถานศึกษา และให้ความเห็นชอบการรับย้ายข้าราชการครูในโรงเรียน"},{"id":51,"q":"ตาม พ.ร.บ.ระเบียบบริหารราชการกระทรวงศึกษาธิการ พ.ศ. 2546 และที่แก้ไขเพิ่มเติม ข้อใดกล่าวไม่ถูกต้อง","opts":{"ก":"สถานศึกษาที่จัดการศึกษาขั้นพื้นฐาน เฉพาะที่เป็นโรงเรียน มีฐานะเป็นนิติบุคคล","ข":"กศจ. มีอำนาจหน้าที่ในการ กำกับดูแล จัดตั้ง ยุบ รวม หรือเลิกสถานศึกษาขั้นพื้นฐาน ในเขตพื้นที่การศึกษา","ค":"สถานศึกษาใดจัดการศึกษาขั้นพื้นฐานทั้งระดับประถมศึกษาและระดับมัธยมศึกษาให้สังกัดสำนักงานเขตพื้นที่การศึกษามัธยมศึกษา","ง":"เมื่อมีการยุบเลิกสถานศึกษา ให้ความเป็นนิติบุคคลสิ้นสุดลง"},"a":"ค","exp":"สถานศึกษาใดจัดการศึกษาขั้นพื้นฐานทั้งระดับประถมศึกษาและระดับมัธยมศึกษาให้สังกัดสำนักงานเขตพื้นที่การศึกษามัธยมศึกษา คำอธิบายเพิ่มเติม: ข้อ ค. กล่าวผิด เพราะมาตรา 33 วรรคสาม ระบุว่าหากมีการเปิดสอนทั้งประถมและมัธยม การจะให้สังกัดประถมหรือมัธยมศึกษาให้ยึดระดับการศึกษาของสถานศึกษานั้นเป็นสำคัญ และเป็นไปตามรัฐมนตรีประกาศกำหนดโดยคำแนะนำของ คณะกรรมการการศึกษาขั้นพื้นฐาน (ไม่ได้บังคับให้ต้องสังกัดเขตมัธยมศึกษาเสมอไป)"},{"id":52,"q":"ข้อใดไม่ใช่ภาระงานตามการกระจายอำนาจการบริหารและการจัดการศึกษา ไปยัง กศจ. สำนักงานเขตพื้นที่การศึกษา และสถานศึกษา","opts":{"ก":"ด้านการบริหารงานคดีความ","ข":"ด้านการบริหารงานงบประมาณ","ค":"ด้านการบริหารงานวิชาการ","ง":"ด้านการบริหารงานทั่วไป"},"a":"ก","exp":"ด้านการบริหารงานคดีความ คำอธิบายเพิ่มเติม: ตามมาตรา 44 การกระจายอำนาจมี 4 ด้านเท่านั้น ได้แก่ (1) ด้านวิชาการ (2) ด้านงบประมาณ (3) ด้านการบริหารงานบุคคล และ (4) ด้านการบริหารทั่วไป (สูตรจำ: วี มาณ คล ไป) ไม่มีด้านการบริหารงานคดีความ"},{"id":53,"q":"\"การที่ผู้บังคับบัญชามอบอำนาจในการบริหารราชการให้แก่ผู้ใต้บังคับบัญชา โดยที่ผู้มอบอำนาจยังคงดำรงตำแหน่งและยังปฏิบัติหน้าที่อยู่\" หมายความว่าอย่างไร","opts":{"ก":"รักษาราชการแทน","ข":"รักษาการในตำแหน่ง","ค":"การปฏิบัติราชการแทน","ง":"การปฏิบัติงานแทน"},"a":"ค","exp":"การปฏิบัติราชการแทน คำอธิบายเพิ่มเติม: นิยามของการปฏิบัติราชการแทน คือ ตัวผู้มอบอำนาจยังมีตัวตนและปฏิบัติราชการอยู่ แต่เนื่องจากงานมีจำนวนมาก จึงมีการส่งมอบอำนาจอย่างเป็นทางการ (ทำเป็นหนังสือ) ให้บุคคลอื่นปฏิบัติราชการแทนตามกรอบอำนาจหน้าที่"},{"id":54,"q":"การปฏิบัติราชการแทน สอดคล้องกับข้อใดมากที่สุด","opts":{"ก":"ไม่อยู่ปฏิบัติหน้าที่","ข":"งานมากให้คนอื่นมาช่วยทำ","ค":"ไม่มีผู้ดำรงตำแหน่ง","ง":"ตัวอยู่แต่ทำงานไม่ได้"},"a":"ข","exp":"งานมากให้คนอื่นมาช่วยทำ คำอธิบายเพิ่มเติม: เป็นการกระจายภาระหน้าที่เมื่อมีปริมาณงานจำนวนมาก เพื่อให้งานดำเนินไปได้อย่างคล่องตัว รวดเร็ว โดยผู้มอบยังสามารถเข้าปฏิบัติราชการหลักได้ตามปกติ"},{"id":55,"q":"ข้อใดสอดคล้องกับการกระจายอำนาจการบริหารและการจัดการศึกษา","opts":{"ก":"คณะรัฐมนตรีมอบอำนาจให้เขตพื้นที่การศึกษาบริหารจัดการด้านการบริหารงานทั่วไปได้","ข":"เลขาธิการ กพฐ. มอบอำนาจให้เขตพื้นที่การศึกษาบริหารจัดการด้านการบริหารงานงบประมาณได้","ค":"นายกรัฐมนตรีมอบอำนาจให้สถานศึกษาบริหารจัดการด้านการบริหารงานบุคคลได้","ง":"รัฐมนตรีว่ากระทรวงศึกษาธิการ ประกาศในราชกิจจานุเบกษากำหนดเขตพื้นที่การศึกษา"},"a":"ข","exp":"เลขาธิการ กพฐ. มอบอำนาจให้เขตพื้นที่การศึกษาบริหารจัดการด้านการบริหารงานงบประมาณได้ คำอธิบายเพิ่มเติม: เลขาธิการ กพฐ. เป็นผู้มีอำนาจในการกระจายอำนาจและมอบอำนาจให้แก่ ผอ.สพท. หรือ ผอ.สถานศึกษา ในการบริหารจัดการศึกษาทั้ง 4 ด้าน รวมถึงด้านการบริหารงานงบประมาณตามที่บัญญัติในมาตรา 44"},{"id":56,"q":"“การเข้าไปกระทำการในตำแหน่งแทนผู้ทรงอำนาจ ในขณะที่ผู้ทรงอำนาจนั้นไม่อยู่ หรืออยู่แต่ไม่สามารถปฏิบัติหน้าที่ได้” หมายความว่าอย่างไร","opts":{"ก":"ปฏิบัติราชการแทน","ข":"รักษาตำแหน่งแทน","ค":"รักษาแทนตำแหน่ง","ง":"รักษาราชการแทน"},"a":"ง","exp":"รักษาราชการแทน คำอธิบายเพิ่มเติม: นิยามของการรักษาราชการแทน คือ \"กรณีที่ไม่มีผู้ดำรงตำแหน่ง หรือมีแต่ไม่สามารถปฏิบัติราชการได้\" (ตัวไม่มี ตัวไม่อยู่ ตัวตาย ตัวอยู่แต่ทำงานไม่ได้ ลา/ขาด/ป่วย) จะต้องมีข้าราชการเข้ามาทำหน้าที่รักษาราชการแทนเพื่อให้ภารกิจดำเนินต่อไปได้"},{"id":57,"q":"“กรณีที่ไม่มีผู้ดำรงตำแหน่งรัฐมนตรีว่าการกระทรวงศึกษาธิการ หรือมีแต่ไม่อาจปฏิบัติราชการได้” จะต้องดำเนินการตามกฎหมายตามข้อใด","opts":{"ก":"ให้คณะรัฐมนตรีแต่งรัฐมนตรีช่วยว่าการกระทรวงศึกษาธิการเป็นผู้รักษาราชการแทน","ข":"ให้คณะรัฐมนตรีแต่งรัฐมนตรีช่วยว่าการกระทรวงศึกษาธิการเป็นรักษาการในตำแหน่ง","ค":"ให้นายกรัฐมนตรีแต่งรัฐมนตรีช่วยว่าการกระทรวงศึกษาธิการเป็นผู้รักษาราชการแทน","ง":"ให้คณะรัฐมนตรีแต่งตั้งปลัดกระทรวงศึกษาธิการเป็นผู้รักษาราชการแทน"},"a":"ก","exp":"ให้คณะรัฐมนตรีแต่งรัฐมนตรีช่วยว่าการกระทรวงศึกษาธิการเป็นผู้รักษาราชการแทน คำอธิบายเพิ่มเติม: ตามมาตรา 48 บัญญัติว่า ในกรณีที่ไม่มีผู้ดำรงตำแหน่ง รมว.ศธ. หรือมีแต่ไม่อาจปฏิบัติราชการได้ ให้ รมช.ศธ. เป็นผู้รักษาราชการแทน โดยหากมี รมช. หลายคน ให้คณะรัฐมนตรีมอบหมายคนใดคนหนึ่ง"},{"id":58,"q":"“กรณีที่ไม่มีผู้ดำรงตำแหน่งผู้อำนวยการสถานศึกษา หรือมีแต่ไม่อาจปฏิบัติราชการได้” ให้มีการแต่งบุคคลใดบุคคลหนึ่งตามที่กฎหมายกำหนดตามข้อใด","opts":{"ก":"รักษาราชการแทน","ข":"รักษาตำแหน่งแทน","ค":"รักษาการในตำแหน่ง","ง":"ปฏิบัติงานแทน"},"a":"ค","exp":"รักษาการในตำแหน่ง คำอธิบายเพิ่มเติม: ในมาตรา 54 ของ พ.ร.บ.ระเบียบบริหารราชการกระทรวงศึกษาธิการ จะเขียนคำว่า \"รักษาราชการแทน\" เพื่อให้ครอบคลุมความใน พ.ร.บ. ทั่วไป แต่สำหรับสถานศึกษา สังกัด ศธ. ในทางระเบียบข้าราชการครูฯ หากเป็นกรณีไม่มี ผอ. หรือมีแต่ปฏิบัติราชการไม่ได้ จะใช้ระเบียบกฎหมายเฉพาะซึ่งกำหนดศัพท์เทคนิคให้ใช้ว่า \"รักษาการในตำแหน่ง\" (เพื่อแยกแยะกับกรณีรักษาราชการแทนของส่วนราชการทั่วไป)"},{"id":59,"q":"“โรงเรียนบ้านหนึ่งจักรยาน มีข้าราชการครูและบุคลากรทางการศึกษาทั้งหมด 9 คน แต่ไม่มีผู้อำนวยการโรงเรียน และไม่มีรองผู้อำนวยการโรงเรียน” จะต้องดำเนินการตามกฎหมายตามข้อใด","opts":{"ก":"ให้ศึกษาธิการจังหวัดแต่งตั้งรองผู้อำนวยการสถานศึกษารักษาราชการในตำแหน่ง","ข":"ให้ศึกษาธิการจังหวัดแต่งตั้งข้าราชการในสถานศึกษารักษาการในตำแหน่ง","ค":"ให้ผู้อำนวยการสำนักงานเขตพื้นที่การศึกษาแต่งตั้งข้าราชการในสถานศึกษารักษาการในตำแหน่ง","ง":"ให้ อ.ก.ค.ศ.เขตพื้นที่การศึกษา แต่งตั้งข้าราชการในสถานศึกษารักษาการในตำแหน่ง"},"a":"ค","exp":"ให้ผู้อำนวยการสำนักงานเขตพื้นที่การศึกษาแต่งตั้งข้าราชการในสถานศึกษารักษาการในตำแหน่ง คำอธิบายเพิ่มเติม: ตามหลักเกณฑ์และมาตรา 54 หากไม่มีผู้อำนวยการและไม่มีรองผู้อำนวยการ ให้เป็นอำนาจหน้าที่ของผู้อำนวยการสำนักงานเขตพื้นที่การศึกษา (ผอ.สพท.) ในการแต่งตั้งข้าราชการในสถานศึกษาคนใดคนหนึ่งรักษาการในตำแหน่ง"},{"id":60,"q":"ตาม พ.ร.บ.ระเบียบบริหารราชการกระทรวงศึกษาธิการ พ.ศ. 2546 และที่แก้ไขเพิ่มเติม ข้อใดเป็นชุดข้อความที่ถูกต้องทั้งหมด","opts":{"ก":"รัฐมนตรีว่าการกระทรวงศึกษาธิการ รักษาการ พ.ร.บ. นี้ และ พ.ร.บ.นี้ ประกาศใช้เพื่อกำหนดขอบเขตอำนาจหน้าที่ของการบริหารงานบุคคลของกระทรวงศึกษาธิการ และ การจัดระเบียบราชการกระทรวงศึกษาธิการ ประกอบด้วย ส่วนกลาง เขตพื้นที่การศึกษา สถานศึกษาของรัฐที่จัดการศึกษาระดับปริญญาที่เป็นนิติบุคคล","ข":"การจัดระเบียบราชการส่วนกลางของกระทรวงศึกษาธิการ มี 6 ส่วนราชการ และกรมส่งเสริมการเรียนรู้ มีฐานะเป็นกองและเป็นนิติบุคคล และสำนักงานรัฐมนตรี ไม่มีฐานะเป็นกรมและไม่เป็นนิติบุคคล","ค":"รัฐมนตรีว่าการกระทรวงศึกษาธิการ รักษาการ พ.ร.บ. นี้ และ การจัดระเบียบราชการกระทรวงศึกษาธิการ ประกอบด้วย ส่วนกลาง เขตพื้นที่การศึกษา สถานศึกษาของรัฐที่จัดการศึกษาระดับปริญญาที่เป็นนิติบุคคล และสำนักงานรัฐมนตรี ไม่มีฐานะเป็นกรมและไม่เป็นนิติบุคคล","ง":"พ.ร.บ.นี้ ประกาศใช้เพื่อกำหนดขอบเขตอำนาจหน้าที่ของการบริหารงานบุคคลของกระทรวงศึกษาธิการ และ การจัดระเบียบราชการส่วนกลางของกระทรวงศึกษาธิการ มี 6 ส่วนราชการ และ กรมส่งเสริมการเรียนรู้ มีฐานะเป็นสำนักและเป็นนิติบุคคล"},"a":"ค","exp":"รัฐมนตรีว่าการกระทรวงศึกษาธิการ รักษาการ พ.ร.บ. นี้ และ การจัดระเบียบราชการกระทรวงศึกษาธิการ ประกอบด้วย ส่วนกลาง เขตพื้นที่การศึกษา สถานศึกษาของรัฐที่จัดการศึกษาระดับปริญญาที่เป็นนิติบุคคล และสำนักงานรัฐมนตรี ไม่มีฐานะเป็นกรมและไม่เป็นนิติบุคคล คำอธิบายเพิ่มเติม: ข้อ"},{"id":61,"q":"ตาม พ.ร.บ.ระเบียบบริหารราชการกระทรวงศึกษาธิการ พ.ศ. 2546 และที่แก้ไขเพิ่มเติม ข้อใดเป็นชุดข้อความที่ถูกต้องทั้งหมด","opts":{"ก":"อ.ก.ค.ศ. สำนักงานปลัดกระทรวงศึกษาธิการ เป็นองค์กรหลักในรูปสภาหรือคณะกรรมการของกระทรวงศึกษาธิการ และ คณะกรรมการการศึกษาขั้นพื้นฐาน เป็นองค์กรหลักในรูปสภาหรือคณะกรรมการของกระทรวงศึกษาธิการ และ ผู้ตรวจราชการกระทรวงศึกษาธิการ ขึ้นตรงต่อรัฐมนตรีว่าการกระทรวงศึกษาธิการ","ข":"คณะกรรมการการศึกษาขั้นพื้นฐาน เป็นองค์กรหลักในรูปสภาหรือคณะกรรมการของกระทรวงศึกษาธิการ และสำนักงานปลัดกระทรวงศึกษาธิการ มีอำนาจหน้าที่ราชการประจำทั่วไปของกระทรวงศึกษาธิการ และผู้ตรวจราชการกระทรวงศึกษาธิการ ขึ้นตรงต่อปลัดกระทรวงศึกษาธิการ","ค":"คณะกรรมการการศึกษาขั้นพื้นฐาน เป็นองค์กรหลักในรูปสภาหรือคณะกรรมการของกระทรวงศึกษาธิการ และสำนักงานปลัดกระทรวงศึกษาธิการ มีอำนาจหน้าที่ราชการประจำทั่วไปของกระทรวงศึกษาธิการ และเลขาธิการคณะกรรมการการอาชีวศึกษา มีฐานะเทียบเท่าอธิบดี","ง":"อ.ก.ค.ศ. สำนักงานปลัดกระทรวงศึกษาธิการ เป็นองค์กรหลักในรูปสภาหรือคณะกรรมการของกระทรวงศึกษาธิการ และ เลขาธิการสภาการศึกษา อธิบดีกรมส่งเสริมการเรียนรู้ ขึ้นตรงต่อรัฐมนตรีว่าการกระทรวงศึกษาธิการ และ สำนักงานปลัดกระทรวงศึกษาธิการ มีอำนาจหน้าที่ราชการประจำทั่วไปของกระทรวงศึกษาธิการ"},"a":"ข","exp":"คณะกรรมการการศึกษาขั้นพื้นฐาน เป็นองค์กรหลักในรูปสภาหรือคณะกรรมการของกระทรวงศึกษาธิการ และสำนักงานปลัดกระทรวงศึกษาธิการ มีอำนาจหน้าที่ราชการประจำทั่วไปของกระทรวงศึกษาธิการ และผู้ตรวจราชการกระทรวงศึกษาธิการ ขึ้นตรงต่อปลัดกระทรวงศึกษาธิการ คำอธิบายเพิ่มเติม: ข้อ"},{"id":62,"q":"ตาม พ.ร.บ.ระเบียบบริหารราชการกระทรวงศึกษาธิการ พ.ศ. 2546 และที่แก้ไขเพิ่มเติม ข้อใดเป็นชุดข้อความที่ถูกต้องทั้งหมด","opts":{"ก":"ปลัดกระทรวงศึกษาธิการ เป็นผู้บังคับบัญชาข้าราชการ กำหนดนโยบาย เป้าหมาย และผลสัมฤทธิ์ของงานในกระทรวงศึกษาธิการ และ รัฐมนตรีช่วยว่าการกระทรวงศึกษาธิการ มีหน้าที่แปลงนโยบายเป็นแนวทางและแผนปฏิบัติราชการกำกับการทำงานของส่วนราชการในกระทรวงศึกษาธิการให้เกิดผลสัมฤทธิ์ และ รัฐมนตรีว่าการกระทรวงศึกษาธิการ เป็นผู้บังคับบัญชาข้าราชการ ในสำนักงานปลัดกระทรวงศึกษาธิการ","ข":"รัฐมนตรีว่าการกระทรวงศึกษาธิการ เป็นผู้บังคับบัญชาข้าราชการ กำหนดนโยบาย เป้าหมาย และผลสัมฤทธิ์ของงานในกระทรวงศึกษาธิการ และสภาการศึ id":78,"q":"ผู้แทนข้าราชการ เป็นกรรมการของคณะกรรมการสถานศึกษาขั้นพื้นฐาน","opts":{"ก":"กล่าวถูกต้อง","ข":"กล่าวไม่ถูกต้อง"},"a":"ข","exp":"ในองค์ประกอบมาตรา 38 กำหนดให้มี \"ผู้แทนครู\" ไม่ใช่ผู้แทนข้าราชการทั่วไป"},{"id":79,"q":"ผู้บริหารองค์กรปกครองส่วนท้องถิ่น เป็นกรรมการของคณะกรรมการสถานศึกษาขั้นพื้นฐาน","opts":{"ก":"กล่าวถูกต้อง","ข":"กล่าวไม่ถูกต้อง"},"a":"ข","exp":"กฎหมายมาตรา 38 กำหนดให้มี \"ผู้แทนองค์กรปกครองส่วนท้องถิ่น\" เข้ามาร่วมเป็นกรรมการ ซึ่งอาจแต่งตั้งเจ้าหน้าที่หรือตัวแทนของ อปท. เข้ามาทำหน้าที่แทนได้ ไม่จำเป็นต้องเป็นตัวผู้บริหารสูงสุดของ อปท. (เช่น นายก อบต. หรือ นายกเทศมนตรี) ด้วยตนเองเสมอไป"},{"id":80,"q":"ประธานกรรมการสถานศึกษาขั้นพื้นฐานมีวาระการดำรงตำแหน่งวาระละ 3 ปี","opts":{"ก":"กล่าวถูกต้อง","ข":"กล่าวไม่ถูกต้อง"},"a":"ข","exp":"คณะกรรมการสถานศึกษาขั้นพื้นฐานและประธานกรรมการ มีวาระการดำรงตำแหน่งคราวละ 4 ปี (และอาจดำรงตำแหน่งได้อีกแต่ต้องไม่เกิน 2 วาระติดต่อกัน) ตามมาตรา 38 วรรคท้าย"},{"id":81,"q":"โรงเรียนบ้านโคก มีนักเรียน 301 คน ครู 9 คน มีคณะกรรมการสถานศึกษาขั้นพื้นฐานจำนวน 15 คน","opts":{"ก":"กล่าวถูกต้อง","ข":"กล่าวไม่ถูกต้อง"},"a":"ก","exp":"โรงเรียนมีจำนวนนักเรียน 301 คน ซึ่งถือว่า \"เกิน 300 คนขึ้นไป\" ส่งผลให้จัดอยู่ในประเภทโรงเรียนขนาดใหญ่ จึงต้องมีคณะกรรมการสถานศึกษาจำนวน 15 คน"},{"id":82,"q":"คณะกรรมการสถานศึกษาขั้นพื้นฐาน มีอำนาจหน้าที่เห็นชอบหลักสูตรสถานศึกษา","opts":{"ก":"กล่าวถูกต้อง","ข":"กล่าวไม่ถูกต้อง"},"a":"ก","exp":"อำนาจในการเห็นชอบหลักสูตรของโรงเรียน แผนพัฒนาการศึกษา และแผนปฏิบัติการประจำปี เป็นอำนาจหน้าที่ที่กฎหมายและระเบียบส่งเสริมการศึกษาขั้นพื้นฐานมอบหมายให้คณะกรรมการสถานศึกษาเป็นผู้พิจารณาเห็นชอบ"},{"id":83,"q":"การบริหารงานกฎหมายและคดีความ เป็นภาระงานตามการกระจายอำนาจการบริหารและการจัดการศึกษา","opts":{"ก":"กล่าวถูกต้อง","ข":"กล่าวไม่ถูกต้อง"},"a":"ข","exp":"การกระจายอำนาจของกระทรวงศึกษาธิการตามมาตรา 44 มีเพียง 4 ด้านหลักเท่านั้น คือ ด้านวิชาการ ด้านงบประมาณ ด้านบริหารงานบุคคล และด้านบริหารทั่วไป ไม่มีเรื่องงานกฎหมายและคดีความ"},{"id":84,"q":"การปฏิบัติงานแทน หมายถึง การที่ผู้บังคับบัญชามอบอำนาจในการบริหารราชก  สภาครูฯ นี้"},{"id":7,"q":"ข้อใดไม่ใช่ “สถานศึกษา” ตามพระราชบัญญัตสิภาครูและบุคลากรทางการศึกษา พ.ศ. 2546 (พิจารณาจากแนวข้อสอบจริง สพฐ.กรณีพิเศษ 2564)","opts":{"ก":"โรงเรียนเอกชน","ข":"มหาวิทยาลัย","ค":"พิพิธภัณฑ์","ง":"วิทยาลัย"},"a":"ค","exp":"ตามนิยามคำว่า \"สถานศึกษา\" ในมาตรา 4 นั้น มุ่งเน้นหน่วยงานที่มีวัตถุประสงค์หลักในการจัดการศึกษา ได้แก่ สถานพัฒนาเด็กปฐมวัย โรงเรียน วิทยาลัย สถาบัน มหาวิทยาลัย แม้ว่าพิพิธภัณฑ์จะเป็นแหล่งเรียนรู้ตลอดชีวิต แต่ตามกฎหมายฉบับนี้ไม่ได้จัดให้พิพิธภัณฑ์เป็นสถานศึกษาตามเงื่อนไขที่ผู้ปฏิบัติงานในตำแหน่งครูหรือผู้บริหารต้องมีใบอนุญาตประกอบวิชาชีพควบคุม"},{"id":8,"q":"บุคคลใดไม่ใช่ผู้ประกอบวิชาชีพทางการศึกษา (พิจารณาจากแนวข้อสอบจริง สอศ.กรณีพิเศษ 2566)","opts":{"ก":"ผู้อำนวยการสำนักงานเขตพื้นที่การศึกษา","ข":"อาจารย์มหาวิทยาลัยของรัฐ","ค":"ครูสอนนักเรียนในสถานศึกษาเอกชน","ง":"ผู้อำนวยการโรงเรียนเอกชน"},"a":"ข","exp":"ตามมาตรา 4 และมาตรา 43 (6) กำหนดข้อยกเว้นไว้ว่า คณาจารย์ (อาจารย์มหาวิทยาลัย) ทั้งของรัฐและเอกชน ไม่ต้องมีใบอนุญาตประกอบวิชาชีพควบคุมและไม่จัดเป็นผู้ประกอบวิชาชีพทางการศึกษาควบคุมภายใต้ พ.ร.บ. สภาครูฯ ในขณะที่ผู้บริหารการศึกษา (ผอ.เขตพื้นที่ฯ), ครูสอนในโรงเรียนเอกชน (ครู), และผู้บริหารสถานศึกษาเอกชน (ผอ.โรงเรียนเอกชน) ล้วนอยู่ในข่ายที่ต้องมีใบอนุญาตประกอบวิชาชีพตามกฎหมาย"},{"id":9,"q":"ใครไม่เกี่ยวข้องกับพระราชบัญญัตสิภาครูและบุคลากรทางการศึกษา พ.ศ. 2546 (พิจารณาจากแนวข้อสอบจริง สพฐ.กรณีพิเศษ ปี 2564)","opts":{"ก":"อาจารย์มหาวิทยาลัย","ข":"ครูโรงเรียนเอกชน","ค":"ครูศูนย์พัฒนาเด็กเล็ก","ง":"ครูโรงเรียนสาธิต"},"a":"ก","exp":"ข้อนี้ใช้หลักการยกเว้นตามมาตรา 43 (6) คณาจารย์ในระดับอุดมศึกษาระดับปริญญาไม่จัดเป็นผู้ประกอบวิชาชีพควบคุมภายใต้การกำกับดูแลของสภาครู (คุรุสภา) จึงไม่มีความเกี่ยวข้องโดยตรงกับการบังคับใช้ พ.ร.บ. นี้ ส่วนครูโรงเรียนเอกชน ครูศูนย์พัฒนาเด็กเล็ก (ปฐมวัย) และครูโรงเรียนสาธิต (ขั้นพื้นฐาน) ล้วนมีหน้าที่หลักด้านการเรียนการสอนในระดับที่กฎหมายนี้ควบคุม จึงเกี่ยวข้องเต็มตัวและต้องมีใบอนุญาตประกอบวิชาชีพครู"},{"id":10,"q":"สภาครูและบุคลากรทางการศึกษา หมายถึงหน่วยงานใด (สพฐ.รอบทั่วไป 2563)","opts":{"ก":"คณะกรรมการข้
