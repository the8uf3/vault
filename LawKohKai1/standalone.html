. 2562","opts":{"ก":"บิดา","ข":"มารดา","ค":"ผู้ปกครอง","ง":"นายจ้าง"},"a":"ง","exp":"ละเอียด: มาตรา 3 กำหนดคำนิยาม \"ผู้ดูแลเด็กปฐมวัย\" ไว้เพียง \"บิดา มารดา ผู้ปกครอง หรือผู้ซึ่งเลี้ยงดูเด็กปฐมวัย\" เท่านั้น ดังนั้น \"นายจ้าง\" จึงไม่ใช่ผู้ดูแลเด็กปฐมวัยตามกฎหมายนี้"},{"id":8,"q":"ข้อใดไม่ใช่ “สถานพัฒนาเด็กปฐมวัย” ตาม พ.ร.บ.การพัฒนาเด็กปฐมวัย พ.ศ. 2562 (สพฐ.รอบทั่วไป 2566)","opts":{"ก":"มูลนิธิกระจกเงา","ข":"โรงเรียนเอกชน","ค":"ศูนย์บริการช่วยเหลือระยะแรกเริ่มของเด็กพิการหรือเด็กซึ่งมีความต้องการพิเศษ","ง":"ศูนย์เด็กเล็ก ศูนย์พัฒนาเด็กเล็ก สถานรับเลี้ยงเด็ก"},"a":"ก","exp":"ละเอียด: ตามนิยามในมาตรา 3 \"สถานพัฒนาเด็กปฐมวัย\" หมายถึง ศูนย์เด็กเล็ก ศูนย์พัฒนาเด็กเล็ก ศูนย์บริการช่วยเหลือระยะแรกเริ่มฯ สถานรับเลี้ยงเด็ก สถานสงเคราะห์ โรงเรียน ศูนย์การเรียน หน่วยงานการศึกษา หรือสถาบันศาสนาที่มีวัตถุประสงค์ในการจัดการศึกษาให้แก่เด็กปฐมวัย แต่มูลนิธิกระจกเงาเป็นองค์การสาธารณประโยชน์ที่ไม่ได้จัดตั้งเป็นสถานศึกษาหรือสถานพัฒนาเด็กปฐมวัยตามนิยามนี้"},{"id":9,"q":"ข้อใดไม่ใช่วัตถุประสงค์หรือเป้าหมายการพัฒนาเด็กปฐมวัย (สพฐ. รอบทั่วไป 2567)","opts":{"ก":"เด็กปฐมวัยมีพัฒนาการที่ดีรอบด้านทั้งทางร่างกาย จิตใจ วินัย อารมณ์ สังคม และสติปัญญา","ข":"การจัดการเรียนรู้ที่มุ่งเน้นการสอบแข่งขันระหว่างเด็กปฐมวัย","ค":"เด็กปฐมวัยอยู่รอดปลอดภัยและได้รับความคุ้มครองให้พ้นจากการล่วงละเมิด","ง":"มารดาได้รับการดูแลในระหว่างตั้งครรภ์เพื่อให้บุตรที่อยู่ในครรภ์มีสุขภาวะและพัฒนาการที่ดี"},"a":"ข","exp":"ละเอียด: ตามมาตรา 8 กำหนดอย่างชัดเจนว่า \"การจัดการเรียนรู้ของสถานพัฒนาเด็กปฐมวัยต้องเป็นไปเพื่อเตรียมความพร้อมของเด็กปฐมวัย แต่ต้องไม่เป็นการจัดการเรียนรู้ที่มุ่งเน้นการสอบแข่งขันระหว่างเด็กปฐมวัย\" การจัดสอบแข่งขันจึงไม่ใช่วัตถุประสงค์และถือเป็นการขัดหลักการพัฒนาเด็กปฐมวัยด้วย"},{"id":10,"q":"ข้อใดกล่าวไม่ถูกต้องเกี่ยวกับวัตถุประสงค์ของการพัฒนาเด็กปฐมวัย (สพฐ. รอบทั่วไป 2567)","opts":{"ก":"บ่มเพาะเจตคติของเด็กปฐมวัยให้มีจิตสำนึกในการเป็นพลเมืองไทยและพลโลก","ข":"บ่มเพาะเจตคติของเด็กปฐมวัยให้เคารพในสถาบันชาติ ยึดถือการปกครองในระบอบประชาธิปไตยอันมีพระมหากษัตริย์ทรงเป็นประมุข","ค":"บ่มเพาะเจตคติของเด็กปฐมวัยให้เคารพคุณค่าของบุคคลอื่น","ง":"สร้างคุณลักษณะให้เด็กปฐมวัยมีอุปนิสัยใฝ่ดี มีคุณธรรม มีวินัย ใฝ่รู้ มีความคิดสร้างสรรค์"},"a":"ข","exp":"ละเอียด: วัตถุประสงค์ตามมาตรา 5 บัญญัติให้บ่มเพาะเจตคติของเด็กปฐมวัยให้ \"เคารพคุณค่าของบุคคลอื่น มีจิตวิญญาณของการอยู่ร่วมกันในสังคมอย่างเสมอภาค และมีจิตสำนึกในความเป็นพลเมืองไทยและพลโลก\" (อนุมาตรา 5) โดยไม่มีการบัญญัติเรื่อง \"การเคารพสถาบันชาติ หรือระบอบประชาธิปไตยฯ\" ไว้ในมาตรานี้"},{"id":11,"q":"ข้อใดเป็นเป้าหมายของการพัฒนาเด็กปฐมวัย (สพฐ.รอบทั่วไป 2566)","opts":{"ก":"มารดาได้รับการดูแลหลังการคลอดบุตร มีสุขภาวะและพัฒนาการที่ดีอย่างน้อย 6 ปี","ข":"เลือกบริการทางการศึกษา สถานศึกษา ระบบและรูปแบบการศึกษา โดยคำนึงถึงความสามารถ","ค":"เด็กปฐมวัยมีพัฒนาการที่ดีรอบด้านในการเรียนรู้อย่างต่อเนื่องตลอดชีวิต","ง":"ได้รับการศึกษาโดยไม่เสียค่าใช้จ่ายตั้งแต่แรกเกิดหรือพบความพิการจนตลอดชีวิต"},"a":"ค","exp":"ละเอียด: ตามมาตรา 5 (3) กำหนดวัตถุประสงค์สำคัญเพื่อให้เด็กปฐมวัยมีพัฒนาการที่ดีรอบด้านทั้งทางร่างกาย จิตใจ วินัย อารมณ์ สังคม และสติปัญญาให้สมกับวัย เพื่อให้เกิดทักษะพื้นฐานในการเรียนรู้อย่างต่อเนื่องตลอดชีวิต"},{"id":12,"q":"บิดา มารดา และผู้ปกครองมีหน้าที่ตามข้อใด","opts":{"ก":"จัดให้เด็กก่อนวัยเรียนได้รับการพัฒนาตามแนวปฏิบัติที่ดีเกี่ยวกับการพัฒนาเด็กก่อนวัยเรียน","ข":"จัดให้เด็กอนุบาลซึ่งอยู่ในความดูแลได้รับการศึกษาจนถึงการศึกษาขั้นพื้นฐาน","ค":"จัดให้เด็กปฐมวัยซึ่งอยู่ในความดูแลได้รับการศึกษาจนถึงการศึกษาภาคบังคับ","ง":"จัดให้เด็กปฐมวัยซึ่งอยู่ในความดูแลได้รับการพัฒนาตามแนวปฏิบัติที่ดีเกี่ยวกับการพัฒนาเด็กปฐมวัย"},"a":"ง","exp":"ละเอียด: มาตรา 7 ของ พ.ร.บ. นี้ กำหนดบทบาทหน้าที่โดยตรงของ บิดา มารดา และผู้ปกครอง ว่ามี \"หน้าที่จัดให้เด็กปฐมวัยซึ่งอยู่ในความดูแลได้รับการพัฒนาตามแนวปฏิบัติที่ดีเกี่ยวกับการพัฒนาเด็กปฐมวัย\""},{"id":13,"q":"การจัดการเรียนรู้ของสถานพัฒนาเด็กปฐมวัยต้องเป็นไปเพื่อเตรียมความพร้อมของเด็กปฐมวัยตามข้อใด","opts":{"ก":"มุ่งเน้นการสอบแข่งขันระหว่างเด็กปฐมวัย","ข":"ไม่เป็นมุ่งเน้นการสอบแข่งขันระหว่างเด็กปฐมวัย","ค":"เป็นการจัดการเรียนการสอนจนถึงการศึกษาขั้นพื้นฐาน","ง":"การจัดการศึกษาต้องเป็นไปเพื่อพัฒนาคนไทยให้เป็นมนุษย์ที่สมบูรณ์"},"a":"ข","exp":"ละเอียด: ตามมาตรา 8 บัญญัติว่า \"การจัดการเรียนรู้ของสถานพัฒนาเด็กปฐมวัยต้องเป็นไปเพื่อเตรียมความพร้อมของเด็กปฐมวัย แต่ต้องไม่เป็นการจัดการเรียนรู้ที่มุ่งเน้นการสอบแข่งขันระหว่างเด็กปฐมวัย\" เพื่อไม่ให้ส่งผลเสียต่อพัฒนาการตามธรรมชาติของเด็ก หมวด 2 และ 3: คณะกรรมการนโยบายฯ และ แผนพัฒนาเด็กปฐมวัย"},{"id":14,"q":"ใครเป็นประธานกรรมการคณะกรรมการนโยบายการพัฒนาเด็กปฐมวัย","opts":{"ก":"นายกรัฐมนตรีหรือรองนายกรัฐมนตรีซึ่งนายกรัฐมนตรีมอบหมาย","ข":"รัฐมนตรีว่าการกระทรวงศึกษาธิการ","ค":"รัฐมนตรีว่าการกระทรวงการพัฒนาสังคมและความมั่นคงของมนุษย์","ง":"เลขาธิการคณะกรรมการการศึกษาขั้นพื้นฐาน"},"a":"ก","exp":"ละเอียด: ตามมาตรา 9 (1) ระบุชัดเจนว่า คณะกรรมการนโยบายการพัฒนาเด็กปฐมวัย มีประธานกรรมการคือ \"นายกรัฐมนตรีหรือรองนายกรัฐมนตรีซึ่งนายกรัฐมนตรีมอบหมาย\""},{"id":15,"q":"ใครเป็นกรรมการและเลขานุการในคณะกรรมการนโยบายการพัฒนาเด็กปฐมวัย","opts":{"ก":"เลขาธิการคณะกรรมการการศึกษาขั้นพื้นฐาน","ข":"ปลัดกระทรวงศึกษาธิการ","ค":"เลขาธิการสภาการศึกษา","ง":"ผู้อำนวยการสำนักบริหารงานการศึกษาพิเศษ"},"a":"ค","exp":"ละเอียด: ตามมาตรา 9 วรรคสอง กำหนดให้อัตราตำแหน่ง \"เลขาธิการสภาการศึกษา\" ทำหน้าที่เป็นกรรมการและเลขานุการในคณะกรรมการนโยบายฯ โดยตำแหน่ง"},{"id":16,"q":"ใครเป็นผู้กำหนดนโยบายการพัฒนาเด็กปฐมวัย (สพฐ. รอบทั่วไป 2568)","opts":{"ก":"คณะกรรมการการศึกษาขั้นพื้นฐาน","ข":"สภาการศึกษา","ค":"คณะกรรมการนโยบายการพัฒนาเด็กปฐมวัย","ง":"คณะกรรมการข้าราชการครูและบุคลากรทางการศึกษา"},"a":"ค","exp":"ละเอียด: ตามมาตรา 14 (1) คณะกรรมการนโยบายการพัฒนาเด็กปฐมวัย มีหน้าที่และอำนาจหลักคือ \"จัดทำนโยบายระดับชาติด้านการพัฒนาเด็กปฐมวัย\" เพื่อส่งต่อให้คณะรัฐมนตรีให้ความเห็นชอบ"},{"id":17,"q":"คณะกรรมการนโยบายการพัฒนาเด็กปฐมวัยต้องจัดทำนโยบายระดับชาติด้านการพัฒนาเด็กปฐมวัยให้สอดคล้องตามพระราชบัญญัติการพัฒนาเด็กปฐมวัย พ.ศ. 2562 ยกเว้นข้อใด","opts":{"ก":"กฎหมายว่าด้วยการศึกษาแห่งชาติ","ข":"ยุทธศาสตร์ชาติ","ค":"แผนพัฒนาเศรษฐกิจและสังคมแห่งชาติ","ง":"แผนการปฏิรูปประเทศ"},"a":"ค","exp":"ละเอียด: มาตรา 14 (1) บัญญัติว่า การจัดทำนโยบายระดับชาติด้านการพัฒนาเด็กปฐมวัย \"ต้องสอดคล้องกับกฎหมายว่าด้วยการศึกษาแห่งชาติ ยุทธศาสตร์ชาติ และแผนการปฏิรูปประเทศ\" โดยไม่ได้ระบุชื่อของ \"แผนพัฒนาเศรษฐกิจและสังคมแห่งชาติ\" ไว้อย่างเจาะจงในส่วนนี้"},{"id":18,"q":"นโยบายการพัฒนาเด็กปฐมวัย แผนพัฒนาเด็กปฐมวัย ต้องเสนอต่อใครเพื่อให้ความเห็นชอบ (สพฐ.รอบทั่วไป 2566)","opts":{"ก":"คณะกรรมการนโยบายการพัฒนาเด็กปฐมวัย","ข":"รัฐมนตรีว่าการกระทรวงศึกษาธิการ","ค":"นายกรัฐมนตรี","ง":"คณะรัฐมนตรี"},"a":"ง","exp":"ละเอียด: ตามมาตรา 14 (1) และ มาตรา 19 กำหนดให้คณะกรรมการเป็นผู้เสนอแผนพัฒนาเด็กปฐมวัยต่อ \"คณะรัฐมนตรี\" เพื่อพิจารณาให้ความเห็นชอบและประกาศให้ทราบเป็นการทั่วไป"},{"id":19,"q":"หน่วยงานใดทำหน้าที่เป็นสำนักงานเลขานุการของคณะกรรมการนโยบายการพัฒนาเด็กปฐมวัย","opts":{"ก":"สำนักงานปลัดกระทรวงการพัฒนาสังคมและความมั่นคงของมนุษย์","ข":"สำนักงานเลขาธิการสภาการศึกษา","ค":"สำนักงานคณะกรรมการการศึกษาขั้นพื้นฐาน","ง":"สำนักบริหารงานการศึกษาพิเศษ"},"a":"ข","exp":"ละเอียด: มาตรา 18 บัญญัติให้ \"สำนักงานเลขาธิการสภาการศึกษา\" (สพศ.) ทำหน้าที่เป็นสำนักงานเลขานุการของคณะกรรมการ รับผิดชอบงานธุรการ งานประชุม วิชาการ และงานวิจัยทั้งหมด"},{"id":20,"q":"หน่วยงานที่เกี่ยวข้องมีหน้าที่ดำเนินการสนับสนุนแผนพัฒนาเด็กปฐมวัยอย่างไร (สพฐ.รอบทั่วไป 2564/2565)","opts":{"ก":"เยี่ยมเยียน ให้คำปรึกษา แนะนำ และตักเตือนเกี่ยวกับเรื่องความประพฤติการศึกษา","ข":"จัดให้มีระบบงานและกิจกรรมในการแนะแนวให้คำปรึกษาและฝึกอบรมแก่นักเรียน นักศึกษา และผู้ปกครอง","ค":"ให้การอุปการะเลี้ยงดู อบรมสั่งสอน และพัฒนาเด็กที่อยู่ในความปกครองดูแลของตน","ง":"การบูรณาการการทำงานร่วมกันระหว่างหน่วยงานของรัฐ ภาคเอกชน เพื่อขับเคลื่อนการดำเนินการตามแผนพัฒนาเด็กปฐมวัย"},"a":"ง","exp":"ละเอียด: ตามมาตรา 20 (2) แผนพัฒนาเด็กปฐมวัยต้องกำหนดเรื่อง \"การบูรณาการการทำงานร่วมกันระหว่างหน่วยงานของรัฐ องค์กรปกครองส่วนท้องถิ่น ภาคเอกชน และภาคประชาสังคม เพื่อขับเคลื่อนการดำเนินการตามแผนพัฒนาเด็กปฐมวัย\" หมวด 4: การพัฒนาเด็กปฐมวัย"},{"id":21,"q":"การผลิตครูหรือพัฒนาครูด้านการพัฒนาเด็กปฐมวัย ให้สถาบันอุดมศึกษาจัดให้มีการเรียนการสอน ยกเว้นข้อใด","opts":{"ก":"เพื่อเสริมสร้างจิตวิญญาณของความเป็นครู","ข":"ความสามารถในการจัดการเรียนการสอน","ค":"ดูแลและพัฒนาเด็กปฐมวัยตามหลักการและปรัชญาของการพัฒนาเด็กปฐมวัย","ง":"ให้บริการสาธารณสุขแก่หญิงตั้งครรภ์และเด็กปฐมวัย"},"a":"ง","exp":"ละเอียด: มาตรา 23 บัญญัติขอบข่ายหน้าที่ในการผลิตและพัฒนาครูของสถาบันอุดมศึกษาให้ครอบคลุมการเสริมสร้างจิตวิญญาณความเป็นครู มีคุณธรรม จริยธรรม ความรู้ ทักษะ และความสามารถในการจัดการเรียนการสอนตามปรัชญาพัฒนาเด็กปฐมวัย แต่การให้บริการสาธารณสุขเป็นบทบาทหน้าที่ของ \"สถานพยาบาล\" ตามมาตรา 24"},{"id":22,"q":"สถานพยาบาลของหน่วยงานของรัฐ องค์กรปกครองส่วนท้องถิ่น หรือภาคเอกชน ต้องมีการส่งเสริมพัฒนาการและการส่งเสริมการให้นมมารดาแก่บุตรตั้งแต่แรกเกิดอย่างน้อยกี่เดือน","opts":{"ก":"3 เดือน","ข":"6 เดือน","ค":"12 เดือน","ง":"24 เดือน"},"a":"ข","exp":"ละเอียด: ตามมาตรา 24 กำหนดให้สถานพยาบาลที่ให้บริการสาธารณสุขแก่หญิงตั้งครรภ์และเด็กปฐมวัย ต้องให้บริการส่งเสริมสุขภาพ โภชนาการ พัฒนาการ และ \"การส่งเสริมการให้นมมารดาแก่บุตรตั้งแต่แรกเกิดอย่างน้อยหกเดือน\""},{"id":23,"q":"ครูท่านใดสนับสนุนการพัฒนาเด็กปฐมวัยตาม พ.ร.บ. การพัฒนาเด็กปฐมวัย พ.ศ. 2562 (สพฐ.รอบทั่วไป 2564/2565)","opts":{"ก":"ครูฝน ประสานความร่วมมือระหว่างชุมชน ผู้ปกครอง เพื่อพัฒนาการเรียนรู้ของเด็ก","ข":"ครูมด จำหน่าย แลกเปลี่ยน หรือให้สุราหรือบุหรี่แก่เด็ก","ค":"ครูไก่ บังคับ ขู่เข็ญ ชักจูง ส่งเสริม ยินยอม หรือกระทำด้วยประการใดให้เด็กไปเป็นขอทาน","ง":"ครูผึ้ง โฆษณาทางสื่อมวลชนหรือเผยแพร่ด้วยประการใด เพื่อรับเด็กให้แก่บุคคลอื่นที่มิใช่ญาติ"},"a":"ก","exp":"ละเอียด: ตามหลักการ พ.ร.บ. การพัฒนาเด็กปฐมวัย เน้นย้ำเรื่องภารกิจร่วมมือกันของหน่วยงานรัฐ ชุมชน ครอบครัว (ตามมาตรา 6 และ 14) การประสานงานของครูฝนเป็นคุณลักษณะที่สนับสนุนแนวปฏิบัติที่ดีตามกฎหมายฉบับนี้โดยตรง ส่วนพฤติกรรมในข้ออื่นเป็นความผิดร้ายแรงและละเมิดสิทธิเด็กอย่างชัดเจน"},{"id":24,"q":"นายแดงกำลังเตรียมตัวสอบครูผู้ช่วย โดยสรุปสาระสำคัญของ พ.ร.บ.การพัฒนาเด็กปฐมวัย พ.ศ. 2562 ไว้ว่า \"ผู้รักษาการตามกฎหมายฉบับนี้คือรัฐมนตรีว่าการกระทรวงศึกษาธิการและรัฐมนตรีว่าการกระทรวงมหาดไทย\" เพื่อนของนายแดงจึงทักท้วงว่าข้อมูลดังกล่าวอาจไม่ถูกต้อง ข้อใดเป็นการวิเคราะห์ที่ถูกต้องที่สุด","opts":{"ก":"ข้อมูลของนายแดงถูกต้อง เพราะองค์กรปกครองส่วนท้องถิ่นมีหน้าที่เกี่ยวกับเด็กปฐมวัย","ข":"ข้อมูลของนายแดงไม่ถูกต้อง เพราะผู้รักษาการคือ นายกรัฐมนตรี และรัฐมนตรีว่าการกระทรวงศึกษาธิการ","ค":"ข้อมูลของนายแดงไม่ถูกต้อง เพราะนายกรัฐมนตรีเป็นผู้รักษาการเพียงผู้เดียว","ง":"ข้อมูลของนายแดงถูกต้อง เพราะกระทรวงมหาดไทยกำกับดูแลศูนย์พัฒนาเด็กเล็ก"},"a":"ข","exp":"ละเอียด: มาตรา 4 ของพระราชบัญญัติการพัฒนาเด็กปฐมวัย พ.ศ. 2562 กำหนดว่า \"ให้นายกรัฐมนตรีและรัฐมนตรีว่าการกระทรวงศึกษาธิการรักษาการตามพระราชบัญญัตินี้\" ดังนั้น สรุปของนายแดงจึงผิดพลาดเนื่องจากขาดนายกรัฐมนตรี และระบุรัฐมนตรีว่าการกระทรวงมหาดไทยเกินมา แม้กระทรวงมหาดไทยจะกำกับดูแล อปท. ที่ดูแลเด็กปฐมวัย แต่ตามกฎหมายไม่ได้เป็นผู้รักษาการร่วม"},{"id":25,"q":"เด็กชายต้น อายุ 5 ปี 10 เดือน กำลังเรียนอยู่ในศูนย์พัฒนาเด็กเล็กขององค์กรปกครองส่วนท้องถิ่น ขณะที่เด็กชายเมฆ อายุ 6 ปี 2 เดือน ยังไม่ได้เข้าเรียนระดับประถมศึกษา ผู้ปกครองของทั้งสองคนสงสัยว่าใครเป็น \"เด็กปฐมวัย\" ตามกฎหมาย ข้อใดถูกต้องที่สุด","opts":{"ก":"เด็กชายต้นเป็นเด็กปฐมวัย แต่เด็กชายเมฆไม่เป็น เพราะอายุเกิน 6 ปีแล้ว","ข":"ทั้งสองคนเป็นเด็กปฐมวัย เพราะยังไม่ได้เข้าเรียนระดับประถมศึกษา","ค":"เด็กชายเมฆเป็นเด็กปฐมวัย แต่เด็กชายต้นไม่เป็น เพราะเรียนในศูนย์พัฒนาเด็กเล็กแล้ว","ง":"ทั้งสองคนไม่เป็นเด็กปฐมวัย เพราะกฎหมายคุ้มครองเฉพาะเด็กก่อนเข้าเรียนเท่านั้น"},"a":"ข","exp":"ละเอียด: บทนิยามในมาตรา 3 ระบุว่า \"เด็กปฐมวัย\" หมายถึง \"เด็กซึ่งมีอายุต่ำกว่าหกปีบริบูรณ์ และให้หมายความรวมถึงเด็กซึ่งต้องได้รับการพัฒนาก่อนเข้ารับการศึกษาในระดับประถมศึกษา\" เด็กชายต้น อายุ 5 ปี 10 เดือน ซึ่งต่ำกว่า 6 ปีบริบูรณ์ จึงเข้าข่ายโดยตรง เด็กชายเมฆ อายุ 6 ปี 2 เดือน แม้จะเกิน 6 ปีไปแล้ว แต่เขายังมิได้เข้าเรียนในระดับประถมศึกษาและยังต้องการพัฒนาการก่อนประถมศึกษา จึงได้รับการครอบคลุมให้อยู่ในกลุ่มเด็กปฐมวัยด้วย ดังนั้นทั้งสองคนจึงเป็นเด็กปฐมวัยตามกฎหมาย"},{"id":26,"q":"นางสาวน้ำฝนกำลังตั้งครรภ์ 7 เดือน เข้าร่วมโครงการอบรมการเลี้ยงดูบุตรของเทศบาล โดยเจ้าหน้าที่ให้ความรู้เรื่องโภชนาการ การส่งเสริมพัฒนาการ และการเตรียมความพร้อมก่อนคลอด ขณะเดียวกันเพื่อนของเธอเห็นว่าโครงการดังกล่าวไม่น่าจะเกี่ยวข้องกับการพัฒนาเด็กปฐมวัย เพราะเด็กยังไม่คลอด ข้อใดวิเคราะห์ได้ถูกต้องที่สุด","opts":{"ก":"ไม่ถือเป็นการพัฒนาเด็กปฐมวัย เพราะเด็กยังไม่เกิดและยังไม่มีอายุต่ำกว่า 6 ปีบริบูรณ์","ข":"ถือเป็นการพัฒนาเด็กปฐมวัย เพราะกฎหมายให้ความหมายรวมถึงการดูแลและพัฒนาหญิงตั้งครรภ์ด้วย","ค":"ไม่ถือเป็นการพัฒนาเด็กปฐมวัย เพราะต้องเป็นกิจกรรมที่จัดให้แก่เด็กโดยตรงเท่านั้น","ง":"ถือเป็นการพัฒนาเด็กปฐมวัย เฉพาะกรณีที่หญิงตั้งครรภ์เข้ารับบริการในโรงพยาบาลของรัฐเท่านั้น"},"a":"ข","exp":"ละเอียด: ตามบทนิยามมาตรา 3 \"การพัฒนาเด็กปฐมวัย\" หมายความว่า \"การดูแล การพัฒนา และการจัดการเรียนรู้สำหรับเด็กปฐมวัย หญิงตั้งครรภ์ หรือผู้ดูแลเด็กปฐมวัย\" และมาตรา 5 (1) กำหนดวัตถุประสงค์เพื่อให้มารดาได้รับการดูแลระหว่างตั้งครรภ์ ดังนั้น การจัดอบรมให้ความรู้แก่หญิงตั้งครรภ์ 7 เดือน จึงจัดเป็นการพัฒนาเด็กปฐมวัยตามกฎหมายนี้อย่างสมบูรณ์แบบ"},{"id":27,"q":"วัดแห่งหนึ่งเปิดศูนย์การเรียนสำหรับเด็กอายุ 3-5 ปี โดยจัดกิจกรรมเตรียมความพร้อมด้านภาษา สังคม และอารมณ์ทุกวัน มีผู้ปกครองบางคนเห็นว่าไม่ใช่ \"สถานพัฒนาเด็กปฐมวัย\" เพราะไม่ได้ใช้ชื่อว่าโรงเรียนหรือศูนย์พัฒนาเด็กเล็ก ข้อใดเป็นการวิเคราะห์ที่ถูกต้องที่สุด","opts":{"ก":"ไม่เป็นสถานพัฒนาเด็กปฐมวัย เพราะต้องมีคำว่า \"ศูนย์พัฒนาเด็กเล็ก\" ในชื่อสถานที่","ข":"ไม่เป็นสถานพัฒนาเด็กปฐมวัย เพราะสถาบันศาสนาไม่มีอำนาจจัดการศึกษา","ค":"เป็นสถานพัฒนาเด็กปฐมวัย เพราะมีวัตถุประสงค์จัดการศึกษา และมีการพัฒนาให้แก่เด็กปฐมวัย","ง":"เป็นสถานพัฒนาเด็กปฐมวัย เฉพาะเมื่อได้รับอนุญาตจากกระทรวงศึกษาธิการเท่านั้น"},"a":"ค","exp":"ละเอียด: บทนิยาม \"สถานพัฒนาเด็กปฐมวัย\" ในมาตรา 3 ระบุไว้อย่างครอบคลุมกว้างขวาง \"...รวมทั้งโรงเรียน ศูนย์การเรียน หน่วยงานการศึกษา หรือหน่วยงานอื่นของรัฐหรือเอกชน และสถาบันศาสนา ที่มีวัตถุประสงค์ในการจัดการศึกษาให้แก่เด็กปฐมวัย\" ดังนั้น แม้จะเป็นสถาบันทางศาสนา (วัด) และไม่ได้ใช้ชื่อว่าโรงเรียน แต่หากจัดตั้งโดยมีวัตถุประสงค์พัฒนาและจัดการศึกษาให้เด็กวัย 3-5 ปี ก็ถือเป็นสถานพัฒนาเด็กปฐมวัยตามกฎหมายทันที"},{"id":28,"q":"ศูนย์บริการช่วยเหลือระยะแรกเริ่มของเด็กพิการแห่งหนึ่ง ดูแลเด็กพิการ อายุ 3-5 ปี ตั้งอยู่ในเขตกรุงเทพมหานคร วันหนึ่งมีผู้ตรวจสอบเสนอว่า หน่วยงานดังกล่าวไม่ควรถูกนับเป็นสถานพัฒนาเด็กปฐมวัย เพราะไม่ได้รับเด็กทั่วไปเข้าเรียนเหมือนโรงเรียนอนุบาล ข้อใดเป็นเหตุผลโต้แย้งที่ถูกต้องที่สุด","opts":{"ก":"ศูนย์ดังกล่าวไม่เป็นสถานพัฒนาเด็กปฐมวัย เพราะให้บริการเฉพาะเด็กพิการ","ข":"ศูนย์ดังกล่าวเป็นสถานพัฒนาเด็กปฐมวัย เนื่องจากเข้าเงื่อนไขตามกฎหมาย","ค":"ศูนย์ดังกล่าวเป็นสถานพัฒนาเด็กปฐมวัย เฉพาะเมื่อสังกัดกระทรวงศึกษาธิการ","ง":"ศูนย์ดังกล่าวไม่เป็นสถานพัฒนาเด็กปฐมวัย เพราะไม่มีคำว่า \"โรงเรียน\" ในชื่อหน่วยงาน"},"a":"ข","exp":"ละเอียด: ในบทนิยามมาตรา 3 บัญญัติชัดเจนว่า \"สถานพัฒนาเด็กปฐมวัย\" รวมถึง \"ศูนย์บริการช่วยเหลือระยะแรกเริ่มของเด็กพิการหรือเด็กซึ่งมีความต้องการพิเศษ\" ด้วย ดังนั้น ข้อเสนอของผู้ตรวจสอบที่บอกว่าไม่นับเนื่องจากไม่รับเด็กทั่วไปจึงไม่ถูกต้องตามหลักกฎหมายฉบับนี้ที่ให้ความคุ้มครองเด็กทุกกลุ่มรวมถึงกลุ่มเด็กพิการด้วย"},{"id":29,"q":"เทศบาลแห่งหนึ่งจัดโครงการ \"แม่พร้อม ลูกพร้อม\" โดยให้หญิงตั้งครรภ์เข้ารับการตรวจสุขภาพ รับคำแนะนำด้านโภชนาการ และติดตามพัฒนาการของทารกในครรภ์อย่างต่อเนื่อง ขณะที่อีกหน่วยงานหนึ่งเสนอให้นำงบประมาณดังกล่าวไปใช้เฉพาะกับเด็กที่เกิดแล้วเท่านั้น เพราะเห็นว่ายังไม่เกี่ยวกับการพัฒนาเด็กปฐมวัย ข้อใดวิเคราะห์ได้สอดคล้องกับวัตถุประสงค์ของ พ.ร.บ.การพัฒนาเด็กปฐมวัย พ.ศ. 2562 มากที่สุด","opts":{"ก":"ควรยกเลิกโครงการ เพราะการพัฒนาเด็กปฐมวัยเริ่มหลังคลอดเท่านั้น","ข":"ควรดำเนินโครงการต่อ เพราะวัตถุประสงค์ของกฎหมายครอบคลุมถึงการดูแลมารดาในระหว่างตั้งครรภ์","ค":"ควรดำเนินโครงการเฉพาะหญิงตั้งครรภ์ที่มีรายได้น้อย","ง":"ควรเปลี่ยนเป็นโครงการส่งเสริมการเรียนพิเศษก่อนเข้าโรงเรียนแทน"},"a":"ข","exp":"ละเอียด: วัตถุประสงค์ข้อแรกตามมาตรา 5 (1) บัญญัติว่า \"ให้มารดาได้รับการดูแลในระหว่างตั้งครรภ์เพื่อให้บุตรที่อยู่ในครรภ์มีสุขภาวะและพัฒนาการที่ดี\" การดูแลของเทศบาลโดยการส่งเสริมโภชนาการและติดตามพัฒนาการทารกในครรภ์จึงสอดคล้องกับเจตนารมณ์และวัตถุประสงค์ของกฎหมายโดยตรง ดังนั้น การเสนอให้ตัดงบเพื่อไปใช้เฉพาะเด็กที่เกิดแล้วจึงไม่สอดคล้องกับหลักบูรณาการตาม พ.ร.บ. นี้"},{"id":30,"q":"ศูนย์พัฒนาเด็กเล็กแห่งหนึ่งจัดกิจกรรมให้เด็กช่วยเหลือตนเอง รู้จักแบ่งปัน เคารพกติกา และมีจิตอาสา ผู้ปกครองบางคนเห็นว่ากิจกรรมดังกล่าวไม่จำเป็น เพราะไม่ช่วยให้เด็กอ่านหนังสือเก่งขึ้น ข้อใดเป็นเหตุผลสนับสนุนกิจกรรมของศูนย์ได้ดีที่สุด","opts":{"ก":"ควรจัดกิจกรรมดังกล่าวต่อไป เพราะเป็นกิจกรรมที่ช่วยลดภาระครู","ข":"ควรจัดกิจกรรมดังกล่าวต่อไป เพราะเป็นการสร้างคุณลักษณะและอุปนิสัยใฝ่ดี มีคุณธรรมให้แก่เด็กปฐมวัย","ค":"ควรจัดกิจกรรมดังกล่าวต่อไป เพราะเป็นกิจกรรมที่ทุกศูนย์ต้องจัดเหมือนกัน","ง":"ถูกทุกข้อ"},"a":"ข","exp":"ละเอียด: กิจกรรมดังกล่าวตรงตามมาตรา 5 (4) ที่ระบุวัตถุประสงค์ให้ \"สร้างคุณลักษณะให้เด็กปฐมวัยมีอุปนิสัยใฝ่ดี มีคุณธรรม มีวินัย ใฝ่รู้ มีความคิดสร้างสรรค์...\" การเน้นอ่านออกเขียนได้อย่างเดียวทางวิชาการไม่ได้เป็นวัตถุประสงค์เดียวของการจัดการเรียนรู้เด็กปฐมวัย กิจกรรมสร้างอุปนิสัยและการเรียนรู้แบบเตรียมความพร้อมจึงจำเป็นอย่างยิ่ง"},{"id":31,"q":"โรงเรียน เอ ใช้การสังเกตพัฒนาการรายบุคคลและสะท้อนผลให้ผู้ปกครองทราบเป็นระยะ โรงเรียน บี จัดสอบคัดเลือกเด็กทุกเดือน พร้อมประกาศอันดับคะแนนหน้าเสาธง หากพิจารณาตามหลักการจัดการเรียนรู้ของสถานพัฒนาเด็กปฐมวัย ข้อใดถูกต้องที่สุด","opts":{"ก":"โรงเรียน เอ และ บี สอดคล้องกับกฎหมาย","ข":"โรงเรียน เอ สอดคล้องกับกฎหมาย","ค":"โรงเรียน บี สอดคล้องกับกฎหมาย","ง":"ทั้งสองโรงเรียนไม่สอดคล้องกับกฎหมาย"},"a":"ข","exp":"ละเอียด: ตามมาตรา 8 บัญญัติชัดเจนว่า \"การจัดการเรียนรู้ของสถานพัฒนาเด็กปฐมวัยต้องเป็นไปเพื่อเตรียมความพร้อมของเด็กปฐมวัย แต่ต้องไม่เป็นการจัดการเรียนรู้ที่มุ่งเน้นการสอบแข่งขันระหว่างเด็กปฐมวัย\" โรงเรียน บี มีการสอบคัดเลือกและประกาศอันดับหน้าเสาธง ซึ่งส่งเสริมการสอบแข่งขันเชิงเปรียบเทียบ ขัดต่อกฎหมายนี้อย่างรุนแรง โรงเรียน เอ มีการประเมินเพื่อเตรียมความพร้อมผ่านการสังเกตและพัฒนาแบบรายบุคคล จึงสอดคล้องตามกฎหมายถูกต้องที่สุด"},{"id":32,"q":"ในการประชุมเตรียมความพร้อมของสำนักงานศึกษาธิการจังหวัดแห่งหนึ่ง นายต้นกล่าวว่า \"คณะกรรมการนโยบายการพัฒนาเด็กปฐมวัยมีปลัดกระทรวงศึกษาธิการเป็นประธานกรรมการ และมีสำนักงานปลัดกระทรวงศึกษาธิการเป็นหน่วยงานเลขานุการ โดยมีหน้าที่เพียงกำกับดูแลการดำเนินงานของสถานพัฒนาเด็กปฐมวัยเท่านั้น\" นางสาวฟ้าจึงแย้งว่า ข้อมูลดังกล่าวคลาดเคลื่อนจากบทบัญญัติของ พ.ร.บ.การพัฒนาเด็กปฐมวัย พ.ศ. 2562 ทั้งในเรื่ององค์ประกอบของคณะกรรมการ หน่วยงานเลขานุการ และอำนาจหน้าที่ของคณะกรรมการ หากท่านเป็น <script>
const STORAGE_KEY = 'teacherQuizProgress_v1';
let QUESTIONS = {};
let wrongOnlyMode = false;
let mode = 'practice'; // practice | exam
let currentLevel = null;
let currentQs = [];
let idx = 0;
let score = 0;
let answered = false;

function loadData() {
  const el = document.getElementById('qdata');
  if (el && el.textContent && el.textContent.trim().length > 10) {
    try { QUESTIONS = JSON.parse(el.textContent); renderLevels(); return; }
    catch (e) { console.error(e); }
  }
  fetch('questions.json').then(r => r.json()).then(d => { QUESTIONS = d; renderLevels(); })
    .catch(e => { console.error(e); toast('โหลดข้อสอบไม่สำเร็จ'); });
}

function getProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch { return {}; }
}
function saveProgress(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function renderLevels() {
  const grid = document.getElementById('levelGrid');
  const prog = getProgress();
  grid.innerHTML = '';
  const keys = Object.keys(QUESTIONS);
  keys.forEach((name, i) => {
    const qs = QUESTIONS[name];
    if (!qs || !qs.length) return;
    const p = prog[name] || {};
    const played = p.played || p.plays || 0;
    const best = p.best || 0;
    const answered = p.answered || 0;
    const lastIdx = p.lastIdx || 0;
    const wrongs = (p.wrongIds || []);
    const pct = Math.round((best / qs.length) * 100) || 0;
    const card = document.createElement('div');
    card.className = 'level-card';
    card.innerHTML = `
      <div class="info" style="flex:1;cursor:pointer" data-start="1">
        <h3>${i+1}. ${name}</h3>
        <span>${qs.length} ข้อ · เล่นแล้ว ${played} ครั้ง · ทำไปแล้ว ${answered}/${qs.length} · สูงสุด ${best}</span>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="level-actions"></div>
      </div>
      <div class="badge">${pct}%</div>`;
    const actions = card.querySelector('.level-actions');
    // เริ่มใหม่
    const bStart = document.createElement('button');
    bStart.className = 'btn-restart';
    bStart.textContent = 'เริ่มใหม่';
    bStart.onclick = (e) => { e.stopPropagation(); startLevel(name, 0, false); };
    actions.appendChild(bStart);
    // ทำต่อ
    if (lastIdx > 0 && lastIdx < qs.length) {
      const bCont = document.createElement('button');
      bCont.className = 'btn-continue';
      bCont.textContent = 'ทำต่อข้อ ' + (lastIdx + 1);
      bCont.onclick = (e) => { e.stopPropagation(); startLevel(name, lastIdx, false); };
      actions.appendChild(bCont);
    }
    // ข้อผิด
    if (wrongs.length > 0) {
      const bWrong = document.createElement('button');
      bWrong.className = 'btn-wrong';
      bWrong.textContent = 'ทบทวนข้อผิด (' + wrongs.length + ')';
      bWrong.onclick = (e) => { e.stopPropagation(); startLevel(name, 0, true); };
      actions.appendChild(bWrong);
    }
    card.querySelector('[data-start]').onclick = () => startLevel(name, 0, false);
    grid.appendChild(card);
  });
}

function startLevel(name, resumeIdx, wrongOnly) {
  currentLevel = name;
  wrongOnlyMode = !!wrongOnly;
  const prog = getProgress();
  const p = prog[name] || {};
  let pool;
  if (wrongOnly && p.wrongIds && p.wrongIds.length) {
    const all = QUESTIONS[name];
    const idSet = new Set(p.wrongIds);
    pool = all.filter(q => idSet.has(q.id));
    if (!pool.length) pool = [...all];
  } else {
    pool = [...QUESTIONS[name]];
    // shuffle only if starting fresh (not resume)
    if (!resumeIdx) {
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
    }
    if (mode === 'exam') {
      pool = pool.slice(0, Math.min(40, pool.length));
    }
  }
  currentQs = pool;
  idx = resumeIdx || 0;
  if (idx >= currentQs.length) idx = 0;
  score = p.lastScore || 0;
  if (!resumeIdx) score = 0;
  showScreen('quiz');
  showQ();
}

function showQ() {
  answered = false;
  const q = currentQs[idx];
  document.getElementById('qProgress').textContent = `${idx+1} / ${currentQs.length}`;
  document.getElementById('liveScore').textContent = `${score} คะแนน`;
  document.getElementById('qBar').style.width = `${((idx)/currentQs.length)*100}%`;
  document.getElementById('qText').textContent = q.q || '(ไม่มีข้อความคำถาม)';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').style.display = 'none';

  const optsEl = document.getElementById('opts');
  optsEl.innerHTML = '';
  const letters = ['ก','ข','ค','ง','จ'];
  const optCount = letters.filter(L => q.opts[L]).length;
  letters.forEach(L => {
    if (!q.opts[L]) return;
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="letter">${L}</span><span>${q.opts[L]}</span>`;
    btn.onclick = () => selectOpt(L, btn);
    optsEl.appendChild(btn);
  });
  // ปุ่มดูเฉลย ถ้าตัวเลือกไม่ครบ
  if (optCount < 2) {
    const rev = document.createElement('button');
    rev.className = 'btn';
    rev.style.marginTop = '12px';
    rev.textContent = 'ดูเฉลย';
    rev.onclick = () => {
      if (answered) return;
      answered = true;
      const fb = document.getElementById('feedback');
      fb.className = 'feedback show ok';
      fb.textContent = '✅ เฉลย: ' + q.a + (q.opts[q.a] ? ' — ' + q.opts[q.a] : '') + (q.exp ? '\n\n📖 ' + q.exp : '');
      document.getElementById('nextBtn').style.display = 'flex';
      if (idx === currentQs.length - 1) document.getElementById('nextBtn').textContent = 'ดูผลคะแนน';
    };
    optsEl.appendChild(rev);
  }
}

function selectOpt(letter, btn) {
  if (answered) return;
  answered = true;
  const q = currentQs[idx];
  const correct = q.a;
  const all = document.querySelectorAll('.opt');
  all.forEach(el => el.classList.add('disabled'));

  const fb = document.getElementById('feedback');
  const exp = q.exp ? '\n\n📖 ' + q.exp : '';
  if (letter === correct) {
    score++;
    btn.classList.add('correct');
    fb.className = 'feedback show ok';
    fb.textContent = '✅ ถูกต้อง!' + exp;
    try {
      const pp = getProgress();
      if (pp[currentLevel] && pp[currentLevel].wrongIds) {
        pp[currentLevel].wrongIds = pp[currentLevel].wrongIds.filter(id => id !== q.id);
        saveProgress(pp);
      }
    } catch(e) {}
  } else {
    btn.classList.add('wrong');
    all.forEach(el => {
      if (el.querySelector('.letter') && el.querySelector('.letter').textContent === correct)
        el.classList.add('correct');
    });
    fb.className = 'feedback show bad';
    const ansText = q.opts[correct] ? (correct + ' — ' + q.opts[correct]) : correct;
    fb.textContent = '❌ ผิด — เฉลยข้อ ' + ansText + exp;
    try {
      const pp = getProgress();
      if (!pp[currentLevel]) pp[currentLevel] = { played: 0, best: 0, answered: 0, wrongIds: [] };
      if (!pp[currentLevel].wrongIds) pp[currentLevel].wrongIds = [];
      if (!pp[currentLevel].wrongIds.includes(q.id)) pp[currentLevel].wrongIds.push(q.id);
      saveProgress(pp);
    } catch(e) {}
  }
  try {
    const p2 = getProgress();
    if (!p2[currentLevel]) p2[currentLevel] = { played: 0, best: 0, answered: 0, wrongIds: [] };
    p2[currentLevel].lastIdx = idx + 1;
    p2[currentLevel].answered = Math.max(p2[currentLevel].answered || 0, idx + 1);
    p2[currentLevel].lastScore = score;
    saveProgress(p2);
  } catch(e) {}

  document.getElementById('nextBtn').style.display = 'flex';
  if (idx === currentQs.length - 1) {
    document.getElementById('nextBtn').textContent = 'ดูผลคะแนน';
  }
}

function nextQ() {
  if (idx >= currentQs.length - 1) {
    finish();
    return;
  }
  idx++;
  showQ();
}

function finish() {
  const total = currentQs.length;
  const pct = Math.round((score / total) * 100);
  // save
  const prog = getProgress();
  const prev = prog[currentLevel] || { best: 0, played: 0, answered: 0 };
  // ถ้าเคยนับจาก partial แล้ว ไม่นับ plays ซ้ำ
  if (!prev._partial) {
    prev.played = (prev.played || prev.plays || 0) + 1;
  }
  delete prev._partial;
  delete prev.plays;
  prev.last = score;
  prev.answered = total;
  prev.lastIdx = 0;
  prev.lastScore = score;
  if (score > (prev.best || 0)) prev.best = score;
  prog[currentLevel] = prev;
  saveProgress(prog);

  document.getElementById('finalScore').textContent = pct + '%';
  document.getElementById('rCorrect').textContent = score;
  document.getElementById('rWrong').textContent = total - score;
  document.getElementById('rTotal').textContent = total;
  let stars = '★☆☆';
  let msg = 'พยายามต่อไปนะ!';
  if (pct >= 90) { stars = '★★★'; msg = 'ยอดเยี่ยมมาก! พร้อมสอบจริงแล้ว'; }
  else if (pct >= 70) { stars = '★★☆'; msg = 'ดีมาก เกือบเต็มแล้ว'; }
  else if (pct >= 50) { stars = '★☆☆'; msg = 'พอใช้ ฝึกเพิ่มอีกนิด'; }
  document.getElementById('stars').textContent = stars;
  document.getElementById('resultMsg').textContent = msg;
  showScreen('result');
}

function retryLevel() {
  if (currentLevel) startLevel(currentLevel);
}

function goHome() {
  // บันทึกความคืบหน้าบางส่วน ถ้าออกกลางด่าน
  if (currentLevel && currentQs.length > 0 && idx > 0) {
    const p = getProgress();
    if (!p[currentLevel]) p[currentLevel] = { played: 0, best: 0, last: 0, answered: 0 };
    p[currentLevel].answered = Math.max(p[currentLevel].answered || 0, idx);
    p[currentLevel].lastIdx = idx;
    p[currentLevel].lastScore = score;
    p[currentLevel].last = Math.max(p[currentLevel].last || 0, score);
    // นับเป็น plays เฉพาะเมื่อตอบอย่างน้อย 1 ข้อ
    if (idx >= 1 && !(p[currentLevel]._partial)) {
      p[currentLevel].played = (p[currentLevel].played || p[currentLevel].plays || 0) + 1;
      p[currentLevel]._partial = true;
    }
    saveProgress(p);
  }
  showScreen('home');
  renderLevels();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function resetAllProgress() {
  if (confirm('ลบประวัติการเล่นทั้งหมดบนเครื่องนี้?')) {
    localStorage.removeItem(STORAGE_KEY);
    renderLevels();
    toast('ล้างประวัติแล้ว');
  }
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// mode toggle
document.querySelectorAll('.mode-toggle button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.mode-toggle button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    mode = b.dataset.mode;
  };
});

// SW
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

loadData();
</script>
